name: "ScoreSymphony AI-Agent-VPS Forge subsystem"
purpose: "Optional execution-only runtime reusing proven Forge executor/CLI-adapter behavior behind the platform-owned Executor boundary, plus the source/reference for recovery, event/idempotency and workspace behavior evaluated for issue #9."
status: integrated
integration_categories:
  - "adapter integration"
  - "external optional runtime"
  - "reference-only influence"
canonical_upstream: "https://github.com/ScoreSymphony/AI-Agent-VPS"
pinned_revision: "00b821bc94767865457814bf282982ca242a2e10"
verified_license: "MIT"
license_verification_date: "2026-09-03"
last_review_date: "2026-09-03"
platform_adapter_or_boundary: "src/ai_multi_agent_platform/adapters/forge.py implements the canonical Executor through the platform-owned ForgeClient protocol; src/ai_multi_agent_platform/adapters/forge_http.py implements that protocol against the pinned execution-only Forge sidecar."
local_source_path: "src/ai_multi_agent_platform/adapters/forge.py; src/ai_multi_agent_platform/adapters/forge_http.py"
source_origin_path: "AI-Agent-VPS core/forge/crates/executor-sidecar plus reused core/forge/crates/executors, cli-adapters, git and api-types; no upstream source is copied into this repository."
modified_locally: false
modification_summary: "The platform adapter and HTTP client are platform-owned Python code. The execution-only sidecar is maintained in the canonical AI-Agent-VPS upstream repository and is consumed at the pinned revision."
required_notices:
  - "No upstream source is vendored or copied into this repository. The upstream runtime retains its MIT license metadata at its source repository. Preserve MIT notices if substantial upstream source is ever copied locally."
compatibility_constraints:
  - "The concrete runtime compatibility target is protocol forge-executor-sidecar/v1 at pinned revision 00b821bc94767865457814bf282982ca242a2e10."
  - "Forge Task/Project/Event/API/DB types are not canonical platform types and are not required by the sidecar boundary."
  - "Canonical Task/Run/Step/correlation identity and lifecycle ownership remain in the platform kernel."
  - "The sidecar request_ref is derived from the canonical Run ID and acts only as a backend idempotency/recovery key."
  - "The default tested executor family is the deterministic null adapter; other CLI executor families require explicit allowlisting and their own compatibility/security validation."
security_constraints:
  - "The sidecar binds only to loopback by default and refuses a non-loopback bind in its current entrypoint."
  - "Executor families are explicitly allowlisted; the default allowlist contains only null."
  - "Any shell/process or coding-CLI execution path requires explicit policy, environment filtering, workspace isolation and sandbox/resource controls before enablement."
  - "Forge authentication/authorization may protect a future remote backend connection but may not replace platform authorization."
  - "ForgeExecutor validates the configured workspace root and rejects traversal before dispatch; the sidecar independently canonicalizes and verifies the requested workspace below its configured root."
deployment_constraints:
  - "Forge remains optional and is not imported by execution core startup or required for reference executor tests."
  - "The integrated runtime is the execution-only sidecar, not the legacy full Forge Task/Project application."
  - "The sidecar requires a Rust build/runtime artifact and configured workspace/log roots but no Forge database, TaskService, Project service or domain-event service."
resource_constraints:
  - "Resource usage depends on the explicitly enabled executor family. The null integration smoke test has negligible requirements; no baseline GPU or paid service is required."
required_for_baseline: false
recurring_paid_service_required: false
update_review_method: "For any runtime update, compare the pinned AI-Agent-VPS revision, review executor-sidecar protocol/license/security changes and reused executor/cli-adapter changes, update this record and Forge design docs, then run platform unit/contract tests plus the pinned real-sidecar CI integration test."
exit_replacement_strategy: "Remove src/ai_multi_agent_platform/adapters/forge.py, forge_http.py and sidecar-specific configuration/CI. Canonical Task/Run/Event/Workspace state remains platform-owned, so removing the runtime requires no canonical-state migration."
adr: ""
notes: "The execution-only sidecar was merged upstream through AI-Agent-VPS PR #71. Platform CI checks out the exact pinned revision, builds the sidecar, starts it on loopback with the null executor allowlisted, and runs real health/execute/cancellation integration through ForgeHttpClient and ForgeExecutor. Recovery/idempotency behavior is split deliberately: the sidecar durably maps request_ref to backend execution identity and marks interrupted in-flight jobs for reconciliation after restart, while canonical lifecycle/event replay remains owned and tested by PlatformKernel."
