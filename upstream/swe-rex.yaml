name: "SWE-ReX"
purpose: "Optional runtime/backend abstraction behind platform-owned Executor and Worker boundaries."
status: experimental_only
integration_categories:
  - "executor adapter"
  - "runtime abstraction"
canonical_upstream: "https://github.com/SWE-agent/SWE-ReX"
pinned_revision: "5c995c365dfb1fd5bc56fda688be5d8538f9931f"
evaluated_version: "1.4.0"
verified_license: "MIT at the reviewed revision (LICENSE.txt)."
license_verification_date: "2026-09-12"
last_review_date: "2026-09-12"
platform_adapter_or_boundary: "Experimental optional SwerexExecutor behind canonical #7 Executor and #14 Worker/Node boundaries; Task/Run/Workspace/File/Artifact identities and policy remain platform-owned."
local_source_path: "src/ai_multi_agent_platform/adapters/swe_rex.py"
source_origin_path: "No SWE-ReX source is copied; the repository contains platform-owned adapter, tests and evaluation fixtures only."
modified_locally: false
modification_summary: "No upstream modifications."
required_notices:
  - "Retain the upstream MIT copyright and permission notice for any future redistributed SWE-ReX source or substantial portions."
compatibility_constraints:
  - "Evaluated revision package metadata reports 1.4.0; the published v1.4.0 tag itself points to older commit f802b3e14d82aa4c13291d2fda5bd4fd48f36f91, so evidence is tied to pinned_revision rather than only the version string."
  - "Linux LocalDeployment is functionally useful but explicitly unsandboxed."
  - "Native Windows LocalDeployment fails at import on the exercised Windows Server 2025/Python 3.12 runner because pexpect.spawn is unavailable."
  - "Pinned default Docker execution passes raw command and Artifact round-trip semantics, and the corrected canonical SwerexExecutor Docker bridge passes end-to-end; default egress is still allowed and provider paths are not canonical Workspace boundaries."
  - "Loopback Remote execution/auth/concurrency works, but transport security and Workspace authorization remain external platform/deployment responsibilities."
  - "Modal, Fargate, Daytona and other unexercised provider paths remain unknown and inherit no guarantees from Local/Docker/Remote evidence."
  - "Provider deployment/runtime/session identifiers remain namespaced adapter metadata rather than canonical platform IDs."
security_constraints:
  - "Authorization #15, secret handling #34, Workspace #37 and security policy #43 remain authoritative."
  - "Direct canonical ExecutionRequest.environment projection is rejected by the evaluation adapter until scoped #34-safe delivery is proven."
  - "Raw live fixtures confirm directly supplied synthetic environment data is visible to executed code."
  - "Local, Docker and Remote evidence demonstrate provider-level reads outside the selected per-run Workspace; SWE-ReX is not the canonical filesystem authorization boundary."
  - "Default Docker live evidence allowed Internet egress (HTTP 200 to example.com)."
  - "Docker runtime server port was published on IPv4 all-interfaces and IPv6 in the exercised default path."
  - "A spawned Docker child process survived its parent command timeout; timeout signaling is not process-tree cleanup."
  - "Docker --network=none and --internal attempts break the SWE-ReX host-to-runtime control path; no functional deny-egress Docker profile was demonstrated by these flags alone."
  - "Reviewed remote authentication uses X-API-Key and the exercised transport is HTTP; protected deployments require trusted/private networking or TLS termination outside SWE-ReX."
  - "Remote request IDs/caching do not replace canonical #14 dispatch/idempotency."
deployment_constraints:
  - "SWE-ReX is experimental only and must not be selected for sandbox-required workloads from #861 evidence."
  - "Baseline/reference Executor operation must remain independent of SWE-ReX."
  - "LocalDeployment requires explicit unsafe/trusted-host opt-in."
  - "Remote-backed evaluation requires aiohttp>=3.11,<4 because the reviewed base package imports aiohttp without declaring it. This is not added to the platform baseline."
  - "Accepted Docker evidence builds a dedicated server image from pinned_revision and uses pull=never; host-side pinning alone is insufficient server provenance."
  - "A future protected Docker/Remote profile must supply external network/transport controls and rerun live evidence."
resource_constraints:
  - "Default Docker fixture startup was approximately 0.78 seconds and stop approximately 0.22 seconds on the exercised GitHub-hosted runner."
  - "The pinned evaluation image measured approximately 176,887,972 bytes (~177 MB)."
  - "One Docker resource sample was approximately 38.26 MiB memory and 0.13% CPU; this is a fixture sample, not a sizing guarantee."
  - "No production density/capacity claim is made from #861 evidence."
required_for_baseline: false
recurring_paid_service_required: false
discovery_classification: "experimental/evaluate"
discovery_visibility: "Advanced/Custom only; expose backend-specific availability, isolation, egress, transport and platform-support metadata."
unsupported_claims:
  - "generic sandbox"
  - "native Windows LocalDeployment support"
  - "deny-by-default Docker egress"
  - "provider-owned canonical Workspace security"
  - "uniform in-flight cancellation or descendant-process cleanup"
  - "secure remote transport without external controls"
update_review_method: "Pin every evaluated revision and container/remote server image; re-check license/version/dependency metadata, deployment/runtime APIs, filesystem behavior, Windows support, authentication/transport, egress, scoped-secret handling, cancellation/process cleanup and resource behavior; rerun canonical contract/security/live evidence before promotion."
exit_replacement_strategy: "Disable/remove the experimental adapter. Canonical Task/Run/Workspace/File/Artifact identities and the reference Executor require no migration because SWE-ReX owns none of them."
adr: ""
notes: "Issue #861 final classification: experimental_only. Linux Local, pinned Docker with canonical SwerexExecutor bridge, and loopback Remote demonstrate runtime-abstraction value, while live evidence rejects generic sandbox, native Windows-local, deny-egress and process-cleanup guarantees. See docs/upstream/SWE_REX_EVALUATION.md, SWE_REX_SECURITY_REVIEW.md and SWE_REX_LIVE_EVIDENCE.md."
