notes: "No upstream source is copied or vendored. Expo tag expo@58.0.22 resolves to 004bfc41cfd82784da23450101015717c5da74e6. This update preserves the existing public /api/v1 boundary and Android 7+/iOS 16.4+ support; CI validates typecheck, mobile tests, configuration and export smoke. SDK 58 strict TypeScript API changes are handled in mobile/App.tsx."
