name: ai-multi-agent-platform

services:
  control-plane:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#main}
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      AI_MAP_DATA_DIR: /var/lib/ai-multi-agent-platform
      AI_MAP_HOST: 0.0.0.0
      AI_MAP_PORT: "8000"
      AI_MAP_SECURE_COOKIE: "true"
      AI_MAP_LOG_LEVEL: ${AI_MAP_LOG_LEVEL:-info}
      AI_MAP_SHUTDOWN_TIMEOUT_SECONDS: ${AI_MAP_SHUTDOWN_TIMEOUT_SECONDS:-30}
    expose:
      - "8000"
    volumes:
      - platform-data:/var/lib/ai-multi-agent-platform
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/api/v1/readiness", timeout=3
          ).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 3610s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform

  web:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#main}
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform

  hostinger-gateway:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#main}
      dockerfile: deploy/docker/hostinger-gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AI_MAP_PUBLIC_DOMAIN: ${AI_MAP_PUBLIC_DOMAIN:-}
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${AI_MAP_TRAEFIK_NETWORK:-ai-map-hostinger-edge}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.rule=Host(`${AI_MAP_PUBLIC_DOMAIN:-setup.invalid}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.tls.certresolver=letsencrypt"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.loadbalancer.server.port=8080"
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform
      - hostinger-edge

volumes:
  platform-data:

networks:
  platform:
  hostinger-edge:
    name: ${AI_MAP_TRAEFIK_NETWORK:-ai-map-hostinger-edge}
    external: ${AI_MAP_TRAEFIK_EXTERNAL:-false}
