# Diagnostic-only real-Hostinger probe for #1466 / PR #1467.
# Do not promote this file to the maintained installation URL.
name: ai-map-open-probe

services:
  control-plane:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#2d19b8d9e28200eceb525ee0a33b28f9a4ff52bf}
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      AI_MAP_DATA_DIR: /var/lib/ai-multi-agent-platform
      AI_MAP_HOST: 0.0.0.0
      AI_MAP_PORT: "8000"
      AI_MAP_SECURE_COOKIE: "true"
      AI_MAP_LOG_LEVEL: ${AI_MAP_LOG_LEVEL:-info}
      AI_MAP_SHUTDOWN_TIMEOUT_SECONDS: ${AI_MAP_SHUTDOWN_TIMEOUT_SECONDS:-30}
    expose:
      - "8000"
    volumes:
      - platform-data:/var/lib/ai-multi-agent-platform
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/api/v1/readiness", timeout=3
          ).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 3610s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform

  web:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#2d19b8d9e28200eceb525ee0a33b28f9a4ff52bf}
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform

  hostinger-gateway:
    build:
      context: ${AI_MAP_SOURCE_CONTEXT:-https://github.com/ScoreSymphony/AI-Multi-Agent-Platform.git#2d19b8d9e28200eceb525ee0a33b28f9a4ff52bf}
      dockerfile: deploy/docker/hostinger-gateway.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    uts: host
    environment:
      AI_MAP_HOSTINGER_EDGE_MODE: traefik-passthrough
      AI_MAP_PUBLIC_DOMAIN: ${AI_MAP_PUBLIC_DOMAIN:-}
      AI_MAP_HOSTINGER_COMPOSE_HOSTNAME: ${HOSTNAME:-}
      AI_MAP_COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}
    expose:
      - "80"
      - "443"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.rule=Host(`${AI_MAP_PUBLIC_DOMAIN:-${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.${HOSTNAME:?Hostinger Compose must expose HOSTNAME for zero-config Open autodiscovery}.hstgr.cloud}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.rule=HostSNI(`${AI_MAP_PUBLIC_DOMAIN:-${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}.${HOSTNAME:?Hostinger Compose must expose HOSTNAME for zero-config Open autodiscovery}.hstgr.cloud}`)"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.entrypoints=websecure"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.tls.passthrough=true"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-open.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http.rule=HostRegexp(`^${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}\\.srv[0-9]+\\.hstgr\\.cloud$`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http.loadbalancer.server.port=80"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls.rule=HostSNIRegexp(`^${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}\\.srv[0-9]+\\.hstgr\\.cloud$`)"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls.entrypoints=websecure"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls.tls.passthrough=true"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls"
      - "traefik.tcp.services.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls.loadbalancer.server.port=443"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-http.rule=HostRegexp(`(?i)^${AI_MAP_PUBLIC_DOMAIN:+\\Q}${AI_MAP_PUBLIC_DOMAIN:-a^}${AI_MAP_PUBLIC_DOMAIN:+\\E}$`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-http.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-http"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-tls.rule=HostSNIRegexp(`(?i)^${AI_MAP_PUBLIC_DOMAIN:+\\Q}${AI_MAP_PUBLIC_DOMAIN:-a^}${AI_MAP_PUBLIC_DOMAIN:+\\E}$`)"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-tls.entrypoints=websecure"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-tls.tls.passthrough=true"
      - "traefik.tcp.routers.${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-custom-compat-tls.service=${COMPOSE_PROJECT_NAME:-ai-multi-agent-platform}-hostinger-tls"
    volumes:
      - hostinger-gateway-data:/data
      - hostinger-gateway-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - platform

volumes:
  platform-data:
  hostinger-gateway-data:
  hostinger-gateway-config:

networks:
  platform:
