name: ai-multi-agent-platform

services:
  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      AI_MAP_DATA_DIR: /var/lib/ai-multi-agent-platform
      AI_MAP_HOST: 0.0.0.0
      AI_MAP_PORT: "8000"
      AI_MAP_SECURE_COOKIE: "true"
      AI_MAP_LOG_LEVEL: ${AI_MAP_LOG_LEVEL:-info}
      AI_MAP_SHUTDOWN_TIMEOUT_SECONDS: ${AI_MAP_SHUTDOWN_TIMEOUT_SECONDS:-30}
    expose:
      - "8000"
    volumes:
      - platform-data:/var/lib/ai-multi-agent-platform
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          "http://127.0.0.1:8000/api/v1/readiness", timeout=3
          ).read()
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 3610s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform


  backup:
    profiles:
      - operations
    build:
      context: .
      dockerfile: deploy/docker/control-plane.Dockerfile
    restart: "no"
    init: true
    entrypoint:
      - platform-backup
    volumes:
      - type: volume
        source: platform-data
        target: /var/lib/ai-multi-agent-platform
      - type: bind
        source: ${AI_MAP_BACKUP_DIR:-./backups}
        target: /backups
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    network_mode: none

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
    restart: unless-stopped
    depends_on:
      control-plane:
        condition: service_healthy
    expose:
      - "8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/api/v1/health
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    read_only: true
    tmpfs:
      - /config
      - /data
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - platform

  https-edge:
    build:
      context: .
      dockerfile: deploy/docker/https-edge.Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      AI_MAP_PUBLIC_DOMAIN: ${AI_MAP_PUBLIC_DOMAIN:?set AI_MAP_PUBLIC_DOMAIN to the public DNS hostname}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - platform

volumes:
  platform-data:
  caddy-data:
  caddy-config:

networks:
  platform:
