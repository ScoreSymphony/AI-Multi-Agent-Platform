[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-agent-platform"
version = "0.0.1"
description = "General-purpose, self-hostable AI multi-agent platform"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "ScoreSymphony" }]
dependencies = [
  "jsonschema==4.26.0",
]

[project.scripts]
platform = "ai_multi_agent_platform.cli.app:main"
platform-completion = "ai_multi_agent_platform.cli.completion:main"
platform-server = "ai_multi_agent_platform.adapters.single_node_app:main"
platform-distributed-server = "ai_multi_agent_platform.adapters.distributed_control_plane_app:main"
platform-worker = "ai_multi_agent_platform.deployment.distributed_worker:main"
platform-message-broker = "ai_multi_agent_platform.deployment.message_broker:main"
platform-backup = "ai_multi_agent_platform.backup.cli:main"
platform-acceptance = "ai_multi_agent_platform.cli.acceptance:main"
platform-conformance = "ai_multi_agent_platform.cli.conformance:main"
platform-upgrade = "ai_multi_agent_platform.upgrade.cli:main"
platform-benchmark = "ai_multi_agent_platform.benchmarking.cli:main"
platform-provider-fault = "ai_multi_agent_platform.benchmarking.provider_fault_cli:main"
platform-plan-step = "ai_multi_agent_platform.benchmarking.plan_step_cli:main"
platform-planning-pressure = "ai_multi_agent_platform.benchmarking.planning_pressure_cli:main"
platform-planning-graph-scale = "ai_multi_agent_platform.benchmarking.planning_graph_scale_cli:main"
platform-coordination-pressure = "ai_multi_agent_platform.benchmarking.coordination_pressure_cli:main"
platform-coordination-contention = "ai_multi_agent_platform.benchmarking.coordination_contention_cli:main"
platform-api-pressure = "ai_multi_agent_platform.benchmarking.api_pressure_cli:main"
platform-distributed-scale = "ai_multi_agent_platform.benchmarking.distributed_scale_cli:main"
platform-distributed-faults = "ai_multi_agent_platform.benchmarking.distributed_faults_cli:main"
platform-heterogeneous-placement = "ai_multi_agent_platform.benchmarking.heterogeneous_placement_cli:main"
platform-ha-failover = "ai_multi_agent_platform.benchmarking.ha_failover_cli:main"
platform-host-pressure-observe = "ai_multi_agent_platform.benchmarking.host_pressure_observer_cli:main"
platform-persistence-fault = "ai_multi_agent_platform.benchmarking.persistence_fault_cli:main"
platform-persistence-contention = "ai_multi_agent_platform.benchmarking.persistence_contention_cli:main"
platform-operating-envelope = "ai_multi_agent_platform.benchmarking.operating_envelope_cli:main"
platform-operating-envelope-catalog = "ai_multi_agent_platform.benchmarking.operating_envelope_catalog_cli:main"
platform-reference-host-campaign = "ai_multi_agent_platform.benchmarking.reference_host_campaign_cli:main"
platform-reference-host-reproducibility = "ai_multi_agent_platform.benchmarking.reference_host_reproducibility_cli:main"
platform-reference-host-regression = "ai_multi_agent_platform.benchmarking.reference_host_regression_cli:main"
platform-reference-host-absolute-budget = "ai_multi_agent_platform.benchmarking.reference_host_absolute_budget_cli:main"
platform-inference-backend-evaluation = "ai_multi_agent_platform.benchmarking.inference_backend_evaluation_cli:main"
platform-release = "ai_multi_agent_platform.release.cli:main"

[project.optional-dependencies]
server = [
  "uvicorn>=0.35,<1",
]
ha-postgres = [
  "psycopg==3.3.5",
]
mcp = [
  "mcp==2.1.1",
]
litellm = [
  "litellm==1.99.0",
]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.12,<1",
  "mypy>=1.17,<3",
  "mcp==2.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ai_multi_agent_platform.backup" = ["*.json"]
"ai_multi_agent_platform.benchmarking" = ["schemas/*.json"]
"ai_multi_agent_platform.release" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: isolated component tests",
  "contract: canonical platform contract and conformance tests",
  "integration: multi-component or real upstream integration tests",
  "e2e: end-to-end platform flow tests",
  "performance: benchmark, pressure, scale, latency and throughput tests",
  "regression: durable reproductions of previously observed defects",
  "release: release artifact and compatibility verification tests",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ai_multi_agent_platform/control_plane/organization_api.py" = ["UP047"]
# These collection wrappers intentionally import non-package case modules from tests/.
"tests/contract/control_plane/test_manifest_openapi_contract.py" = ["I001"]
"tests/contract/control_plane/test_openapi_surface.py" = ["I001"]
"tests/contract/control_plane/test_run_error_contract.py" = ["I001"]
"tests/contract/search/test_openapi_contract.py" = ["I001"]
"tests/integration/control_plane/test_extension_routing.py" = ["I001"]
"tests/integration/control_plane/test_http_api.py" = ["I001"]
"tests/integration/control_plane/test_run_error_http.py" = ["I001"]
"tests/integration/events/test_task_sse_stream.py" = ["I001"]
"tests/integration/events/test_timeline_api.py" = ["I001"]
"tests/integration/notifications/test_control_plane_inbox.py" = ["I001"]
"tests/integration/search/test_control_plane_search.py" = ["I001"]
"tests/integration/search/test_registered_resource_search.py" = ["I001"]
"tests/integration/search/test_search_checkpoint_refresh.py" = ["I001"]
"tests/unit/control_plane/test_extension_registration.py" = ["I001"]
"tests/unit/notifications/test_event_projection.py" = ["I001"]
"tests/unit/search/test_registered_resource_mapping.py" = ["I001"]
"tests/unit/search/test_search_index_checkpoint.py" = ["I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["ai_multi_agent_platform"]
