[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "ai-multi-agent-platform"
version = "0.1.0"
description = "Canonical substrate for an AI multi-agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "mcp>=1.0.0,<2",
  "httpx>=0.27,<1",
  "dulwich>=0.22,<1",
]

[project.scripts]
platform = "ai_multi_agent_platform.cli.issue_82:main"
platform-completion = "ai_multi_agent_platform.cli.completion:main"
platform-server = "ai_multi_agent_platform.adapters.single_node_app:main"
platform-backup = "ai_multi_agent_platform.backup.cli:main"
platform-restore = "ai_multi_agent_platform.backup.restore_cli:main"
platform-upgrade = "ai_multi_agent_platform.upgrade.cli:main"

[project.optional-dependencies]
forgex = ["httpx>=0.27,<1"]
litellm = ["litellm>=1.40,<2"]
hermes = ["hermes-agent @ git+https://github.com/NousResearch/hermes-agent.git@41a7bdee44746ccfeffe25dc5bd42a49bedb0e5e"]
dev = [
  "build>=1.2",
  "mypy>=1.10",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_multi_agent_platform"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["mcp.*", "dulwich.*"]
ignore_missing_imports = true
