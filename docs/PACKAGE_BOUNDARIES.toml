version = 1
source_root = "src/ai_multi_agent_platform"

# Every importable package directly below source_root must appear exactly once here.
# Adding a root package therefore requires an explicit ownership and rationale change.

[[package]]
name = "acceptance"
kind = "quality"
owner = "repository"
disposition = "keep"
responsibility = "End-to-end acceptance harnesses and operator-facing acceptance checks; not canonical runtime ownership."

