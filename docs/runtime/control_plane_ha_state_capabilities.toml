# disposition values:
# - shared_sql: canonical state must be available through the HA SQL composition.
# - shared_provider: canonical content must use a provider reachable by the promoted process.
# - reconstructable: safe to rebuild after promotion from shared canonical state or live peers.
# - unsupported: initial HA profile must reject/gate the capability while this state is host-local.
#
# initial_support values:
# - required: must be shared before #566 may claim the baseline failover scenario.
# - conditional: required only when the named capability is enabled; otherwise it must fail closed.
# - reconstructable: does not need shared persistence for correctness.
# - single_node_only: intentionally excluded from the initial HA capability claim.

