version = 1
enforce = true

# Baseline captured for #895 from the repository-wide AST dependency audit.
# The initial enforced probe found 62 top-level packages, 434 directed import
# edges and one strongly connected component spanning 47 packages.
#
# Compatibility-only migration roots are intentionally excluded from the allowed SCC once
# repository-internal callers have moved to their canonical owners. task_reassignment was removed
# before the original baseline freeze; #1241 additionally removes capability_assignments,
# high_availability and repository_intelligence from the reviewed SCC allowance.
#
# A detected SCC may shrink or split, but it must never grow beyond this
# explicitly reviewed package set. New SCCs outside this set are rejected.

