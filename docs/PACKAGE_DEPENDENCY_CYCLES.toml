# Before freezing the baseline, the remaining internal Control Plane import of
# the task_reassignment compatibility namespace was moved to its canonical
# task_management.reassignment owner. The compatibility package is therefore
# intentionally excluded from the allowed SCC below.
#
# A detected SCC may shrink or split, but it must never grow beyond this
# explicitly reviewed package set. New SCCs outside this set are rejected.

