role = "core"
stability = "beta"
public_surfaces = ["Agent resources", "Agent Team resources", "agent-facing Control Plane behavior"]
docs = ["docs/DOMAIN_MODEL.md"]
compatibility = "Supported for real use; bounded contract evolution may occur in non-patch releases with migration guidance."
user_signaling = "documentation"

