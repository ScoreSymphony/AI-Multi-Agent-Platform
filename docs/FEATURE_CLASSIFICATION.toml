schema_version = 1

# Architectural role and public-surface stability are deliberately orthogonal.
# Package ownership remains authoritative in PACKAGE_BOUNDARIES.toml.

[[feature]]
id = "task-run-lifecycle"
name = "Canonical Task/Run lifecycle"
owners = ["domain", "kernel", "planning"]
role = "core"
stability = "stable"
public_surfaces = ["canonical Task/Run/Plan/Step schemas", "kernel lifecycle semantics"]
docs = ["docs/DOMAIN_MODEL.md", "docs/KERNEL.md", "docs/runtime/DOMAIN_CONTRACT_VERSIONING.md"]
compatibility = "Canonical schema majors and lifecycle semantics use explicit versioning; incompatible schema changes require a new major and migration handling."
user_signaling = "none"

[[feature]]
id = "durable-coordination"
name = "Durable Plan/Step coordination"
owners = ["coordination"]
role = "core"
stability = "beta"
public_surfaces = ["plan-coordination resource", "coordination reconcile/cancel/repair commands", "Task workflow coordination progress projection"]
docs = ["docs/PLANNING.md", "docs/PLATFORM_CONFORMANCE.md", "docs/SECURITY_THREAT_MODEL.md"]
compatibility = "The canonical coordinator remains the supported dependency/readiness/fan-out/fan-in/reconciliation authority; its public resource and repair-command contracts may receive bounded non-patch changes with migration guidance."
user_signaling = "documentation"

[[feature]]
id = "control-plane-v1"
name = "Control Plane API v1 foundation"
owners = ["control_plane"]
role = "core"
stability = "stable"
public_surfaces = ["shared HTTP /api/v1 protocol and foundation conventions", "generated OpenAPI 3.1 foundation conventions"]
docs = ["docs/runtime/CONTROL_PLANE.md", "docs/adr/0003-versioned-control-plane-api.md"]
compatibility = "Stable applies to shared v1 protocol/foundation conventions and does not promote later-domain maturity; ADR 0003 still requires a new Control Plane major for every breaking canonical northbound contract change, including Beta or Experimental resources composed under /api/v1."
user_signaling = "none"

[[feature]]
id = "provider-contracts-v2"
name = "Provider and adapter contracts v2"
owners = ["contracts"]
role = "core"
stability = "stable"
public_surfaces = ["provider contract 2.0 Python interfaces", "provider descriptors and canonical errors"]
docs = ["docs/CONTRACTS.md"]
compatibility = "Breaking provider-contract changes require a new contract major; adapters advertise the major they implement."
user_signaling = "none"

[[feature]]
