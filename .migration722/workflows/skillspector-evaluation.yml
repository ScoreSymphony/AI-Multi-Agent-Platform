name: SkillSpector evaluation

on:
  pull_request:
    paths:
      - ".github/workflows/skillspector-evaluation.yml"
      - "experiments/skillspector/*.py"
      - "providers/skillspector/**"
      - "src/ai_multi_agent_platform/adapters/skillspector.py"
      - "src/ai_multi_agent_platform/skills/security_evidence.py"
      - "src/ai_multi_agent_platform/skills/security_evidence_control_plane.py"
      - "tests/integration/skills/test_skillspector_evaluation.py"
      - "tests/integration/skills/test_skillspector_container_command.py"
      - "tests/performance/skills/test_skillspector_benchmark_semantics.py"
      - "tests/integration/security/test_skillspector_security_evidence.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-static-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out platform
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out exact SkillSpector candidate
        uses: actions/checkout@v7
        with:
          repository: NVIDIA/SkillSpector
          ref: 69dcdfb74487d361ba4c811d088cfdea2ff3a9dc
          path: .candidate/skillspector
          persist-credentials: false

      - name: Verify upstream and production locks
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C .candidate/skillspector rev-parse HEAD)" = "69dcdfb74487d361ba4c811d088cfdea2ff3a9dc"
          grep -Fq 'Apache License' .candidate/skillspector/LICENSE
          test "$(sha256sum .candidate/skillspector/LICENSE | awk '{print $1}')" = \
            "9f8785b47596b2993a17a3fa8d747ae63126a2c5e80a9e77195a907273d71839"
          test "$(sha256sum .candidate/skillspector/Dockerfile | awk '{print $1}')" = \
            "124041bd2c81880747197f221c8d9a13b7378ac5ad98a17b4ab6a15ad22eb9aa"
          test "$(sha256sum providers/skillspector/Dockerfile | awk '{print $1}')" = \
            "69f5a47d8d9b9551ef0b6719733d585a196d73877054ba0300e90dda7bccfa2a"
          test "$(sha256sum providers/skillspector/requirements.lock | awk '{print $1}')" = \
            "85e25c541f966f1a2d513b0be5ce8d92a54bbec6b45b635d49f36cbf817f76c7"
          {
            echo "revision=$(git -C .candidate/skillspector rev-parse HEAD)"
            echo "license_sha256=$(sha256sum .candidate/skillspector/LICENSE | awk '{print $1}')"
            echo "upstream_dockerfile_sha256=$(sha256sum .candidate/skillspector/Dockerfile | awk '{print $1}')"
            echo "production_dockerfile_sha256=$(sha256sum providers/skillspector/Dockerfile | awk '{print $1}')"
            echo "requirements_sha256=$(sha256sum providers/skillspector/requirements.lock | awk '{print $1}')"
          } | tee "$RUNNER_TEMP/skillspector-production-lock.txt"

      - name: Build locked production image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            --file providers/skillspector/Dockerfile \
            --tag skillspector-production:2.11.2 \
            .
          image_id="$(docker image inspect skillspector-production:2.11.2 --format '{{.Id}}')"
          echo "image_id=$image_id" | tee "$RUNNER_TEMP/skillspector-image.txt"
          docker image inspect skillspector-production:2.11.2 --format '{{json .Config.Labels}}' \
            | tee -a "$RUNNER_TEMP/skillspector-image.txt"
          test "$(docker image inspect skillspector-production:2.11.2 --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = \
            "69dcdfb74487d361ba4c811d088cfdea2ff3a9dc"
          test "$(docker image inspect skillspector-production:2.11.2 --format '{{index .Config.Labels "io.scoresymphony.skillspector.dependency-set-sha256"}}')" = \
            "d6716d890040ac73494a8422ea51ef11229e71e0c0d9b538a95316a3a644fc61"
          test "$(docker image inspect skillspector-production:2.11.2 --format '{{index .Config.Labels "io.scoresymphony.skillspector.scan-mode"}}')" = \
            "static_no_llm_network_none"
          test "$(docker image inspect skillspector-production:2.11.2 --format '{{index .Config.Labels "io.scoresymphony.skillspector.policy-config-revision"}}')" = \
            "skillspector-static-v1"
          docker run --rm --entrypoint /app/.venv/bin/pip skillspector-production:2.11.2 freeze \
            | LC_ALL=C sort \
            | tee "$RUNNER_TEMP/skillspector-pip-freeze.txt"
          diff -u providers/skillspector/pip-freeze.lock "$RUNNER_TEMP/skillspector-pip-freeze.txt"
          freeze_sha="$(sha256sum "$RUNNER_TEMP/skillspector-pip-freeze.txt" | awk '{print $1}')"
          test "$freeze_sha" = \
            "d6716d890040ac73494a8422ea51ef11229e71e0c0d9b538a95316a3a644fc61"
          echo "$freeze_sha  skillspector-pip-freeze.txt" \
            | tee "$RUNNER_TEMP/skillspector-pip-freeze.sha256"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Exercise platform-side harness and production adapter tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python -m pytest -q \
            tests/integration/skills/test_skillspector_evaluation.py \
            tests/integration/skills/test_skillspector_container_command.py \
            tests/performance/skills/test_skillspector_benchmark_semantics.py \
            tests/integration/security/test_skillspector_security_evidence.py

      - name: Run static no-LLM network-disabled regression corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m experiments.skillspector.run_benchmark \
            --output "$RUNNER_TEMP/skillspector-evidence" \
            --repeats 3 \
            --image skillspector-production:2.11.2 \
            --timeout 120 \
            | tee "$RUNNER_TEMP/skillspector-benchmark-console.json"

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: skillspector-issue-868-evidence
          path: |
            ${{ runner.temp }}/skillspector-production-lock.txt
            ${{ runner.temp }}/skillspector-image.txt
            ${{ runner.temp }}/skillspector-pip-freeze.txt
            ${{ runner.temp }}/skillspector-pip-freeze.sha256
            ${{ runner.temp }}/skillspector-benchmark-console.json
            ${{ runner.temp }}/skillspector-evidence/**
          if-no-files-found: warn
