name: Benchmark smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate benchmark implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking \
            tests/performance/deployment/test_benchmarking.py \
            tests/performance/deployment/test_sweep.py \
            tests/performance/evaluation/test_operating_envelope.py \
            tests/performance/files/test_workloads.py \
            tests/performance/context/test_endurance.py \
            tests/performance/deployment/test_stress_fault.py \
            tests/performance/context/test_transport_faults.py \
            tests/performance/recovery/test_persistence.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking \
            tests/performance/deployment/test_benchmarking.py \
            tests/performance/deployment/test_sweep.py \
            tests/performance/evaluation/test_operating_envelope.py \
            tests/performance/files/test_workloads.py \
            tests/performance/context/test_endurance.py \
            tests/performance/deployment/test_stress_fault.py \
            tests/performance/context/test_transport_faults.py \
            tests/performance/recovery/test_persistence.py
          mypy src/ai_multi_agent_platform/benchmarking
          pytest \
            tests/performance/deployment/test_benchmarking.py \
            tests/performance/deployment/test_sweep.py \
            tests/performance/evaluation/test_operating_envelope.py \
            tests/performance/files/test_workloads.py \
            tests/performance/context/test_endurance.py \
            tests/performance/deployment/test_stress_fault.py \
            tests/performance/context/test_transport_faults.py \
            tests/performance/recovery/test_persistence.py
      - name: Run deterministic single-node performance smoke
        run: |
          mkdir -p artifacts/benchmarks
          platform-benchmark single-node \
            --operations 5 \
            --concurrency 2 \
            --warmup-operations 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-single-node.json
      - name: Run tiny single-node concurrency sweep
        run: |
          platform-benchmark single-node-sweep \
            --concurrency-levels 1,2 \
            --operations-per-level 2 \
            --warmup-operations 0 \
            --repetitions 1 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-sweep
      - name: Run tiny growing-state persistence sweep
        run: |
          platform-benchmark single-node-persistence-sweep \
            --seed-task-levels 1,2 \
            --operations-per-level 2 \
            --concurrency 1 \
            --warmup-operations 0 \
            --repetitions 1 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-persistence-sweep
      - name: Run tiny single-node workload profiles
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks/pr-workloads
          for scenario in read-heavy mixed history restart; do
            platform-benchmark single-node-workload \
              --scenario "$scenario" \
              --operations 5 \
              --concurrency 2 \
              --seed-tasks 2 \
              --warmup-operations 0 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-workloads/${scenario}.json"
          done
      - name: Run tiny idle and soak profiles
        run: |
          mkdir -p artifacts/benchmarks/pr-endurance
          platform-benchmark single-node-endurance \
            --scenario idle \
            --duration-seconds 0.05 \
            --sample-interval-seconds 0.02 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-endurance/idle.json
          platform-benchmark single-node-endurance \
            --scenario soak \
            --duration-seconds 5 \
            --sample-interval-seconds 0.01 \
            --max-operations 4 \
            --concurrency 2 \
            --seed-tasks 2 \
            --warmup-operations 0 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-endurance/soak.json
      - name: Derive tiny tested operating envelope
        run: |
          platform-operating-envelope \
            --sweep artifacts/benchmarks/pr-sweep/summary.json \
            --endurance artifacts/benchmarks/pr-endurance/soak.json \
            --output artifacts/benchmarks/pr-operating-envelope.json
      - name: Run tiny stress and fault-under-load profiles
        run: |
          platform-benchmark single-node-stress \
            --concurrency-levels 1,2 \
            --operations-per-level 2 \
            --warmup-operations 0 \
            --safety-max-concurrency 4 \
            --safety-max-operations-per-level 4 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-stress
          platform-benchmark single-node-fault-under-load \
            --operations 6 \
            --concurrency 2 \
            --fault-after-operations 3 \
            --seed-tasks 2 \
            --warmup-operations 0 \
            --safety-max-operations 10 \
            --safety-max-concurrency 4 \
            --read-weight 2 \
            --write-weight 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-fault.json
      - name: Run tiny transport fault profiles
        run: |
          mkdir -p artifacts/benchmarks/pr-transport-faults
          platform-benchmark transport-fault \
            --scenario backpressure \
            --batch-size 2 \
            --concurrency 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/backpressure.json
          platform-benchmark transport-fault \
            --scenario outage \
            --batch-size 2 \
            --concurrency 2 \
            --fault-operations 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/outage.json
          platform-benchmark transport-fault \
            --scenario duplicate-delivery \
            --batch-size 3 \
            --concurrency 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/duplicate-delivery.json
      - name: Validate benchmark report schemas and correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report = json.loads(Path("artifacts/benchmarks/pr-single-node.json").read_text())
          report_schema = json.loads(
              Path("docs/schemas/benchmark-report.v1.schema.json").read_text()
          )
          Draft202012Validator(report_schema).validate(report)
          assert report["correctness"]["passed"] is True
          assert report["benchmark"]["deployment_profile"] == "single-node-reference"

          sweep = json.loads(Path("artifacts/benchmarks/pr-sweep/summary.json").read_text())
          sweep_schema = json.loads(
              Path("docs/schemas/benchmark-sweep.v1.schema.json").read_text()
          )
          Draft202012Validator(sweep_schema).validate(sweep)
          assert sweep["correctness_passed"] is True
          assert sweep["concurrency_levels"] == [1, 2]
          assert len(sweep["points"]) == 2

          for point in sweep["points"]:
              point_report = json.loads(
                  (Path("artifacts/benchmarks/pr-sweep") / point["report_file"]).read_text()
              )
              Draft202012Validator(report_schema).validate(point_report)
              assert point_report["correctness"]["passed"] is True

          persistence_sweep = json.loads(
              Path("artifacts/benchmarks/pr-persistence-sweep/summary.json").read_text()
          )
          persistence_sweep_schema = json.loads(
              Path("docs/schemas/benchmark-persistence-sweep.v1.schema.json").read_text()
          )
          Draft202012Validator(persistence_sweep_schema).validate(persistence_sweep)
          assert persistence_sweep["correctness_passed"] is True
          assert persistence_sweep["seed_task_levels"] == [1, 2]
          assert len(persistence_sweep["points"]) == 2

          workload_schema = json.loads(
              Path("docs/schemas/benchmark-workload.v1.schema.json").read_text()
          )
          for point in persistence_sweep["points"]:
              point_report = json.loads(
                  (
                      Path("artifacts/benchmarks/pr-persistence-sweep")
                      / point["report_file"]
                  ).read_text()
              )
              Draft202012Validator(workload_schema).validate(point_report)
              assert point_report["benchmark"]["scenario"] == "restart"
              assert point_report["correctness"]["passed"] is True

          for scenario in ("read-heavy", "mixed", "history", "restart"):
              workload = json.loads(
                  Path(f"artifacts/benchmarks/pr-workloads/{scenario}.json").read_text()
              )
              Draft202012Validator(workload_schema).validate(workload)
              assert workload["benchmark"]["scenario"] == scenario
              assert workload["correctness"]["passed"] is True

          endurance_schema = json.loads(
              Path("docs/schemas/benchmark-endurance.v1.schema.json").read_text()
          )
          for scenario in ("idle", "soak"):
              endurance = json.loads(
                  Path(f"artifacts/benchmarks/pr-endurance/{scenario}.json").read_text()
              )
              Draft202012Validator(endurance_schema).validate(endurance)
              assert endurance["benchmark"]["scenario"] == scenario
              assert endurance["correctness"]["passed"] is True
              assert len(endurance["snapshots"]) >= 2

          envelope = json.loads(
              Path("artifacts/benchmarks/pr-operating-envelope.json").read_text()
          )
          envelope_schema = json.loads(
              Path("docs/schemas/benchmark-operating-envelope.v1.schema.json").read_text()
          )
          Draft202012Validator(envelope_schema).validate(envelope)
          assert envelope["highest_verified_concurrency"] == 2
          assert envelope["claim_semantics"] == "tested-envelope-only"
          assert envelope["budget_status"] == "not-established"
          assert envelope["correctness_passed"] is True

          stress = json.loads(Path("artifacts/benchmarks/pr-stress/summary.json").read_text())
          stress_schema = json.loads(
              Path("docs/schemas/benchmark-stress.v1.schema.json").read_text()
          )
          Draft202012Validator(stress_schema).validate(stress)
          assert stress["correctness_passed"] is True
          assert stress["completed_levels"] == [1, 2]
          for point in stress["points"]:
              point_report = json.loads(
                  (Path("artifacts/benchmarks/pr-stress") / point["report_file"]).read_text()
              )
              Draft202012Validator(report_schema).validate(point_report)
              assert point_report["correctness"]["passed"] is True

          fault = json.loads(Path("artifacts/benchmarks/pr-fault.json").read_text())
          fault_schema = json.loads(
              Path("docs/schemas/benchmark-fault-under-load.v1.schema.json").read_text()
          )
          Draft202012Validator(fault_schema).validate(fault)
          assert fault["benchmark"]["scenario"] == "control-plane-restart"
          assert fault["correctness"]["passed"] is True
          assert fault["correctness"]["pre_fault_completed_operations"] > 0
          assert fault["correctness"]["post_fault_completed_operations"] > 0
          assert fault["correctness"]["unauthorized_access_blocked"] is True

          transport_schema = json.loads(
              Path("docs/schemas/benchmark-transport-fault.v1.schema.json").read_text()
          )
          expected_errors = {
              "backpressure": {"resource_exhausted": 1},
              "outage": {"unavailable": 2},
              "duplicate-delivery": {},
          }
          for scenario in ("backpressure", "outage", "duplicate-delivery"):
              transport = json.loads(
                  Path(f"artifacts/benchmarks/pr-transport-faults/{scenario}.json").read_text()
              )
              Draft202012Validator(transport_schema).validate(transport)
              assert transport["benchmark"]["scenario"] == scenario
              assert transport["correctness"]["passed"] is True
              assert transport["correctness"]["message_loss_count"] == 0
              assert transport["error_counts"] == expected_errors[scenario]
          assert (
              json.loads(
                  Path(
                      "artifacts/benchmarks/pr-transport-faults/duplicate-delivery.json"
                  ).read_text()
              )["correctness"]["suppressed_duplicate_handlers"]
              == 1
          )
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-single-node-benchmark
          path: artifacts/benchmarks
          if-no-files-found: ignore

  distributed-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate distributed fault smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py \
            tests/performance/distributed/test_distributed_faults.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py \
            tests/performance/distributed/test_distributed_faults.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py
          pytest tests/performance/distributed/test_distributed_faults.py
          mkdir -p artifacts/benchmarks/pr-distributed-faults
          platform-distributed-faults \
            --worker-count 3 \
            --pre-fault-rounds 1 \
            --degraded-rounds 1 \
            --post-rejoin-rounds 1 \
            --payload-bytes 1024 \
            --heartbeat-timeout-seconds 1 \
            --reservation-ttl-seconds 1 \
            --timeout-seconds 20 \
            --safety-max-operations 16 \
            --safety-max-payload-bytes 4096 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-distributed-faults/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("docs/schemas/benchmark-distributed-faults.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-distributed-faults/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          benchmark = report["benchmark"]
          correctness = report["correctness"]
          assert benchmark["worker_count"] == 3
          assert benchmark["pre_fault_jobs"] == 3
          assert benchmark["degraded_jobs"] == 2
          assert benchmark["post_rejoin_jobs"] == 3
          assert benchmark["expected_successful_jobs"] == 9
          assert benchmark["total_attempts"] == 10
          assert correctness["passed"] is True
          assert correctness["stable_worker_ids"] == 3
          assert correctness["lost_worker_offline"] is True
          assert correctness["degraded_avoided_lost_worker"] is True
          assert correctness["rejoin_preserved_identity"] is True
          assert correctness["post_rejoin_used_rejoined_worker"] is True
          assert correctness["workspace_failure_code"] == "unavailable"
          assert correctness["workspace_failure_retryable"] is True
          assert correctness["workspace_failure_record_lost"] is True
          assert correctness["workspace_failure_reached_execution"] is False
          assert correctness["workspace_recovery_terminal"] is True
          assert correctness["workspace_cleanup_succeeded"] is True
          assert correctness["terminal_successful_jobs"] == 9
          assert report["pre_fault_dispatch_latency"]["count"] == 3
          assert report["worker_loss_reconciliation_latency"]["count"] == 1
          assert report["degraded_dispatch_latency"]["count"] == 2
          assert report["worker_rejoin_latency"]["count"] == 1
          assert report["post_rejoin_dispatch_latency"]["count"] == 3
          assert report["workspace_failure_latency"]["count"] == 1
          assert report["workspace_recovery_dispatch_latency"]["count"] == 1
          PY
      - name: Upload distributed fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-distributed-fault-benchmark
          path: artifacts/benchmarks/pr-distributed-faults
          if-no-files-found: ignore

      - name: Validate distributed scale smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py \
            tests/performance/distributed/test_distributed_scale.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py \
            tests/performance/distributed/test_distributed_scale.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py
          pytest tests/performance/distributed/test_distributed_scale.py
          mkdir -p artifacts/benchmarks/pr-distributed-scale
          platform-distributed-scale \
            --worker-count 2 \
            --rounds 1 \
            --payload-sizes-bytes 1024 \
            --timeout-seconds 20 \
            --safety-max-operations 4 \
            --safety-max-payload-bytes 4096 \
            --safety-max-fixture-bytes 4096 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-distributed-scale/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("docs/schemas/benchmark-distributed-scale.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-distributed-scale/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          correctness = report["correctness"]
          assert report["benchmark"]["worker_count"] == 2
          assert report["benchmark"]["rounds"] == 1
          assert report["benchmark"]["payload_sizes_bytes"] == [1024]
          assert report["benchmark"]["chunk_bytes"] == 131072
          assert report["benchmark"]["fixture_bytes"] == 1024
          assert report["benchmark"]["operation_count"] == 2
          assert correctness["passed"] is True
          assert correctness["registered_workers"] == 2
          assert correctness["heartbeat_workers"] == 2
          assert correctness["terminal_jobs"] == 2
          assert correctness["unique_worker_job_ids"] == 2
          assert correctness["unique_run_ids"] == 2
          assert correctness["workers_used"] == 2
          assert correctness["balanced_rounds"] == 1
          assert correctness["cleaned_materializations"] == 2
          assert report["registration_latency"]["count"] == 2
          assert report["heartbeat_latency"]["count"] == 2
          assert report["dispatch_latency"]["count"] == 2
          assert report["reconciliation_batch_latency"]["count"] == 1
          assert report["terminal_result_latency"]["count"] == 2
          assert report["payload_operation_counts"] == {"1024": 2}
          PY
      - name: Upload distributed scale evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-distributed-scale-benchmark
          path: artifacts/benchmarks/pr-distributed-scale
          if-no-files-found: ignore

      - name: Validate HA failover smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py \
            tests/performance/distributed/test_ha_failover_benchmark.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py \
            tests/performance/distributed/test_ha_failover_benchmark.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py
          pytest tests/performance/distributed/test_ha_failover_benchmark.py
          mkdir -p artifacts/benchmarks/pr-ha-failover
          platform-ha-failover \
            --active-task-count 2 \
            --repetitions 1 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-ha-failover/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("docs/schemas/benchmark-ha-failover.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-ha-failover/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          correctness = report["correctness"]
          assert report["benchmark"]["active_task_count"] == 2
          assert report["benchmark"]["repetitions"] == 1
          assert report["benchmark"]["coordination_profile"] == "in-memory-process-local"
          assert correctness["passed"] is True
          assert correctness["expected_tasks"] == 2
          assert correctness["prepared_tasks"] == 2
          assert correctness["recovered_tasks"] == 2
          assert correctness["task_identity_failures"] == 0
          assert correctness["run_identity_failures"] == 0
          assert correctness["duplicate_lifecycle_dispatches"] == 0
          assert correctness["history_failures"] == 0
          assert correctness["reconciled_stale_reservations"] == 2
          assert correctness["reconciliation_failures"] == 0
          assert correctness["stale_leader_rejections"] == 1
          assert correctness["outage_fail_closed_rejections"] == 1
          assert correctness["recovery_promotions"] == 1
          assert correctness["epoch_monotonicity_failures"] == 0
          assert report["promotion_latency"]["count"] == 1
          assert report["replay_task_latency"]["count"] == 2
          assert len(report["epoch_evidence"]) == 1
          epochs = report["epoch_evidence"][0]
          assert epochs["initial_epoch"] < epochs["promoted_epoch"] < epochs["recovery_epoch"]
          PY
      - name: Upload HA failover evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-ha-failover-benchmark
          path: artifacts/benchmarks/pr-ha-failover
          if-no-files-found: ignore

      - name: Validate heterogeneous placement smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py \
            tests/performance/application_distribution/test_heterogeneous_placement.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py \
            tests/performance/application_distribution/test_heterogeneous_placement.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py
          pytest tests/performance/application_distribution/test_heterogeneous_placement.py
          mkdir -p artifacts/benchmarks/pr-heterogeneous-placement
          platform-heterogeneous-placement \
            --iterations-per-profile 2 \
            --safety-max-operations 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-heterogeneous-placement/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("docs/schemas/benchmark-heterogeneous-placement.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-heterogeneous-placement/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          correctness = report["correctness"]
          assert report["benchmark"]["iterations_per_profile"] == 2
          assert report["benchmark"]["operation_count"] == 8
          assert correctness["passed"] is True
          assert correctness["attempted_operations"] == 8
          assert correctness["successful_placements"] == 6
          assert correctness["rejected_operations"] == 2
          assert correctness["misplaced_operations"] == 0
          assert correctness["constraint_evidence_failures"] == 0
          assert correctness["reservation_leaks"] == 0
          assert report["role_placement_counts"] == {"browser": 2, "cpu": 2, "gpu": 2}
          assert report["profile_latency"]["cpu-only"]["count"] == 2
          assert report["profile_latency"]["gpu-inference"]["count"] == 2
          assert report["profile_latency"]["browser-network"]["count"] == 2
          assert report["profile_latency"]["unschedulable-vram"]["count"] == 2
          assert report["constraint_evidence_counts"] == {
              "browser-network:cpu:network_unavailable": 2,
              "browser-network:gpu:label_mismatch": 2,
              "cpu-only:browser:label_mismatch": 2,
              "cpu-only:gpu:gpu_required": 2,
              "gpu-inference:browser:gpu_required": 2,
              "gpu-inference:cpu:gpu_required": 2,
              "unschedulable-vram:gpu:vram_insufficient": 2,
          }
          PY
      - name: Upload heterogeneous placement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-heterogeneous-placement-benchmark
          path: artifacts/benchmarks/pr-heterogeneous-placement
          if-no-files-found: ignore

  reference-host-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate absolute budget smoke
        if: always()
        run: |
