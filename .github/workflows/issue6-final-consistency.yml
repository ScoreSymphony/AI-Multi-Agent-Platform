name: Issue 6 final consistency

on:
  push:
    branches:
      - fix/issue-6-final-consistency

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-6-final-consistency
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply consistency fixes and regression tests
        run: python scripts/issue6_finalize.py
      - name: Validate repository
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format src/ai_multi_agent_platform/kernel/kernel.py tests/test_kernel_consistency.py
          ruff format --check .
          ruff check .
          mypy
          pytest
          python -m build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close final issue 6 consistency gaps"
          git push origin HEAD:fix/issue-6-final-consistency
