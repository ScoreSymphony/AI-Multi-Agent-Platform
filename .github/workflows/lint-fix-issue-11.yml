name: Temporary Issue 11 lint fix

on:
  push:
    branches: [feat/issue-11-litellm-adapter]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-litellm-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py src/ai_multi_agent_platform/adapters/__init__.py
          ruff format src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py src/ai_multi_agent_platform/adapters/__init__.py
      - name: Commit lint fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py src/ai_multi_agent_platform/adapters/__init__.py
          git commit -m "style: apply LiteLLM lint fixes"
          git push origin HEAD:feat/issue-11-litellm-adapter
