name: Temporary Issue 11 lint fix

on:
  push:
    branches: [feat/issue-11-litellm-adapter]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-litellm-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fix final line-length diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/adapters/litellm.py")
          text = path.read_text()
          text = text.replace(
              '                "LiteLLM library mode is enabled but the optional \'litellm\' dependency is not installed",',
              '                "LiteLLM library mode is enabled but the optional "\n'
              '                "\'litellm\' dependency is not installed",',
          )
          text = text.replace(
              '                f"configured LiteLLM credential environment variable is missing: {self.config.api_key_env}",',
              '                "configured LiteLLM credential environment variable is missing: "\n'
              '                f"{self.config.api_key_env}",',
          )
          path.write_text(text)
          PY
          ruff format src/ai_multi_agent_platform/adapters/litellm.py
          ruff check src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py src/ai_multi_agent_platform/adapters/__init__.py
      - name: Commit fixes and remove temporary diagnostics
        shell: bash
        run: |
          rm -f issue-11-lint.txt .github/workflows/lint-fix-issue-11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: fix LiteLLM lint diagnostics"
          git push origin HEAD:feat/issue-11-litellm-adapter
