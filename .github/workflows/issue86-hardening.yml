name: Issue 86 hardening

on:
  push:
    branches:
      - "fix/issue-86-hardening"

permissions:
  contents: write

jobs:
  harden-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-86-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply issue 86 hardening
        run: |
          python .github/scripts/issue86_hardening_patch.py
          python .github/scripts/issue86_hardening_fix_style.py
      - name: Install toolchain
        run: python -m pip install -e ".[dev]"
      - name: Normalize hardening slice
        run: |
          ruff format \
            src/ai_multi_agent_platform/verification \
            src/ai_multi_agent_platform/deployment/single_node.py \
            tests/test_issue_86_hardening.py
          ruff check --fix \
            src/ai_multi_agent_platform/verification \
            src/ai_multi_agent_platform/deployment/single_node.py \
            tests/test_issue_86_hardening.py
      - name: Lint
        run: |
          ruff check \
            src/ai_multi_agent_platform/verification \
            src/ai_multi_agent_platform/deployment/single_node.py \
            tests/test_issue_86_hardening.py
      - name: Typecheck
        run: mypy src
      - name: Focused verification tests
        run: |
          pytest -q \
            tests/test_issue_86_verification.py \
            tests/test_issue_86_kernel_gate.py \
            tests/test_issue_86_persistence.py \
            tests/test_issue_86_control_plane.py \
            tests/test_issue_86_observability.py \
            tests/test_issue_86_reviewer_agent.py \
            tests/test_issue_86_repair_runtime.py \
            tests/test_issue_86_replacement_conformance.py \
            tests/test_issue_86_hardening.py \
            tests/test_issue39_single_node_deployment.py
      - name: Commit validated hardening slice
        run: |
          if git diff --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/verification \
            src/ai_multi_agent_platform/deployment/single_node.py \
            tests/test_issue_86_hardening.py
          git commit -m "fix(verification): harden canonical completion integration (#86)"
          git push origin HEAD:fix/issue-86-hardening
