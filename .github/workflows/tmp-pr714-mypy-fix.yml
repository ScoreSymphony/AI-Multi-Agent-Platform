name: Temporary PR 714 mypy fix

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply focused typing fixes
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              target.write_text(text.replace(old, new, 1))

          repair = "src/ai_multi_agent_platform/verification/repair.py"
          replace_once(
              repair,
              '                "repair planning produced no canonical executable step",\n            )\n\n        selected_step = step_id',
              '                "repair planning produced no canonical executable step",\n            )\n        plan_id = planned.plan_ref\n\n        selected_step = step_id',
          )
          replace_once(repair, "            plan_id=planned.plan_ref,", "            plan_id=plan_id,")

          output = "src/ai_multi_agent_platform/verification/output_workflow.py"
          replace_once(output, "from typing import Literal", "from typing import Literal, cast")
          replace_once(
              output,
              '            details={"fields": sorted(unknown)},',
              '            details={"fields": cast(JsonValue, sorted(unknown))},',
          )
          replace_once(
              output,
              "    subject_types = frozenset(subject_types_raw)",
              "    subject_types = frozenset(\n        item for item in subject_types_raw if isinstance(item, str)\n    )",
          )
          replace_once(
              output,
              '                details={"stage_id": stage_id, "fields": sorted(unknown_stage)},',
              '                details={\n                    "stage_id": stage_id,\n                    "fields": cast(JsonValue, sorted(unknown_stage)),\n                },',
          )

          reviewer = "src/ai_multi_agent_platform/verification/reviewer_input.py"
          replace_once(reviewer, "from enum import Enum\n", "from enum import Enum\nfrom typing import cast\n")
          replace_once(
              reviewer,
              "from ai_multi_agent_platform.kernel.repository import RunRepository, TaskRepository",
              "from ai_multi_agent_platform.kernel.models import RunState\nfrom ai_multi_agent_platform.kernel.repository import RunRepository, TaskRepository",
          )
          replace_once(
              reviewer,
              "def _result_snapshot(*, task_id: str, result_id: str, run: object) -> dict[str, JsonValue]:",
              "def _result_snapshot(*, task_id: str, result_id: str, run: RunState) -> dict[str, JsonValue]:",
          )
          replace_once(
              reviewer,
              '        "output": _plain_json(run.output),\n        "artifact_ids": list(run.artifact_ids),',
              '        "output": cast(JsonValue, _plain_json(run.output)),\n        "artifact_ids": cast(JsonValue, list(run.artifact_ids)),',
          )
      - name: Format focused typing fixes
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format \
            src/ai_multi_agent_platform/verification/repair.py \
            src/ai_multi_agent_platform/verification/output_workflow.py \
            src/ai_multi_agent_platform/verification/reviewer_input.py
          ruff check \
            src/ai_multi_agent_platform/verification/repair.py \
            src/ai_multi_agent_platform/verification/output_workflow.py \
            src/ai_multi_agent_platform/verification/reviewer_input.py
      - name: Commit focused typing fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/verification/repair.py \
            src/ai_multi_agent_platform/verification/output_workflow.py \
            src/ai_multi_agent_platform/verification/reviewer_input.py
          git commit -m 'fix(review): satisfy canonical workflow typing (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
