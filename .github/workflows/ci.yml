name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python_tests:
    name: python-tests / ${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fast-structural
            marker: unit or contract
            paths: tests/unit tests/contract
          - shard: system
            marker: integration or e2e
            paths: tests/integration tests/e2e
          - shard: qualification
            marker: regression or performance or release
            paths: tests/regression tests/performance tests/release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Run ${{ matrix.shard }} pytest shard
        env:
          PYTEST_MARKER: ${{ matrix.marker }}
          PYTEST_PATHS: ${{ matrix.paths }}
        run: pytest -m "$PYTEST_MARKER" $PYTEST_PATHS
      - name: Run architecture tests
        if: matrix.shard == 'fast-structural'
        run: pytest tests/architecture
      - name: Verify fast-layer regression detection
        if: matrix.shard == 'fast-structural'
        run: python scripts/ci/verify_fast_unit_regression_detection.py

  backend_gates:
    name: backend-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Verify canonical runtime assets
        run: python scripts/ci/materialize_runtime_assets.py --check
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Deterministic evaluation gate
        run: python scripts/ci/deterministic_evaluation_regression_gate.py --platform-commit "$GITHUB_SHA"
      - name: Materialize runtime assets
        run: python scripts/ci/materialize_runtime_assets.py
      - name: Build package
        run: python -m build
      - name: Verify built runtime assets
        run: python scripts/ci/verify_distribution_runtime_assets.py dist
      - name: Run MCP environment conformance
        run: |
          python scripts/ci/optional_environment_conformance_profile.py \
            mcp \
            --json-report conformance-mcp.json
      - name: Upload MCP conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-mcp
          path: conformance-mcp.json
          if-no-files-found: warn

  test:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - python_tests
      - backend_gates
    steps:
      - name: Verify Python CI shards succeeded
        env:
          PYTHON_TESTS_RESULT: ${{ needs.python_tests.result }}
          BACKEND_GATES_RESULT: ${{ needs.backend_gates.result }}
        shell: bash
        run: |
          if [[ "$PYTHON_TESTS_RESULT" != "success" || "$BACKEND_GATES_RESULT" != "success" ]]; then
            echo "python_tests=$PYTHON_TESTS_RESULT"
            echo "backend_gates=$BACKEND_GATES_RESULT"
            exit 1
          fi

  single-node-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Create clean server-only installation
        shell: bash
        run: |
          python -m venv .install-smoke-venv
          source .install-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[server]"
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("uvicorn") is not None
          assert importlib.util.find_spec("pytest") is None
          PY
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Run fresh-install process lifecycle smoke
        run: python scripts/ci/fresh_install_lifecycle_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Verify frontend toolchain
        run: |
          node --version
          npm --version
          python --version
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser E2E backend
        run: python -m pip install -e "..[server]"
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Chromium regression runner
        shell: bash
        run: |
          runner_dir="$RUNNER_TEMP/playwright"
          npm install --prefix "$runner_dir" --no-audit --no-fund --no-save --package-lock=false playwright@1.55.0
          ln -s "$runner_dir/node_modules/playwright" node_modules/playwright
          ln -s "$runner_dir/node_modules/playwright-core" node_modules/playwright-core
      - name: Install Chromium
        run: '"$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Run real browser session regression
        run: node tests/browserSession.browser.mjs
      - name: Run clean browser-first deployment regression
        run: node tests/browserFirstRun.browser.mjs
