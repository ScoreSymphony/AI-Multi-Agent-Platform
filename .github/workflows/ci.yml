name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quality
            kind: quality
            marker: ""
            paths: ""
          - lane: unit
            kind: test
            marker: unit
            paths: tests/unit
          - lane: contract-architecture-release
            kind: test
            marker: not unit
            paths: tests/architecture tests/contract tests/release
          - lane: integration-core
            kind: test
            marker: not unit
            paths: tests/integration --ignore=tests/integration/deployment --ignore=tests/integration/recovery
          - lane: integration-recovery-deployment
            kind: test
            marker: not unit
            paths: tests/integration/deployment tests/integration/recovery
          - lane: system-regression
            kind: test
            marker: not unit
            paths: tests/e2e tests/performance tests/regression
    name: python-validation (${{ matrix.lane }})
    steps:
      - name: Record validation lane start
        shell: bash
        run: echo "VALIDATION_STARTED_AT=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"

      - name: Run pytest lane with retained timing evidence
        if: matrix.kind == 'test'
        shell: bash
        run: |
          python scripts/ci/run_pytest_lane.py             --lane "${{ matrix.lane }}"             -- -m "${{ matrix.marker }}" ${{ matrix.paths }}
      - name: Verify fast-layer regression detection
        if: matrix.lane == 'unit'
        run: python scripts/ci/verify_fast_unit_regression_detection.py
      - name: Verify non-unit shard coverage
        if: matrix.lane == 'unit'
        run: python scripts/ci/verify_pytest_shards.py
      - name: Upload pytest runtime evidence
        if: always() && matrix.kind == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: python-test-runtime-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: .artifacts/test-runtime/${{ matrix.lane }}.*
          if-no-files-found: warn

      - name: Verify canonical runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/materialize_runtime_assets.py --check
      - name: Ruff format
        if: matrix.kind == 'quality'
        run: ruff format --check .
      - name: Ruff lint
        if: matrix.kind == 'quality'
        run: ruff check .
      - name: Mypy
        if: matrix.kind == 'quality'
        run: mypy
      - name: Deterministic evaluation gate
        if: matrix.kind == 'quality'
        run: python scripts/ci/deterministic_evaluation_regression_gate.py --platform-commit "$GITHUB_SHA"
      - name: Materialize runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/materialize_runtime_assets.py
      - name: Build package
        if: matrix.kind == 'quality'
        run: python -m build
      - name: Verify built runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/verify_distribution_runtime_assets.py dist
      - name: Run MCP environment conformance
        if: matrix.kind == 'quality'
        run: |
          python scripts/ci/optional_environment_conformance_profile.py             mcp             --json-report conformance-mcp.json
      - name: Upload MCP conformance evidence
        if: always() && matrix.kind == 'quality'
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-mcp
          path: conformance-mcp.json
          if-no-files-found: warn
      - name: Record validation lane runtime
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/validation-runtime
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          started = float(os.environ["VALIDATION_STARTED_AT"])
          payload = {
              "schema_version": 1,
              "lane": os.environ["VALIDATION_LANE"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "wall_seconds": round(time.time() - started, 3),
          }
          path = Path(".artifacts/validation-runtime") / (
              payload["lane"] + ".json"
          )
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
      - name: Upload validation lane runtime
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-validation-runtime-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: .artifacts/validation-runtime/${{ matrix.lane }}.json
          if-no-files-found: warn

  test:
    if: always()
    needs: python-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download Python runtime evidence
        if: needs.python-validation.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: python-test-runtime-*
          path: .artifacts/test-runtime-aggregate
          merge-multiple: false
      - name: Download Python validation runtime evidence
        if: needs.python-validation.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: python-validation-runtime-*
          path: .artifacts/validation-runtime-aggregate
          merge-multiple: false
      - name: Verify frontend-independent Python aggregate budget
        if: needs.python-validation.result == 'success'
        run: |
          python scripts/ci/verify_pytest_runtime_aggregate.py \
            --reports .artifacts/test-runtime-aggregate \
            --validation-reports .artifacts/validation-runtime-aggregate
      - name: Upload Python aggregate runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-runtime-aggregate-attempt-${{ github.run_attempt }}
          path: .artifacts/test-runtime-aggregate/aggregate.json
          if-no-files-found: warn
      - name: Require all Python validation lanes
        if: always()
        env:
          VALIDATION_RESULT: ${{ needs.python-validation.result }}
        run: |
          echo "python-validation=$VALIDATION_RESULT"
          test "$VALIDATION_RESULT" = "success"

  single-node-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AI_MAP_PUBLIC_PORT: "18080"
      AI_MAP_PUBLIC_DOMAIN: "agents.example.test"
      AI_MAP_SOURCE_CONTEXT: "../.."
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Create clean server-only installation
        shell: bash
        run: |
          python -m venv .install-smoke-venv
          source .install-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[server]"
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("uvicorn") is not None
          assert importlib.util.find_spec("pytest") is None
          PY
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Run fresh-install process lifecycle smoke
        run: python scripts/ci/fresh_install_lifecycle_smoke.py
      - name: Validate Docker Compose configurations
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.local.yml config
          docker compose --env-file /dev/null -p agents \
            -f deploy/docker/docker-compose.hostinger-compose-from-url.yml config
          AI_MAP_DATA_VOLUME=ci-recovery-config docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            config
          AI_MAP_PUBLIC_DOMAIN= AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-zero-config.yml \
            config > /tmp/hostinger-zero-config.yml
          grep -F 'uts: host' /tmp/hostinger-zero-config.yml
          if grep -F 'published:' /tmp/hostinger-zero-config.yml; then
            echo "zero-config Hostinger profile unexpectedly publishes a host port" >&2
            exit 1
          fi
          grep -F 'traefik.enable:' /tmp/hostinger-zero-config.yml
          grep -F 'HostRegexp(' /tmp/hostinger-zero-config.yml
          grep -F 'HostSNIRegexp(' /tmp/hostinger-zero-config.yml
          grep -F 'tls.passthrough: "true"' /tmp/hostinger-zero-config.yml
          if grep -F 'setup.invalid' /tmp/hostinger-zero-config.yml \
            || grep -F -- '-custom-http.rule=Host(' /tmp/hostinger-zero-config.yml \
            || grep -F -- '-custom-tls.rule=HostSNI(' /tmp/hostinger-zero-config.yml; then
            echo "zero-config Hostinger profile unexpectedly advertises an exact fallback host" >&2
            exit 1
          fi
          if grep -F 'traefik.docker.network' /tmp/hostinger-zero-config.yml \
            || grep -F 'name: traefik-proxy' /tmp/hostinger-zero-config.yml; then
            echo "zero-config Hostinger profile unexpectedly requires a shared Docker network" >&2
            exit 1
          fi
          if grep -F 'HostSNI(`*`)' /tmp/hostinger-zero-config.yml; then
            echo "zero-config Hostinger profile must not install a catch-all TLS router" >&2
            exit 1
          fi
          grep -F 'custom-compat-http.rule=HostRegexp' \
            deploy/docker/docker-compose.hostinger-zero-config.yml
          grep -F 'custom-compat-tls.rule=HostSNIRegexp' \
            deploy/docker/docker-compose.hostinger-zero-config.yml
          grep -F '(?i)^${AI_MAP_PUBLIC_DOMAIN:+\\Q}${AI_MAP_PUBLIC_DOMAIN:-a^}${AI_MAP_PUBLIC_DOMAIN:+\\E}$' \
            deploy/docker/docker-compose.hostinger-zero-config.yml
          grep -F 'custom-compat-http.rule: HostRegexp(`(?i)^a^$$`)' \
            /tmp/hostinger-zero-config.yml
          grep -F 'custom-compat-tls.rule: HostSNIRegexp(`(?i)^a^$$`)' \
            /tmp/hostinger-zero-config.yml
          if grep -F 'HostSNIRegexp(`^\Q\E$$`)' /tmp/hostinger-zero-config.yml; then
            echo "empty Hostinger compatibility matcher unexpectedly matches empty host/SNI" >&2
            exit 1
          fi
          AI_MAP_PUBLIC_DOMAIN=Agents.Example.Test AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-zero-config.yml \
            config > /tmp/hostinger-zero-config-custom.yml
          grep -F 'custom-compat-http.rule: HostRegexp(`(?i)^\QAgents.Example.Test\E$$`)' \
            /tmp/hostinger-zero-config-custom.yml
          grep -F 'custom-compat-tls.rule: HostSNIRegexp(`(?i)^\QAgents.Example.Test\E$$`)' \
            /tmp/hostinger-zero-config-custom.yml
          grep -F 'custom-compat-http' /tmp/hostinger-zero-config-custom.yml
          grep -F 'custom-compat-tls' /tmp/hostinger-zero-config-custom.yml
          if grep -F 'setup.invalid' /tmp/hostinger-zero-config-custom.yml \
            || grep -F 'Host(`agents.example.test`)' /tmp/hostinger-zero-config-custom.yml \
            || grep -F 'HostSNI(`agents.example.test`)' /tmp/hostinger-zero-config-custom.yml; then
            echo "zero-config Hostinger custom-domain compatibility regressed to an exact host" >&2
            exit 1
          fi
          if AI_MAP_PUBLIC_DOMAIN= AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-custom-domain.yml \
            config >/tmp/hostinger-custom-missing.yml 2>&1; then
            echo "custom-domain Hostinger profile unexpectedly accepts an empty domain" >&2
            exit 1
          fi
          TRAEFIK_HOST= AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-managed.yml \
            config > /tmp/hostinger-managed-pending.yml
          grep -F 'hostinger-http.rule: HostRegexp(`a^`)' \
            /tmp/hostinger-managed-pending.yml
          grep -F 'hostinger-tls.rule: HostSNIRegexp(`a^`)' \
            /tmp/hostinger-managed-pending.yml
          grep -F 'AI_MAP_HOSTINGER_TRAEFIK_HOST: ""' \
            /tmp/hostinger-managed-pending.yml
          if grep -F 'published:' /tmp/hostinger-managed-pending.yml \
            || grep -F 'setup.invalid' /tmp/hostinger-managed-pending.yml; then
            echo "pending managed Hostinger profile regressed its fail-closed contract" >&2
            exit 1
          fi
          TRAEFIK_HOST=srv123456.hstgr.cloud AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-managed.yml \
            config > /tmp/hostinger-managed.yml
          grep -F 'Host(`ai-multi-agent-platform.srv123456.hstgr.cloud`)' \
            /tmp/hostinger-managed.yml
          grep -F 'HostSNI(`ai-multi-agent-platform.srv123456.hstgr.cloud`)' \
            /tmp/hostinger-managed.yml
          grep -F 'AI_MAP_HOSTINGER_TRAEFIK_HOST: srv123456.hstgr.cloud' \
            /tmp/hostinger-managed.yml
          if grep -F 'published:' /tmp/hostinger-managed.yml \
            || grep -F 'setup.invalid' /tmp/hostinger-managed.yml; then
            echo "managed Hostinger profile regressed its private/exact-host contract" >&2
            exit 1
          fi
          COMPOSE_PROJECT_NAME=ai-multi-agent-platform \
            TRAEFIK_HOST=srv123456.hstgr.cloud AI_MAP_IMAGE_TAG=0.0.1 docker compose \
            -f deploy/docker/docker-compose.hostinger-catalog-candidate.yml \
            config > /tmp/hostinger-catalog.yml
          grep -F 'ghcr.io/scoresymphony/ai-multi-agent-platform-control-plane:0.0.1' \
            /tmp/hostinger-catalog.yml
          grep -F 'ghcr.io/scoresymphony/ai-multi-agent-platform-web:0.0.1' \
            /tmp/hostinger-catalog.yml
          grep -F 'ghcr.io/scoresymphony/ai-multi-agent-platform-hostinger-gateway:0.0.1' \
            /tmp/hostinger-catalog.yml
          grep -F 'Host(`ai-multi-agent-platform.srv123456.hstgr.cloud`)' \
            /tmp/hostinger-catalog.yml
          grep -F 'HostSNI(`ai-multi-agent-platform.srv123456.hstgr.cloud`)' \
            /tmp/hostinger-catalog.yml
          grep -F 'AI_MAP_SECURE_COOKIE: "true"' /tmp/hostinger-catalog.yml
          if grep -F 'build:' /tmp/hostinger-catalog.yml \
            || grep -F 'published:' /tmp/hostinger-catalog.yml \
            || grep -F 'setup.invalid' /tmp/hostinger-catalog.yml \
            || grep -F '/var/run/docker.sock' /tmp/hostinger-catalog.yml; then
            echo "Hostinger catalog profile regressed its image-only/private contract" >&2
            exit 1
          fi
          AI_MAP_PUBLIC_DOMAIN=agents.example.test AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-custom-domain.yml \
            config > /tmp/hostinger-custom-domain.yml
          grep -F 'Host(`agents.example.test`)' /tmp/hostinger-custom-domain.yml
          grep -F 'HostSNI(`agents.example.test`)' /tmp/hostinger-custom-domain.yml
          if grep -F 'setup.invalid' /tmp/hostinger-custom-domain.yml; then
            echo "custom-domain Hostinger profile unexpectedly contains setup.invalid" >&2
            exit 1
          fi
          AI_MAP_PUBLIC_DOMAIN= AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-direct.yml \
            config > /tmp/hostinger-direct.yml
          grep -F 'published: "80"' /tmp/hostinger-direct.yml
          grep -F 'published: "443"' /tmp/hostinger-direct.yml
          if grep -F 'traefik.enable:' /tmp/hostinger-direct.yml; then
            echo "direct Hostinger profile unexpectedly contains Traefik labels" >&2
            exit 1
          fi
          AI_MAP_PUBLIC_DOMAIN= AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger.yml \
            config > /tmp/hostinger-legacy.yml
          grep -F 'traefik.enable:' /tmp/hostinger-legacy.yml
          if grep -F 'published: "80"' /tmp/hostinger-legacy.yml \
            || grep -F 'published: "443"' /tmp/hostinger-legacy.yml; then
            echo "legacy Hostinger profile unexpectedly claims 80/443" >&2
            exit 1
          fi
          AI_MAP_PUBLIC_DOMAIN= TRAEFIK_HOST=srv123456.hstgr.cloud \
            AI_MAP_TRAEFIK_NETWORK=traefik-proxy \
            AI_MAP_SOURCE_CONTEXT=../.. \
            docker compose \
            -f deploy/docker/docker-compose.hostinger-shared-traefik.yml \
            config > /tmp/hostinger-shared-traefik.yml
          grep -F 'Host(`ai-multi-agent-platform.srv123456.hstgr.cloud`)' \
            /tmp/hostinger-shared-traefik.yml
          grep -F 'name: traefik-proxy' /tmp/hostinger-shared-traefik.yml
          AI_MAP_PUBLIC_DOMAIN=agents.example.test \
            TRAEFIK_HOST=srv123456.hstgr.cloud \
            AI_MAP_TRAEFIK_NETWORK=traefik-proxy \
            AI_MAP_SOURCE_CONTEXT=../.. \
            docker compose \
            -f deploy/docker/docker-compose.hostinger-shared-traefik.yml \
            config > /tmp/hostinger-shared-custom-domain.yml
          grep -F 'Host(`agents.example.test`)' /tmp/hostinger-shared-custom-domain.yml
      - name: Build production container images
        run: |
          docker compose -f docker-compose.yml build --pull
          docker compose -f docker-compose.local.yml build
          AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-zero-config.yml \
            build
          AI_MAP_PUBLIC_DOMAIN=agents.example.test AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-custom-domain.yml \
            build
          AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-managed.yml \
            build
          AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-direct.yml \
            build
          AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger.yml \
            build
          AI_MAP_SOURCE_CONTEXT=../.. docker compose \
            -f deploy/docker/docker-compose.hostinger-shared-traefik.yml \
            build
      - name: Start Compose profile
        run: docker compose -f docker-compose.local.yml up -d
      - name: Wait for same-origin readiness
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/v1/readiness \
              > /tmp/readiness.json; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.local.yml ps
          docker compose -f docker-compose.local.yml logs --tail=200
          exit 1
      - name: Verify public Web and API boundary
        shell: bash
        run: |
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/v1/health \
            > /tmp/health.json
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/api/v1/readiness \
            > /tmp/readiness.json
          curl --fail --silent --show-error \
            http://127.0.0.1:18080/ \
            > /tmp/index.html
          test -s /tmp/index.html
      - name: Exercise Compose backup and replacement-volume restore
        shell: bash
        run: |
          set -euo pipefail

          export AI_MAP_BACKUP_DIR="$PWD/.ci-compose-backups"
          export AI_MAP_BACKUP_NAME="ci-backup"
          export AI_MAP_BUILD_COMMIT="$GITHUB_SHA"
          export AI_MAP_REPLACEMENT_VOLUME="ai-map-ci-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          docker compose -f docker-compose.local.yml stop

          ADMIN_OUTPUT="$(
            printf '%s\n' 'compose-backup-ci-password' | \
              docker compose -f docker-compose.local.yml run --rm --no-deps -T control-plane \
                platform-server bootstrap-admin \
                --username compose-backup-ci \
                --password-stdin
          )"
          EXPECTED_USER_ID="$(
            printf '%s\n' "$ADMIN_OUTPUT" | \
              sed -n 's/^bootstrapped administrator identity: //p' | tail -n 1
          )"

          SMOKE_OUTPUT="$(
            docker compose -f docker-compose.local.yml run --rm --no-deps -T control-plane \
              platform-server smoke
          )"
          EXPECTED_TASK_ID="$(
            printf '%s\n' "$SMOKE_OUTPUT" | \
              sed -n 's/.*task=\([^ ]*\).*/\1/p' | tail -n 1
          )"
          EXPECTED_RUN_ID="$(
            printf '%s\n' "$SMOKE_OUTPUT" | \
              sed -n 's/.*run=\([^ ]*\).*/\1/p' | tail -n 1
          )"

          test -n "$EXPECTED_USER_ID"
          test -n "$EXPECTED_TASK_ID"
          test -n "$EXPECTED_RUN_ID"

          mkdir -p "$AI_MAP_BACKUP_DIR"
          sudo chown 10001:10001 "$AI_MAP_BACKUP_DIR"

          docker compose -f docker-compose.local.yml --profile operations run \
            --rm --no-deps -T --build backup \
            create \
            --data-dir /var/lib/ai-multi-agent-platform \
            --destination "/backups/$AI_MAP_BACKUP_NAME" \
            --quiesced \
            --platform-commit "$AI_MAP_BUILD_COMMIT"

          docker compose -f docker-compose.local.yml --profile operations run \
            --rm --no-deps -T --build backup \
            verify "/backups/$AI_MAP_BACKUP_NAME"

          # Destroy the original Compose containers, network and named data volume.
          # The following restore must therefore depend only on the exported verified backup.
          docker compose -f docker-compose.local.yml down -v

          if docker volume inspect "$AI_MAP_REPLACEMENT_VOLUME" >/dev/null 2>&1; then
            echo "replacement volume unexpectedly already exists" >&2
            exit 1
          fi
          docker volume create "$AI_MAP_REPLACEMENT_VOLUME"
          export AI_MAP_DATA_VOLUME="$AI_MAP_REPLACEMENT_VOLUME"

          docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            --profile operations run --rm --no-deps -T --build restore \
            restore "/backups/$AI_MAP_BACKUP_NAME" \
            --target-data-dir /var/lib/ai-multi-agent-platform/restored-data \
            --expected-platform-commit "$AI_MAP_BUILD_COMMIT"

          set +e
          DIRTY_RESTORE_OUTPUT="$(
            docker compose \
              -f docker-compose.local.yml \
              -f deploy/docker/docker-compose.recovery.yml \
              --profile operations run --rm --no-deps -T restore \
              restore "/backups/$AI_MAP_BACKUP_NAME" \
              --target-data-dir /var/lib/ai-multi-agent-platform/restored-data \
              --expected-platform-commit "$AI_MAP_BUILD_COMMIT" 2>&1
          )"
          DIRTY_RESTORE_STATUS=$?
          set -e
          test "$DIRTY_RESTORE_STATUS" -ne 0
          printf '%s\n' "$DIRTY_RESTORE_OUTPUT" | \
            grep -F "restore target must not already exist"

          docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            --profile operations run --rm --no-deps -T --build recover-restore

          docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            up -d

          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/v1/readiness \
              > /tmp/restored-readiness.json; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              docker compose \
                -f docker-compose.local.yml \
                -f deploy/docker/docker-compose.recovery.yml \
                ps
              docker compose \
                -f docker-compose.local.yml \
                -f deploy/docker/docker-compose.recovery.yml \
                logs --tail=200
              exit 1
            fi
            sleep 2
          done

          docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            stop

          docker compose \
            -f docker-compose.local.yml \
            -f deploy/docker/docker-compose.recovery.yml \
            run --rm --no-deps -T \
            -e EXPECTED_USER_ID="$EXPECTED_USER_ID" \
            -e EXPECTED_TASK_ID="$EXPECTED_TASK_ID" \
            -e EXPECTED_RUN_ID="$EXPECTED_RUN_ID" \
            control-plane python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          from ai_multi_agent_platform.deployment import (
              SingleNodeConfig,
              build_single_node_deployment,
          )

          data_dir = Path(os.environ["AI_MAP_DATA_DIR"])
          deployment = build_single_node_deployment(
              SingleNodeConfig(data_dir=data_dir, secure_cookie=False)
          )

          expected_user_id = os.environ["EXPECTED_USER_ID"]
          expected_task_id = os.environ["EXPECTED_TASK_ID"]
          expected_run_id = os.environ["EXPECTED_RUN_ID"]

          async def verify() -> None:
              task = await deployment.kernel.get_task(expected_task_id)
              run = await deployment.kernel.get_run(expected_task_id, expected_run_id)
              assert task.task_id == expected_task_id
              assert run.run_id == expected_run_id
              assert run.task_id == expected_task_id
              assert task.status.value == "succeeded"
              assert run.status.value == "succeeded"

          asyncio.run(verify())
          assert expected_user_id in deployment.authentication.store.users
          assert deployment.authorization.has_policy(expected_user_id)
          PY

      - name: Show Compose logs on failure
        if: failure()
        run: docker compose -f docker-compose.local.yml logs --tail=300
      - name: Tear down Compose profile
        if: always()
        shell: bash
        run: |
          AI_MAP_DATA_VOLUME="ai-map-ci-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            docker compose \
              -f docker-compose.local.yml \
              -f deploy/docker/docker-compose.recovery.yml \
              down -v --remove-orphans || true
          docker compose -f docker-compose.local.yml down -v --remove-orphans || true
          docker volume rm \
            "ai-map-ci-restored-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            >/dev/null 2>&1 || true
          docker volume rm ai-multi-agent-platform_platform-data >/dev/null 2>&1 || true
          sudo rm -rf .ci-compose-backups

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Verify frontend toolchain
        run: |
          node --version
          npm --version
          python --version
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser E2E backend
        run: python -m pip install -e "..[server]"
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install optional mobile client dependencies from committed lockfile
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck optional mobile client
        working-directory: mobile
        run: npm run typecheck
      - name: Test optional mobile client
        working-directory: mobile
        run: npm test
      - name: Validate Expo mobile configuration
        working-directory: mobile
        run: npm run check:expo
      - name: Export Android mobile smoke bundle
        working-directory: mobile
        run: npm run smoke:android
      - name: Export iOS mobile smoke bundle
        working-directory: mobile
        run: npm run smoke:ios
      - name: Install Chromium regression runner
        shell: bash
        run: |
          runner_dir="$RUNNER_TEMP/playwright"
          npm install --prefix "$runner_dir" --no-audit --no-fund --no-save --package-lock=false playwright@1.55.0
          ln -s "$runner_dir/node_modules/playwright" node_modules/playwright
          ln -s "$runner_dir/node_modules/playwright-core" node_modules/playwright-core
      - name: Install Chromium
        run: '"$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Run real browser session regression
        run: node tests/browserSession.browser.mjs
      - name: Run clean browser-first deployment regression
        run: node tests/browserFirstRun.browser.mjs
        env:
          BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/browser-first-run-artifacts
      - name: Upload browser first-run failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-first-run-failure
          path: ${{ runner.temp }}/browser-first-run-artifacts
          if-no-files-found: ignore
          retention-days: 7
