name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Capture issue 16 mypy diagnostics
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: mypy > .issue16-mypy.txt 2>&1 || true
      - name: Commit issue 16 mypy diagnostics
        if: github.actor != 'github-actions[bot]'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue16-mypy.txt
          git commit -m "chore: capture issue 16 mypy diagnostics" || exit 0
          git push origin HEAD:issue-16-observability-foundation
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Build package
        run: python -m build
