name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Verify canonical runtime assets
        run: python scripts/ci/issue725_materialize_runtime_assets.py --check
      - name: Ruff format
        run: ruff format --check .
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Pytest
        run: pytest
      - name: Deterministic evaluation gate
        run: python scripts/ci/issue19_evaluation_gate.py --platform-commit "$GITHUB_SHA"
      - name: Materialize runtime assets
        run: python scripts/ci/issue725_materialize_runtime_assets.py
      - name: Build package
        run: python -m build
      - name: Verify built runtime assets
        run: python scripts/ci/issue725_verify_distribution_assets.py dist
      - name: Run MCP environment conformance
        run: |
          python scripts/ci/issue46_optional_environment_profile.py \
            mcp \
            --json-report conformance-mcp.json
      - name: Upload MCP conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-mcp
          path: conformance-mcp.json
          if-no-files-found: warn

  single-node-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Create clean server-only installation
        shell: bash
        run: |
          python -m venv .install-smoke-venv
          source .install-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[server]"
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("uvicorn") is not None
          assert importlib.util.find_spec("pytest") is None
          PY
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Run fresh-install process lifecycle smoke
        run: python scripts/ci/issue39_install_lifecycle_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Verify frontend toolchain
        run: |
          node --version
          npm --version
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install Chromium regression runner
        run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run real browser session regression
        run: node tests/browserSession.browser.mjs

  litellm-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned optional LiteLLM extra and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[litellm]" pytest
      - name: Run LiteLLM environment conformance
        run: |
          python scripts/ci/issue46_optional_environment_profile.py \
            litellm \
            --json-report conformance-litellm.json
      - name: Upload LiteLLM conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-litellm
          path: conformance-litellm.json
          if-no-files-found: warn

  bifrost-pinned-compat:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Start hermetic OpenAI-compatible upstream fixture
        shell: bash
        run: |
          python scripts/ci/issue859_mock_openai.py --port 18000 \
            > "$GITHUB_WORKSPACE/.issue859-mock-openai.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/.issue859-mock-openai.pid"
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:18000/healthz", timeout=1) as response:
                      payload = json.load(response)
                  if payload.get("healthy") is True:
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("issue #859 mock OpenAI endpoint did not become healthy")
          PY
      - name: Create file-only Bifrost configuration
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.issue859-bifrost-data"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cat > "$GITHUB_WORKSPACE/.issue859-bifrost-data/config.json" <<'JSON'
          {
            "encryption_key": "env.BIFROST_ENCRYPTION_KEY",
            "client": {
              "drop_excess_requests": false,
              "enable_logging": false
            },
            "providers": {
              "issue859-local": {
                "keys": [
                  {
                    "name": "issue859-fixture-key",
                    "value": "env.ISSUE859_PROVIDER_KEY",
                    "models": ["fixture-model"],
                    "weight": 1.0
                  }
                ],
                "network_config": {
                  "base_url": "http://127.0.0.1:18000",
                  "default_request_timeout_in_seconds": 5,
                  "max_retries": 0
                },
                "custom_provider_config": {
                  "base_provider_type": "openai",
                  "allowed_requests": {
                    "list_models": true,
                    "chat_completion": true,
                    "chat_completion_stream": true
                  },
                  "request_path_overrides": {
                    "chat_completion": "/v1/chat/completions",
                    "chat_completion_stream": "/v1/chat/completions"
                  }
                }
              }
            },
            "config_store": {
              "enabled": false
            }
          }
          JSON
      - name: Pull and start reviewed Bifrost HTTP release
        shell: bash
        run: |
          docker pull maximhq/bifrost:v2.1.1
          docker image inspect \
            --format '{{index .RepoDigests 0}}' \
            maximhq/bifrost:v2.1.1 \
            > "$GITHUB_WORKSPACE/artifacts/issue-859-bifrost-image-digest.txt"
          docker run --rm -d \
            --name issue859-bifrost \
            --network host \
            -v "$GITHUB_WORKSPACE/.issue859-bifrost-data:/app/data" \
            -e APP_HOST=0.0.0.0 \
            -e BIFROST_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef \
            -e ISSUE859_PROVIDER_KEY=ci-fixture-provider-key \
            maximhq/bifrost:v2.1.1
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          payload = json.dumps({
              "model": "issue859-local/fixture-model",
              "messages": [{"role": "user", "content": "ready"}],
          }).encode("utf-8")
          for _ in range(120):
              request = urllib.request.Request(
                  "http://127.0.0.1:8080/v1/chat/completions",
                  data=payload,
                  headers={"Content-Type": "application/json"},
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=2) as response:
                      body = json.load(response)
                  if response.status == 200 and body.get("choices"):
                      break
              except (OSError, urllib.error.HTTPError):
                  time.sleep(0.5)
          else:
              raise SystemExit("pinned Bifrost gateway did not become ready")
          PY
      - name: Run pinned Bifrost compatibility and fault gates
        env:
          BIFROST_EVAL_DIRECT_BASE_URL: http://127.0.0.1:18000/v1
          BIFROST_EVAL_DIRECT_MODEL: fixture-model
          BIFROST_EVAL_BIFROST_BASE_URL: http://127.0.0.1:8080/v1
          BIFROST_EVAL_BIFROST_MODEL: issue859-local/fixture-model
          BIFROST_EVAL_OPERATION_COUNT: "6"
          BIFROST_EVAL_CONCURRENCY: "2"
          BIFROST_EVAL_WARMUP: "1"
          BIFROST_EVAL_STRUCTURED_OUTPUT: "1"
          BIFROST_EVAL_TOOL_CALLING: "1"
          BIFROST_EVAL_UPSTREAM_CONTROL_URL: http://127.0.0.1:18000/control
        run: |
          pytest \
            tests/test_issue_859_bifrost_live_conformance.py \
            tests/test_issue_859_bifrost_evaluation.py \
            -m integration
      - name: Emit non-representative CI gateway smoke evidence
        run: |
          python -m ai_multi_agent_platform.adapters.model_gateway_evaluation_cli \
            --canonical-model-id issue-859-ci-model \
            --downstream-deployment-label issue-859-ci-mock-openai \
            --direct-base-url http://127.0.0.1:18000/v1 \
            --direct-model fixture-model \
            --direct-runtime-version issue859-mock-openai-v1 \
            --bifrost-base-url http://127.0.0.1:8080/v1 \
            --bifrost-model issue859-local/fixture-model \
            --operation-count 10 \
            --concurrency 2 \
            --warmup-operations 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/issue-859-ci-direct-vs-bifrost.json
      - name: Verify gateway diagnostics do not expose synthetic secrets
        shell: bash
        run: |
          docker logs issue859-bifrost > "$RUNNER_TEMP/issue859-bifrost.log" 2>&1
          if grep -Fq "ci-fixture-provider-key" "$RUNNER_TEMP/issue859-bifrost.log"; then
            echo "Bifrost runtime logs exposed the synthetic provider credential" >&2
            exit 1
          fi
          if grep -Fq "synthetic-secret=must-not-leak" "$RUNNER_TEMP/issue859-bifrost.log"; then
            echo "Bifrost runtime logs exposed the synthetic upstream secret marker" >&2
            exit 1
          fi
      - name: Upload Bifrost CI smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: issue-859-bifrost-ci-smoke
          path: artifacts/issue-859-*
          if-no-files-found: warn
      - name: Show Bifrost startup diagnostics on failure
        if: failure()
        run: docker logs issue859-bifrost || true
      - name: Stop Bifrost and mock upstream
        if: always()
        shell: bash
        run: |
          docker stop issue859-bifrost 2>/dev/null || true
          if [ -f "$GITHUB_WORKSPACE/.issue859-mock-openai.pid" ]; then
            kill "$(cat "$GITHUB_WORKSPACE/.issue859-mock-openai.pid")" 2>/dev/null || true
          fi

  hermes-pinned-compat:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Checkout pinned Hermes runtime source
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 2237be355906fbe6065ce1815711eee52b2d646e
          path: .upstream/hermes
          persist-credentials: false
      - name: Install pinned Hermes runtime dependencies
        run: |
          python -m pip install -e ".upstream/hermes"
          python -m pip install "aiohttp==3.14.3"
      - name: Run Hermes Scenario B conformance
        env:
          HERMES_UPSTREAM_DIR: ${{ github.workspace }}/.upstream/hermes
          HERMES_UPSTREAM_REVISION: 2237be355906fbe6065ce1815711eee52b2d646e
        run: |
          platform-conformance \
            --profile integration \
            --deployment-profile hermes-pinned \
            --enable-optional B \
            --scenario B \
            --adapter-version "hermes-agent=$HERMES_UPSTREAM_REVISION" \
            --json-report conformance-hermes.json
      - name: Upload Hermes conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-hermes
          path: conformance-hermes.json
          if-no-files-found: warn

  forge-sidecar-integration:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Checkout pinned Forge runtime source
        uses: actions/checkout@v7
        with:
          repository: ScoreSymphony/AI-Agent-VPS
          ref: 00b821bc94767865457814bf282982ca242a2e10
          path: .upstream/forge
          persist-credentials: false
      - name: Build execution-only Forge sidecar
        working-directory: .upstream/forge/core/forge
        run: cargo build -p executor-sidecar --bin forge-executor-sidecar
      - name: Start execution-only Forge sidecar
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.forge-sidecar-workspaces"
          mkdir -p "$GITHUB_WORKSPACE/.forge-sidecar-logs"
          FORGE_EXECUTOR_WORKSPACE_ROOT="$GITHUB_WORKSPACE/.forge-sidecar-workspaces" \
          FORGE_EXECUTOR_LOGS_ROOT="$GITHUB_WORKSPACE/.forge-sidecar-logs" \
          FORGE_EXECUTOR_ALLOWED_TYPES="null" \
          FORGE_EXECUTOR_SIDECAR_ADDR="127.0.0.1:8787" \
          "$GITHUB_WORKSPACE/.upstream/forge/core/forge/target/debug/forge-executor-sidecar" \
            > "$GITHUB_WORKSPACE/.forge-sidecar.log" 2>&1 &
          echo $! > "$GITHUB_WORKSPACE/.forge-sidecar.pid"
          python - <<'PY'
          import json
          import time
          import urllib.request

          for _ in range(80):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8787/healthz", timeout=1) as response:
                      payload = json.load(response)
                  if payload.get("healthy") is True:
                      break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("Forge executor sidecar did not become healthy")
          PY
      - name: Run Forge Scenario C conformance
        env:
          FORGE_SIDECAR_BASE_URL: http://127.0.0.1:8787
          FORGE_SIDECAR_WORKSPACE_ROOT: ${{ github.workspace }}/.forge-sidecar-workspaces
        run: |
          platform-conformance \
            --profile integration \
            --deployment-profile forge-sidecar \
            --enable-optional C \
            --scenario C \
            --adapter-version "forge-sidecar=00b821bc94767865457814bf282982ca242a2e10" \
            --json-report conformance-forge.json
      - name: Upload Forge conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-forge
          path: conformance-forge.json
          if-no-files-found: warn
      - name: Show Forge sidecar log
        if: always()
        run: cat "$GITHUB_WORKSPACE/.forge-sidecar.log" || true
      - name: Stop Forge sidecar
        if: always()
        shell: bash
        run: |
          if [ -f "$GITHUB_WORKSPACE/.forge-sidecar.pid" ]; then
            kill "$(cat "$GITHUB_WORKSPACE/.forge-sidecar.pid")" 2>/dev/null || true
          fi
