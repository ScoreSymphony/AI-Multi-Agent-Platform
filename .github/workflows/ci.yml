name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: quality
            kind: quality
            marker: ""
            paths: ""
          - lane: unit
            kind: test
            marker: unit
            paths: tests/unit
          - lane: contract-architecture-release
            kind: test
            marker: not unit
            paths: tests/architecture tests/contract tests/release
          - lane: integration
            kind: test
            marker: not unit
            paths: tests/integration
          - lane: system-regression
            kind: test
            marker: not unit
            paths: tests/e2e tests/performance tests/regression
    name: python-validation (${{ matrix.lane }})
    steps:
      - name: Record validation lane start
        shell: bash
        run: echo "VALIDATION_STARTED_AT=$(date +%s.%N)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap documented environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"

      - name: Run pytest lane with retained timing evidence
        if: matrix.kind == 'test'
        shell: bash
        run: |
          python scripts/ci/run_pytest_lane.py             --lane "${{ matrix.lane }}"             -- -m "${{ matrix.marker }}" ${{ matrix.paths }}
      - name: Verify fast-layer regression detection
        if: matrix.lane == 'unit'
        run: python scripts/ci/verify_fast_unit_regression_detection.py
      - name: Verify non-unit shard coverage
        if: matrix.lane == 'unit'
        run: python scripts/ci/verify_pytest_shards.py
      - name: Upload pytest runtime evidence
        if: always() && matrix.kind == 'test'
        uses: actions/upload-artifact@v7
        with:
          name: python-test-runtime-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: .artifacts/test-runtime/${{ matrix.lane }}.*
          if-no-files-found: warn

      - name: Verify canonical runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/materialize_runtime_assets.py --check
      - name: Ruff format
        if: matrix.kind == 'quality'
        run: ruff format --check .
      - name: Ruff lint
        if: matrix.kind == 'quality'
        run: ruff check .
      - name: Mypy
        if: matrix.kind == 'quality'
        run: mypy
      - name: Deterministic evaluation gate
        if: matrix.kind == 'quality'
        run: python scripts/ci/deterministic_evaluation_regression_gate.py --platform-commit "$GITHUB_SHA"
      - name: Materialize runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/materialize_runtime_assets.py
      - name: Build package
        if: matrix.kind == 'quality'
        run: python -m build
      - name: Verify built runtime assets
        if: matrix.kind == 'quality'
        run: python scripts/ci/verify_distribution_runtime_assets.py dist
      - name: Run MCP environment conformance
        if: matrix.kind == 'quality'
        run: |
          python scripts/ci/optional_environment_conformance_profile.py             mcp             --json-report conformance-mcp.json
      - name: Upload MCP conformance evidence
        if: always() && matrix.kind == 'quality'
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-mcp
          path: conformance-mcp.json
          if-no-files-found: warn
      - name: Record validation lane runtime
        if: always()
        shell: bash
        run: |
          mkdir -p .artifacts/validation-runtime
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          started = float(os.environ["VALIDATION_STARTED_AT"])
          payload = {
              "schema_version": 1,
              "lane": os.environ["VALIDATION_LANE"],
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "wall_seconds": round(time.time() - started, 3),
          }
          path = Path(".artifacts/validation-runtime") / (
              payload["lane"] + ".json"
          )
          path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
        env:
          VALIDATION_LANE: ${{ matrix.lane }}
      - name: Upload validation lane runtime
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-validation-runtime-${{ matrix.lane }}-attempt-${{ github.run_attempt }}
          path: .artifacts/validation-runtime/${{ matrix.lane }}.json
          if-no-files-found: warn

  test:
    if: always()
    needs: python-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Download Python runtime evidence
        if: needs.python-validation.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: python-test-runtime-*
          path: .artifacts/test-runtime-aggregate
          merge-multiple: false
      - name: Download Python validation runtime evidence
        if: needs.python-validation.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: python-validation-runtime-*
          path: .artifacts/validation-runtime-aggregate
          merge-multiple: false
      - name: Verify frontend-independent Python aggregate budget
        if: needs.python-validation.result == 'success'
        run: |
          python scripts/ci/verify_pytest_runtime_aggregate.py \
            --reports .artifacts/test-runtime-aggregate \
            --validation-reports .artifacts/validation-runtime-aggregate
      - name: Upload Python aggregate runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: python-test-runtime-aggregate-attempt-${{ github.run_attempt }}
          path: .artifacts/test-runtime-aggregate/aggregate.json
          if-no-files-found: warn
      - name: Require all Python validation lanes
        if: always()
        env:
          VALIDATION_RESULT: ${{ needs.python-validation.result }}
        run: |
          echo "python-validation=$VALIDATION_RESULT"
          test "$VALIDATION_RESULT" = "success"

  single-node-install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Create clean server-only installation
        shell: bash
        run: |
          python -m venv .install-smoke-venv
          source .install-smoke-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[server]"
          python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("uvicorn") is not None
          assert importlib.util.find_spec("pytest") is None
          PY
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Run fresh-install process lifecycle smoke
        run: python scripts/ci/fresh_install_lifecycle_smoke.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Verify frontend toolchain
        run: |
          node --version
          npm --version
          python --version
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser E2E backend
        run: python -m pip install -e "..[server]"
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test frontend
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Install optional mobile client dependencies from committed lockfile
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Typecheck optional mobile client
        working-directory: mobile
        run: npm run typecheck
      - name: Test optional mobile client
        working-directory: mobile
        run: npm test
      - name: Validate Expo mobile configuration
        working-directory: mobile
        run: npm run check:expo
      - name: Export Android mobile smoke bundle
        working-directory: mobile
        run: npm run smoke:android
      - name: Export iOS mobile smoke bundle
        working-directory: mobile
        run: npm run smoke:ios
      - name: Install Chromium regression runner
        shell: bash
        run: |
          runner_dir="$RUNNER_TEMP/playwright"
          npm install --prefix "$runner_dir" --no-audit --no-fund --no-save --package-lock=false playwright@1.55.0
          ln -s "$runner_dir/node_modules/playwright" node_modules/playwright
          ln -s "$runner_dir/node_modules/playwright-core" node_modules/playwright-core
      - name: Install Chromium
        run: '"$RUNNER_TEMP/playwright/node_modules/.bin/playwright" install --with-deps chromium'
      - name: Run real browser session regression
        run: node tests/browserSession.browser.mjs
      - name: Run clean browser-first deployment regression
        run: node tests/browserFirstRun.browser.mjs
        env:
          BROWSER_E2E_ARTIFACT_DIR: ${{ runner.temp }}/browser-first-run-artifacts
      - name: Upload browser first-run failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-first-run-failure
          path: ${{ runner.temp }}/browser-first-run-artifacts
          if-no-files-found: ignore
          retention-days: 7
