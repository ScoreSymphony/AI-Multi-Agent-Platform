name: Issue 19 portability composition helper

on:
  push:
    branches:
      - fix/issue-19-final-product-completion

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-19-final-product-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Compose EvaluationSuite portability and format changed Python
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/deployment/single_node.py")
          text = path.read_text(encoding="utf-8")
          old = '''    portability_workflow = build_agent_portability_workflow(
              agents=agents.repository,
              models=models,
              scopes=scopes,
              platform_version=__version__,
              templates=templates.repository,
          )
          '''
          new = '''    portability_workflow = build_agent_portability_workflow(
              agents=agents.repository,
              models=models,
              scopes=scopes,
              platform_version=__version__,
              templates=templates.repository,
              evaluation=evaluation_composition.service,
          )
          '''
          if old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
          elif new not in text:
              raise SystemExit("expected portability composition block not found")
          PY
          python -m pip install "ruff>=0.12,<1"
          ruff format \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/evaluation/service.py \
            src/ai_multi_agent_platform/evaluation/single_node.py \
            src/ai_multi_agent_platform/evaluation/suite_assets.py \
            src/ai_multi_agent_platform/portability/composition.py \
            src/ai_multi_agent_platform/portability/evaluation_codecs.py \
            src/ai_multi_agent_platform/portability/evaluation_import.py \
            tests/test_issue_19_suite_assets.py \
            tests/test_issue_19_evaluation_suite_portability.py
      - name: Commit deterministic composition patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/evaluation/service.py \
            src/ai_multi_agent_platform/evaluation/single_node.py \
            src/ai_multi_agent_platform/evaluation/suite_assets.py \
            src/ai_multi_agent_platform/portability/composition.py \
            src/ai_multi_agent_platform/portability/evaluation_codecs.py \
            src/ai_multi_agent_platform/portability/evaluation_import.py \
            tests/test_issue_19_suite_assets.py \
            tests/test_issue_19_evaluation_suite_portability.py
          git commit -m "feat: wire evaluation suite portability into single node"
          git push origin HEAD:fix/issue-19-final-product-completion
