name: Issue 19 finalization helper

on:
  push:
    branches:
      - fix/issue-19-final-product-completion

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-19-final-product-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply finalization patch
        run: python scripts/issue19_finalize_temp.py
      - name: Format touched files
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff format src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/evaluation/suite_assets.py
      - name: Commit finalization
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/evaluation/suite_assets.py
          git commit -m "fix: finalize evaluation suite product composition"
          git push origin HEAD:fix/issue-19-final-product-completion
