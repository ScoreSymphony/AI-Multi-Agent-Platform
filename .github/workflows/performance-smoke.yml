name: Performance smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate benchmark implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking \
            tests/test_issue_440_benchmarking.py \
            tests/test_issue_440_sweep.py \
            tests/test_issue_440_workloads.py \
            tests/test_issue_440_endurance.py \
            tests/test_issue_440_stress_fault.py \
            tests/test_issue_440_transport_faults.py \
            tests/test_issue_440_persistence.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking \
            tests/test_issue_440_benchmarking.py \
            tests/test_issue_440_sweep.py \
            tests/test_issue_440_workloads.py \
            tests/test_issue_440_endurance.py \
            tests/test_issue_440_stress_fault.py \
            tests/test_issue_440_transport_faults.py \
            tests/test_issue_440_persistence.py
          mypy src/ai_multi_agent_platform/benchmarking
          pytest \
            tests/test_issue_440_benchmarking.py \
            tests/test_issue_440_sweep.py \
            tests/test_issue_440_workloads.py \
            tests/test_issue_440_endurance.py \
            tests/test_issue_440_stress_fault.py \
            tests/test_issue_440_transport_faults.py \
            tests/test_issue_440_persistence.py
      - name: Run deterministic single-node performance smoke
        run: |
          mkdir -p artifacts/benchmarks
          platform-benchmark single-node \
            --operations 5 \
            --concurrency 2 \
            --warmup-operations 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-single-node.json
      - name: Run tiny single-node concurrency sweep
        run: |
          platform-benchmark single-node-sweep \
            --concurrency-levels 1,2 \
            --operations-per-level 2 \
            --warmup-operations 0 \
            --repetitions 1 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-sweep
      - name: Run tiny growing-state persistence sweep
        run: |
          platform-benchmark single-node-persistence-sweep \
            --seed-task-levels 1,2 \
            --operations-per-level 2 \
            --concurrency 1 \
            --warmup-operations 0 \
            --repetitions 1 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-persistence-sweep
      - name: Run tiny single-node workload profiles
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks/pr-workloads
          for scenario in read-heavy mixed history restart; do
            platform-benchmark single-node-workload \
              --scenario "$scenario" \
              --operations 5 \
              --concurrency 2 \
              --seed-tasks 2 \
              --warmup-operations 0 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-workloads/${scenario}.json"
          done
      - name: Run tiny idle and soak profiles
        run: |
          mkdir -p artifacts/benchmarks/pr-endurance
          platform-benchmark single-node-endurance \
            --scenario idle \
            --duration-seconds 0.05 \
            --sample-interval-seconds 0.02 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-endurance/idle.json
          platform-benchmark single-node-endurance \
            --scenario soak \
            --duration-seconds 5 \
            --sample-interval-seconds 0.01 \
            --max-operations 4 \
            --concurrency 2 \
            --seed-tasks 2 \
            --warmup-operations 0 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-endurance/soak.json
      - name: Run tiny stress and fault-under-load profiles
        run: |
          platform-benchmark single-node-stress \
            --concurrency-levels 1,2 \
            --operations-per-level 2 \
            --warmup-operations 0 \
            --safety-max-concurrency 4 \
            --safety-max-operations-per-level 4 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/pr-stress
          platform-benchmark single-node-fault-under-load \
            --operations 6 \
            --concurrency 2 \
            --fault-after-operations 3 \
            --seed-tasks 2 \
            --warmup-operations 0 \
            --safety-max-operations 10 \
            --safety-max-concurrency 4 \
            --read-weight 2 \
            --write-weight 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-fault.json
      - name: Run tiny transport fault profiles
        run: |
          mkdir -p artifacts/benchmarks/pr-transport-faults
          platform-benchmark transport-fault \
            --scenario backpressure \
            --batch-size 2 \
            --concurrency 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/backpressure.json
          platform-benchmark transport-fault \
            --scenario outage \
            --batch-size 2 \
            --concurrency 2 \
            --fault-operations 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/outage.json
          platform-benchmark transport-fault \
            --scenario duplicate-delivery \
            --batch-size 3 \
            --concurrency 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-transport-faults/duplicate-delivery.json
      - name: Validate benchmark report schemas and correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report = json.loads(Path("artifacts/benchmarks/pr-single-node.json").read_text())
          report_schema = json.loads(
              Path("docs/schemas/benchmark-report.v1.schema.json").read_text()
          )
          Draft202012Validator(report_schema).validate(report)
          assert report["correctness"]["passed"] is True
          assert report["benchmark"]["deployment_profile"] == "single-node-reference"

          sweep = json.loads(Path("artifacts/benchmarks/pr-sweep/summary.json").read_text())
          sweep_schema = json.loads(
              Path("docs/schemas/benchmark-sweep.v1.schema.json").read_text()
          )
          Draft202012Validator(sweep_schema).validate(sweep)
          assert sweep["correctness_passed"] is True
          assert sweep["concurrency_levels"] == [1, 2]
          assert len(sweep["points"]) == 2

          for point in sweep["points"]:
              point_report = json.loads(
                  (Path("artifacts/benchmarks/pr-sweep") / point["report_file"]).read_text()
              )
              Draft202012Validator(report_schema).validate(point_report)
              assert point_report["correctness"]["passed"] is True

          persistence_sweep = json.loads(
              Path("artifacts/benchmarks/pr-persistence-sweep/summary.json").read_text()
          )
          persistence_sweep_schema = json.loads(
              Path("docs/schemas/benchmark-persistence-sweep.v1.schema.json").read_text()
          )
          Draft202012Validator(persistence_sweep_schema).validate(persistence_sweep)
          assert persistence_sweep["correctness_passed"] is True
          assert persistence_sweep["seed_task_levels"] == [1, 2]
          assert len(persistence_sweep["points"]) == 2

          workload_schema = json.loads(
              Path("docs/schemas/benchmark-workload.v1.schema.json").read_text()
          )
          for point in persistence_sweep["points"]:
              point_report = json.loads(
                  (
                      Path("artifacts/benchmarks/pr-persistence-sweep")
                      / point["report_file"]
                  ).read_text()
              )
              Draft202012Validator(workload_schema).validate(point_report)
              assert point_report["benchmark"]["scenario"] == "restart"
              assert point_report["correctness"]["passed"] is True

          for scenario in ("read-heavy", "mixed", "history", "restart"):
              workload = json.loads(
                  Path(f"artifacts/benchmarks/pr-workloads/{scenario}.json").read_text()
              )
              Draft202012Validator(workload_schema).validate(workload)
              assert workload["benchmark"]["scenario"] == scenario
              assert workload["correctness"]["passed"] is True

          endurance_schema = json.loads(
              Path("docs/schemas/benchmark-endurance.v1.schema.json").read_text()
          )
          for scenario in ("idle", "soak"):
              endurance = json.loads(
                  Path(f"artifacts/benchmarks/pr-endurance/{scenario}.json").read_text()
              )
              Draft202012Validator(endurance_schema).validate(endurance)
              assert endurance["benchmark"]["scenario"] == scenario
              assert endurance["correctness"]["passed"] is True
              assert len(endurance["snapshots"]) >= 2

          stress = json.loads(Path("artifacts/benchmarks/pr-stress/summary.json").read_text())
          stress_schema = json.loads(
              Path("docs/schemas/benchmark-stress.v1.schema.json").read_text()
          )
          Draft202012Validator(stress_schema).validate(stress)
          assert stress["correctness_passed"] is True
          assert stress["completed_levels"] == [1, 2]
          for point in stress["points"]:
              point_report = json.loads(
                  (Path("artifacts/benchmarks/pr-stress") / point["report_file"]).read_text()
              )
              Draft202012Validator(report_schema).validate(point_report)
              assert point_report["correctness"]["passed"] is True

          fault = json.loads(Path("artifacts/benchmarks/pr-fault.json").read_text())
          fault_schema = json.loads(
              Path("docs/schemas/benchmark-fault-under-load.v1.schema.json").read_text()
          )
          Draft202012Validator(fault_schema).validate(fault)
          assert fault["benchmark"]["scenario"] == "control-plane-restart"
          assert fault["correctness"]["passed"] is True
          assert fault["correctness"]["pre_fault_completed_operations"] > 0
          assert fault["correctness"]["post_fault_completed_operations"] > 0
          assert fault["correctness"]["unauthorized_access_blocked"] is True

          transport_schema = json.loads(
              Path("docs/schemas/benchmark-transport-fault.v1.schema.json").read_text()
          )
          expected_errors = {
              "backpressure": {"resource_exhausted": 1},
              "outage": {"unavailable": 2},
              "duplicate-delivery": {},
          }
          for scenario in ("backpressure", "outage", "duplicate-delivery"):
              transport = json.loads(
                  Path(f"artifacts/benchmarks/pr-transport-faults/{scenario}.json").read_text()
              )
              Draft202012Validator(transport_schema).validate(transport)
              assert transport["benchmark"]["scenario"] == scenario
              assert transport["correctness"]["passed"] is True
              assert transport["correctness"]["message_loss_count"] == 0
              assert transport["error_counts"] == expected_errors[scenario]
          assert (
              json.loads(
                  Path(
                      "artifacts/benchmarks/pr-transport-faults/duplicate-delivery.json"
                  ).read_text()
              )["correctness"]["suppressed_duplicate_handlers"]
              == 1
          )
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-single-node-benchmark
          path: artifacts/benchmarks
          if-no-files-found: ignore
