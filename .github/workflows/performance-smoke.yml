name: Performance smoke

on:
  pull_request:
  workflow_dispatch:

jobs:
  performance-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run deterministic single-node performance smoke
        run: |
          mkdir -p artifacts/benchmarks
          platform-benchmark single-node \
            --operations 5 \
            --concurrency 2 \
            --warmup-operations 1 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-single-node.json
      - name: Validate benchmark report schema and correctness
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report = json.loads(Path("artifacts/benchmarks/pr-single-node.json").read_text())
          schema = json.loads(Path("docs/schemas/benchmark-report.v1.schema.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          assert report["benchmark"]["deployment_profile"] == "single-node-reference"
          PY
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-single-node-benchmark
          path: artifacts/benchmarks/pr-single-node.json
          if-no-files-found: ignore
