name: Reliability regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/reliability-regressions.yml"
  workflow_dispatch:

jobs:
  persistence-fault-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate persistence fault benchmark implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py \
            tests/performance/test_issue_440_persistence_fault_benchmark.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py \
            tests/performance/test_issue_440_persistence_fault_benchmark.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py
          pytest tests/performance/test_issue_440_persistence_fault_benchmark.py
      - name: Run tiny persistence fault profile
        run: |
          mkdir -p artifacts/benchmarks/pr-persistence-fault
          platform-persistence-fault \
            --task-count 2 \
            --concurrency 1 \
            --failure-mode mixed \
            --failure-every 1 \
            --max-attempts 2 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-persistence-fault/report.json
      - name: Validate persistence fault report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-persistence-fault.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-persistence-fault/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          faults = report["faults"]
          assert report["benchmark"]["task_count"] == 2
          assert report["benchmark"]["failure_mode"] == "mixed"
          assert report["benchmark"]["logical_operation_count"] == 4
          assert correctness["passed"] is True
          assert correctness["completed_tasks"] == 2
          assert correctness["successful_logical_operations"] == 4
          assert correctness["retryable_failures_observed"] == 4
          assert correctness["recovered_faulted_operations"] == 4
          assert correctness["history_failures"] == 0
          assert correctness["command_record_failures"] == 0
          assert faults["planned_faults"] == 4
          assert faults["injected_failures"] == 4
          assert faults["injected_before_commit"] == 2
          assert faults["injected_after_commit"] == 2
          assert report["recovery_latency"]["count"] == 4
          PY
      - name: Upload persistence fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-persistence-fault-benchmark
          path: artifacts/benchmarks/pr-persistence-fault
          if-no-files-found: ignore

  provider-fault-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate provider fault implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py \
            tests/performance/test_issue_440_provider_faults.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py \
            tests/performance/test_issue_440_provider_faults.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py
          pytest tests/performance/test_issue_440_provider_faults.py
      - name: Run tiny provider degradation profiles
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks/pr-provider-faults
          for scenario in \
            model-latency \
            model-unavailable \
            model-cancelled \
            tool-unavailable \
            tool-timeout \
            tool-cancelled; do
            platform-provider-fault \
              --scenario "$scenario" \
              --operations-per-phase 2 \
              --concurrency 2 \
              --fault-delay-seconds 0.02 \
              --tool-timeout-seconds 0.005 \
              --cancel-after-seconds 0.005 \
              --operation-timeout-seconds 1 \
              --safety-max-operations-per-phase 4 \
              --safety-max-concurrency 4 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-provider-faults/${scenario}.json"
          done
      - name: Validate provider fault reports
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-provider-fault.v1.schema.json").read_text()
          )
          expected_errors = {
              "model-latency": {},
              "model-unavailable": {"unavailable": 2},
              "model-cancelled": {"cancelled": 2},
              "tool-unavailable": {"unavailable": 2},
              "tool-timeout": {"timeout": 2},
              "tool-cancelled": {"cancelled": 2},
          }
          expected_retryable_errors = {
              "model-latency": {},
              "model-unavailable": {"unavailable": 2},
              "model-cancelled": {},
              "tool-unavailable": {"unavailable": 2},
              "tool-timeout": {"timeout": 2},
              "tool-cancelled": {"cancelled": 2},
          }
          for scenario, errors in expected_errors.items():
              report = json.loads(
                  Path(f"artifacts/benchmarks/pr-provider-faults/{scenario}.json").read_text()
              )
              Draft202012Validator(schema).validate(report)
              assert report["benchmark"]["scenario"] == scenario
              assert report["correctness"]["passed"] is True
              assert report["correctness"]["recovered"] is True
              assert report["correctness"]["automatic_retry_attempts"] == 0
              assert report["error_counts"] == errors
              assert report["retryable_error_counts"] == expected_retryable_errors[scenario]
              for phase in ("baseline", "fault", "recovery"):
                  assert report["phase_latency"][phase]["count"] == 2
                  assert report["provider_service_latency"][phase]["count"] == 2
                  assert report["platform_overhead_latency"][phase]["count"] == 2
          assert (
              json.loads(
                  Path(
                      "artifacts/benchmarks/pr-provider-faults/model-latency.json"
                  ).read_text()
              )["provider_service_latency"]["fault"]["p50_ms"]
              >= 10
          )
          PY
      - name: Upload provider fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-provider-fault-benchmarks
          path: artifacts/benchmarks/pr-provider-faults
          if-no-files-found: ignore

  distributed-faults-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate distributed fault implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py \
            tests/performance/test_issue_440_distributed_faults.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py \
            tests/performance/test_issue_440_distributed_faults.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/distributed_faults.py \
            src/ai_multi_agent_platform/benchmarking/distributed_faults_cli.py
          pytest tests/performance/test_issue_440_distributed_faults.py
      - name: Run tiny distributed fault profile
        run: |
          mkdir -p artifacts/benchmarks/pr-distributed-faults
          platform-distributed-faults \
            --worker-count 3 \
            --pre-fault-rounds 1 \
            --degraded-rounds 1 \
            --post-rejoin-rounds 1 \
            --payload-bytes 1024 \
            --heartbeat-timeout-seconds 1 \
            --reservation-ttl-seconds 1 \
            --timeout-seconds 20 \
            --safety-max-operations 16 \
            --safety-max-payload-bytes 4096 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-distributed-faults/report.json
      - name: Validate distributed fault report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-distributed-faults.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-distributed-faults/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          benchmark = report["benchmark"]
          correctness = report["correctness"]
          assert benchmark["worker_count"] == 3
          assert benchmark["pre_fault_jobs"] == 3
          assert benchmark["degraded_jobs"] == 2
          assert benchmark["post_rejoin_jobs"] == 3
          assert benchmark["expected_successful_jobs"] == 9
          assert benchmark["total_attempts"] == 10
          assert correctness["passed"] is True
          assert correctness["stable_worker_ids"] == 3
          assert correctness["lost_worker_offline"] is True
          assert correctness["degraded_avoided_lost_worker"] is True
          assert correctness["rejoin_preserved_identity"] is True
          assert correctness["post_rejoin_used_rejoined_worker"] is True
          assert correctness["workspace_failure_code"] == "unavailable"
          assert correctness["workspace_failure_retryable"] is True
          assert correctness["workspace_failure_record_lost"] is True
          assert correctness["workspace_failure_reached_execution"] is False
          assert correctness["workspace_recovery_terminal"] is True
          assert correctness["workspace_cleanup_succeeded"] is True
          assert correctness["terminal_successful_jobs"] == 9
          assert report["pre_fault_dispatch_latency"]["count"] == 3
          assert report["worker_loss_reconciliation_latency"]["count"] == 1
          assert report["degraded_dispatch_latency"]["count"] == 2
          assert report["worker_rejoin_latency"]["count"] == 1
          assert report["post_rejoin_dispatch_latency"]["count"] == 3
          assert report["workspace_failure_latency"]["count"] == 1
          assert report["workspace_recovery_dispatch_latency"]["count"] == 1
          PY
      - name: Upload distributed fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-distributed-fault-benchmark
          path: artifacts/benchmarks/pr-distributed-faults
          if-no-files-found: ignore

  ha-failover-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate HA failover benchmark implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py \
            tests/performance/test_issue_440_ha_failover_benchmark.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py \
            tests/performance/test_issue_440_ha_failover_benchmark.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/ha_failover.py \
            src/ai_multi_agent_platform/benchmarking/ha_failover_cli.py
          pytest tests/performance/test_issue_440_ha_failover_benchmark.py
      - name: Run tiny HA failover profile
        run: |
          mkdir -p artifacts/benchmarks/pr-ha-failover
          platform-ha-failover \
            --active-task-count 2 \
            --repetitions 1 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-ha-failover/report.json
      - name: Validate HA failover report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-ha-failover.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-ha-failover/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          assert report["benchmark"]["active_task_count"] == 2
          assert report["benchmark"]["repetitions"] == 1
          assert report["benchmark"]["coordination_profile"] == "in-memory-process-local"
          assert correctness["passed"] is True
          assert correctness["expected_tasks"] == 2
          assert correctness["prepared_tasks"] == 2
          assert correctness["recovered_tasks"] == 2
          assert correctness["task_identity_failures"] == 0
          assert correctness["run_identity_failures"] == 0
          assert correctness["duplicate_lifecycle_dispatches"] == 0
          assert correctness["history_failures"] == 0
          assert correctness["reconciled_stale_reservations"] == 2
          assert correctness["reconciliation_failures"] == 0
          assert correctness["stale_leader_rejections"] == 1
          assert correctness["outage_fail_closed_rejections"] == 1
          assert correctness["recovery_promotions"] == 1
          assert correctness["epoch_monotonicity_failures"] == 0
          assert report["promotion_latency"]["count"] == 1
          assert report["replay_task_latency"]["count"] == 2
          assert len(report["epoch_evidence"]) == 1
          epochs = report["epoch_evidence"][0]
          assert epochs["initial_epoch"] < epochs["promoted_epoch"] < epochs["recovery_epoch"]
          PY
      - name: Upload HA failover evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-ha-failover-benchmark
          path: artifacts/benchmarks/pr-ha-failover
          if-no-files-found: ignore
