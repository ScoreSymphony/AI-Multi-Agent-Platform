name: Reliability regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/reliability-regressions.yml"
  workflow_dispatch:

jobs:
  reliability-regressions:
    name: Reliability regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Persistence fault regression
        run: |
          mkdir -p artifacts/benchmarks/pr-persistence-fault
          platform-persistence-fault \
            --task-count 2 \
            --concurrency 1 \
            --failure-mode mixed \
            --failure-every 1 \
            --max-attempts 2 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-persistence-fault/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-persistence-fault.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-persistence-fault/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          PY

      - name: Provider fault regressions
        shell: bash
        run: |
          mkdir -p artifacts/benchmarks/pr-provider-faults
          for scenario in \
            model-latency \
            model-unavailable \
            model-cancelled \
            tool-unavailable \
            tool-timeout \
            tool-cancelled; do
            platform-provider-fault \
              --scenario "$scenario" \
              --operations-per-phase 2 \
              --concurrency 2 \
              --fault-delay-seconds 0.02 \
              --tool-timeout-seconds 0.005 \
              --cancel-after-seconds 0.005 \
              --operation-timeout-seconds 1 \
              --safety-max-operations-per-phase 4 \
              --safety-max-concurrency 4 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-provider-faults/${scenario}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-provider-fault.v1.schema.json").read_text())
          scenarios = (
              "model-latency",
              "model-unavailable",
              "model-cancelled",
              "tool-unavailable",
              "tool-timeout",
              "tool-cancelled",
          )
          for scenario in scenarios:
              report = json.loads(Path(f"artifacts/benchmarks/pr-provider-faults/{scenario}.json").read_text())
              Draft202012Validator(schema).validate(report)
              assert report["correctness"]["passed"] is True
              assert report["correctness"]["recovered"] is True
          PY

      - name: Distributed fault regression
        run: |
          mkdir -p artifacts/benchmarks/pr-distributed-faults
          platform-distributed-faults \
            --worker-count 3 \
            --pre-fault-rounds 1 \
            --degraded-rounds 1 \
            --post-rejoin-rounds 1 \
            --payload-bytes 1024 \
            --heartbeat-timeout-seconds 1 \
            --reservation-ttl-seconds 1 \
            --timeout-seconds 20 \
            --safety-max-operations 16 \
            --safety-max-payload-bytes 4096 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-distributed-faults/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-distributed-faults.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-distributed-faults/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          PY

      - name: HA failover regression
        run: |
          mkdir -p artifacts/benchmarks/pr-ha-failover
          platform-ha-failover \
            --active-task-count 2 \
            --repetitions 1 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-ha-failover/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-ha-failover.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-ha-failover/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          PY

      - name: Upload grouped regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-regressions
          path: artifacts/benchmarks
          if-no-files-found: ignore
