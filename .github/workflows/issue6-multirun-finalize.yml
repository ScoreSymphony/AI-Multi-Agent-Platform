name: Issue 6 multi-run finalize

on:
  push:
    branches:
      - fix/issue-6-cancel-all-active-runs

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-6-cancel-all-active-runs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply multi-run lifecycle fixes
        run: python .github/issue6_multirun_fix.py
      - name: Remove temporary files from final tree
        run: |
          rm .github/workflows/issue6-multirun-finalize.yml
          rm .github/issue6_multirun_fix.py
      - name: Validate repository
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format src/ai_multi_agent_platform/kernel/kernel.py tests/test_kernel_consistency.py
          ruff format --check .
          ruff check .
          mypy
          pytest
          python -m build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/kernel/kernel.py tests/test_kernel_consistency.py docs/KERNEL.md .github/workflows/issue6-multirun-finalize.yml .github/issue6_multirun_fix.py
          git commit -m "fix: make task cancellation multi-run safe"
          git push origin HEAD:fix/issue-6-cancel-all-active-runs
