name: Temporary Issue 11 formatter

on:
  push:
    branches: [feat/issue-11-litellm-adapter]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-litellm-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format issue 11 Python files
        run: |
          ruff format src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py
          git commit -m "style: format LiteLLM adapter"
          git push origin HEAD:feat/issue-11-litellm-adapter
