name: issue-79-doc-finalize

on:
  push:
    branches:
      - feat/issue-79-portability-final

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portability overview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PORTABILITY.md")
          text = path.read_text()
          old = "Further canonical configuration codecs, import/export reports and Control Plane/CLI surfaces remain follow-up work within #79."
          new = """Template full-revision round trip, canonical Template dependency/reference remapping, guarded Template compensation, replay-safe import reports and Control Plane/CLI workflows are covered by the current #79 implementation. Remaining resource-family integrations are intentionally dependency-gated: Project portability waits for #308, durable model-routing-policy portability for #309, reusable authorization-policy portability for #310, and Evaluation suite/result portability for #19. #79 must consume those canonical contracts rather than inventing shadow persistence."""
          if old not in text:
              raise SystemExit("expected stale #79 follow-up sentence not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit documentation and remove helper
        run: |
          git rm .github/workflows/issue-79-doc-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PORTABILITY.md
          git commit -m "docs(portability): align completion and dependency status"
          git push origin HEAD:feat/issue-79-portability-final
