name: Temporary issue 291 result finalizer

on:
  push:
    branches: [feat/issue-291-verification-search]

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[issue-291-results]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-291-verification-search
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply result discovery patch
        run: python scripts/tmp_issue_291_result_patch.py
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format and lint
        run: |
          ruff format src/ai_multi_agent_platform/security/authorization.py src/ai_multi_agent_platform/verification/control_plane.py src/ai_multi_agent_platform/search/indexing.py tests/test_issue_291_verification_search.py
          ruff check src/ai_multi_agent_platform/security/authorization.py src/ai_multi_agent_platform/verification/control_plane.py src/ai_multi_agent_platform/search/indexing.py tests/test_issue_291_verification_search.py
      - name: Type check
        run: mypy
      - name: Targeted verification search tests
        run: pytest -q tests/test_issue_291_verification_search.py
      - name: Commit result discovery completion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/security/authorization.py src/ai_multi_agent_platform/verification/control_plane.py src/ai_multi_agent_platform/search/indexing.py tests/test_issue_291_verification_search.py docs/SEARCH.md docs/SEARCH_VERIFICATION.md
          git commit -m "feat: expose canonical verification results to Search (#291) [issue-291-results]"
          git push origin HEAD:feat/issue-291-verification-search
