name: Pipelock outage recovery

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-outage-recovery.yml"
      - "tests/test_issue_730_pipelock_outage_recovery.py"
      - "tests/fixtures/pipelock_outage_enforced.yaml"
      - "tests/fixtures/pipelock_outage_target_server.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-outage-recovery:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-outage-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-outage-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi

      - name: Exercise enforced outage and recovery
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
        run: |
          pytest -q tests/test_issue_730_pipelock_outage_recovery.py \
            --basetemp="$RUNNER_TEMP/pipelock-outage" \
            --junitxml="$RUNNER_TEMP/pipelock-outage-junit.xml"

      - name: Upload outage and recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-outage-recovery-evidence
          path: |
            ${{ runner.temp }}/pipelock-outage-buildinfo.txt
            ${{ runner.temp }}/pipelock-outage-junit.xml
            ${{ runner.temp }}/pipelock-outage/**/*.log
            ${{ runner.temp }}/pipelock-outage/**/target-count.txt
          if-no-files-found: warn
