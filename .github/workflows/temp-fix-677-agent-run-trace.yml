name: Temporary PR 677 exact AgentRun trace fix

on:
  push:
    branches:
      - fix/591-650-651-context-egress-handoffs

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/591-650-651-context-egress-handoffs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact AgentRun trace fix
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/ai_multi_agent_platform/capabilities/types.py",
              """    run_id: str\n    agent_id: str\n    project_id: str | None = None\n""",
              """    run_id: str\n    agent_id: str\n    agent_run_id: str | None = None\n    project_id: str | None = None\n""",
          )
          replace_once(
              "src/ai_multi_agent_platform/capabilities/types.py",
              """        validate_id(self.run_id, \"run\")\n        validate_id(self.agent_id, \"agent\")\n        if self.project_id is not None:\n""",
              """        validate_id(self.run_id, \"run\")\n        validate_id(self.agent_id, \"agent\")\n        if self.agent_run_id is not None:\n            validate_id(self.agent_run_id, \"agent_run\")\n        if self.project_id is not None:\n""",
          )
          replace_once(
              "src/ai_multi_agent_platform/agents/capability_turn.py",
              """        capability_versions: dict[str, str],\n        context: OperationContext,\n        data_classification: DataClassification = DataClassification.INTERNAL,\n""",
              """        capability_versions: dict[str, str],\n        context: OperationContext,\n        agent_run_id: str | None = None,\n        data_classification: DataClassification = DataClassification.INTERNAL,\n""",
          )
          replace_once(
              "src/ai_multi_agent_platform/agents/capability_turn.py",
              """                        run_id=run_id,\n                        agent_id=agent_id,\n                        project_id=operation.project_id,\n""",
              """                        run_id=run_id,\n                        agent_id=agent_id,\n                        agent_run_id=agent_run_id,\n                        project_id=operation.project_id,\n""",
          )
          replace_once(
              "src/ai_multi_agent_platform/context/lifecycle.py",
              """                    capability_versions=dict(agent_run.capability_versions),\n                    context=request.context,\n                    data_classification=data_classification,\n""",
              """                    capability_versions=dict(agent_run.capability_versions),\n                    context=request.context,\n                    agent_run_id=agent_run.agent_run_id,\n                    data_classification=data_classification,\n""",
          )

          path = Path("src/ai_multi_agent_platform/deployment/context_operationalization.py")
          text = path.read_text()
          pattern = re.compile(
              r"def _bound_capability_classification\(.*?\n\n@dataclass\(slots=True\)\nclass SingleNodeContextComposition:",
              re.S,
          )
          replacement = '''def _bound_capability_classification(
              request: CapabilityInvocation,
              *,
              agents: AgentRepository,
              bundles: ContextBundleRepository,
              run_bindings: ContextRunBindingRepository,
          ) -> DataClassification:
              agent_run_id = request.trace.agent_run_id
              if agent_run_id is None:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress requires the exact invoking AgentRun identity",
                      details={
                          "run_id": request.trace.run_id,
                          "agent_id": request.trace.agent_id,
                      },
                  )
              try:
                  agent_run = agents.get_agent_run(agent_run_id)
              except KeyError as exc:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress references a missing invoking AgentRun",
                      details={"agent_run_id": agent_run_id},
                  ) from exc
              if (
                  agent_run.run_id != request.trace.run_id
                  or agent_run.task_id != request.trace.task_id
                  or agent_run.agent.agent_id != request.trace.agent_id
                  or agent_run.status is not AgentRunStatus.RUNNING
              ):
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress AgentRun does not match the invocation trace",
                      details={"agent_run_id": agent_run_id},
                  )
              try:
                  binding = run_bindings.get(agent_run_id)
              except KeyError as exc:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress requires the invoking AgentRun Context binding",
                      details={"agent_run_id": agent_run_id},
                  ) from exc
              if (
                  binding.run_id != request.trace.run_id
                  or binding.task_id != request.trace.task_id
                  or binding.agent_id != request.trace.agent_id
                  or binding.agent_revision != agent_run.agent.revision
              ):
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress binding does not match the invoking AgentRun",
                      details={"agent_run_id": agent_run_id},
                  )
              try:
                  bundle = bundles.get(binding.context_bundle_id)
              except KeyError as exc:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress binding references a missing Context Bundle",
                      details={"context_bundle_id": binding.context_bundle_id},
                  ) from exc
              if (
                  bundle.context_bundle_id != binding.context_bundle_id
                  or bundle.digest != binding.context_bundle_digest
                  or bundle.run_id != binding.run_id
                  or bundle.task_id != binding.task_id
                  or bundle.agent_id != binding.agent_id
                  or bundle.agent_revision != binding.agent_revision
              ):
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "Context capability egress bundle does not match the invoking AgentRun binding",
                      details={
                          "agent_run_id": agent_run_id,
                          "context_bundle_id": binding.context_bundle_id,
                      },
                  )
              return effective_context_bundle_classification(bundle)


          @dataclass(slots=True)
          class SingleNodeContextComposition:'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"context_operationalization.py: expected one function block, found {count}")
          path.write_text(text)

          replace_once(
              "tests/test_context_capability_binding_recovery.py",
              """    def list_agent_runs(self, run_id: str | None = None) -> tuple[SimpleNamespace, ...]:\n        if run_id is None:\n            return self.records\n        return tuple(record for record in self.records if record.run_id == run_id)\n""",
              """    def get_agent_run(self, agent_run_id: str) -> SimpleNamespace:\n        for record in self.records:\n            if record.agent_run_id == agent_run_id:\n                return record\n        raise KeyError(agent_run_id)\n\n    def list_agent_runs(self, run_id: str | None = None) -> tuple[SimpleNamespace, ...]:\n        if run_id is None:\n            return self.records\n        return tuple(record for record in self.records if record.run_id == run_id)\n""",
          )
          replace_once(
              "tests/test_context_capability_binding_recovery.py",
              """                status=AgentRunStatus.FAILED,\n""",
              """                status=AgentRunStatus.RUNNING,\n""",
          )
          replace_once(
              "tests/test_context_capability_binding_recovery.py",
              """            run_id=run_id,\n            agent_id=agent_id,\n        ),\n""",
              """            run_id=run_id,\n            agent_id=agent_id,\n            agent_run_id=current_agent_run_id,\n        ),\n""",
          )
          PY
      - name: Format touched Python files
        run: |
          python -m pip install ruff==0.16.6
          ruff format \
            src/ai_multi_agent_platform/capabilities/types.py \
            src/ai_multi_agent_platform/agents/capability_turn.py \
            src/ai_multi_agent_platform/context/lifecycle.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/test_context_capability_binding_recovery.py
      - name: Commit exact AgentRun trace fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/capabilities/types.py \
            src/ai_multi_agent_platform/agents/capability_turn.py \
            src/ai_multi_agent_platform/context/lifecycle.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/test_context_capability_binding_recovery.py
          git diff --cached --quiet && exit 1
          git commit -m "fix: bind capability egress to invoking agent run"
          git push origin HEAD:fix/591-650-651-context-egress-handoffs
