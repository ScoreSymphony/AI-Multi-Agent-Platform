name: Issue 19 main sync helper

on:
  push:
    branches:
      - fix/issue-19-final-product-completion

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-19-final-product-completion
          fetch-depth: 0
      - name: Merge current main without stealing parallel issue work
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            exit 0
          fi
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            expected='^(src/ai_multi_agent_platform/accounting/service.py|src/ai_multi_agent_platform/organizations/accounting.py|tests/test_issue171_accounting_integrations.py)$'
            unexpected=$(git diff --name-only --diff-filter=U | grep -Ev "$expected" || true)
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unexpected"
              exit 1
            fi
            for path in \
              src/ai_multi_agent_platform/accounting/service.py \
              src/ai_multi_agent_platform/organizations/accounting.py \
              tests/test_issue171_accounting_integrations.py
            do
              if git diff --name-only --diff-filter=U | grep -Fxq "$path"; then
                git checkout --theirs -- "$path"
                git add "$path"
              fi
            done
          fi
          remaining=$(git diff --name-only --diff-filter=U)
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:"
            echo "$remaining"
            exit 1
          fi
          git commit -m "chore: sync issue 19 with current main"
          git push origin HEAD:fix/issue-19-final-product-completion
