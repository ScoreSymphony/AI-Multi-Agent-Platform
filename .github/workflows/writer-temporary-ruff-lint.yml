name: Temporary writer Ruff lint fix

on:
  push:
    branches:
      - fix/594-595-eval-learning-integration
    paths:
      - .github/workflows/writer-temporary-ruff-lint.yml

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/594-595-eval-learning-integration
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply targeted Ruff fixes and remove temporary workflow
        shell: bash
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff check tests/test_issue_594_595_evidence_identity.py --fix
          ruff format tests/test_issue_594_595_evidence_identity.py
          ruff format --check .
          ruff check .
          git rm .github/workflows/writer-temporary-ruff-lint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: fix Ruff lint in evidence regressions'
          git push origin HEAD:fix/594-595-eval-learning-integration
