name: Issue 414 completion apply

on:
  push:
    branches: [issue-414-completion-audit]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-414-completion-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install development environment
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'
      - name: Apply completion patch
        run: python scripts/tmp_issue_414_completion.py
      - name: Remove temporary patch machinery
        run: rm scripts/tmp_issue_414_completion.py .github/workflows/issue-414-completion-apply.yml
      - name: Format changed Python files
        run: ruff format src/ai_multi_agent_platform/distributed/registry.py tests/test_issue_414_node_worker_state_timestamps.py tests/test_issue_288_node_worker_search.py
      - name: Ruff lint
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Targeted regression tests
        run: pytest -q tests/test_issue_414_node_worker_state_timestamps.py tests/test_issue_288_node_worker_search.py tests/test_issue_14_security_result_recovery.py tests/test_issue_14_distributed_runtime.py tests/test_issue_14_registry_completion.py tests/test_issue_14_restart_persistence.py tests/test_issue_14_control_plane.py
      - name: Commit validated completion patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(runtime): complete Node/Worker timestamp semantics (#414)'
          git push origin HEAD:issue-414-completion-audit
