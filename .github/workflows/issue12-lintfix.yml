name: Issue 12 Ruff Lint Fix

on:
  push:
    branches:
      - feat/issue-12-capability-registry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-12-capability-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply safe lint fixes
        run: ruff check --fix tests/test_capabilities.py
      - name: Commit lint fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_capabilities.py
          git commit -m "style(#12): apply Ruff import fix"
          git push
