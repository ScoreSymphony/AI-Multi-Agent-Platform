name: Test Migration Audit

on:
  push:
    branches:
      - test/722-final-rest-migration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Exact test inventory
        run: python scripts/ci/report_test_inventory.py
      - name: Full pytest collection
        run: python -m pytest --collect-only -q
