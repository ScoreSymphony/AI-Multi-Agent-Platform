name: Issue 4 domain digest patch

on:
  push:
    branches:
      - fix/issue-4-final-governance-gaps

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-4-final-governance-gaps
      - name: Add canonical argument digest field
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("src/ai_multi_agent_platform/domain/models.py")
          text = path.read_text()
          old = dedent('''\
          @dataclass(frozen=True, kw_only=True)
          class ToolInvocation:
              tool_id: str
              owner_ref: OwnerRef
              id: str = field(default_factory=lambda: new_id("tool_invocation"))
              project_id: str | None = None
              correlation_id: str | None = None
              causation_id: str | None = None
              trace_id: str | None = None
              created_at: datetime = field(default_factory=utc_now)
              schema_version: str = SCHEMA_VERSION
              provenance: Provenance | None = None
              external_refs: tuple[ExternalRef, ...] = ()

              def __post_init__(self) -> None:
                  validate_id(self.id, "tool_invocation")
                  validate_id(self.tool_id, "tool")
                  _validate_optional_id(self.project_id, "project")
                  _freeze_tuple_field(self, "external_refs")
          ''')
          new = dedent('''\
          @dataclass(frozen=True, kw_only=True)
          class ToolInvocation:
              tool_id: str
              owner_ref: OwnerRef
              id: str = field(default_factory=lambda: new_id("tool_invocation"))
              project_id: str | None = None
              correlation_id: str | None = None
              causation_id: str | None = None
              trace_id: str | None = None
              arguments_digest: str | None = None
              created_at: datetime = field(default_factory=utc_now)
              schema_version: str = SCHEMA_VERSION
              provenance: Provenance | None = None
              external_refs: tuple[ExternalRef, ...] = ()

              def __post_init__(self) -> None:
                  validate_id(self.id, "tool_invocation")
                  validate_id(self.tool_id, "tool")
                  _validate_optional_id(self.project_id, "project")
                  _freeze_tuple_field(self, "external_refs")
                  if self.arguments_digest is not None:
                      prefix = "sha256:"
                      digest = self.arguments_digest
                      if len(digest) != len(prefix) + 64 or not digest.startswith(prefix):
                          raise ValueError("tool invocation arguments_digest must be sha256:<64 hex>")
                      hex_digest = digest[len(prefix) :]
                      try:
                          int(hex_digest, 16)
                      except ValueError as exc:
                          raise ValueError(
                              "tool invocation arguments_digest must be sha256:<64 hex>"
                          ) from exc
                      if hex_digest.lower() != hex_digest:
                          raise ValueError("tool invocation arguments_digest must use lowercase hex")
          ''')
          if old not in text:
              raise SystemExit("expected ToolInvocation block not found")
          path.write_text(text.replace(old, new))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Format and commit
        run: |
          python -m pip install "ruff==0.16.5"
          ruff format src/ai_multi_agent_platform/domain/models.py
          ruff check --fix src/ai_multi_agent_platform/domain/models.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/domain/models.py
          git commit -m "fix(domain): bind tool invocation to argument digest"
          git push origin HEAD:fix/issue-4-final-governance-gaps
