name: Issue 171 temporary formatter

on:
  push:
    branches:
      - issue-171-runtime-hardening

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    if: github.repository == 'ScoreSymphony/AI-Multi-Agent-Platform'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-runtime-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.16.6'
      - name: Apply repository formatter
        run: ruff format .
      - name: Commit formatting only when needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'style: apply Ruff formatting for #171'
          git push origin HEAD:issue-171-runtime-hardening
