name: Temporary issue 903 formatter

on:
  push:
    branches:
      - issue-903-agent-matching

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-903-agent-matching
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.7'
      - name: Format issue 903 Python files
        run: >-
          ruff format
          src/ai_multi_agent_platform/agents/matching.py
          src/ai_multi_agent_platform/planning/agent_matching.py
          tests/test_issue_903_agent_matching.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/agents/matching.py \
                  src/ai_multi_agent_platform/planning/agent_matching.py \
                  tests/test_issue_903_agent_matching.py
          git commit -m "style(#903): apply Ruff formatting"
          git push origin HEAD:issue-903-agent-matching
