name: Final error-boundary contract tests

on:
  push:
    branches:
      - codex/983-final-error-boundary-audit

permissions:
  contents: write

jobs:
  fix-contract-tests:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/983-final-error-boundary-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Align tests with secret-safe error contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/ai_multi_agent_platform/upgrade/preflight.py": [
                  (
                      "plugin-owned state requires migration but no controlled  hook is available",
                      "plugin-owned state requires migration but no controlled migration hook is available",
                  ),
                  (
                      "required plugin-owned state migrations have a controlled  hook",
                      "required plugin-owned state migrations have a controlled migration hook",
                  ),
              ],
              "src/ai_multi_agent_platform/upgrade/service.py": [
                  (
                      "deterministic  PluginStateMigrator",
                      "deterministic PluginStateMigrator",
                  ),
              ],
              "tests/integration/plugins/test_plugin_state_upgrade.py": [
                  (
                      'with pytest.raises(UpgradeError, match="no controlled #20 hook"):',
                      'with pytest.raises(UpgradeError, match="no controlled migration hook"):',
                  ),
                  (
                      '    with pytest.raises(UpgradeError, match="plugin fixture failed"):\n'
                      '        failing.apply(request, quiesced=True)\n',
                      '    with pytest.raises(\n'
                      '        UpgradeError, match="plugin-owned state migration failed: RuntimeError"\n'
                      '    ) as exc_info:\n'
                      '        failing.apply(request, quiesced=True)\n'
                      '    assert "plugin fixture failed" not in str(exc_info.value)\n',
                  ),
              ],
              "tests/release/release/test_upgrade_lifecycle.py": [
                  (
                      '    with pytest.raises(MigrationError, match="fixture failure"):\n'
                      '        runner.apply((step,), MigrationContext(data_dir=data_dir))\n',
                      '    with pytest.raises(\n'
                      '        MigrationError, match="migration \'r001\' failed: RuntimeError"\n'
                      '    ) as exc_info:\n'
                      '        runner.apply((step,), MigrationContext(data_dir=data_dir))\n'
                      '    assert "fixture failure" not in str(exc_info.value)\n',
                  ),
                  (
                      '    with pytest.raises(MigrationError, match="interrupted"):\n'
                      '        service.apply(request, quiesced=True)\n',
                      '    with pytest.raises(\n'
                      '        MigrationError, match="migration \'r001\' failed: RuntimeError"\n'
                      '    ) as exc_info:\n'
                      '        service.apply(request, quiesced=True)\n'
                      '    assert "interrupted" not in str(exc_info.value)\n',
                  ),
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"expected text not found in {name}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Install test environment
        run: python -m pip install -e ".[dev]"
      - name: Format and run affected contract tests
        shell: bash
        run: |
          ruff format src/ai_multi_agent_platform/upgrade/preflight.py src/ai_multi_agent_platform/upgrade/service.py tests/integration/plugins/test_plugin_state_upgrade.py tests/release/release/test_upgrade_lifecycle.py
          ruff check src/ai_multi_agent_platform/upgrade/preflight.py src/ai_multi_agent_platform/upgrade/service.py tests/integration/plugins/test_plugin_state_upgrade.py tests/release/release/test_upgrade_lifecycle.py
          pytest -q \
            tests/integration/plugins/test_plugin_state_upgrade.py::test_plugin_state_upgrade_requires_backup_and_controlled_hook \
            tests/integration/plugins/test_plugin_state_upgrade.py::test_plugin_state_failure_remains_fail_closed_and_resumes_same_set \
            tests/release/release/test_upgrade_lifecycle.py::test_failed_migration_requires_explicit_restart_safe_resume \
            tests/release/release/test_upgrade_lifecycle.py::test_failed_upgrade_stays_in_maintenance_until_explicit_resume
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/upgrade/preflight.py \
            src/ai_multi_agent_platform/upgrade/service.py \
            tests/integration/plugins/test_plugin_state_upgrade.py \
            tests/release/release/test_upgrade_lifecycle.py
          git commit -m "test: align upgrade failures with safe error contracts"
          git push origin HEAD:codex/983-final-error-boundary-audit
