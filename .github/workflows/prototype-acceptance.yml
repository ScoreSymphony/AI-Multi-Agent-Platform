name: Prototype acceptance

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: acceptance-${{ matrix.profile }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        profile: [reference, local-ai, degraded, persistence]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Install platform acceptance environment
        run: python -m pip install -e '.[dev]'
      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit --no-fund
      - name: Run profile
        run: >-
          platform-acceptance
          --profile "${{ matrix.profile }}"
          --json-report "acceptance-${{ matrix.profile }}.json"
      - name: Upload machine-readable report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prototype-acceptance-${{ matrix.profile }}
          path: acceptance-${{ matrix.profile }}.json
          if-no-files-found: warn
