name: Issue 10 Lint Diagnostic

on:
  push:
    branches: [feat/issue-10-model-registry-router]

permissions:
  contents: write

jobs:
  lint-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-model-registry-router
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Capture lint report
        shell: bash
        run: |
          ruff check --fix . > issue10-ruff-report.txt 2>&1 || true
          ruff format .
      - name: Commit fixes and report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: capture remaining issue 10 lint diagnostics" || exit 0
          git push origin HEAD:feat/issue-10-model-registry-router
