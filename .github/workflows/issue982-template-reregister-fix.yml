name: issue982-template-reregister-fix

on:
  push:
    branches:
      - issue/982-explicit-control-plane-composition
    paths:
      - .github/workflows/issue982-template-reregister-fix.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/982-explicit-control-plane-composition
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Make wrapper re-registration idempotent
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/templates/__init__.py')
          text = path.read_text(encoding='utf-8')
          old = '''    _register_template_control_plane(\n        control_plane,\n        application,\n        environment_resolver=environment_resolver,\n        agent_exporter=agent_exporter,\n        automation_exporter=automation_exporter,\n    )\n\n    capability_handler = application.handlers.get(TemplateType.CAPABILITY_ASSIGNMENT)\n'''
          new = '''    already_registered = (\n        getattr(application, "_control_plane_template_control_plane", None) is control_plane\n    )\n    _register_template_control_plane(\n        control_plane,\n        application,\n        environment_resolver=environment_resolver,\n        agent_exporter=agent_exporter,\n        automation_exporter=automation_exporter,\n    )\n    if already_registered:\n        return\n\n    capability_handler = application.handlers.get(TemplateType.CAPABILITY_ASSIGNMENT)\n'''
          if text.count(old) != 1:
              raise RuntimeError('expected one Template registration wrapper block')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Install development environment
        run: python -m pip install -e ".[dev,server]"
      - name: Format
        run: ruff format src/ai_multi_agent_platform/templates/__init__.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Install smoke
        run: python scripts/ci/issue39_install_lifecycle_smoke.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/templates/__init__.py
          git commit -m "Make Template Control Plane registration idempotent"
          git push origin HEAD:issue/982-explicit-control-plane-composition
