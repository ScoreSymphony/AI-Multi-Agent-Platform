name: Issue 32 test fix

on:
  push:
    branches:
      - fix/issue-32-ci-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-32-ci-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply stale-test corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path("tests/test_control_plane.py")
          text = control.read_text()
          old = '''        run_events = await http.handle(
            HTTPRequest(
                method="GET",
                path=f"/api/v1/tasks/{task_id}/timeline",
                query={"filter[subject_id]": run_id},
            )
        )
        assert_page(run_events.body, total=1)
'''
          new = '''        run_events = await http.handle(
            HTTPRequest(
                method="GET",
                path=f"/api/v1/tasks/{task_id}/timeline",
                query={"filter[subject_id]": run_id},
            )
        )
        run_items = assert_page(run_events.body)
        assert run_items
        assert all(
            isinstance(item, dict) and item.get("subject_id") == run_id for item in run_items
        )
'''
          if old not in text:
              raise SystemExit("timeline assertion target not found")
          text = text.replace(old, new, 1)

          old = '''def test_openapi_is_current_scope_only_and_documents_evolution() -> None:
    spec = build_openapi()
    assert spec["openapi"] == "3.1.0"
    paths = spec["paths"]
    for resource in (
        "projects",
        "workspaces",
        "tasks",
        "runs",
        "plans",
        "steps",
        "artifacts",
        "results",
    ):
        assert f"/api/v1/{resource}" in paths
    assert "/api/v1/tasks/{task_id}/timeline" in paths
    assert "/api/v1/tasks/{task_id}/events/stream" in paths
    for future_resource in (
        "agents",
        "models",
        "tools",
        "nodes",
        "automations",
        "evaluations",
        "plugins",
    ):
        assert f"/api/v1/{future_resource}" not in paths
    assert spec["x-evolution-policy"]["breaking_changes"] == "require a new major path namespace"
'''
          new = '''def test_openapi_documents_full_issue_32_scope_and_evolution() -> None:
    spec = build_openapi()
    assert spec["openapi"] == "3.1.0"
    paths = spec["paths"]
    for resource in (
        "projects",
        "workspaces",
        "tasks",
        "plans",
        "steps",
        "runs",
        "agents",
        "teams",
        "artifacts",
        "results",
        "files",
        "memory",
        "knowledge",
        "models",
        "providers",
        "tools",
        "capabilities",
        "nodes",
        "workers",
        "approvals",
        "automations",
        "evaluations",
        "plugins",
        "adapters",
    ):
        assert f"/api/v1/{resource}" in paths
    assert "/api/v1/tasks/{task_id}/timeline" in paths
    assert "/api/v1/tasks/{task_id}/events/stream" in paths
    assert spec["x-evolution-policy"]["breaking_changes"] == "require a new major path namespace"
'''
          if old not in text:
              raise SystemExit("OpenAPI assertion target not found")
          control.write_text(text.replace(old, new, 1))

          issue10 = Path("tests/test_issue_10_openai_provider_runtime.py")
          text = issue10.read_text()
          old = '''        return HttpJsonResponse(
            200,
            {
                "model": "Qwen/Qwen3-Coder-30B-A3B-Instruct",
                "choices": [
                    {
                        "message": {"role": "assistant", "content": "local answer"},
                        "finish_reason": "stop",
                    }
                ],
'''
          new = '''        structured = payload is not None and payload.get("response_format") is not None
        content = '{"answer":"local answer"}' if structured else "local answer"
        return HttpJsonResponse(
            200,
            {
                "model": "Qwen/Qwen3-Coder-30B-A3B-Instruct",
                "choices": [
                    {
                        "message": {"role": "assistant", "content": content},
                        "finish_reason": "stop",
                    }
                ],
'''
          if old not in text:
              raise SystemExit("issue #10 transport target not found")
          text = text.replace(old, new, 1)
          old = '''    assert response.text == "local answer"
'''
          new = '''    assert response.text == '{"answer":"local answer"}'
    assert response.structured_output == {"answer": "local answer"}
'''
          if old not in text:
              raise SystemExit("issue #10 response assertion target not found")
          issue10.write_text(text.replace(old, new, 1))
          PY
      - name: Validate targeted corrections
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format tests/test_control_plane.py tests/test_issue_10_openai_provider_runtime.py
          ruff check tests/test_control_plane.py tests/test_issue_10_openai_provider_runtime.py
          mypy
          pytest \
            tests/test_control_plane.py::test_timeline_query_preserves_correlation_and_can_filter_run_events \
            tests/test_control_plane.py::test_openapi_documents_full_issue_32_scope_and_evolution \
            tests/test_issue_10_openai_provider_runtime.py::test_runtime_routes_canonical_model_then_provider_resolves_native_name
      - name: Commit fixes and remove helper
        run: |
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git rm .github/workflows/issue32-test-fix.yml
          git add tests/test_control_plane.py tests/test_issue_10_openai_provider_runtime.py
          git commit -m "test: align issue 32 contracts with full scope"
          git push origin HEAD:fix/issue-32-ci-cleanup
