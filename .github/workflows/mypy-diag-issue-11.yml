name: Temporary Issue 11 mypy diagnostics

on:
  push:
    branches: [feat/issue-11-litellm-adapter]

permissions:
  contents: write

jobs:
  mypy-diag:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-litellm-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Capture mypy diagnostics
        shell: bash
        run: mypy > issue-11-mypy.txt 2>&1 || true
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-11-mypy.txt
          git commit -m "chore: capture LiteLLM mypy diagnostics"
          git push origin HEAD:feat/issue-11-litellm-adapter
