name: Temporary Issue 11 type fix

on:
  push:
    branches: [feat/issue-11-litellm-adapter]

permissions:
  contents: write

jobs:
  type-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-11-litellm-adapter
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Fix validated JsonValue typing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/adapters/litellm.py")
          text = path.read_text()
          old = '        return parsed\n\n    def _canonical_tool_calls'
          new = '        return cast(JsonValue, parsed)\n\n    def _canonical_tool_calls'
          if old not in text:
              raise SystemExit("expected structured-output return was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          ruff format src/ai_multi_agent_platform/adapters/litellm.py
          ruff check src/ai_multi_agent_platform/adapters/litellm.py tests/test_issue_11_litellm_adapter.py
          mypy
      - name: Capture pytest result
        shell: bash
        run: |
          if pytest > issue-11-pytest.txt 2>&1; then
            rm issue-11-pytest.txt
          fi
      - name: Commit fix and clean temporary type diagnostics
        shell: bash
        run: |
          rm -f issue-11-mypy.txt .github/workflows/mypy-diag-issue-11.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy LiteLLM adapter type contract"
          git push origin HEAD:feat/issue-11-litellm-adapter
