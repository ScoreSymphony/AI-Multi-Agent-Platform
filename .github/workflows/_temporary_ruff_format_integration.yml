name: Temporary integration Ruff format

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply canonical Ruff formatting
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          ruff format .
          ruff format --check .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'style: apply Ruff formatting after branch integration'
            git push origin HEAD:integration/active-branches-2026-09-08
          fi
