name: Issue 892 pytest diagnostic

on:
  pull_request:

jobs:
  pytest-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run verbose pytest with deadlock diagnostics
        run: pytest -vv -o faulthandler_timeout=90
