name: Issue 82 final format

on:
  push:
    branches: [feat/issue-82-operational-completion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format issue 82 additions
        run: |
          ruff format tests/test_issue_82_repository_collaboration_cli.py tests/test_issue_82_repository_runtime_event_ingress.py
      - name: Commit formatting if needed
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_issue_82_repository_collaboration_cli.py tests/test_issue_82_repository_runtime_event_ingress.py
          git commit -m "style: format final issue #82 tests"
          git push origin HEAD:feat/issue-82-operational-completion
