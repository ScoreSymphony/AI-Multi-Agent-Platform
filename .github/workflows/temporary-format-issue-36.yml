name: Temporary issue 36 formatter

on:
  push:
    branches:
      - feat/issue-36-authentication

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-36-authentication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Fix authentication files
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
          ruff format \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
          git commit -m "style(auth): apply ruff lint fixes"
          git push origin HEAD:feat/issue-36-authentication
