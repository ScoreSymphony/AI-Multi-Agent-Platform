name: Temporary issue 36 formatter

on:
  push:
    branches:
      - feat/issue-36-authentication

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-36-authentication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Fix and capture authentication lint
        shell: bash
        run: |
          set +e
          ruff check --fix \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py \
            > issue36-ruff.txt 2>&1
          status=$?
          ruff format \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py \
            >> issue36-ruff.txt 2>&1
          echo "ruff_status=$status" >> issue36-ruff.txt
          cat issue36-ruff.txt
          exit 0
      - name: Commit fixes and diagnostic
        run: |
          if git diff --quiet && git ls-files --error-unmatch issue36-ruff.txt >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py \
            issue36-ruff.txt
          git commit -m "chore(auth): capture ruff diagnostics"
          git push origin HEAD:feat/issue-36-authentication
