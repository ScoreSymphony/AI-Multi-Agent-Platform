name: Temporary issue 36 formatter

on:
  push:
    branches:
      - feat/issue-36-authentication

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-36-authentication
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Apply authentication review fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          tests = Path("tests/test_issue_36_authentication.py")
          text = tests.read_text()
          if "from ai_multi_agent_platform.contracts.types import JsonValue" not in text:
              text = text.replace(
                  "import pytest\n\nfrom ai_multi_agent_platform.control_plane",
                  "import pytest\n\nfrom ai_multi_agent_platform.contracts.types import JsonValue\nfrom ai_multi_agent_platform.control_plane",
              )
          tests.write_text(text)

          control = Path("src/ai_multi_agent_platform/control_plane/authentication.py")
          text = control.read_text()
          text = text.replace(
              "from datetime import datetime\nfrom typing import cast\n",
              "from collections.abc import Mapping\nfrom datetime import datetime\nfrom typing import Any\n",
          )
          text = text.replace("        control_plane: object,\n", "        control_plane: Any,\n")
          text = text.replace(
              "        super().__init__(cast(object, control_plane))\n",
              "        super().__init__(control_plane)\n",
          )
          error_boundary = (
              "            trusted = _with_authenticated_actor(request, actor)\n"
              "            return await super().handle(trusted)\n"
              "        except AuthenticationError as exc:\n"
          )
          if "except APIException as exc:" not in text:
              text = text.replace(
                  error_boundary,
                  "            trusted = _with_authenticated_actor(request, actor)\n"
                  "            return await super().handle(trusted)\n"
                  "        except APIException as exc:\n"
                  "            return self._error_response(exc, request_id, correlation_id)\n"
                  "        except AuthenticationError as exc:\n",
              )
          old_header = (
              "def _header(headers: object, name: str) -> str | None:\n"
              "    if not hasattr(headers, \"items\"):\n"
              "        return None\n"
              "    for key, value in cast(dict[str, str], headers).items():\n"
              "        if key.casefold() == name.casefold():\n"
              "            return value\n"
              "    return None\n"
          )
          new_header = (
              "def _header(headers: Mapping[str, str], name: str) -> str | None:\n"
              "    for key, value in headers.items():\n"
              "        if key.casefold() == name.casefold():\n"
              "            return value\n"
              "    return None\n"
          )
          text = text.replace(old_header, new_header)
          control.write_text(text)

          auth = Path("src/ai_multi_agent_platform/security/authentication.py")
          text = auth.read_text()
          text = text.replace(
              "from .authorization import ActorIdentity, ActorType\n",
              "from .authorization import ActorIdentity, ActorType, infer_actor_identity\n",
          )
          validation = "        _validate_credential_kind(actor_type, kind)\n"
          if "_validate_actor_reference(owner_id, actor_type)" not in text:
              text = text.replace(
                  validation,
                  validation + "        _validate_actor_reference(owner_id, actor_type)\n",
                  1,
              )
          helper_marker = "def _validate_credential_kind(actor_type: ActorType, kind: CredentialKind) -> None:\n"
          helper = (
              "def _validate_actor_reference(owner_id: str, actor_type: ActorType) -> None:\n"
              "    inferred = infer_actor_identity(owner_id).actor_type\n"
              "    if inferred is not actor_type:\n"
              "        raise ValueError(\n"
              "            f\"credential owner {owner_id!r} does not encode actor type {actor_type.value!r}\"\n"
              "        )\n\n\n"
          )
          if "def _validate_actor_reference(" not in text:
              text = text.replace(helper_marker, helper + helper_marker)
          auth.write_text(text)
          PY
          ruff check --fix \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
          ruff format \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/security/authentication.py \
            src/ai_multi_agent_platform/control_plane/authentication.py \
            src/ai_multi_agent_platform/security/__init__.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_36_authentication.py
          git commit -m "fix(auth): preserve canonical identity and transport errors"
          git push origin HEAD:feat/issue-36-authentication
