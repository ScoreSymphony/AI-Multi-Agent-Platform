name: Issue 32 formatter

on:
  push:
    branches:
      - fix/issue-32-full-scope

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-32-full-scope
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format affected files
        run: |
          ruff format \
            src/ai_multi_agent_platform/control_plane/extensions.py \
            src/ai_multi_agent_platform/control_plane/http.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            tests/test_control_plane.py \
            tests/test_control_plane_full_scope.py
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/issue32-format.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply Ruff formatting for issue 32"
          git push origin HEAD:fix/issue-32-full-scope
