name: Temporary PR 677 formatter repair

on:
  push:
    branches:
      - fix/591-650-651-context-egress-handoffs

permissions:
  contents: write

jobs:
  format-production:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/591-650-651-context-egress-handoffs
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.16.6
      - name: Format affected file
        run: ruff format src/ai_multi_agent_platform/handoffs/production.py
      - name: Commit formatter result
        run: |
          if git diff --quiet; then
            echo "No formatter changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/handoffs/production.py
          git commit -m "style: restore handoff formatter newline"
          git push origin HEAD:fix/591-650-651-context-egress-handoffs
