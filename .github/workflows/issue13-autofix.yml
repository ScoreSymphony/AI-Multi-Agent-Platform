name: Issue 13 Autofix

on:
  push:
    branches: [feat/issue-13-data-boundaries]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-13-data-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.5'
      - name: Apply formatting and safe lint fixes
        run: |
          ruff format .
          ruff check --fix .
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'style: apply issue 13 ruff fixes'
          git push origin HEAD:feat/issue-13-data-boundaries
