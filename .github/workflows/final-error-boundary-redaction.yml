name: Final error-boundary redaction

on:
  push:
    branches:
      - codex/983-final-error-boundary-audit

permissions:
  contents: write

jobs:
  redact:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/983-final-error-boundary-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Redact broad-boundary diagnostic text
        run: python scripts/maintenance/final_error_boundary_redaction.py
      - name: Commit redacted tree
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No redaction changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "fix: redact broad-boundary exception diagnostics"
          git push origin HEAD:codex/983-final-error-boundary-audit
