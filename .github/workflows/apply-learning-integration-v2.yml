name: Apply Learning integration patch v2

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/apply-learning-integration-v2.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Apply prepared integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/merge-ready-learning.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Install backend test environment"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch = textwrap.dedent(source[start:end])
          Path('/tmp/apply_learning_patch.py').write_text(patch)
          subprocess.run(['python', '/tmp/apply_learning_patch.py'], check=True)

          test = Path('tests/test_issue_595_governed_learning.py')
          text = test.read_text()
          old = "    ModelRoutingProfilePolicy,\n    ModelRoutingProfileService,\n"
          new = "    ModelRoutingProfilePolicy,\n    ModelRoutingProfileRef,\n    ModelRoutingProfileService,\n"
          if old not in text:
              raise SystemExit('routing profile import anchor missing')
          text = text.replace(old, new, 1)
          old = "    latest = routing_repository.get_revision(definition.current_ref)\n"
          new = "    latest = routing_repository.get_revision(\n        ModelRoutingProfileRef(original.profile_id, definition.current_revision)\n    )\n"
          if old not in text:
              raise SystemExit('routing profile assertion anchor missing')
          test.write_text(text.replace(old, new, 1))

          test = Path('tests/test_issue_439_single_node.py')
          text = test.read_text()
          old = "        assert model_provider.calls\n        assert model_provider.calls[-1].messages[-1] == planned_step.objective\n"
          new = (
              "        assert model_provider.calls\n"
              "        rendered_prompt = model_provider.calls[-1].messages[-1]\n"
              "        assert planned_step.objective in rendered_prompt\n"
              "        assert f\"[context:1:task:{created.task_id}]\" in rendered_prompt\n"
              "        assert f\"[context:2:plan_step:{canonical_step_id}]\" in rendered_prompt\n"
          )
          if old not in text:
              raise SystemExit('context prompt assertion anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Install backend test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format and lint backend
        run: |
          ruff format src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py tests/test_issue_595_governed_learning.py tests/test_issue_439_single_node.py
          ruff check --fix src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py tests/test_issue_595_governed_learning.py tests/test_issue_439_single_node.py
          ruff check src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py tests/test_issue_595_governed_learning.py tests/test_issue_439_single_node.py
      - name: Backend targeted regression
        run: |
          pytest -q tests/test_issue_595_governed_learning.py tests/test_issue_650_single_node_context_e2e.py tests/test_issue_651_deployment_composition.py tests/test_issue_439_single_node.py
          python - <<'PY'
          from ai_multi_agent_platform.cli.main import _build_parser
          args = _build_parser().parse_args(["learning", "candidate", "list"])
          assert args.area == "learning"
          assert args.command == "candidate"
          assert args.candidate_command == "list"
          PY
      - name: Backend typecheck
        run: mypy
      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/learning/control_plane.py \
            src/ai_multi_agent_platform/learning/runtime_control_plane.py \
            src/ai_multi_agent_platform/learning/single_node.py \
            src/ai_multi_agent_platform/deployment/durable_connectors.py \
            src/ai_multi_agent_platform/cli/main.py \
            frontend/src/app/navigation.ts \
            frontend/src/app/Shell.tsx \
            tests/test_issue_595_governed_learning.py \
            tests/test_issue_439_single_node.py
          git diff --cached --check
          git commit -m "fix: complete learning integration and context assertions"
          git push origin HEAD:integration/active-branches-2026-09-08
