name: Issue 76 time-window trends apply

on:
  push:
    branches: [feat/issue-76-time-window-trends]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-time-window-trends
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          cd frontend
          npm install --no-audit --no-fund
      - name: Apply #76 time-window trend follow-up
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"expected exactly one match in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1))

          service = "src/ai_multi_agent_platform/accounting/service.py"
          replace_once(
              service,
              "from datetime import datetime, timedelta\n",
              "from datetime import datetime, timedelta\nfrom math import ceil\n",
          )
          replace_once(
              service,
              "ThresholdEventSink = Callable[[BudgetThresholdEvent], None]\n",
              "ThresholdEventSink = Callable[[BudgetThresholdEvent], None]\nMAX_TREND_BUCKETS = 500\n",
          )
          replace_once(
              service,
              '''    def aggregate(self, query: UsageQuery) -> UsageAggregate:\n        records = self.store.query(query)\n        if query.metric_type is None or query.unit is None:\n            raise ValueError("aggregate query requires metric_type and unit")\n        return aggregate_usage_records(\n            records,\n            metric_type=query.metric_type,\n            unit=query.unit,\n            start=query.start,\n            end=query.end,\n        )\n\n    def put_budget''',
              '''    def aggregate(self, query: UsageQuery) -> UsageAggregate:\n        records = self.store.query(query)\n        if query.metric_type is None or query.unit is None:\n            raise ValueError("aggregate query requires metric_type and unit")\n        return aggregate_usage_records(\n            records,\n            metric_type=query.metric_type,\n            unit=query.unit,\n            start=query.start,\n            end=query.end,\n        )\n\n    def trend(\n        self,\n        query: UsageQuery,\n        *,\n        bucket_seconds: int,\n    ) -> tuple[UsageAggregate, ...]:\n        """Return bounded time buckets without fabricating samples for empty periods."""\n\n        if query.metric_type is None or query.unit is None:\n            raise ValueError("trend query requires metric_type and unit")\n        if query.start is None or query.end is None:\n            raise ValueError("trend query requires explicit start and end")\n        records = self.store.query(\n            UsageQuery(\n                metric_type=query.metric_type,\n                unit=query.unit,\n                scope=query.scope,\n                quality=query.quality,\n            )\n        )\n        return trend_usage_records(\n            records,\n            metric_type=query.metric_type,\n            unit=query.unit,\n            start=query.start,\n            end=query.end,\n            bucket_seconds=bucket_seconds,\n        )\n\n    def put_budget''',
          )
          replace_once(
              service,
              '''def aggregate_usage_records(\n    records: tuple[UsageRecord, ...],\n    *,\n    metric_type: str,\n    unit: str,\n    start: datetime | None = None,\n    end: datetime | None = None,\n) -> UsageAggregate:''',
              '''def aggregate_usage_records(\n    records: tuple[UsageRecord, ...],\n    *,\n    metric_type: str,\n    unit: str,\n    start: datetime | None = None,\n    end: datetime | None = None,\n    default_aggregation_mode: AggregationMode = AggregationMode.ADDITIVE,\n) -> UsageAggregate:''',
          )
          replace_once(
              service,
              "    mode = next(iter(modes), AggregationMode.ADDITIVE)\n",
              "    mode = next(iter(modes), default_aggregation_mode)\n",
          )
          replace_once(
              service,
              "\n\ndef _budget_quantity(records: tuple[UsageRecord, ...]) -> float:\n",
              '''\n\ndef trend_usage_records(\n    records: tuple[UsageRecord, ...],\n    *,\n    metric_type: str,\n    unit: str,\n    start: datetime,\n    end: datetime,\n    bucket_seconds: int,\n) -> tuple[UsageAggregate, ...]:\n    """Bucket one metric/unit while preserving additive versus latest semantics."""\n\n    if bucket_seconds <= 0:\n        raise ValueError("bucket_seconds must be greater than zero")\n    if end <= start:\n        raise ValueError("trend end must be later than start")\n    bucket_count = ceil((end - start).total_seconds() / bucket_seconds)\n    if bucket_count > MAX_TREND_BUCKETS:\n        raise ValueError(f"trend query exceeds {MAX_TREND_BUCKETS} buckets")\n\n    metric_records = tuple(\n        sorted(\n            (\n                record\n                for record in records\n                if record.metric_type == metric_type and record.unit == unit\n            ),\n            key=lambda record: (record.timestamp, record.id),\n        )\n    )\n    modes = {record.aggregation_mode for record in metric_records}\n    if len(modes) > 1:\n        raise ValueError("one metric/unit trend cannot mix aggregation modes")\n    mode = next(iter(modes), AggregationMode.ADDITIVE)\n    window_records = tuple(\n        record for record in metric_records if start <= record.timestamp <= end\n    )\n\n    buckets: list[UsageAggregate] = []\n    record_index = 0\n    width = timedelta(seconds=bucket_seconds)\n    for bucket_index in range(bucket_count):\n        bucket_start = start + timedelta(seconds=bucket_index * bucket_seconds)\n        bucket_end = min(end, bucket_start + width)\n        is_last = bucket_index == bucket_count - 1\n        selected: list[UsageRecord] = []\n        while record_index < len(window_records):\n            record = window_records[record_index]\n            if record.timestamp < bucket_start:\n                record_index += 1\n                continue\n            if record.timestamp < bucket_end or (is_last and record.timestamp <= end):\n                selected.append(record)\n                record_index += 1\n                continue\n            break\n        buckets.append(\n            aggregate_usage_records(\n                tuple(selected),\n                metric_type=metric_type,\n                unit=unit,\n                start=bucket_start,\n                end=bucket_end,\n                default_aggregation_mode=mode,\n            )\n        )\n    return tuple(buckets)\n\n\ndef _budget_quantity(records: tuple[UsageRecord, ...]) -> float:\n''',
          )

          control = "src/ai_multi_agent_platform/accounting/control_plane.py"
          replace_once(
              control,
              "from hashlib import sha256\n",
              "from datetime import datetime, timedelta\nfrom hashlib import sha256\n",
          )
          replace_once(
              control,
              '''from .models import (\n    UsageAggregate,\n    UsageBudget,\n    UsageQuery,\n    UsageRecord,\n    UsageScope,\n)\nfrom .service import AccountingService, aggregate_usage_records\n''',
              '''from .models import (\n    UsageAggregate,\n    UsageBudget,\n    UsageQuery,\n    UsageRecord,\n    UsageScope,\n    utc_now,\n)\nfrom .service import AccountingService, aggregate_usage_records, trend_usage_records\n''',
          )
          replace_once(
              control,
              '''    def __init__(self, accounting: AccountingService) -> None:\n        self._accounting = accounting\n\n    async def list_resources(\n        self,\n        context: RequestContext,\n        query: PageQuery,\n    ) -> tuple[dict[str, JsonValue], ...]:\n        del query\n        records = tuple(\n            record\n            for record in self._accounting.query(_owner_query(context))\n            if _visible(record, context)\n        )\n        pairs = sorted({(record.metric_type, record.unit) for record in records})\n        resources: list[dict[str, JsonValue]] = []\n        scope_key = _scope_key(context)\n        for metric_type, unit in pairs:\n            aggregate = _aggregate_visible(records, metric_type, unit)\n            resources.append(_aggregate_resource(metric_type, unit, aggregate, scope_key))\n        return tuple(resources)\n''',
              '''    def __init__(\n        self,\n        accounting: AccountingService,\n        *,\n        trend_window_seconds: int = 24 * 60 * 60,\n        trend_bucket_seconds: int = 60 * 60,\n    ) -> None:\n        if trend_window_seconds <= 0 or trend_bucket_seconds <= 0:\n            raise ValueError("trend window and bucket must be greater than zero")\n        self._accounting = accounting\n        self._trend_window_seconds = trend_window_seconds\n        self._trend_bucket_seconds = trend_bucket_seconds\n\n    async def list_resources(\n        self,\n        context: RequestContext,\n        query: PageQuery,\n    ) -> tuple[dict[str, JsonValue], ...]:\n        del query\n        records = tuple(\n            record\n            for record in self._accounting.query(_owner_query(context))\n            if _visible(record, context)\n        )\n        pairs = sorted({(record.metric_type, record.unit) for record in records})\n        resources: list[dict[str, JsonValue]] = []\n        scope_key = _scope_key(context)\n        trend_end = utc_now()\n        trend_start = trend_end - timedelta(seconds=self._trend_window_seconds)\n        for metric_type, unit in pairs:\n            selected = _metric_records(records, metric_type, unit)\n            aggregate = aggregate_usage_records(selected, metric_type=metric_type, unit=unit)\n            trend = trend_usage_records(\n                selected,\n                metric_type=metric_type,\n                unit=unit,\n                start=trend_start,\n                end=trend_end,\n                bucket_seconds=self._trend_bucket_seconds,\n            )\n            resources.append(\n                _aggregate_resource(\n                    metric_type,\n                    unit,\n                    aggregate,\n                    scope_key,\n                    trend=trend,\n                    trend_start=trend_start,\n                    trend_end=trend_end,\n                    trend_bucket_seconds=self._trend_bucket_seconds,\n                )\n            )\n        return tuple(resources)\n''',
          )
          replace_once(
              control,
              '''def _aggregate_visible(\n    records: tuple[UsageRecord, ...], metric_type: str, unit: str\n) -> UsageAggregate:\n    selected = tuple(\n        record for record in records if record.metric_type == metric_type and record.unit == unit\n    )\n    return aggregate_usage_records(selected, metric_type=metric_type, unit=unit)\n''',
              '''def _metric_records(\n    records: tuple[UsageRecord, ...], metric_type: str, unit: str\n) -> tuple[UsageRecord, ...]:\n    return tuple(\n        record for record in records if record.metric_type == metric_type and record.unit == unit\n    )\n\n\ndef _aggregate_visible(\n    records: tuple[UsageRecord, ...], metric_type: str, unit: str\n) -> UsageAggregate:\n    selected = _metric_records(records, metric_type, unit)\n    return aggregate_usage_records(selected, metric_type=metric_type, unit=unit)\n''',
          )
          replace_once(
              control,
              '''def _aggregate_resource(\n    metric_type: str,\n    unit: str,\n    aggregate: UsageAggregate,\n    scope_key: str,\n) -> dict[str, JsonValue]:\n    digest = sha256(f"{scope_key}\\0{metric_type}\\0{unit}".encode()).hexdigest()[:24]\n    quality_counts: dict[str, JsonValue] = {\n        quality.value: count for quality, count in aggregate.quality_counts.items()\n    }\n    return {\n        "id": f"usage_aggregate_{digest}",\n        "metric_type": metric_type,\n        "unit": unit,\n        "total": aggregate.total,\n        "record_count": aggregate.record_count,\n        "unavailable_count": aggregate.unavailable_count,\n        "quality_counts": quality_counts,\n        "aggregation_mode": aggregate.aggregation_mode.value,\n    }\n''',
              '''def _aggregate_resource(\n    metric_type: str,\n    unit: str,\n    aggregate: UsageAggregate,\n    scope_key: str,\n    *,\n    trend: tuple[UsageAggregate, ...] = (),\n    trend_start: datetime | None = None,\n    trend_end: datetime | None = None,\n    trend_bucket_seconds: int | None = None,\n) -> dict[str, JsonValue]:\n    digest = sha256(f"{scope_key}\\0{metric_type}\\0{unit}".encode()).hexdigest()[:24]\n    quality_counts: dict[str, JsonValue] = {\n        quality.value: count for quality, count in aggregate.quality_counts.items()\n    }\n    trend_points: list[JsonValue] = []\n    for point in trend:\n        point_quality: dict[str, JsonValue] = {\n            quality.value: count for quality, count in point.quality_counts.items()\n        }\n        trend_points.append(\n            {\n                "start": None if point.start is None else point.start.isoformat(),\n                "end": None if point.end is None else point.end.isoformat(),\n                "value": point.total,\n                "record_count": point.record_count,\n                "unavailable_count": point.unavailable_count,\n                "quality_counts": point_quality,\n            }\n        )\n    return {\n        "id": f"usage_aggregate_{digest}",\n        "metric_type": metric_type,\n        "unit": unit,\n        "total": aggregate.total,\n        "record_count": aggregate.record_count,\n        "unavailable_count": aggregate.unavailable_count,\n        "quality_counts": quality_counts,\n        "aggregation_mode": aggregate.aggregation_mode.value,\n        "trend_window_start": None if trend_start is None else trend_start.isoformat(),\n        "trend_window_end": None if trend_end is None else trend_end.isoformat(),\n        "trend_bucket_seconds": trend_bucket_seconds,\n        "trend": trend_points,\n    }\n''',
          )

          types = "frontend/src/api/types.ts"
          replace_once(
              types,
              '''export interface CanonicalUsageAggregate {\n  id: string;\n  metric_type: string;\n  unit: string;\n  total: number | null;\n  record_count: number;\n  unavailable_count: number;\n  quality_counts: Record<MeasurementQuality, number>;\n  aggregation_mode: AggregationMode;\n}\n''',
              '''export interface CanonicalUsageTrendPoint {\n  start: string;\n  end: string;\n  value: number | null;\n  record_count: number;\n  unavailable_count: number;\n  quality_counts: Record<MeasurementQuality, number>;\n}\n\nexport interface CanonicalUsageAggregate {\n  id: string;\n  metric_type: string;\n  unit: string;\n  total: number | null;\n  record_count: number;\n  unavailable_count: number;\n  quality_counts: Record<MeasurementQuality, number>;\n  aggregation_mode: AggregationMode;\n  trend_window_start: string | null;\n  trend_window_end: string | null;\n  trend_bucket_seconds: number | null;\n  trend: CanonicalUsageTrendPoint[];\n}\n''',
          )

          page = "frontend/src/pages/UsagePage.tsx"
          replace_once(
              page,
              '<thead><tr><th>Metric</th><th>Value</th><th>Mode</th><th>Records</th><th>Quality mix</th></tr></thead>',
              '<thead><tr><th>Metric</th><th>Value</th><th>Mode</th><th>Records</th><th>Quality mix</th><th>Recent history</th></tr></thead>',
          )
          replace_once(
              page,
              '''              <td>{qualitySummary(aggregate.quality_counts)}</td>\n            </tr>''',
              '''              <td>{qualitySummary(aggregate.quality_counts)}</td>\n              <td><TrendSummary aggregate={aggregate} /></td>\n            </tr>''',
          )
          replace_once(
              page,
              '''function qualitySummary(counts: Record<MeasurementQuality, number>): string {\n''',
              '''function TrendSummary({ aggregate }: { aggregate: CanonicalUsageAggregate }) {\n  const sampled = aggregate.trend.filter((point) => point.value !== null).slice(-6);\n  if (!sampled.length) return <span>No samples in window</span>;\n  return (\n    <div>\n      <small>\n        {aggregate.trend_bucket_seconds === null\n          ? "Historical window"\n          : `${formatNumber(aggregate.trend_bucket_seconds / 60)} min buckets`}\n      </small>\n      {sampled.map((point) => (\n        <div key={point.start}>\n          <time dateTime={point.start}>{formatTrendTime(point.start)}</time>{" "}\n          {formatQuantity(point.value, aggregate.unit)}\n        </div>\n      ))}\n    </div>\n  );\n}\n\nfunction formatTrendTime(value: string): string {\n  const date = new Date(value);\n  return Number.isNaN(date.getTime()) ? value : date.toLocaleTimeString();\n}\n\nfunction qualitySummary(counts: Record<MeasurementQuality, number>): string {\n''',
          )

          http_test = "tests/test_issue76_control_plane_http.py"
          replace_once(
              http_test,
              '''        assert aggregate_items[0]["total"] == 42.0\n        assert aggregate_items[0]["aggregation_mode"] == "latest"\n''',
              '''        assert aggregate_items[0]["total"] == 42.0\n        assert aggregate_items[0]["aggregation_mode"] == "latest"\n        assert aggregate_items[0]["trend_bucket_seconds"] == 3600\n        trend = aggregate_items[0]["trend"]\n        assert isinstance(trend, list)\n        assert any(isinstance(point, dict) and point["value"] == 42.0 for point in trend)\n''',
          )

          Path("tests/test_issue76_trends.py").write_text('''from __future__ import annotations\n\nimport asyncio\nfrom datetime import UTC, datetime, timedelta\n\nimport pytest\n\nfrom ai_multi_agent_platform.accounting import (\n    AccountingService,\n    AggregationMode,\n    InMemoryUsageStore,\n    MeasurementQuality,\n    UsageQuery,\n    UsageRecord,\n    UsageScope,\n)\nfrom ai_multi_agent_platform.accounting.control_plane import UsageAggregateResourceService\nfrom ai_multi_agent_platform.control_plane.models import ActorContext, PageQuery, RequestContext\n\n\ndef _record(\n    *,\n    timestamp: datetime,\n    quantity: float | None,\n    mode: AggregationMode = AggregationMode.ADDITIVE,\n    quality: MeasurementQuality = MeasurementQuality.MEASURED,\n    owner: str | None = None,\n) -> UsageRecord:\n    return UsageRecord(\n        metric_type="test.metric",\n        unit="units",\n        quality=quality,\n        source="test",\n        quantity=quantity,\n        timestamp=timestamp,\n        aggregation_mode=mode,\n        scope=UsageScope(\n            owner_type=None if owner is None else "user",\n            owner_id=owner,\n        ),\n    )\n\n\ndef test_additive_trend_buckets_sum_without_fabricating_empty_zeroes() -> None:\n    start = datetime(2026, 9, 3, 0, 0, tzinfo=UTC)\n    service = AccountingService(InMemoryUsageStore())\n    for record in (\n        _record(timestamp=start + timedelta(minutes=10), quantity=1.0),\n        _record(timestamp=start + timedelta(minutes=30), quantity=2.0),\n        _record(\n            timestamp=start + timedelta(hours=1, minutes=10),\n            quantity=None,\n            quality=MeasurementQuality.UNAVAILABLE,\n        ),\n        _record(timestamp=start + timedelta(hours=2, minutes=20), quantity=4.0),\n    ):\n        service.record(record)\n\n    trend = service.trend(\n        UsageQuery(\n            metric_type="test.metric",\n            unit="units",\n            start=start,\n            end=start + timedelta(hours=3),\n        ),\n        bucket_seconds=3600,\n    )\n\n    assert [bucket.total for bucket in trend] == [3.0, None, 4.0]\n    assert [bucket.record_count for bucket in trend] == [2, 1, 1]\n    assert [bucket.unavailable_count for bucket in trend] == [0, 1, 0]\n    assert all(bucket.aggregation_mode is AggregationMode.ADDITIVE for bucket in trend)\n\n\ndef test_latest_trend_uses_latest_sample_per_bucket_without_carry_forward() -> None:\n    start = datetime(2026, 9, 3, 0, 0, tzinfo=UTC)\n    service = AccountingService(InMemoryUsageStore())\n    for record in (\n        _record(\n            timestamp=start + timedelta(minutes=5),\n            quantity=10.0,\n            mode=AggregationMode.LATEST,\n        ),\n        _record(\n            timestamp=start + timedelta(minutes=50),\n            quantity=12.0,\n            mode=AggregationMode.LATEST,\n        ),\n        _record(\n            timestamp=start + timedelta(hours=2, minutes=15),\n            quantity=7.0,\n            mode=AggregationMode.LATEST,\n        ),\n    ):\n        service.record(record)\n\n    trend = service.trend(\n        UsageQuery(\n            metric_type="test.metric",\n            unit="units",\n            start=start,\n            end=start + timedelta(hours=3),\n        ),\n        bucket_seconds=3600,\n    )\n\n    assert [bucket.total for bucket in trend] == [12.0, None, 7.0]\n    assert all(bucket.aggregation_mode is AggregationMode.LATEST for bucket in trend)\n\n\ndef test_trend_requires_bounded_reasonable_bucket_count() -> None:\n    start = datetime(2026, 9, 3, 0, 0, tzinfo=UTC)\n    service = AccountingService(InMemoryUsageStore())\n    with pytest.raises(ValueError, match="500 buckets"):\n        service.trend(\n            UsageQuery(\n                metric_type="test.metric",\n                unit="units",\n                start=start,\n                end=start + timedelta(seconds=501),\n            ),\n            bucket_seconds=1,\n        )\n\n\ndef test_control_plane_trend_is_owner_isolated() -> None:\n    now = datetime.now(UTC)\n    accounting = AccountingService(InMemoryUsageStore())\n    accounting.record(_record(timestamp=now - timedelta(minutes=30), quantity=5.0, owner="alice"))\n    accounting.record(_record(timestamp=now - timedelta(minutes=20), quantity=999.0, owner="bob"))\n    context = RequestContext(\n        request_id="request-trend",\n        correlation_id="correlation-trend",\n        actor=ActorContext(\n            principal_ref="user:alice",\n            owner_type="user",\n            owner_id="alice",\n        ),\n    )\n\n    resources = asyncio.run(\n        UsageAggregateResourceService(\n            accounting, trend_window_seconds=3600, trend_bucket_seconds=900\n        ).list_resources(context, PageQuery())\n    )\n\n    assert len(resources) == 1\n    assert resources[0]["total"] == 5.0\n    trend = resources[0]["trend"]\n    assert isinstance(trend, list)\n    values = [point["value"] for point in trend if isinstance(point, dict)]\n    assert 5.0 in values\n    assert 999.0 not in values\n''')

          Path("docs/ISSUE_76_TRENDS_PROGRESS.md").write_text('''# Issue #76 — Time-window trend progress\n\nThis follow-up adds bounded historical trend aggregation on top of the durable `UsageRecord` store.\n\n## Semantics\n\n- `AccountingService.trend(...)` requires an explicit metric, unit, start, end and positive bucket width.\n- A request is capped at 500 buckets so an API/UI projection cannot accidentally materialize an unbounded history.\n- `additive` metrics sum only records inside each bucket.\n- `latest` metrics select the latest sample inside each bucket.\n- Empty buckets remain `null`/no sample; they are not fabricated as zero.\n- `latest` values are not silently carried forward into buckets that have no measurement.\n- Measurement-quality counts and unavailable counts remain visible for each bucket.\n\n## Control Plane / UI\n\nThe existing `usage-aggregates` resource now includes a default rolling 24-hour history in one-hour buckets. This remains an owner-isolated projection over the same accounting records; it does not create a second usage store.\n\nThe `/usage` frontend displays recent non-empty bucket values alongside each aggregate and continues to distinguish `additive` from `latest` semantics.\n\n## Remaining progressive work\n\nIssue #76 remains open. Worker/Node telemetry, authorization/admission enforcement, Agent/Team/Organization attribution, notifications and external/browser/repository measurements remain dependent on their owning domains and must not be fabricated here.\n''')
          PY
      - name: Verify repository gates
        run: |
          ruff format src/ai_multi_agent_platform/accounting tests/test_issue76_control_plane_http.py tests/test_issue76_trends.py
          ruff check src/ai_multi_agent_platform/accounting tests/test_issue76_control_plane_http.py tests/test_issue76_trends.py
          mypy
          pytest tests/test_issue76_accounting.py tests/test_issue76_storage_accounting.py tests/test_issue76_control_plane_http.py tests/test_issue76_trends.py
          python -m build
          cd frontend
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/accounting/service.py src/ai_multi_agent_platform/accounting/control_plane.py tests/test_issue76_control_plane_http.py tests/test_issue76_trends.py docs/ISSUE_76_TRENDS_PROGRESS.md frontend/src/api/types.ts frontend/src/pages/UsagePage.tsx
          git commit -m "feat: add #76 time-window usage trends"
          git push origin HEAD:feat/issue-76-time-window-trends
