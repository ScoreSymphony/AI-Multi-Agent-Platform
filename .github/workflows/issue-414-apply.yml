name: Issue 414 apply

on:
  push:
    branches:
      - issue-414-node-worker-updated-at

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply patch
        shell: bash
        run: |
          python scripts/ci/issue414_apply.py
          rm scripts/ci/issue414_apply.py
      - name: Install development environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format touched Python
        run: |
          ruff format src/ai_multi_agent_platform/distributed/models.py src/ai_multi_agent_platform/distributed/registry.py src/ai_multi_agent_platform/distributed/persistence.py src/ai_multi_agent_platform/distributed/control_plane.py tests/test_issue_414_node_worker_state_timestamps.py tests/test_issue_288_node_worker_search.py
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Targeted regression tests
        run: |
          pytest -q tests/test_issue_414_node_worker_state_timestamps.py tests/test_issue_288_node_worker_search.py tests/test_issue_14_distributed_runtime.py tests/test_issue_14_registry_completion.py tests/test_issue_14_restart_persistence.py tests/test_issue_14_control_plane.py
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/distributed/models.py src/ai_multi_agent_platform/distributed/registry.py src/ai_multi_agent_platform/distributed/persistence.py src/ai_multi_agent_platform/distributed/control_plane.py tests/test_issue_414_node_worker_state_timestamps.py tests/test_issue_288_node_worker_search.py docs/DISTRIBUTED_RUNTIME.md docs/adr/0010-node-worker-state-change-timestamps.md
          git add -A scripts/ci/issue414_apply.py
          git commit -m "feat(runtime): define Node/Worker state timestamps (#414)"
          git push origin HEAD:issue-414-node-worker-updated-at
