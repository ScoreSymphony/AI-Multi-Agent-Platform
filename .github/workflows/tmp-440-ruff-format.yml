name: Temporary #440 Ruff formatter

on:
  push:
    branches:
      - perf/440-sqlite-contention

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/440-sqlite-contention
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format #440 Python files
        run: |
          ruff format \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py \
            tests/performance/test_issue_440_persistence_contention.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py \
            tests/performance/test_issue_440_persistence_contention.py
          git commit -m "style(#440): apply Ruff formatting"
          git push origin HEAD:perf/440-sqlite-contention
