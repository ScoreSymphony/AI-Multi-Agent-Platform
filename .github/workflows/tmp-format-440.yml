name: Temporary format 440

on:
  push:
    branches:
      - issue-440-planning-graph-scale

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-440-planning-graph-scale
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format issue 440 files
        run: |
          ruff format \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale.py \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale_cli.py \
            tests/performance/test_issue_440_planning_graph_scale.py
          ruff check --fix \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale.py \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale_cli.py \
            tests/performance/test_issue_440_planning_graph_scale.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale.py \
            src/ai_multi_agent_platform/benchmarking/planning_graph_scale_cli.py \
            tests/performance/test_issue_440_planning_graph_scale.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format planning graph scale benchmark"
            git push origin HEAD:issue-440-planning-graph-scale
          fi
