name: Hermes v0.21.2 Candidate

on:
  pull_request:
    paths:
      - ".github/workflows/hermes-v0-21-2-candidate.yml"
      - "scripts/ci/external_adapter_conformance_profile.py"
      - "scripts/ci/hermes_v0_21_2_candidate_validation.py"
      - "tests/regression/upstreams/test_hermes_v0_21_2.py"
      - "tests/integration/upstreams/test_hermes_v0_21_2_candidate.py"
      - "tests/integration/upstreams/test_hermes_v0_21_2_concurrency.py"
      - "tests/integration/upstreams/test_hermes_v0_21_2_restart.py"
      - "src/ai_multi_agent_platform/adapters/hermes.py"
      - "upstream/hermes-agent.yaml"
      - "release/compatibility.json"
      - "src/ai_multi_agent_platform/release/compatibility.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-v0-21-2-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform validation environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"

      - name: Checkout exact Hermes v0.21.2 candidate
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          ref: 939e45c91d751fadd94dcd1b873ac3cb44846213
          path: .upstream/hermes
          persist-credentials: false

      - name: Install candidate Hermes runtime
        run: |
          python -m pip install -e ".upstream/hermes"
          python -m pip install "aiohttp==3.14.3"

      - name: Run revision-bound candidate compatibility and state-store gates
        env:
          HERMES_UPSTREAM_DIR: ${{ github.workspace }}/.upstream/hermes
          HERMES_UPSTREAM_REVISION: 939e45c91d751fadd94dcd1b873ac3cb44846213
        run: python scripts/ci/hermes_v0_21_2_candidate_validation.py

      - name: Run Hermes Scenario B against candidate
        env:
          HERMES_UPSTREAM_DIR: ${{ github.workspace }}/.upstream/hermes
          HERMES_UPSTREAM_REVISION: 939e45c91d751fadd94dcd1b873ac3cb44846213
          HERMES_COMPATIBILITY_CANDIDATE_REVISION: 939e45c91d751fadd94dcd1b873ac3cb44846213
        run: |
          platform-conformance \
            --profile integration \
            --deployment-profile hermes-v0.21.2-candidate \
            --enable-optional B \
            --scenario B \
            --adapter-version "hermes-agent=$HERMES_UPSTREAM_REVISION" \
            --json-report conformance-hermes-v0.21.2-candidate.json

      - name: Upload candidate conformance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: platform-conformance-hermes-v0.21.2-candidate
          path: conformance-hermes-v0.21.2-candidate.json
          if-no-files-found: warn
