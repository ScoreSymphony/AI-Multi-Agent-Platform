name: issue-79-preview-once

on:
  push:
    branches:
      - feat/issue-79-control-plane-portability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make stored previews replay-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/portability/workflow.py")
          text = path.read_text()
          replacements = (
              (
                  "        self._reports: dict[str, ImportReport] = {}\n",
                  "        self._reports: dict[str, ImportReport] = {}\n"
                  "        self._reports_by_preview: dict[str, ImportReport] = {}\n",
              ),
              (
                  "    async def execute_import(self, preview_id: str) -> ImportReport:\n"
                  "        stored = self.preview(preview_id)\n",
                  "    async def execute_import(self, preview_id: str) -> ImportReport:\n"
                  "        completed = self._reports_by_preview.get(preview_id)\n"
                  "        if completed is not None:\n"
                  "            return completed\n"
                  "        stored = self.preview(preview_id)\n",
              ),
              (
                  "        self._reports[report_id] = report\n        return report\n",
                  "        self._reports[report_id] = report\n"
                  "        self._reports_by_preview[stored.preview_id] = report\n"
                  "        return report\n",
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected workflow anchor not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format changed source
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff check --fix src/ai_multi_agent_platform/portability/workflow.py
          ruff format src/ai_multi_agent_platform/portability/workflow.py
      - name: Commit hardening and remove helper
        run: |
          rm .github/workflows/issue-79-preview-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(portability): make preview execution replay-safe"
          git push origin HEAD:feat/issue-79-control-plane-portability
