name: Issue 7 mypy report

on:
  push:
    branches: [fix/issue-7-ci]

permissions:
  contents: write

jobs:
  report:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-7-ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy diagnostics
        shell: bash
        run: |
          mypy > .issue7-mypy.txt 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .issue7-mypy.txt
          git commit -m "chore: capture issue 7 mypy diagnostics"
          git push origin HEAD:fix/issue-7-ci
