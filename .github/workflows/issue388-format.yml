name: Issue 388 format branch

on:
  push:
    branches: [issue-388-two-host-acceptance]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-388-two-host-acceptance
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format only the new #388 Python files
        run: |
          ruff format scripts/acceptance/two_host_message_transport.py \
            tests/integration/deployment/test_two_host_message_transport_acceptance.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- \
            scripts/acceptance/two_host_message_transport.py \
            tests/integration/deployment/test_two_host_message_transport_acceptance.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/acceptance/two_host_message_transport.py \
            tests/integration/deployment/test_two_host_message_transport_acceptance.py
          git commit -m "style: format #388 acceptance harness"
          git push origin HEAD:issue-388-two-host-acceptance
