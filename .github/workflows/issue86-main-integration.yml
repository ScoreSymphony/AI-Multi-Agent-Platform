name: Issue 86 main integration

on:
  push:
    branches:
      - "feat/issue-86-main-integration-helper"

permissions:
  contents: write

jobs:
  integrate-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-86-main-integration-helper
          fetch-depth: 0
      - name: Import conflict-free #86 files
        shell: bash
        run: |
          git fetch origin feat/issue-86-canonical-verification
          git checkout origin/feat/issue-86-canonical-verification -- \
            docs/VERIFICATION.md \
            frontend/src/api/verification.test.ts \
            frontend/src/api/verification.ts \
            frontend/src/app/navigation.ts \
            frontend/src/components/VerificationSummary.test.tsx \
            frontend/src/components/VerificationSummary.tsx \
            frontend/src/pages/VerificationBoundPages.tsx \
            frontend/src/pages/VerificationPage.tsx \
            src/ai_multi_agent_platform/agents/runtime.py \
            src/ai_multi_agent_platform/kernel/kernel.py \
            src/ai_multi_agent_platform/verification/__init__.py \
            src/ai_multi_agent_platform/verification/audit.py \
            src/ai_multi_agent_platform/verification/control_plane.py \
            src/ai_multi_agent_platform/verification/deterministic.py \
            src/ai_multi_agent_platform/verification/gate.py \
            src/ai_multi_agent_platform/verification/models.py \
            src/ai_multi_agent_platform/verification/observability.py \
            src/ai_multi_agent_platform/verification/persistence.py \
            src/ai_multi_agent_platform/verification/repair.py \
            src/ai_multi_agent_platform/verification/reviewer_agent.py \
            src/ai_multi_agent_platform/verification/service.py \
            tests/test_issue_86_control_plane.py \
            tests/test_issue_86_kernel_gate.py \
            tests/test_issue_86_observability.py \
            tests/test_issue_86_persistence.py \
            tests/test_issue_86_repair_runtime.py \
            tests/test_issue_86_replacement_conformance.py \
            tests/test_issue_86_reviewer_agent.py \
            tests/test_issue_86_verification.py
          python .github/scripts/issue86_integrate_shell.py
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/VERIFICATION.md")
          text = path.read_text()
          old = '''- focused regression tests for core, kernel-gate, persistence/recovery, Control Plane authorization, observability, reviewer-Agent and repair semantics.

Remaining issue work is intentionally layered on top of these authorities:

- frontend pending-review/detail/history/action surface;
- broader replacement conformance tests proving equivalent completion semantics across replaceable orchestrators/models/providers.'''
          new = '''- dedicated frontend pending-review queue, detail/history surface and authorized human review actions;
- read-only Verification policy/status/history projections directly on Task, Run and Result detail surfaces;
- replacement-conformance coverage across replaceable orchestrators, reviewer models/providers and external Verification providers;
- focused regression tests for core, kernel-gate, persistence/recovery, Control Plane authorization, observability, reviewer-Agent, repair and replacement semantics.

The implementation work owned directly by #86 is complete. Follow-up integrations remain intentionally owned by their respective issues, including #19 evaluation consumption, #75 review notifications, #82 repository diff/test evidence and #78 reusable policy templates. Those integrations may consume canonical Verification facts but do not own Verification or Task completion semantics.'''
          if old not in text:
              raise SystemExit("verification documentation completion anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python validation environment
        run: python -m pip install -e ".[dev]"
      - name: Validate Python integration
        run: |
          ruff format --check src tests
          ruff check src tests
          mypy src
          pytest -q \
            tests/test_issue_86_verification.py \
            tests/test_issue_86_kernel_gate.py \
            tests/test_issue_86_persistence.py \
            tests/test_issue_86_control_plane.py \
            tests/test_issue_86_observability.py \
            tests/test_issue_86_reviewer_agent.py \
            tests/test_issue_86_repair_runtime.py \
            tests/test_issue_86_replacement_conformance.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
      - name: Pin supported npm
        run: npm install --global npm@11.6.0
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Validate frontend integration
        working-directory: frontend
        run: |
          npm run typecheck
          npm test -- --run src/api/verification.test.ts src/components/VerificationSummary.test.tsx
          npm test
          npm run build
      - name: Commit validated integration
        shell: bash
        run: |
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add \
            docs/VERIFICATION.md \
            frontend/src/api/verification.test.ts \
            frontend/src/api/verification.ts \
            frontend/src/app/Shell.tsx \
            frontend/src/app/navigation.ts \
            frontend/src/components/VerificationSummary.test.tsx \
            frontend/src/components/VerificationSummary.tsx \
            frontend/src/pages/VerificationBoundPages.tsx \
            frontend/src/pages/VerificationPage.tsx \
            src/ai_multi_agent_platform/agents/runtime.py \
            src/ai_multi_agent_platform/kernel/kernel.py \
            src/ai_multi_agent_platform/verification \
            tests/test_issue_86_*.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs: complete canonical verification delivery (#86)"
          git push origin HEAD:feat/issue-86-main-integration-helper
