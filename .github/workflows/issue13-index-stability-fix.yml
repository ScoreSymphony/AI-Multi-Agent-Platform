name: Issue 13 Index Stability Fix

on:
  push:
    branches: [feat/issue-13-data-boundaries]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-13-data-boundaries
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install checks
        run: python -m pip install -e '.[dev]'
      - name: Persist canonical index identity at source registration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/data/reference.py')
          text = path.read_text()

          register_anchor = (
              "                        _json_dump(source.metadata),\n"
              "                    ),\n"
              "                )\n"
              "        except sqlite3.IntegrityError as exc:\n"
          )
          register_replacement = (
              "                        _json_dump(source.metadata),\n"
              "                    ),\n"
              "                )\n"
              "                connection.execute(\n"
              "                    \"\"\"\n"
              "                    INSERT INTO data_knowledge_indexes (\n"
              "                        index_id, source_id, revision, status, updated_at\n"
              "                    ) VALUES (?, ?, ?, ?, ?)\n"
              "                    \"\"\",\n"
              "                    (\n"
              "                        new_knowledge_index_id(),\n"
              "                        source.source_id,\n"
              "                        source.revision,\n"
              "                        KnowledgeStatus.REGISTERED.value,\n"
              "                        source.updated_at.isoformat(),\n"
              "                    ),\n"
              "                )\n"
              "        except sqlite3.IntegrityError as exc:\n"
          )
          if register_anchor not in text:
              raise SystemExit('register_source anchor not found')
          text = text.replace(register_anchor, register_replacement, 1)

          ingest_marker = text.index('    async def ingest_source(')
          start = text.index('                existing = connection.execute(', ingest_marker)
          end = text.index('        except sqlite3.Error as exc:', start)
          replacement_lines = [
              '                connection.execute(',
              '                    """',
              '                    UPDATE data_knowledge_indexes',
              '                    SET revision = ?, status = ?, updated_at = ?',
              '                    WHERE source_id = ?',
              '                    """,',
              '                    (',
              '                        source.revision,',
              '                        KnowledgeStatus.READY.value,',
              '                        now.isoformat(),',
              '                        source_id,',
              '                    ),',
              '                )',
          ]
          text = text[:start] + '\n'.join(replacement_lines) + '\n' + text[end:]

          fallback = (
              "        if row is None:\n"
              "            return IndexReference(\n"
              "                index_id=new_knowledge_index_id(),\n"
              "                source_id=source_id,\n"
              "                revision=source.revision,\n"
              "                status=KnowledgeStatus.REGISTERED,\n"
              "                updated_at=source.updated_at,\n"
              "            )\n"
          )
          fallback_replacement = (
              "        if row is None:\n"
              "            raise ContractError(\n"
              "                ErrorCode.CONTRACT_VIOLATION,\n"
              "                f\"missing canonical knowledge index: {source_id}\",\n"
              "            )\n"
          )
          if fallback not in text:
              raise SystemExit('get_index_status fallback not found')
          path.write_text(text.replace(fallback, fallback_replacement, 1))
          PY
          ruff format .
          ruff check .
          mypy
          pytest tests/test_issue13_canonical_id_stability.py tests/test_data_reference.py
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/data/reference.py
          git commit -m 'fix: preserve canonical knowledge index identity'
          git push origin HEAD:feat/issue-13-data-boundaries
