name: Production security boundary conformance

on:
  pull_request:
    paths:
      - ".github/workflows/security-conformance.yml"
      - "conformance/security/**"
      - "scripts/ci/security_boundary_conformance.py"
      - "src/ai_multi_agent_platform/conformance/gate.py"
      - "tests/contract/security/test_production_security_boundary_matrix.py"
      - "docs/SECURITY_THREAT_MODEL.md"
      - "docs/security/PRODUCTION_SECURITY_BOUNDARY_CONFORMANCE.md"
  push:
    branches: [main]
    paths:
      - ".github/workflows/security-conformance.yml"
      - "conformance/security/**"
      - "scripts/ci/security_boundary_conformance.py"
      - "src/ai_multi_agent_platform/conformance/gate.py"
      - "tests/contract/security/test_production_security_boundary_matrix.py"
      - "docs/SECURITY_THREAT_MODEL.md"
      - "docs/security/PRODUCTION_SECURITY_BOUNDARY_CONFORMANCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-boundary-conformance:
    name: production-security-boundaries
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install security conformance environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate and execute production security boundary matrix
        run: python scripts/ci/security_boundary_conformance.py
