name: Reference host absolute budget smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reference-host-absolute-budget-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate absolute budget implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py tests/performance/test_issue_440_reference_host_absolute_budget.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py tests/performance/test_issue_440_reference_host_absolute_budget.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py
          pytest tests/performance/test_issue_440_reference_host_absolute_budget.py
          platform-reference-host-absolute-budget --help >/dev/null
      - name: Verify no built-in absolute budget policy is shipped
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (Path("docs"), Path("src/ai_multi_agent_platform/benchmarking"))
          candidates = tuple(
              path
              for root in roots
              for path in root.rglob("*absolute-budget-policy*.json")
          )
          schema_files = tuple(path for path in candidates if path.name.endswith(".schema.json"))
          policy_instances = tuple(path for path in candidates if path not in schema_files)
          assert not policy_instances, policy_instances
          PY
