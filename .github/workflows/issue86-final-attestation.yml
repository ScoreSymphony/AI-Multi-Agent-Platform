name: Issue 86 final attestation hardening

on:
  push:
    branches:
      - fix/issue-86-final-attestation

permissions:
  contents: write

jobs:
  hardening:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply final #86 patch
        run: python .github/issue86_patcher_repair.py
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Normalize product and tests
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff format src tests
      - name: Ruff lint
        run: ruff check src tests
      - name: Mypy
        run: mypy
      - name: Focused issue 86 tests
        run: pytest -q tests/test_issue_86_*.py
      - name: Commit validated product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "fix(verification): enforce final canonical attestation (#86)"
          git push
      - name: Remove temporary validator files
        shell: bash
        run: |
          git rm .github/issue86_final_attestation_patch.py .github/issue86_patcher_repair.py .github/workflows/issue86-final-attestation.yml
          git commit -m "chore: remove temporary #86 final attestation validator"
          git push
