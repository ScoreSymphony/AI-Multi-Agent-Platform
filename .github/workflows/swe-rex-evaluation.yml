name: SWE-ReX evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/swe-rex-evaluation.yml"
      - "scripts/benchmarks/issue861_swe_rex_live.py"
      - "scripts/benchmarks/issue861_swe_rex_canonical.py"
      - "scripts/benchmarks/issue861_swe_rex_remote.py"
      - "src/ai_multi_agent_platform/adapters/swe_rex.py"
      - "tests/test_swe_rex_executor.py"
      - "docs/upstream/SWE_REX_*.md"
      - "upstream/swe-rex.yaml"

permissions:
  contents: read

jobs:
  local-runtime:
    name: local-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform and pinned SWE-ReX revision
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
      - name: Run local runtime evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend local
          --output "swe-rex-local-${{ runner.os }}.json"
      - name: Run canonical Executor bridge evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/benchmarks/issue861_swe_rex_canonical.py
          --backend local
          --output "swe-rex-canonical-local-${{ runner.os }}.json"
      - name: Upload local evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "swe-rex-local-${{ runner.os }}"
          path: |
            swe-rex-local-${{ runner.os }}.json
            swe-rex-canonical-local-${{ runner.os }}.json
          if-no-files-found: warn

  docker-runtime:
    name: docker-runtime (${{ matrix.backend }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        backend: [docker, docker-internal]
    env:
      ISSUE861_SWEREX_IMAGE: issue861-swerex:5c995c365dfb1fd5bc56fda688be5d8538f9931f
      ISSUE861_DOCKER_NETWORK: issue861-internal
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform, pinned SWE-ReX revision and remote-runtime dependency
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
          "aiohttp>=3.11,<4"
      - name: Build pinned SWE-ReX server image
        shell: bash
        run: |
          cat > /tmp/issue861-swe-rex.Dockerfile <<'EOF'
          FROM python:3.11-slim
          ARG SWE_REX_REVISION
          RUN python -m pip install --no-cache-dir \
              "https://github.com/SWE-agent/SWE-ReX/archive/${SWE_REX_REVISION}.zip"
          RUN swerex-remote --version
          EOF
          docker build \
            --build-arg SWE_REX_REVISION=5c995c365dfb1fd5bc56fda688be5d8538f9931f \
            --tag "$ISSUE861_SWEREX_IMAGE" \
            --file /tmp/issue861-swe-rex.Dockerfile \
            .
          docker image inspect "$ISSUE861_SWEREX_IMAGE" --format '{{.Id}}'
      - name: Create internal Docker network
        if: ${{ matrix.backend == 'docker-internal' }}
        run: docker network create --internal "$ISSUE861_DOCKER_NETWORK"
      - name: Run Docker runtime evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend "${{ matrix.backend }}"
          --output "swe-rex-${{ matrix.backend }}.json"
      - name: Run canonical Executor bridge evidence
        if: ${{ matrix.backend == 'docker' }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/benchmarks/issue861_swe_rex_canonical.py
          --backend docker
          --output swe-rex-canonical-docker.json
      - name: Remove internal Docker network
        if: ${{ always() && matrix.backend == 'docker-internal' }}
        run: docker network rm "$ISSUE861_DOCKER_NETWORK" || true
      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "swe-rex-${{ matrix.backend }}"
          path: |
            swe-rex-${{ matrix.backend }}.json
            swe-rex-canonical-${{ matrix.backend }}.json
          if-no-files-found: warn

  remote-loopback:
    name: remote-loopback
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform, pinned SWE-ReX revision and remote-runtime dependency
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
          "aiohttp>=3.11,<4"
      - name: Run remote loopback evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_remote.py
          --output swe-rex-remote-loopback.json
      - name: Upload remote evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swe-rex-remote-loopback
          path: swe-rex-remote-loopback.json
          if-no-files-found: warn
