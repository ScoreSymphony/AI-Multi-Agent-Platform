name: SWE-ReX evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/swe-rex-evaluation.yml"
      - "scripts/benchmarks/issue861_swe_rex_live.py"
      - "src/ai_multi_agent_platform/adapters/swe_rex.py"
      - "tests/test_swe_rex_executor.py"
      - "docs/upstream/SWE_REX_*.md"
      - "upstream/swe-rex.yaml"

permissions:
  contents: read

jobs:
  local-runtime:
    name: local-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned SWE-ReX revision
        run: >-
          python -m pip install
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
      - name: Run local runtime evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend local
          --output "swe-rex-local-${{ runner.os }}.json"
      - name: Upload local evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "swe-rex-local-${{ runner.os }}"
          path: "swe-rex-local-${{ runner.os }}.json"
          if-no-files-found: warn

  docker-runtime:
    name: docker-runtime (${{ matrix.backend }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        backend: [docker, docker-network-none]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned SWE-ReX revision and remote-runtime dependency
        run: >-
          python -m pip install
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
          "aiohttp>=3.11,<4"
      - name: Run Docker runtime evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend "${{ matrix.backend }}"
          --output "swe-rex-${{ matrix.backend }}.json"
      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "swe-rex-${{ matrix.backend }}"
          path: "swe-rex-${{ matrix.backend }}.json"
          if-no-files-found: warn
