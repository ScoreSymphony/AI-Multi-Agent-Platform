name: SWE-ReX evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/swe-rex-evaluation.yml"
      - "scripts/benchmarks/issue861_swe_rex_live.py"
      - "scripts/benchmarks/issue861_swe_rex_canonical.py"
      - "scripts/benchmarks/issue861_swe_rex_remote.py"
      - "src/ai_multi_agent_platform/adapters/swe_rex.py"
      - "tests/contract/execution/test_swe_rex_executor.py"
      - "docs/upstream/SWE_REX_*.md"
      - "upstream/swe-rex.yaml"

permissions:
  contents: read

concurrency:
  group: swe-rex-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-runtime:
    name: local-runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            experimental: false
          - os: windows-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform and pinned SWE-ReX revision
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
      - name: Run supported local runtime evidence
        if: ${{ !matrix.experimental }}
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend local
          --output "swe-rex-local-${{ runner.os }}.json"
      - name: Run supported canonical Executor bridge evidence
        if: ${{ !matrix.experimental }}
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/benchmarks/issue861_swe_rex_canonical.py
          --backend local
          --output "swe-rex-canonical-local-${{ runner.os }}.json"
      - name: Assert native Windows local unsupported evidence
        if: ${{ matrix.experimental }}
        shell: pwsh
        run: |
          $output = "swe-rex-local-${{ runner.os }}.json"
          python scripts/benchmarks/issue861_swe_rex_live.py --backend local --output $output
          $probeExit = $LASTEXITCODE
          if ($probeExit -eq 0) {
            throw "Native Windows LocalDeployment unexpectedly passed; update #861 evidence before merging."
          }

          $evidence = Get-Content $output -Raw | ConvertFrom-Json
          if ($evidence.passed_core_semantics -ne $false) {
            throw "Windows negative probe did not record passed_core_semantics=false."
          }
          if ($evidence.fatal_error.type -ne "AttributeError") {
            throw "Expected AttributeError for the pinned Windows LocalDeployment probe, got '$($evidence.fatal_error.type)'."
          }
          if ($evidence.fatal_error.message -notmatch "pexpect.*spawn") {
            throw "Pinned Windows LocalDeployment failure changed: '$($evidence.fatal_error.message)'."
          }

          Write-Host "Confirmed pinned SWE-ReX revision remains unsupported for native Windows LocalDeployment via the documented pexpect.spawn failure."
          exit 0
      - name: Upload local evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "swe-rex-local-${{ runner.os }}"
          path: |
            swe-rex-local-${{ runner.os }}.json
            swe-rex-canonical-local-${{ runner.os }}.json
          if-no-files-found: warn

  docker-runtime:
    name: docker-runtime (docker)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    env:
      ISSUE861_SWEREX_IMAGE: issue861-swerex:5c995c365dfb1fd5bc56fda688be5d8538f9931f
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform, pinned SWE-ReX revision and remote-runtime dependency
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
          "aiohttp>=3.11,<4"
      - name: Build pinned SWE-ReX server image
        shell: bash
        run: |
          cat > /tmp/issue861-swe-rex.Dockerfile <<'EOF'
          FROM python:3.11-slim
          ARG SWE_REX_REVISION
          RUN python -m pip install --no-cache-dir \
              "https://github.com/SWE-agent/SWE-ReX/archive/${SWE_REX_REVISION}.zip"
          RUN swerex-remote --version
          EOF
          docker build \
            --build-arg SWE_REX_REVISION=5c995c365dfb1fd5bc56fda688be5d8538f9931f \
            --tag "$ISSUE861_SWEREX_IMAGE" \
            --file /tmp/issue861-swe-rex.Dockerfile \
            .
          docker image inspect "$ISSUE861_SWEREX_IMAGE" --format '{{.Id}}'
      - name: Run Docker runtime evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_live.py
          --backend docker
          --output swe-rex-docker.json
      - name: Run canonical Executor bridge evidence
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: >-
          python scripts/benchmarks/issue861_swe_rex_canonical.py
          --backend docker
          --output swe-rex-canonical-docker.json
      - name: Upload Docker evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swe-rex-docker
          path: |
            swe-rex-docker.json
            swe-rex-canonical-docker.json
          if-no-files-found: warn

  remote-loopback:
    name: remote-loopback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform, pinned SWE-ReX revision and remote-runtime dependency
        run: >-
          python -m pip install
          -e .
          "git+https://github.com/SWE-agent/SWE-ReX.git@5c995c365dfb1fd5bc56fda688be5d8538f9931f"
          "aiohttp>=3.11,<4"
      - name: Run remote loopback evidence
        run: >-
          python scripts/benchmarks/issue861_swe_rex_remote.py
          --output swe-rex-remote-loopback.json
      - name: Upload remote evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swe-rex-remote-loopback
          path: swe-rex-remote-loopback.json
          if-no-files-found: warn
