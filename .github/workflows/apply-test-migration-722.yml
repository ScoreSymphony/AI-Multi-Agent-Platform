name: Apply Test Migration 722

on:
  push:
    branches:
      - test/722-final-rest-migration
    paths:
      - scripts/ci/apply_test_migration_722.py
      - .github/workflows/apply-test-migration-722.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply safe migration plan
        run: python scripts/ci/apply_test_migration_722.py
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Post-move inventory
        run: python scripts/ci/report_test_inventory.py
      - name: Verify complete collection
        run: python -m pytest --collect-only -q
      - name: Verify full pytest
        run: python -m pytest
      - name: Verify Ruff lint
        run: >-
          python -m ruff check .
          --exclude scripts/ci/apply_test_migration_722.py
          --exclude scripts/ci/plan_test_migration_722.py
      - name: Verify Ruff formatting
        run: >-
          python -m ruff format --check .
          --exclude scripts/ci/apply_test_migration_722.py
          --exclude scripts/ci/plan_test_migration_722.py
      - name: Commit verified migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add -A
          git commit -m "test: migrate final safe #722 rest cohort"
          git push origin HEAD:test/722-final-rest-migration
