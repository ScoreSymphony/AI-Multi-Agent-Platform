name: Apply Test Migration 722
# Current-main baseline after the merged #892 cohorts: 3780 collected tests.

on:
  push:
    branches:
      - test/722-final-rest-migration
    paths:
      - scripts/ci/apply_test_migration_722.py
      - scripts/ci/apply_test_migration_722_residual.py
      - .github/workflows/apply-test-migration-722.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply safe migration plan
        run: python scripts/ci/apply_test_migration_722.py
      - name: Apply explicit residual migration
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/ci")
          import apply_test_migration_722_residual as residual

          mapping = residual.apply_whole_moves()
          residual.rewrite_exact_paths(mapping)
          residual.apply_splits()

          issue_named = sorted(Path("tests").rglob("test_issue*.py"))
          root_tests = sorted(Path("tests").glob("test_*.py"))
          historical_suffix = re.compile(r"_(?:568|650|651|653|654|655|656|657|658|722)$")
          historical_other = sorted(
              path
              for path in Path("tests").rglob("test_*.py")
              if re.match(r"^test_pr[_-]?\d+", path.stem)
              or historical_suffix.search(path.stem)
          )
          if issue_named or root_tests or historical_other:
              problems = [
                  *(f"issue-name: {path.as_posix()}" for path in issue_named),
                  *(f"root-level: {path.as_posix()}" for path in root_tests),
                  *(f"historical-name: {path.as_posix()}" for path in historical_other),
              ]
              raise SystemExit("Historical test-layout residuals remain:\n" + "\n".join(problems))

          print(f"Moved {len(mapping)} residual whole modules")
          print(f"Split {len(residual.SPLITS)} mixed historical modules")
          print("Historical issue/PR test naming residual: 0")
          print("Root-level test modules: 0")
          PY
      - name: Reconcile split exact-path references
        run: |
          python - <<'PY'
          from pathlib import Path

          gate = Path("src/ai_multi_agent_platform/acceptance/gate.py")
          text = gate.read_text(encoding="utf-8")
          old = '_pytest("tests/test_issue_251_lifecycle_commands.py")'
          new = '''_pytest(
                      "tests/integration/memory/test_memory_lifecycle_commands.py",
                      "tests/integration/knowledge/test_knowledge_lifecycle_commands.py",
                  )'''
          if old not in text:
              raise SystemExit("Expected #251 acceptance path was not found")
          gate.write_text(text.replace(old, new), encoding="utf-8")

          acceptance = Path("docs/PROTOTYPE_ACCEPTANCE.md")
          text = acceptance.read_text(encoding="utf-8")
          text = text.replace(
              "`test_issue_251_lifecycle_commands.py`",
              "`tests/integration/memory/test_memory_lifecycle_commands.py` + "
              "`tests/integration/knowledge/test_knowledge_lifecycle_commands.py`",
          )
          acceptance.write_text(text, encoding="utf-8")
          PY
      - name: Finalize migration manifest
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts/ci")
          import apply_test_migration_722_residual as residual

          manifest = Path("docs/TEST_MIGRATION_722_FINAL.md")
          text = manifest.read_text(encoding="utf-8").rstrip()
          lines = [
              "",
              "## Final residual resolution",
              "",
              f"- Explicit whole-file moves/renames: {len(residual.WHOLE_MOVES)}",
              f"- Mixed historical modules split: {len(residual.SPLITS)}",
              "- Final root-level ordinary test modules: 0",
              "- Final issue-numbered test modules: 0",
              "- Intentional numeric filenames: Hermes v0.21.1 upstream-version tests only",
              "",
              "### Explicit residual move map",
              "",
          ]
          lines.extend(
              f"- `{source}` → `{destination}`"
              for source, destination in sorted(residual.WHOLE_MOVES.items())
          )
          lines.extend(["", "### Mixed-file split map", ""])
          for source, spec in sorted(residual.SPLITS.items()):
              destinations = ", ".join(f"`{path}`" for path in sorted(spec["groups"]))
              lines.append(f"- `{source}` → {destinations}")
          manifest.write_text(text + "\n" + "\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Install project test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Normalize generated split modules
        run: |
          python -m ruff check tests --fix
          python -m ruff format tests
      - name: Post-move inventory
        run: python scripts/ci/report_test_inventory.py
      - name: Verify active exact-path references
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (Path(".github"), Path("src"), Path("scripts"), Path("docs"))
          excluded = {
              Path("docs/TEST_MIGRATION_722_FINAL.md"),
              Path(".github/workflows/apply-test-migration-722.yml"),
              Path("scripts/ci/apply_test_migration_722_residual.py"),
          }
          stale = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("*"):
                  if not path.is_file() or path in excluded:
                      continue
                  if path.parts[:2] == ("docs", "history"):
                      continue
                  if path.parts[:2] == ("docs", "reconciliations"):
                      continue
                  try:
                      text = path.read_text(encoding="utf-8")
                  except UnicodeDecodeError:
                      continue
                  if "tests/test_issue" in text:
                      stale.append(path.as_posix())
          if stale:
              raise SystemExit("Stale active issue-path references remain:\n" + "\n".join(stale))
          PY
      - name: Verify complete collection count
        run: |
          python -m pytest --collect-only -q | tee /tmp/collection.txt
          count=$(awk -F': ' '/\.py: [0-9]+$/{sum+=$2} END{print sum+0}' /tmp/collection.txt)
          echo "Collected tests: ${count}"
          test "${count}" = "3780"
      - name: Verify full pytest
        run: python -m pytest
      - name: Remove temporary migration machinery
        run: |
          git rm \
            scripts/ci/apply_test_migration_722.py \
            scripts/ci/apply_test_migration_722_residual.py \
            scripts/ci/plan_test_migration_722.py \
            scripts/ci/report_test_inventory.py \
            .github/workflows/apply-test-migration-722.yml \
            .github/workflows/test-migration-audit.yml \
            .github/workflows/test-migration-plan.yml
      - name: Verify Ruff lint
        run: python -m ruff check .
      - name: Verify Ruff formatting
        run: python -m ruff format --check .
      - name: Commit verified final migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes to commit"
            exit 0
          fi
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add -A
          git commit -m "test: complete final #722 test migration"
          git push origin HEAD:test/722-final-rest-migration
