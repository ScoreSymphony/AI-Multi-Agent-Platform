name: Issue 10 Post-Merge Lint Fix

on:
  push:
    branches: [fix/issue-10-post-merge-ci]

permissions:
  contents: write

jobs:
  lint-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-10-post-merge-ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Fix lint findings
        shell: bash
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/control_plane/service.py \
            tests/test_control_plane.py
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/control_plane/openapi.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              '            "later_domains": "register new Control Plane paths only when their canonical domain exists",\n',
              '            "later_domains": (\n'
              '                "register new Control Plane paths only when their canonical domain exists"\n'
              '            ),\n',
          )
          text = text.replace(
              '            "description": "Exact canonical-field filter; replace field with a resource field name.",\n',
              '            "description": (\n'
              '                "Exact canonical-field filter; replace field with a resource field name."\n'
              '            ),\n',
          )
          path.write_text(text, encoding="utf-8")
          PY
          ruff format \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            tests/test_control_plane.py
          ruff check \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            tests/test_control_plane.py
      - name: Commit lint fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            tests/test_control_plane.py
          git commit -m "fix(ci): satisfy post-merge lint" || exit 0
          git push origin HEAD:fix/issue-10-post-merge-ci
