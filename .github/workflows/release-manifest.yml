name: Release manifest
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact full Git commit SHA to bind the release candidate to
        required: true
        type: string
      generation_input:
        description: Repository path to reviewed release generation-input JSON
        required: true
        type: string
      release_created_at:
        description: RFC3339 timestamp to record in the deterministic release manifest
        required: true
        type: string
permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Prepare release evidence paths
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir .release-evidence/dist
          python - <<'PY'
          from pathlib import Path
          wheels = sorted(Path('.release-evidence/dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'expected exactly one wheel, found {len(wheels)}')
          target = Path('.release-evidence/platform.whl')
          target.parent.mkdir(parents=True, exist_ok=True)
          wheels[0].replace(target)
          PY
          python -m venv .release-evidence/runtime-venv
          .release-evidence/runtime-venv/bin/python -m pip install --upgrade pip
          .release-evidence/runtime-venv/bin/python -m pip install .
          .release-evidence/runtime-venv/bin/python -m pip freeze --all > .release-evidence/python-resolved.txt
          python scripts/release/python_declared_dependencies.py pyproject.toml .release-evidence/python-declared.txt
          created_at="$(git show -s --format=%cI "${{ inputs.source_commit }}")"
          python scripts/release/generate_supply_chain_evidence.py \
            --source-commit "${{ inputs.source_commit }}" \
            --created-at "$created_at" \
            --pyproject pyproject.toml \
            --python-declared .release-evidence/python-declared.txt \
            --python-resolved .release-evidence/python-resolved.txt \
            --frontend-lock frontend/package-lock.json \
            --sbom-output .release-evidence/sbom.spdx.json
          python -m pip install .
      - name: Attest wheel build provenance
        id: provenance_attestation
        uses: actions/attest@v4
        with:
          subject-path: .release-evidence/platform.whl
      - name: Attest wheel SBOM
        id: sbom_attestation
        uses: actions/attest@v4
        with:
          subject-path: .release-evidence/platform.whl
          sbom-path: .release-evidence/sbom.spdx.json
      - name: Resolve signed release evidence
        shell: bash
        env:
          PROVENANCE_ATTESTATION_URL: ${{ steps.provenance_attestation.outputs.attestation-url }}
          PROVENANCE_BUNDLE_PATH: ${{ steps.provenance_attestation.outputs.bundle-path }}
          SBOM_ATTESTATION_URL: ${{ steps.sbom_attestation.outputs.attestation-url }}
          SBOM_BUNDLE_PATH: ${{ steps.sbom_attestation.outputs.bundle-path }}
          RELEASE_CREATED_AT: ${{ inputs.release_created_at }}
        run: |
          set -euo pipefail
          cp "$PROVENANCE_BUNDLE_PATH" .release-evidence/build-provenance.attestation.json
          cp "$SBOM_BUNDLE_PATH" .release-evidence/sbom.attestation.json
          python - "${{ inputs.generation_input }}" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          document = json.loads(source.read_text(encoding="utf-8"))
          provenance_url = os.environ["PROVENANCE_ATTESTATION_URL"]
          sbom_url = os.environ["SBOM_ATTESTATION_URL"]
          if not provenance_url.startswith("https://github.com/"):
              raise SystemExit("provenance attestation URL is not a GitHub HTTPS reference")
          if not sbom_url.startswith("https://github.com/"):
              raise SystemExit("SBOM attestation URL is not a GitHub HTTPS reference")
          document["provenance_ref"] = provenance_url
          document["sbom_ref"] = sbom_url
          if document.get("created_at") != "REPLACE_WITH_RELEASE_CREATED_AT":
              raise SystemExit("release generation input must use the reviewed created_at placeholder")
          document["created_at"] = os.environ["RELEASE_CREATED_AT"]
          output = Path(".release-evidence/generation-input.resolved.json")
          output.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY
          sha256sum \
            .release-evidence/platform.whl \
            .release-evidence/sbom.spdx.json \
            .release-evidence/build-provenance.attestation.json \
            .release-evidence/sbom.attestation.json \
            .release-evidence/python-declared.txt \
            .release-evidence/python-resolved.txt \
            frontend/package-lock.json \
            > .release-evidence/SHA256SUMS
      - name: Validate declared dependency evidence binding
        shell: bash
        run: |
          set -euo pipefail
          python - "${{ inputs.generation_input }}" <<'PY'
          import json
          import sys
          from pathlib import Path

          input_path = Path(sys.argv[1])
          document = json.loads(input_path.read_text(encoding="utf-8"))
          dependency_sets = document.get("dependency_sets", [])
          matches = [
              item
              for item in dependency_sets
              if isinstance(item, dict)
              and item.get("name") == "python-declared"
              and item.get("ecosystem") == "python"
              and item.get("kind") == "declared_set"
          ]
          if len(matches) != 1:
              raise SystemExit(
                  "release generation input must bind exactly one python-declared declared_set"
              )
          configured = (input_path.parent / matches[0].get("path", "")).resolve()
          expected = Path(".release-evidence/python-declared.txt").resolve()
          if configured != expected:
              raise SystemExit(
                  "python-declared dependency set must reference "
                  ".release-evidence/python-declared.txt"
              )
          PY
      - name: Generate and validate manifest
        shell: bash
        run: |
          set -euo pipefail
          platform-release generate --source-commit "${{ inputs.source_commit }}" --input .release-evidence/generation-input.resolved.json --inventory release/compatibility.json --output release-manifest.json --json > release-manifest.generated.json
          platform-release validate --manifest release-manifest.json --json > release-manifest.validation.json
          sha256sum release-manifest.json > release-manifest.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: release-manifest-${{ inputs.source_commit }}
          if-no-files-found: error
          path: |
            release-manifest.json
            release-manifest.sha256
            release-manifest.generated.json
            release-manifest.validation.json
            .release-evidence/platform.whl
            .release-evidence/sbom.spdx.json
            .release-evidence/build-provenance.attestation.json
            .release-evidence/sbom.attestation.json
            .release-evidence/generation-input.resolved.json
            .release-evidence/SHA256SUMS
            .release-evidence/python-declared.txt
            .release-evidence/python-resolved.txt
