name: Apply issue 11 completion hardening

on:
  push:
    branches: [fix/issue-11-completion-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-11-completion-hardening
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply hardening patch
        run: python scripts/issue11_hardening_apply.py
      - name: Verify issue 11 hardening
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format src/ai_multi_agent_platform/adapters/litellm.py src/ai_multi_agent_platform/adapters/__init__.py tests/test_issue_11_litellm_adapter.py tests/test_issue_11_completion_hardening.py
          ruff check src/ai_multi_agent_platform/adapters/litellm.py src/ai_multi_agent_platform/adapters/__init__.py tests/test_issue_11_litellm_adapter.py tests/test_issue_11_completion_hardening.py
          mypy
          pytest tests/test_issue_11_litellm_adapter.py tests/test_issue_11_litellm_routing.py tests/test_issue_11_completion_hardening.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete issue 11 configuration and dependency semantics"
          git push origin HEAD:fix/issue-11-completion-hardening
