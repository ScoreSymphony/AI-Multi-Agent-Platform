- Library mode forwards the configured non-negative `max_retries` as LiteLLM `num_retries`; `0` is the local-first default. Request/control-plane timeouts still override the provider default timeout.
- Proxy mode does not add a second retry engine. Retry/load-balancing behavior inside a separately deployed LiteLLM Proxy is deployment-owned and must not bypass the platform's canonical route selection.
- LiteLLM Router fallbacks remain intentionally disabled in this baseline. Provider fallbacks are therefore not silently enabled by adapter configuration.
- `telemetry_mode=platform_only` emits only the platform-owned namespaced adapter metadata already subject to platform redaction. `disabled` suppresses LiteLLM-specific per-request/error metadata. The adapter does not enable LiteLLM global callbacks or provider-native logging/telemetry.
