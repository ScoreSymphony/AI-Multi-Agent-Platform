def test_committed_examples_parse_through_runtime_config_contract() -> None:
    config_file = Path(__file__).parents[1] / "config" / "litellm.example.json"
    examples = json.loads(config_file.read_text())

    library = LiteLLMProviderConfig.from_mapping(examples["library_local_example"])
    proxy = LiteLLMProviderConfig.from_mapping(examples["proxy_local_example"])

    assert library.mode is LiteLLMMode.LIBRARY
    assert library.max_retries == 0
    assert library.telemetry_mode is LiteLLMTelemetryMode.PLATFORM_ONLY
    assert proxy.mode is LiteLLMMode.PROXY
    assert proxy.base_url == "http://127.0.0.1:4000/v1"


def test_library_retry_configuration_is_forwarded_explicitly() -> None:
    captured: dict[str, object] = {}

    async def completion(**kwargs: object) -> object:
        captured.update(kwargs)
        return {
            "choices": [
                {
                    "message": {"role": "assistant", "content": "ok"},
                    "finish_reason": "stop",
                }
            ]
        }

    provider = make_library_provider(completion=completion, max_retries=3)
    asyncio.run(
        provider.generate(
            ModelRequest(
                request_id="req-litellm-retries",
                messages=("hello",),
                context=CTX,
                requirements={"model_config_id": "model-local-coder"},
            )
        )
    )

    assert captured["num_retries"] == 3


def test_telemetry_disabled_suppresses_litellm_request_metadata() -> None:
    async def completion(**kwargs: object) -> object:
        del kwargs
        return {
            "choices": [
                {
                    "message": {"role": "assistant", "content": "ok"},
                    "finish_reason": "stop",
                }
            ]
        }

    provider = make_library_provider(
        completion=completion,
        telemetry_mode=LiteLLMTelemetryMode.DISABLED,
    )
    response = asyncio.run(
        provider.generate(
            ModelRequest(
                request_id="req-litellm-no-telemetry",
                messages=("hello",),
                context=CTX,
                requirements={"model_config_id": "model-local-coder"},
            )
        )
    )

    assert {item.namespace for item in response.adapter_metadata} == {"model-protocol"}
    descriptor_values = provider.descriptor.adapter_metadata[0].values
    assert descriptor_values["telemetry_mode"] == "disabled"


