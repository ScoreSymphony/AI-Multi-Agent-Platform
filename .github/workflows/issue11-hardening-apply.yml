name: Apply issue 11 completion hardening

on:
  push:
    branches: [fix/issue-11-completion-hardening]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-11-completion-hardening
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract and apply hardening patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          workflow_path = ".github/workflows/issue11-hardening-apply.yml"
          previous = subprocess.check_output(
              ["git", "show", f"HEAD^:{workflow_path}"],
              text=True,
          )
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n      - name: Verify issue 11 hardening"
          start = previous.index(start_marker) + len(start_marker)
          end = previous.index(end_marker, start)
          block = previous[start:end]
          lines = block.splitlines()
          script = "\n".join(
              line[10:] if line.startswith("          ") else line for line in lines
          ) + "\n"
          payload = Path("/tmp/issue11_hardening.py")
          payload.write_text(script)
          subprocess.run([sys.executable, str(payload)], check=True)
          PY
      - name: Verify issue 11 hardening
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format src/ai_multi_agent_platform/adapters/litellm.py src/ai_multi_agent_platform/adapters/__init__.py tests/test_issue_11_litellm_adapter.py tests/test_issue_11_litellm_routing.py
          ruff check src/ai_multi_agent_platform/adapters/litellm.py src/ai_multi_agent_platform/adapters/__init__.py tests/test_issue_11_litellm_adapter.py tests/test_issue_11_litellm_routing.py
          mypy
          pytest tests/test_issue_11_litellm_adapter.py tests/test_issue_11_litellm_routing.py
      - name: Commit hardening
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete issue 11 configuration and dependency semantics"
          git push origin HEAD:fix/issue-11-completion-hardening
