name: Issue 89 format fix

on:
  push:
    branches: [issue-89-control-plane-ha]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install repository formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format issue 89 files
        run: |
          ruff format \
            src/ai_multi_agent_platform/high_availability \
            src/ai_multi_agent_platform/control_plane/ha_composition.py \
            tests/test_issue_89_control_plane_ha.py \
            tests/test_issue_89_ha_integrations.py
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/high_availability \
            src/ai_multi_agent_platform/control_plane/ha_composition.py \
            tests/test_issue_89_control_plane_ha.py \
            tests/test_issue_89_ha_integrations.py
          git commit -m "chore: apply Ruff formatting to #89"
          git push origin HEAD:issue-89-control-plane-ha
