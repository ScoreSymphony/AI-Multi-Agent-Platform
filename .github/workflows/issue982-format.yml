name: Issue 982 formatter

on:
  push:
    branches:
      - issue/982-explicit-control-plane-composition

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/982-explicit-control-plane-composition
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install matching Ruff
        run: python -m pip install ruff==0.16.7
      - name: Format issue 982 files
        run: |
          ruff format \
            src/ai_multi_agent_platform/control_plane/automation_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/conversation_current_composition.py \
            src/ai_multi_agent_platform/control_plane/extensions.py \
            src/ai_multi_agent_platform/control_plane/notifications_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/plugin_module.py \
            src/ai_multi_agent_platform/control_plane/release_api.py \
            src/ai_multi_agent_platform/control_plane/terminal_module.py \
            src/ai_multi_agent_platform/control_plane/organization_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/task_project_reassignment.py \
            tests/architecture/test_control_plane_explicit_composition.py \
            tests/integration/control_plane/test_conversation_explicit_composition.py \
            tests/unit/control_plane/test_explicit_module_composition.py
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/control_plane \
            tests/architecture/test_control_plane_explicit_composition.py \
            tests/integration/control_plane/test_conversation_explicit_composition.py \
            tests/unit/control_plane/test_explicit_module_composition.py
          git commit -m 'Format explicit control plane composition'
          git push origin HEAD:issue/982-explicit-control-plane-composition
