name: Onboarding regression

on:
  push:
    branches: [main]
    paths:
      - "src/ai_multi_agent_platform/onboarding/**"
      - "src/ai_multi_agent_platform/adapters/onboarding_openai_compatible.py"
      - "src/ai_multi_agent_platform/models/**"
      - "tests/test_issue_250*.py"
      - ".github/workflows/onboarding-regression.yml"
  pull_request:
    paths:
      - "src/ai_multi_agent_platform/onboarding/**"
      - "src/ai_multi_agent_platform/adapters/onboarding_openai_compatible.py"
      - "src/ai_multi_agent_platform/models/**"
      - "tests/test_issue_250*.py"
      - ".github/workflows/onboarding-regression.yml"

jobs:
  onboarding-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run first-run onboarding regressions
        run: pytest -q tests/test_issue_250*.py
