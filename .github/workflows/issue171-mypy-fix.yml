name: Issue 171 temporary mypy fixer

on:
  push:
    branches:
      - issue-171-runtime-hardening

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    if: github.repository == 'ScoreSymphony/AI-Multi-Agent-Platform'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-171-runtime-hardening
      - name: Apply narrow ResourceService annotation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/control_plane/organization_runtime_composition.py')
          text = path.read_text()
          old = '''        if self._organization_service is None:\n            from ai_multi_agent_platform.accounting.control_plane import (\n'''
          new = '''        services: dict[str, ResourceService]\n        if self._organization_service is None:\n            from ai_multi_agent_platform.accounting.control_plane import (\n'''
          if old not in text:
              raise SystemExit('expected accounting composition block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/issue171-mypy-fix.yml
      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/control_plane/organization_runtime_composition.py
          git commit -m 'fix(accounting): type shared resource-service composition'
          git push origin HEAD:issue-171-runtime-hardening
