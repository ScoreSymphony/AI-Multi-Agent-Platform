name: Apply evaluation scope integration fix

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/apply-evaluation-scope-integration.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply project-aware evaluation isolation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workspace = Path('src/ai_multi_agent_platform/evaluation/workspace.py')
          text = workspace.read_text()
          text = text.replace(
              'import asyncio\nfrom dataclasses import dataclass\nfrom typing import Protocol\n',
              'import asyncio\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\nfrom typing import Protocol\n',
              1,
          )
          old = '''        actor_ref: str | None = None,\n        fixture_resolver: EvaluationFixtureResolver | None = None,\n    ) -> None:\n'''
          new = '''        actor_ref: str | None = None,\n        fixture_resolver: EvaluationFixtureResolver | None = None,\n        project_resolver: Callable[[EvaluationCase], str] | None = None,\n    ) -> None:\n'''
          if old not in text:
              raise SystemExit('WorkspaceEvaluationIsolation constructor anchor missing')
          text = text.replace(old, new, 1)
          old = '''        self._fixture_resolver = fixture_resolver\n        self._active: dict[str, EvaluationExecutionContext] = {}\n'''
          new = '''        self._fixture_resolver = fixture_resolver\n        self._project_resolver = project_resolver\n        self._active: dict[str, EvaluationExecutionContext] = {}\n'''
          if old not in text:
              raise SystemExit('WorkspaceEvaluationIsolation state anchor missing')
          text = text.replace(old, new, 1)
          old = '''    def _data_context(self, attempt: EvaluationAttempt) -> DataAccessContext:\n        return DataAccessContext(\n            operation=OperationContext(\n                correlation_id=attempt.attempt_id,\n                causation_id=attempt.evaluation_run_id,\n                owner_type=self._owner_ref.type,\n                owner_id=self._owner_ref.id,\n                project_id=self._project_id,\n            ),\n            actor_ref=self._actor_ref,\n        )\n'''
          new = '''    def _project_for(self, case: EvaluationCase) -> str:\n        project_id = (\n            self._project_resolver(case)\n            if self._project_resolver is not None\n            else self._project_id\n        )\n        if not project_id.strip():\n            raise ValueError("evaluation workspace project_id must not be blank")\n        return project_id\n\n    def _data_context(\n        self,\n        attempt: EvaluationAttempt,\n        *,\n        project_id: str,\n    ) -> DataAccessContext:\n        return DataAccessContext(\n            operation=OperationContext(\n                correlation_id=attempt.attempt_id,\n                causation_id=attempt.evaluation_run_id,\n                owner_type=self._owner_ref.type,\n                owner_id=self._owner_ref.id,\n                project_id=project_id,\n            ),\n            actor_ref=self._actor_ref,\n        )\n'''
          if old not in text:
              raise SystemExit('WorkspaceEvaluationIsolation data context anchor missing')
          text = text.replace(old, new, 1)
          old = '''        fixtures = await self._fixtures(case=case, attempt=attempt)\n        data_context = self._data_context(attempt)\n        workspace = await self._workspace_provider.create_workspace(\n            project_id=self._project_id,\n'''
          new = '''        project_id = self._project_for(case)\n        fixtures = await self._fixtures(case=case, attempt=attempt)\n        data_context = self._data_context(attempt, project_id=project_id)\n        workspace = await self._workspace_provider.create_workspace(\n            project_id=project_id,\n'''
          if old not in text:
              raise SystemExit('WorkspaceEvaluationIsolation setup anchor missing')
          text = text.replace(old, new, 1)
          old = '''            attempt_id=attempt.attempt_id,\n            project_id=self._project_id,\n'''
          new = '''            attempt_id=attempt.attempt_id,\n            project_id=project_id,\n'''
          if old not in text:
              raise SystemExit('WorkspaceEvaluationIsolation execution context anchor missing')
          workspace.write_text(text.replace(old, new, 1))

          product = Path('src/ai_multi_agent_platform/evaluation/product.py')
          text = product.read_text()
          old = 'from collections.abc import Iterable, Mapping\n'
          new = 'from collections.abc import Callable, Iterable, Mapping\n'
          if old not in text:
              raise SystemExit('evaluation product imports anchor missing')
          text = text.replace(old, new, 1)
          old = '''        project_id: str,\n        owner_ref: OwnerRef,\n    ) -> None:\n        self._root = Path(fixture_root)\n        self._files = files\n        self._project_id = project_id\n        self._owner_ref = owner_ref\n'''
          new = '''        project_id: str,\n        owner_ref: OwnerRef,\n        project_resolver: Callable[[EvaluationCase], str] | None = None,\n    ) -> None:\n        self._root = Path(fixture_root)\n        self._files = files\n        self._project_id = project_id\n        self._owner_ref = owner_ref\n        self._project_resolver = project_resolver\n'''
          if old not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver constructor anchor missing')
          text = text.replace(old, new, 1)
          old = '''    ) -> ResolvedEvaluationFixtures:\n        workspace_files: list[WorkspaceFile] = []\n'''
          new = '''    ) -> ResolvedEvaluationFixtures:\n        project_id = self._project_for(case)\n        workspace_files: list[WorkspaceFile] = []\n'''
          if old not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver resolve anchor missing')
          text = text.replace(old, new, 1)
          old = '''                    attempt=attempt,\n                    content_type=mimetypes.guess_type(relative_path)[0],\n'''
          new = '''                    attempt=attempt,\n                    project_id=project_id,\n                    content_type=mimetypes.guess_type(relative_path)[0],\n'''
          if old not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver file call anchor missing')
          text = text.replace(old, new, 1)
          anchor = '''    def _fixture_directory(self, fixture_id: str) -> Path:\n'''
          helper = '''    def _project_for(self, case: EvaluationCase) -> str:\n        project_id = (\n            self._project_resolver(case)\n            if self._project_resolver is not None\n            else self._project_id\n        )\n        if not project_id.strip():\n            raise ValueError("evaluation fixture project_id must not be blank")\n        return project_id\n\n'''
          if anchor not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver helper anchor missing')
          text = text.replace(anchor, helper + anchor, 1)
          old = '''        data: bytes,\n        attempt: EvaluationAttempt,\n        content_type: str | None,\n'''
          new = '''        data: bytes,\n        attempt: EvaluationAttempt,\n        project_id: str,\n        content_type: str | None,\n'''
          if old not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver canonical file signature anchor missing')
          text = text.replace(old, new, 1)
          old = '''                owner_type=self._owner_ref.type,\n                owner_id=self._owner_ref.id,\n                project_id=self._project_id,\n'''
          new = '''                owner_type=self._owner_ref.type,\n                owner_id=self._owner_ref.id,\n                project_id=project_id,\n'''
          if old not in text:
              raise SystemExit('DirectoryEvaluationFixtureResolver canonical file project anchor missing')
          product.write_text(text.replace(old, new, 1))

          composition = Path('src/ai_multi_agent_platform/evaluation/single_node.py')
          text = composition.read_text()
          old = '''    evaluation_task_metadata,\n    load_evaluation_assets,\n)\n'''
          new = '''    evaluation_task_metadata,\n    load_evaluation_assets,\n    parse_agent_evaluation_target,\n)\n'''
          if old not in text:
              raise SystemExit('single-node evaluation product import anchor missing')
          text = text.replace(old, new, 1)
          old = '''    owner_ref = OwnerRef(type="service", id=_SINGLE_NODE_EVALUATION_OWNER)\n    repository = SqliteEvaluationRepository(database_path)\n'''
          new = '''    owner_ref = OwnerRef(type="service", id=_SINGLE_NODE_EVALUATION_OWNER)\n\n    def evaluation_project_for_case(case: EvaluationCase) -> str:\n        target = parse_agent_evaluation_target(case)\n        if target is None:\n            return project_id\n        revision = agents.get_agent_revision(target.agent_id, target.agent_revision)\n        if revision.workspace_id is not None:\n            raise ValueError(\n                "workspace-scoped Agent evaluation targets cannot be rebound to a fresh "\n                "isolated evaluation Workspace"\n            )\n        return revision.project_id or project_id\n\n    repository = SqliteEvaluationRepository(database_path)\n'''
          if old not in text:
              raise SystemExit('single-node evaluation project resolver anchor missing')
          text = text.replace(old, new, 1)
          old = '''        project_id=project_id,\n        owner_ref=owner_ref,\n    )\n    isolation = WorkspaceEvaluationIsolation(\n        workspace_provider=workspaces,\n        project_id=project_id,\n        owner_ref=owner_ref,\n        actor_ref=f"service:{_SINGLE_NODE_EVALUATION_OWNER}",\n        fixture_resolver=fixture_resolver,\n    )\n'''
          new = '''        project_id=project_id,\n        owner_ref=owner_ref,\n        project_resolver=evaluation_project_for_case,\n    )\n    isolation = WorkspaceEvaluationIsolation(\n        workspace_provider=workspaces,\n        project_id=project_id,\n        owner_ref=owner_ref,\n        actor_ref=f"service:{_SINGLE_NODE_EVALUATION_OWNER}",\n        fixture_resolver=fixture_resolver,\n        project_resolver=evaluation_project_for_case,\n    )\n'''
          if old not in text:
              raise SystemExit('single-node evaluation isolation composition anchor missing')
          text = text.replace(old, new, 1)
          old = '''        owner_id=_SINGLE_NODE_EVALUATION_OWNER,\n        project_id=project_id,\n        source="single-node-evaluation",\n'''
          new = '''        owner_id=_SINGLE_NODE_EVALUATION_OWNER,\n        project_id=None,\n        source="single-node-evaluation",\n'''
          if old not in text:
              raise SystemExit('single-node evaluation kernel project anchor missing')
          composition.write_text(text.replace(old, new, 1))

          deployment = Path('src/ai_multi_agent_platform/deployment/single_node.py')
          text = deployment.read_text()
          old_actions = '''                        AuthorizationAction.EXECUTE,\n                        AuthorizationAction.READ,\n                        AuthorizationAction.MODIFY,\n'''
          new_actions = '''                        AuthorizationAction.EXECUTE,\n                        AuthorizationAction.READ,\n                        AuthorizationAction.VIEW,\n                        AuthorizationAction.MODIFY,\n'''
          if old_actions not in text:
              raise SystemExit('evaluation action policy anchor missing')
          text = text.replace(old_actions, new_actions, 1)
          old_resources = '                resource_types=frozenset({ResourceType.RUN}),\n'
          new_resources = '''                resource_types=frozenset(\n                    {\n                        ResourceType.RUN,\n                        ResourceType.TASK,\n                        ResourceType.AGENT,\n                        ResourceType.FILE,\n                        ResourceType.MEMORY,\n                    }\n                ),\n'''
          if old_resources not in text:
              raise SystemExit('evaluation resource policy anchor missing')
          deployment.write_text(text.replace(old_resources, new_resources, 1))

          test = Path('tests/test_issue_19_product_completion.py')
          text = test.read_text()
          workspace_block = '''        workspace = first.scopes.create_workspace(\n            key="issue-19-target-workspace",\n            project_id=project.id,\n        )\n'''
          if workspace_block not in text:
              raise SystemExit('issue 19 target Workspace setup anchor missing')
          text = text.replace(workspace_block, '', 1)
          old = '''            project_id=project.id,\n            workspace_id=workspace.id,\n            name="Evaluation Target Assistant",\n'''
          new = '''            project_id=project.id,\n            workspace_id=None,\n            name="Evaluation Target Assistant",\n'''
          if old not in text:
              raise SystemExit('issue 19 target Agent scope anchor missing')
          test.write_text(text.replace(old, new, 1))
          PY
      - name: Validate scope integration with final actor normalization
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          lifecycle = Path('src/ai_multi_agent_platform/context/lifecycle.py')
          text = lifecycle.read_text()
          old = '    return ActorIdentity(context.owner_id, actor_type)\n'
          new = '''    actor_ref = context.owner_id\n    if ":" not in actor_ref and not actor_ref.startswith(f"{context.owner_type}_"):\n        actor_ref = f"{context.owner_type}:{actor_ref}"\n    return ActorIdentity(actor_ref, actor_type)\n'''
          if old not in text:
              raise SystemExit('actor normalization anchor missing')
          lifecycle.write_text(text.replace(old, new, 1))
          PY
          ruff format src/ai_multi_agent_platform/evaluation/workspace.py src/ai_multi_agent_platform/evaluation/product.py src/ai_multi_agent_platform/evaluation/single_node.py src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/context/lifecycle.py tests/test_issue_19_product_completion.py
          ruff check src/ai_multi_agent_platform/evaluation/workspace.py src/ai_multi_agent_platform/evaluation/product.py src/ai_multi_agent_platform/evaluation/single_node.py src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/context/lifecycle.py tests/test_issue_19_product_completion.py
          mypy src/ai_multi_agent_platform/evaluation src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/context/lifecycle.py
          pytest -q tests/test_evaluation_workspace_isolation.py tests/test_issue_19_product_completion.py::test_agent_model_target_runs_through_product_evaluation_and_server_snapshot
          git checkout -- src/ai_multi_agent_platform/context/lifecycle.py
      - name: Commit scope integration and trigger final fixes
        shell: bash
        run: |
          printf '\n# Re-run after project-aware evaluation scope integration.\n' >> .github/workflows/apply-final-integration-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/evaluation/workspace.py \
            src/ai_multi_agent_platform/evaluation/product.py \
            src/ai_multi_agent_platform/evaluation/single_node.py \
            src/ai_multi_agent_platform/deployment/single_node.py \
            tests/test_issue_19_product_completion.py \
            .github/workflows/apply-final-integration-fixes.yml
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No scope integration changes to commit"
            exit 0
          fi
          git commit -m "fix: preserve project scope in isolated evaluation targets"
          git push origin HEAD:integration/active-branches-2026-09-08
