name: Temporary issue 651 test integration fix

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fix and validate issue 651 test integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_path = Path('tests/test_issue_651_production_handoff_runtime.py')
          text = test_path.read_text()
          old = chr(10).join([
              'from ai_multi_agent_platform.coordination.repository import (',
              '    InMemoryCoordinatorRepository,',
              '    SQLiteCoordinatorRepository,',
              ')',
          ]) + chr(10)
          new = chr(10).join([
              'from ai_multi_agent_platform.coordination.repository import InMemoryCoordinatorRepository',
              'from ai_multi_agent_platform.coordination.sqlite_repository import SQLiteCoordinatorRepository',
          ]) + chr(10)
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one coordinator import block, found {text.count(old)}')
          test_path.write_text(text.replace(old, new))

          pyproject = Path('pyproject.toml')
          config = pyproject.read_text()
          anchor = '  "pytest>=8.3,<10",' + chr(10)
          addition = anchor + '  "pytest-asyncio>=0.24,<2",' + chr(10)
          if 'pytest-asyncio' not in config:
              if config.count(anchor) != 1:
                  raise SystemExit('pytest dependency anchor not found exactly once')
              pyproject.write_text(config.replace(anchor, addition))

          funnel = Path('src/ai_multi_agent_platform/repository_intelligence/context_funnel.py')
          funnel_text = funnel.read_text()
          package_import = '''from ai_multi_agent_platform.context import (
              ContextCandidate,
              ContextDataClassification,
              ContextEntryRole,
              ContextFreshness,
              ContextSourceRef,
              ContextSourceRequest,
              ContextSourceType,
              ContextTrust,
          )'''.replace('          ', '')
          direct_import = '''from ai_multi_agent_platform.context.models import (
              ContextCandidate,
              ContextDataClassification,
              ContextEntryRole,
              ContextFreshness,
              ContextSourceRef,
              ContextSourceType,
              ContextTrust,
          )
          from ai_multi_agent_platform.context.resolver import ContextSourceRequest'''.replace('          ', '')
          if funnel_text.count(package_import) != 1:
              raise SystemExit('context_funnel package import block not found exactly once')
          funnel.write_text(funnel_text.replace(package_import, direct_import))
          PY
          python -m pip install -e '.[dev]'
          ruff format src/ai_multi_agent_platform/repository_intelligence/context_funnel.py tests/test_issue_651_production_handoff_runtime.py
          ruff check src/ai_multi_agent_platform/repository_intelligence/context_funnel.py tests/test_issue_651_production_handoff_runtime.py
          mypy
          pytest tests/test_issue_651_*.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pyproject.toml tests/test_issue_651_production_handoff_runtime.py src/ai_multi_agent_platform/repository_intelligence/context_funnel.py
          git commit -m 'test: fix issue 651 integration dependencies and imports'
          git push origin HEAD:integration/active-branches-2026-09-08
