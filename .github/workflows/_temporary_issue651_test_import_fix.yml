name: Temporary issue 651 test import fix

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Fix and validate issue 651 coordinator import
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_issue_651_production_handoff_runtime.py')
          text = path.read_text()
          old = '''from ai_multi_agent_platform.coordination.repository import (
    InMemoryCoordinatorRepository,
    SQLiteCoordinatorRepository,
)
'''
          new = '''from ai_multi_agent_platform.coordination.repository import InMemoryCoordinatorRepository
from ai_multi_agent_platform.coordination.sqlite_repository import SQLiteCoordinatorRepository
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one coordinator import block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
          ruff format tests/test_issue_651_production_handoff_runtime.py
          ruff check tests/test_issue_651_production_handoff_runtime.py
          mypy tests/test_issue_651_production_handoff_runtime.py
          pytest tests/test_issue_651_production_handoff_runtime.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_issue_651_production_handoff_runtime.py
          git commit -m 'test: fix issue 651 coordinator repository import'
          git push origin HEAD:integration/active-branches-2026-09-08
