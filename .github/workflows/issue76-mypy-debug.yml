name: Issue 76 one-shot type fix

on:
  push:
    branches: [feat/issue-76-accounting-foundation]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-accounting-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply narrow mypy fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          service = Path("src/ai_multi_agent_platform/accounting/service.py")
          text = service.read_text()
          text = text.replace(
              "from ai_multi_agent_platform.observability.models import MetricRecord\n",
              "from ai_multi_agent_platform.contracts.types import JsonValue\n"
              "from ai_multi_agent_platform.observability.models import MetricRecord\n",
              1,
          )
          text = text.replace(
              "    provenance = {\n        \"telemetry_metric\": metric.name,",
              "    provenance: dict[str, JsonValue] = {\n        \"telemetry_metric\": metric.name,",
              1,
          )
          service.write_text(text)

          control_plane = Path("src/ai_multi_agent_platform/accounting/control_plane.py")
          text = control_plane.read_text()
          text = text.replace(
              "def _record_resource(record: UsageRecord) -> dict[str, JsonValue]:\n    return {",
              "def _record_resource(record: UsageRecord) -> dict[str, JsonValue]:\n"
              "    scope: dict[str, JsonValue] = {}\n"
              "    for key, value in record.scope.fields().items():\n"
              "        scope[key] = value\n"
              "    return {",
              1,
          )
          text = text.replace('        "scope": record.scope.fields(),', '        "scope": scope,', 1)
          control_plane.write_text(text)
          PY
          ruff format src/ai_multi_agent_platform/accounting
          ruff check src/ai_multi_agent_platform/accounting
          mypy
      - name: Remove temporary diagnostics and commit fixes
        shell: bash
        run: |
          rm -f issue76-mypy.txt .github/workflows/issue76-mypy-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy strict typing for #76 accounting"
          git push origin HEAD:feat/issue-76-accounting-foundation
