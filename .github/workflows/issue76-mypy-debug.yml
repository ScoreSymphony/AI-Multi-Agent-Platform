name: Issue 76 mypy diagnostics

on:
  push:
    branches: [feat/issue-76-accounting-foundation]

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-accounting-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy diagnostics
        shell: bash
        run: |
          set +e
          mypy > issue76-mypy.txt 2>&1
          status=$?
          echo "exit_code=$status" >> issue76-mypy.txt
          cat issue76-mypy.txt
          exit 0
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue76-mypy.txt
          git commit -m "chore: capture #76 mypy diagnostics"
          git push origin HEAD:feat/issue-76-accounting-foundation
