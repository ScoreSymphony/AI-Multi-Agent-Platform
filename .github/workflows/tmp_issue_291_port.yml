          old_verification_keywords = '''def _verification_keywords(
    resource_type: str,
    resource: Mapping[str, JsonValue],
) -> tuple[str, ...]:
    """Return explicit safe nested Verification metadata, never free-form evidence."""

    values: list[str] = []
