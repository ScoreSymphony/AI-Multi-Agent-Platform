name: Temporary issue 291 port finalizer

on:
  push:
    branches: [feat/issue-291-verification-search]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-291-verification-search
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply issue 291 patch
        run: python scripts/tmp_issue_291_patch.py
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format and lint
        run: |
          ruff format src/ai_multi_agent_platform/security/authorization.py src/ai_multi_agent_platform/verification/control_plane.py src/ai_multi_agent_platform/search/indexing.py tests/test_issue_291_verification_search.py
          ruff check src/ai_multi_agent_platform/security/authorization.py src/ai_multi_agent_platform/verification/control_plane.py src/ai_multi_agent_platform/search/indexing.py tests/test_issue_291_verification_search.py
      - name: Type check
        run: mypy
      - name: Targeted verification search tests
        run: pytest -q tests/test_issue_291_verification_search.py
      - name: Commit finalized issue 291 port
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_issue_291_port.yml scripts/tmp_issue_291_patch.py
          git add -A
          git commit -m "feat: complete privacy-safe verification discovery (#291) [issue-291-patched]"
          git push origin HEAD:feat/issue-291-verification-search
