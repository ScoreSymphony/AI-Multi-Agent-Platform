name: Merge-ready Learning integration

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/merge-ready-learning.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Patch final Learning integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor not found in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1))

          path = "src/ai_multi_agent_platform/learning/control_plane.py"
          replace(
              path,
              "from ai_multi_agent_platform.contracts import ContractError, ErrorCode, JsonValue, OperationContext\n",
              "from ai_multi_agent_platform.contracts import (\n"
              "    ContractError,\n"
              "    ErrorCode,\n"
              "    JsonValue,\n"
              "    OperationContext,\n"
              "    OperationControl,\n"
              ")\n"
              "from ai_multi_agent_platform.contracts.authorization import AuthorizationRequest\n"
              "from ai_multi_agent_platform.contracts.interfaces import AuthorizationProvider\n",
          )
          replace(
              path,
              "    def __init__(self, learning: LearningService) -> None:\n"
              "        self._learning = learning\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del query\n"
              "        return tuple(\n"
              "            _candidate_resource(self._learning, candidate)\n"
              "            for candidate in self._learning.list_candidates()\n"
              "            if _candidate_visible(candidate, context)\n"
              "        )\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        candidate = self._learning.get_candidate(resource_id)\n"
              "        _require_candidate_visible(candidate, context)\n"
              "        return _candidate_resource(self._learning, candidate)\n",
              "    def __init__(\n"
              "        self,\n"
              "        learning: LearningService,\n"
              "        *,\n"
              "        authorization: AuthorizationProvider | None = None,\n"
              "    ) -> None:\n"
              "        self._learning = learning\n"
              "        self._authorization = authorization\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del query\n"
              "        resources: list[dict[str, JsonValue]] = []\n"
              "        for candidate in self._learning.list_candidates():\n"
              "            if await _candidate_visible(\n"
              "                candidate,\n"
              "                context,\n"
              "                self._authorization,\n"
              "                action=\"learning-candidate:list\",\n"
              "            ):\n"
              "                resources.append(_candidate_resource(self._learning, candidate))\n"
              "        return tuple(resources)\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        candidate = self._learning.get_candidate(resource_id)\n"
              "        await _require_candidate_visible(\n"
              "            candidate,\n"
              "            context,\n"
              "            self._authorization,\n"
              "            action=\"learning-candidate:read\",\n"
              "        )\n"
              "        return _candidate_resource(self._learning, candidate)\n",
          )
          replace(
              path,
              "    def __init__(self, learning: LearningService) -> None:\n"
              "        self._learning = learning\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del query\n"
              "        return tuple(\n"
              "            _feedback_resource(feedback)\n"
              "            for feedback in self._learning.repository.list_feedback()\n"
              "            if _project_visible(feedback.project_id, context)\n"
              "        )\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        feedback = self._learning.repository.get_feedback(resource_id)\n"
              "        if not _project_visible(feedback.project_id, context):\n"
              "            raise ContractError(ErrorCode.NOT_FOUND, \"Learning feedback was not found\")\n"
              "        return _feedback_resource(feedback)\n",
              "    def __init__(\n"
              "        self,\n"
              "        learning: LearningService,\n"
              "        *,\n"
              "        authorization: AuthorizationProvider | None = None,\n"
              "    ) -> None:\n"
              "        self._learning = learning\n"
              "        self._authorization = authorization\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del query\n"
              "        resources: list[dict[str, JsonValue]] = []\n"
              "        for feedback in self._learning.repository.list_feedback():\n"
              "            if await _project_visible(\n"
              "                feedback.project_id,\n"
              "                context,\n"
              "                self._authorization,\n"
              "                action=\"learning-feedback:list\",\n"
              "                resource_ref=feedback.feedback_id,\n"
              "            ):\n"
              "                resources.append(_feedback_resource(feedback))\n"
              "        return tuple(resources)\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        feedback = self._learning.repository.get_feedback(resource_id)\n"
              "        if not await _project_visible(\n"
              "            feedback.project_id,\n"
              "            context,\n"
              "            self._authorization,\n"
              "            action=\"learning-feedback:read\",\n"
              "            resource_ref=feedback.feedback_id,\n"
              "        ):\n"
              "            raise ContractError(ErrorCode.NOT_FOUND, \"Learning feedback was not found\")\n"
              "        return _feedback_resource(feedback)\n",
          )
          replace(
              path,
              "def register_learning_control_plane(control_plane: ControlPlane, learning: LearningService) -> None:\n",
              "def register_learning_control_plane(\n"
              "    control_plane: ControlPlane,\n"
              "    learning: LearningService,\n"
              "    *,\n"
              "    authorization: AuthorizationProvider | None = None,\n"
              ") -> None:\n",
          )
          replace(
              path,
              "        LearningCandidateResourceService(learning),\n",
              "        LearningCandidateResourceService(learning, authorization=authorization),\n",
          )
          replace(
              path,
              "        LearningFeedbackResourceService(learning),\n",
              "        LearningFeedbackResourceService(learning, authorization=authorization),\n",
          )
          replace(
              path,
              "        feedback = learning.repository.get_feedback(resource_ref)\n"
              "        if not _project_visible(feedback.project_id, context):\n"
              "            raise ContractError(ErrorCode.NOT_FOUND, \"Learning feedback was not found\")\n",
              "        feedback = learning.repository.get_feedback(resource_ref)\n"
              "        if not await _project_visible(\n"
              "            feedback.project_id,\n"
              "            context,\n"
              "            authorization,\n"
              "            action=\"learning.propose-from-feedback\",\n"
              "            resource_ref=feedback.feedback_id,\n"
              "        ):\n"
              "            raise ContractError(ErrorCode.NOT_FOUND, \"Learning feedback was not found\")\n",
          )
          replace(
              path,
              "        candidate = learning.get_candidate(resource_ref)\n"
              "        _require_candidate_visible(candidate, context)\n"
              "        updated = learning.record_gate_evidence(\n",
              "        candidate = learning.get_candidate(resource_ref)\n"
              "        await _require_candidate_visible(\n"
              "            candidate, context, authorization, action=\"learning.evidence\"\n"
              "        )\n"
              "        updated = learning.record_gate_evidence(\n",
          )
          replace(
              path,
              "        _require_candidate_visible(learning.get_candidate(resource_ref), context)\n"
              "        updated = learning.accept(\n",
              "        await _require_candidate_visible(\n"
              "            learning.get_candidate(resource_ref),\n"
              "            context,\n"
              "            authorization,\n"
              "            action=\"learning.accept\",\n"
              "        )\n"
              "        updated = learning.accept(\n",
          )
          replace(
              path,
              "        _require_candidate_visible(learning.get_candidate(resource_ref), context)\n"
              "        updated = learning.reject(\n",
              "        await _require_candidate_visible(\n"
              "            learning.get_candidate(resource_ref),\n"
              "            context,\n"
              "            authorization,\n"
              "            action=\"learning.reject\",\n"
              "        )\n"
              "        updated = learning.reject(\n",
          )
          replace(
              path,
              "        _require_candidate_visible(learning.get_candidate(resource_ref), context)\n"
              "        replacement_id = _required_string(payload, \"superseded_by\")\n"
              "        _require_candidate_visible(learning.get_candidate(replacement_id), context)\n",
              "        await _require_candidate_visible(\n"
              "            learning.get_candidate(resource_ref),\n"
              "            context,\n"
              "            authorization,\n"
              "            action=\"learning.supersede\",\n"
              "        )\n"
              "        replacement_id = _required_string(payload, \"superseded_by\")\n"
              "        await _require_candidate_visible(\n"
              "            learning.get_candidate(replacement_id),\n"
              "            context,\n"
              "            authorization,\n"
              "            action=\"learning.supersede\",\n"
              "        )\n",
          )
          replace(
              path,
              "        candidate = learning.get_candidate(resource_ref)\n"
              "        _require_candidate_visible(candidate, context)\n"
              "        updated = await learning.promote(\n",
              "        candidate = learning.get_candidate(resource_ref)\n"
              "        await _require_candidate_visible(\n"
              "            candidate, context, authorization, action=\"learning.promote\"\n"
              "        )\n"
              "        updated = await learning.promote(\n",
          )
          replace(
              path,
              "def _candidate_visible(candidate: LearningCandidate, context: RequestContext) -> bool:\n"
              "    return _project_visible(candidate.project_id, context)\n\n\n"
              "def _require_candidate_visible(candidate: LearningCandidate, context: RequestContext) -> None:\n"
              "    if not _candidate_visible(candidate, context):\n"
              "        raise ContractError(ErrorCode.NOT_FOUND, \"Learning Candidate was not found\")\n\n\n"
              "def _project_visible(project_id: str | None, context: RequestContext) -> bool:\n"
              "    del project_id, context\n"
              "    return True\n",
              "async def _candidate_visible(\n"
              "    candidate: LearningCandidate,\n"
              "    context: RequestContext,\n"
              "    authorization: AuthorizationProvider | None,\n"
              "    *,\n"
              "    action: str,\n"
              ") -> bool:\n"
              "    return await _project_visible(\n"
              "        candidate.project_id,\n"
              "        context,\n"
              "        authorization,\n"
              "        action=action,\n"
              "        resource_ref=candidate.learning_candidate_id,\n"
              "    )\n\n\n"
              "async def _require_candidate_visible(\n"
              "    candidate: LearningCandidate,\n"
              "    context: RequestContext,\n"
              "    authorization: AuthorizationProvider | None,\n"
              "    *,\n"
              "    action: str,\n"
              ") -> None:\n"
              "    if not await _candidate_visible(\n"
              "        candidate, context, authorization, action=action\n"
              "    ):\n"
              "        raise ContractError(ErrorCode.NOT_FOUND, \"Learning Candidate was not found\")\n\n\n"
              "async def _project_visible(\n"
              "    project_id: str | None,\n"
              "    context: RequestContext,\n"
              "    authorization: AuthorizationProvider | None,\n"
              "    *,\n"
              "    action: str,\n"
              "    resource_ref: str,\n"
              ") -> bool:\n"
              "    if authorization is None:\n"
              "        return True\n"
              "    actor_type = context.actor.actor_type\n"
              "    if actor_type is None:\n"
              "        actor_type = infer_actor_identity(context.actor.principal_ref).actor_type.value\n"
              "    decision = await authorization.authorize(\n"
              "        AuthorizationRequest(\n"
              "            principal_ref=context.actor.principal_ref,\n"
              "            actor_type=actor_type,\n"
              "            action=action,\n"
              "            resource_ref=resource_ref,\n"
              "            context=OperationContext(\n"
              "                correlation_id=context.correlation_id,\n"
              "                owner_type=context.actor.owner_type,\n"
              "                owner_id=context.actor.owner_id,\n"
              "                project_id=project_id,\n"
              "                control=OperationControl(idempotency_key=context.idempotency_key),\n"
              "            ),\n"
              "            trust_context=context.actor.trust_context,\n"
              "        )\n"
              "    )\n"
              "    return decision.allowed\n",
          )

          path = "src/ai_multi_agent_platform/learning/runtime_control_plane.py"
          replace(
              path,
              "from ai_multi_agent_platform.contracts import ContractError, ErrorCode, JsonValue\n",
              "from ai_multi_agent_platform.contracts import ContractError, ErrorCode, JsonValue\n"
              "from ai_multi_agent_platform.contracts.interfaces import AuthorizationProvider\n",
          )
          replace(
              path,
              "from .control_plane import LEARNING_CANDIDATE_COLLECTION, LearningCandidateResourceService\n",
              "from .control_plane import (\n"
              "    LEARNING_CANDIDATE_COLLECTION,\n"
              "    LearningCandidateResourceService,\n"
              "    _candidate_visible,\n"
              ")\n",
          )
          replace(
              path,
              "    def __init__(self, learning: ObservedLearningService) -> None:\n"
              "        super().__init__(learning)\n"
              "        self._observed_learning = learning\n",
              "    def __init__(\n"
              "        self,\n"
              "        learning: ObservedLearningService,\n"
              "        *,\n"
              "        authorization: AuthorizationProvider | None = None,\n"
              "    ) -> None:\n"
              "        super().__init__(learning, authorization=authorization)\n"
              "        self._observed_learning = learning\n",
          )
          replace(
              path,
              "class LearningPostPromotionResourceService(ResourceService):\n"
              "    def __init__(self, learning: ObservedLearningService) -> None:\n"
              "        self._learning = learning\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del context, query\n"
              "        records: list[dict[str, JsonValue]] = []\n"
              "        for candidate in self._learning.list_candidates():\n"
              "            records.extend(\n"
              "                _resource(record)\n"
              "                for record in self._learning.post_promotion_recorder.list_for_candidate(\n"
              "                    candidate.learning_candidate_id\n"
              "                )\n"
              "            )\n"
              "        return tuple(records)\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        del context\n"
              "        for candidate in self._learning.list_candidates():\n"
              "            for record in self._learning.post_promotion_recorder.list_for_candidate(\n"
              "                candidate.learning_candidate_id\n"
              "            ):\n"
              "                if record.record_id == resource_id:\n"
              "                    return _resource(record)\n",
              "class LearningPostPromotionResourceService(ResourceService):\n"
              "    def __init__(\n"
              "        self,\n"
              "        learning: ObservedLearningService,\n"
              "        *,\n"
              "        authorization: AuthorizationProvider | None = None,\n"
              "    ) -> None:\n"
              "        self._learning = learning\n"
              "        self._authorization = authorization\n\n"
              "    async def list_resources(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        query: PageQuery,\n"
              "    ) -> tuple[dict[str, JsonValue], ...]:\n"
              "        del query\n"
              "        records: list[dict[str, JsonValue]] = []\n"
              "        for candidate in self._learning.list_candidates():\n"
              "            if not await _candidate_visible(\n"
              "                candidate,\n"
              "                context,\n"
              "                self._authorization,\n"
              "                action=\"learning-candidate:read\",\n"
              "            ):\n"
              "                continue\n"
              "            records.extend(\n"
              "                _resource(record)\n"
              "                for record in self._learning.post_promotion_recorder.list_for_candidate(\n"
              "                    candidate.learning_candidate_id\n"
              "                )\n"
              "            )\n"
              "        return tuple(records)\n\n"
              "    async def get_resource(\n"
              "        self,\n"
              "        context: RequestContext,\n"
              "        resource_id: str,\n"
              "    ) -> dict[str, JsonValue]:\n"
              "        for candidate in self._learning.list_candidates():\n"
              "            if not await _candidate_visible(\n"
              "                candidate,\n"
              "                context,\n"
              "                self._authorization,\n"
              "                action=\"learning-candidate:read\",\n"
              "            ):\n"
              "                continue\n"
              "            for record in self._learning.post_promotion_recorder.list_for_candidate(\n"
              "                candidate.learning_candidate_id\n"
              "            ):\n"
