              '  { label: "Evaluations", path: "/evaluations", group: "Intelligence", apiResource: "evaluation-suites" },\n'
              '  { label: "Learning", path: "/learning", group: "Intelligence", apiResource: "learning-candidates" },\n',
          )

          path = "frontend/src/app/Shell.tsx"
          replace(
              path,
              'import { IntegrationsClient } from "../api/integrations";\n',
              'import { IntegrationsClient } from "../api/integrations";\n'
              'import { LearningClient } from "../api/learning";\n',
