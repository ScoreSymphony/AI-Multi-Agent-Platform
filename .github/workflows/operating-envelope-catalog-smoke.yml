name: Operating envelope catalog smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  operating-envelope-catalog-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate catalog implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py tests/performance/test_issue_440_operating_envelope_catalog.py
          ruff check src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py tests/performance/test_issue_440_operating_envelope_catalog.py
          mypy src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py
          pytest tests/performance/test_issue_440_operating_envelope_catalog.py
      - name: Generate tiny single-host envelope
        run: |
          mkdir -p artifacts/benchmarks/catalog-smoke
          platform-benchmark single-node-sweep --concurrency-levels 1,2 --operations-per-level 2 --warmup-operations 0 --repetitions 1 --platform-commit "$GITHUB_SHA" --output-dir artifacts/benchmarks/catalog-smoke/sweep
          platform-operating-envelope --sweep artifacts/benchmarks/catalog-smoke/sweep/summary.json --output artifacts/benchmarks/catalog-smoke/envelope.json
          platform-operating-envelope-catalog --host ci-reference=artifacts/benchmarks/catalog-smoke/envelope.json --output artifacts/benchmarks/catalog-smoke/catalog.json
      - name: Upload operating-envelope catalog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-operating-envelope-catalog
          path: artifacts/benchmarks/catalog-smoke
          if-no-files-found: ignore
