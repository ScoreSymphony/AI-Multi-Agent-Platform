name: Temporary PR 714 repair context validation macOS

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply focused kernel Plan context fallback
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('src/ai_multi_agent_platform/context/source_adapters.py')
          text = source_path.read_text()

          old_import = 'from ai_multi_agent_platform.kernel.repository import RunRepository, TaskRepository\n'
          new_import = '''from ai_multi_agent_platform.kernel.repository import (\n    EventRepository,\n    RunRepository,\n    TaskRepository,\n)\n'''
          if text.count(old_import) != 1:
              raise SystemExit('unexpected kernel repository import anchor')
          text = text.replace(old_import, new_import, 1)

          old_constructor = '''    def __init__(\n        self,\n        coordinator: CoordinatorRepository,\n        *,\n        runs: RunRepository | None = None,\n    ) -> None:\n        self.coordinator = coordinator\n        self.runs = runs\n\n    async def collect(self, request: ContextSourceRequest) -> tuple[ContextCandidate, ...]:\n        if request.plan_id is None or request.step_id is None:\n            return ()\n        state = self.coordinator.get_plan(request.plan_id)\n'''
          new_constructor = '''    def __init__(\n        self,\n        coordinator: CoordinatorRepository,\n        *,\n        runs: RunRepository | None = None,\n        tasks: TaskRepository | None = None,\n        events: EventRepository | None = None,\n    ) -> None:\n        if (tasks is None) != (events is None):\n            raise ValueError("kernel Plan/Step fallback requires task and event repositories")\n        self.coordinator = coordinator\n        self.runs = runs\n        self.tasks = tasks\n        self.events = events\n\n    async def collect(self, request: ContextSourceRequest) -> tuple[ContextCandidate, ...]:\n        if request.plan_id is None or request.step_id is None:\n            return ()\n        try:\n            state = self.coordinator.get_plan(request.plan_id)\n        except ContractError as exc:\n            if (\n                exc.code is not ErrorCode.NOT_FOUND\n                or self.tasks is None\n                or self.events is None\n            ):\n                raise\n            return await self._collect_kernel_plan_step(request)\n'''
          if text.count(old_constructor) != 1:
              raise SystemExit('unexpected PlanStep constructor anchor')
          text = text.replace(old_constructor, new_constructor, 1)

          anchor = '''        return tuple(candidates)\n\n\nclass SkillBundleContextSourceAdapter:\n'''
          fallback = '''        return tuple(candidates)\n\n    async def _collect_kernel_plan_step(\n        self, request: ContextSourceRequest\n    ) -> tuple[ContextCandidate, ...]:\n        if self.tasks is None or self.events is None:\n            raise ContractError(\n                ErrorCode.INVALID_CONFIGURATION,\n                "kernel Plan/Step Context fallback is not configured",\n            )\n        if request.plan_id is None or request.step_id is None:\n            return ()\n\n        task = await self.tasks.get_task(request.task_id)\n        if task.plan_ref != request.plan_id or request.step_id not in task.step_ids:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "requested kernel Plan/Step is not the active canonical Task Plan",\n            )\n\n        plan_events = tuple(\n            event\n            for event in await self.events.read_events(request.task_id)\n            if event.event_type == "plan.created"\n            and event.payload.get("plan_ref") == request.plan_id\n        )\n        if len(plan_events) != 1:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "active kernel Plan must resolve to exactly one canonical plan.created event",\n            )\n        plan_event = plan_events[0]\n        raw_steps = plan_event.payload.get("steps")\n        if not isinstance(raw_steps, list):\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "canonical plan.created event has no valid Step payloads",\n            )\n        matches = [\n            item\n            for item in raw_steps\n            if isinstance(item, Mapping) and item.get("id") == request.step_id\n        ]\n        if len(matches) != 1:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "active kernel Step must resolve to exactly one canonical Step payload",\n            )\n        raw_step = matches[0]\n        title = raw_step.get("title")\n        objective = raw_step.get("objective")\n        depends_on_raw = raw_step.get("depends_on", [])\n        if (\n            not isinstance(title, str)\n            or not isinstance(objective, str)\n            or not isinstance(depends_on_raw, list)\n            or any(not isinstance(item, str) for item in depends_on_raw)\n        ):\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "canonical kernel Step payload is malformed",\n            )\n        dependencies: list[JsonValue] = [cast(JsonValue, item) for item in depends_on_raw]\n        content = _canonical_json(\n            {\n                "projection": "kernel_plan_event",\n                "plan_id": request.plan_id,\n                "plan_event_id": plan_event.id,\n                "step_id": request.step_id,\n                "step_title": title,\n                "step_objective": objective,\n                "dependencies": dependencies,\n            }\n        )\n        digest = _digest(content)\n        return (\n            ContextCandidate(\n                source=ContextSourceRef(\n                    ContextSourceType.PLAN_STEP,\n                    request.step_id,\n                    revision=f"event:{plan_event.id}",\n                    digest=digest,\n                ),\n                role=ContextEntryRole.CONTEXT,\n                selection_reason=(\n                    "active canonical kernel Plan/Step purpose without a Coordination projection"\n                ),\n                inline_content=content,\n                content_digest=digest,\n                trust=ContextTrust.TRUSTED,\n                data_classification=ContextDataClassification.INTERNAL,\n                priority=80,\n                relevance=1.0,\n                project_id=task.task.project_id,\n                workspace_id=request.workspace_id,\n                conflict_key=f"step:{request.step_id}",\n            ),\n        )\n\n\nclass SkillBundleContextSourceAdapter:\n'''
          if text.count(anchor) != 1:
              raise SystemExit('unexpected PlanStep tail anchor')
          source_path.write_text(text.replace(anchor, fallback, 1))

          deployment_path = Path('src/ai_multi_agent_platform/deployment/context_operationalization.py')
          deployment = deployment_path.read_text()
          old_composition = '    plan_adapter = PlanStepContextSourceAdapter(base.coordination_repository, runs=runs)\n'
          new_composition = '''    plan_adapter = PlanStepContextSourceAdapter(\n        base.coordination_repository,\n        runs=runs,\n        tasks=tasks,\n        events=base.kernel_repository,\n    )\n'''
          if deployment.count(old_composition) != 1:
              raise SystemExit('unexpected PlanStep deployment anchor')
          deployment_path.write_text(deployment.replace(old_composition, new_composition, 1))
          PY

      - name: Add focused regression coverage
        shell: bash
        run: |
          mkdir -p tests/integration/context
          cat > tests/integration/context/test_plan_step_kernel_fallback.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          from types import SimpleNamespace

          import pytest

          from ai_multi_agent_platform.context.source_adapters import (
              OperationalContextSourceRequest,
              PlanStepContextSourceAdapter,
          )
          from ai_multi_agent_platform.contracts import ContractError, ErrorCode, OperationContext
          from ai_multi_agent_platform.domain import Event, new_id


          class _MissingCoordinator:
              def get_plan(self, plan_id: str):
                  del plan_id
                  raise ContractError(ErrorCode.NOT_FOUND, "coordination plan not registered")

              def get_step_record(self, step_id: str):
                  raise AssertionError(f"fallback must happen before Step lookup: {step_id}")


          class _PartialCoordinator:
              def __init__(self, plan_id: str) -> None:
                  self.plan_id = plan_id

              def get_plan(self, plan_id: str):
                  assert plan_id == self.plan_id
                  return SimpleNamespace(steps=())

              def get_step_record(self, step_id: str):
                  del step_id
                  raise ContractError(ErrorCode.NOT_FOUND, "registered Plan lost its Step")


          class _TaskRepository:
              def __init__(self, state) -> None:
                  self.state = state

              async def get_task(self, task_id: str):
                  assert task_id == self.state.task_id
                  return self.state


          class _EventRepository:
              def __init__(self, task_id: str, events: tuple[Event, ...]) -> None:
                  self.task_id = task_id
                  self.events = events

              async def read_events(self, stream_id: str) -> tuple[Event, ...]:
                  assert stream_id == self.task_id
                  return self.events


          def _fixture():
              task_id = new_id("task")
              plan_id = new_id("plan")
              step_id = new_id("step")
              project_id = new_id("project")
              state = SimpleNamespace(
                  task_id=task_id,
                  task=SimpleNamespace(project_id=project_id),
                  plan_ref=plan_id,
                  step_ids=(step_id,),
              )
              event = Event(
                  event_type="plan.created",
                  subject_type="task",
                  subject_id=task_id,
                  correlation_id=task_id,
                  project_id=project_id,
                  payload={
                      "plan_ref": plan_id,
                      "summary": "Repair the verified output",
                      "step_refs": [step_id],
                      "steps": [
                          {
                              "id": step_id,
                              "proposal_key": "repair",
                              "title": "Repair output",
                              "objective": "Correct only the verified defects.",
                              "depends_on": [],
                              "metadata": {},
                          }
                      ],
                  },
              )
              request = OperationalContextSourceRequest(
                  task_id=task_id,
                  run_id=new_id("run"),
                  agent_id=new_id("agent"),
                  agent_revision=1,
                  project_id=project_id,
                  workspace_id=new_id("workspace"),
                  operation=OperationContext(correlation_id=task_id),
                  actor_ref="service:test",
                  plan_id=plan_id,
                  step_id=step_id,
              )
              return state, event, request


          def test_kernel_plan_event_supplies_context_when_coordination_plan_is_absent() -> None:
              state, event, request = _fixture()
              adapter = PlanStepContextSourceAdapter(
                  _MissingCoordinator(),  # type: ignore[arg-type]
                  tasks=_TaskRepository(state),  # type: ignore[arg-type]
                  events=_EventRepository(state.task_id, (event,)),  # type: ignore[arg-type]
              )

              candidates = asyncio.run(adapter.collect(request))

              assert len(candidates) == 1
              candidate = candidates[0]
              assert candidate.source.source_id == request.step_id
              assert candidate.source.revision == f"event:{event.id}"
              assert candidate.inline_content is not None
              payload = json.loads(candidate.inline_content)
              assert payload["projection"] == "kernel_plan_event"
              assert payload["plan_id"] == request.plan_id
              assert payload["step_id"] == request.step_id
              assert payload["step_objective"] == "Correct only the verified defects."


          def test_partial_coordination_projection_does_not_fallback() -> None:
              state, event, request = _fixture()
              adapter = PlanStepContextSourceAdapter(
                  _PartialCoordinator(request.plan_id),  # type: ignore[arg-type]
                  tasks=_TaskRepository(state),  # type: ignore[arg-type]
                  events=_EventRepository(state.task_id, (event,)),  # type: ignore[arg-type]
              )

              with pytest.raises(ContractError) as exc_info:
                  asyncio.run(adapter.collect(request))

              assert exc_info.value.code is ErrorCode.NOT_FOUND
              assert "lost its Step" in exc_info.value.message
          PY

      - name: Install test toolchain
        run: python -m pip install -e '.[dev]'
      - name: Normalize focused files
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          ruff format \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          ruff check \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
      - name: Typecheck full source tree
        run: mypy
      - name: Run focused regression tests
        run: |
          pytest -q tests/integration/context/test_plan_step_kernel_fallback.py
          pytest -q tests/integration/verification/test_automatic_reviewer_repair.py
      - name: Commit validated product fix and remove harness
        shell: bash
        run: |
          git rm .github/workflows/tmp-pr714-context-fix-macos.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          git commit -m 'fix(context): resolve kernel-native repair Plan Steps (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
