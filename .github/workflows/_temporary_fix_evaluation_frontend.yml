name: Temporary frontend typecheck integration fix

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Make evaluation policy projections JSON-object compatible
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/api/evaluations.ts')
          text = path.read_text()
          replacements = {
              'export interface EvaluationRepeatPolicyProjection {':
                  'export interface EvaluationRepeatPolicyProjection extends Record<string, JsonValue> {',
              'export interface EvaluationSeedPolicyProjection {':
                  'export interface EvaluationSeedPolicyProjection extends Record<string, JsonValue> {',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected declaration not found: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          cd frontend
          npm install --global npm@11.6.0
          npm install --no-audit --no-fund
          npm run typecheck
          cd ..

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/_temporary_fix_evaluation_frontend.yml
          git add frontend/src/api/evaluations.ts
          git commit -m "fix(frontend): encode evaluation policies as JSON objects"
          git push origin HEAD:integration/active-branches-2026-09-08
