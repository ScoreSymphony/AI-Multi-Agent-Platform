name: Pipelock candidate compatibility

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-candidate-compat.yml"
      - "src/ai_multi_agent_platform/adapters/pipelock.py"
      - "tests/test_issue_730_pipelock_evaluation.py"
      - "docs/upstream/PIPELOCK_CORE_*.md"
      - "upstream/pipelock-core.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-audit-pilot:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out pinned Pipelock candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Verify reviewed license and build boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Apache License" .candidate/pipelock/LICENSE
          grep -q "Elastic License 2.0" .candidate/pipelock/enterprise/LICENSE
          grep -q '^//go:build enterprise$' .candidate/pipelock/enterprise/edition.go
          grep -q 'go build -tags enterprise' .candidate/pipelock/Dockerfile
          python - <<'PY'
          from pathlib import Path

          text = Path(".candidate/pipelock/Makefile").read_text(encoding="utf-8")
          build = text.split("\nbuild:\n", 1)[1].split("\n\n", 1)[0]
          if "-tags enterprise" in build:
              raise SystemExit("upstream default make build unexpectedly enables Enterprise tags")
          PY

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Prove binary has no Enterprise build tag
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi

      - name: Generate and validate audit-only pilot configuration
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pipelock-home"
          ./pipelock init \
            --scan-home "$RUNNER_TEMP/pipelock-home" \
            --output "$RUNNER_TEMP/pipelock-audit.yaml" \
            --preset audit \
            --skip-canary
          grep -Eq '^mode:[[:space:]]*audit$' "$RUNNER_TEMP/pipelock-audit.yaml"
          grep -Eq '^enforce:[[:space:]]*false$' "$RUNNER_TEMP/pipelock-audit.yaml"
          grep -Eq '^flight_recorder:' "$RUNNER_TEMP/pipelock-audit.yaml"
          grep -Eq '^[[:space:]]+redact:[[:space:]]*true$' "$RUNNER_TEMP/pipelock-audit.yaml"
          sha256sum ./pipelock "$RUNNER_TEMP/pipelock-audit.yaml" \
            > "$RUNNER_TEMP/pipelock-candidate-sha256.txt"

      - name: Upload non-secret candidate evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-candidate-core-audit-evidence
          path: |
            ${{ runner.temp }}/pipelock-buildinfo.txt
            ${{ runner.temp }}/pipelock-candidate-sha256.txt
          if-no-files-found: error
