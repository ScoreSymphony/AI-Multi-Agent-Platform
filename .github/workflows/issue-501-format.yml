name: Issue 501 format helper

on:
  push:
    branches:
      - feature/501-proposal-specification-governance

permissions:
  contents: write

jobs:
  format-and-harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/501-proposal-specification-governance
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.16.6'
      - name: Harden authorization and lifecycle invariants
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          control = Path("src/ai_multi_agent_platform/governance/control_plane.py")
          text = control.read_text()
          text = text.replace(
              "    def __init__(self, governance: GovernanceService) -> None:\n        self._governance = governance\n",
              "    def __init__(\n        self, control_plane: ControlPlane, governance: GovernanceService\n    ) -> None:\n        self._control_plane = control_plane\n        self._governance = governance\n",
          )
          text = text.replace(
              "        del context, query\n        return tuple(_audit_resource(value) for value in self._governance.repository.list_audit())\n",
              "        del query\n        resources: list[dict[str, JsonValue]] = []\n        for event in self._governance.repository.list_audit():\n            if await self._control_plane._allowed(\n                context,\n                \"governance-event:list\",\n                event.id,\n                project_id=event.project_id,\n            ):\n                resources.append(_audit_resource(event))\n        return tuple(resources)\n",
          )
          text = text.replace(
              "        del context\n        for event in self._governance.repository.list_audit():\n            if event.id == resource_id:\n                return _audit_resource(event)\n",
              "        for event in self._governance.repository.list_audit():\n            if event.id != resource_id:\n                continue\n            if not await self._control_plane._allowed(\n                context,\n                \"governance-event:read\",\n                event.id,\n                project_id=event.project_id,\n            ):\n                raise ContractError(ErrorCode.FORBIDDEN, \"governance event is forbidden\")\n            return _audit_resource(event)\n",
          )
          text = text.replace(
              "GOVERNANCE_AUDIT_COLLECTION, GovernanceAuditResourceService(governance)",
              "GOVERNANCE_AUDIT_COLLECTION, GovernanceAuditResourceService(control_plane, governance)",
          )
          control.write_text(text)

          service = Path("src/ai_multi_agent_platform/governance/service.py")
          text = service.read_text()
          needle = """        if current.status in {\n            ProposalStatus.DISMISSED,\n            ProposalStatus.SUPERSEDED,\n            ProposalStatus.CONVERTED_TO_TASK,\n        }:\n            raise ContractError(ErrorCode.CONFLICT, \"terminal proposal cannot be revised\")\n"""
          replacement = needle + """        if proposal.status in {\n            ProposalStatus.DISMISSED,\n            ProposalStatus.SUPERSEDED,\n            ProposalStatus.CONVERTED_TO_TASK,\n        }:\n            raise ContractError(\n                ErrorCode.INVALID_REQUEST,\n                \"terminal proposal state requires its dedicated lifecycle operation\",\n            )\n"""
          if needle not in text:
              raise SystemExit("revise_proposal hardening anchor not found")
          text = text.replace(needle, replacement, 1)
          needle = """    def _mark_proposal_ready(self, proposal_id: str) -> None:\n        current = self.repository.get_proposal(proposal_id)\n        if current.status is ProposalStatus.READY:\n            return\n"""
          replacement = """    def _mark_proposal_ready(self, proposal_id: str) -> None:\n        current = self.repository.get_proposal(proposal_id)\n        if current.status is ProposalStatus.READY:\n            return\n        if current.status in {\n            ProposalStatus.DISMISSED,\n            ProposalStatus.SUPERSEDED,\n            ProposalStatus.CONVERTED_TO_TASK,\n        }:\n            raise ContractError(ErrorCode.CONFLICT, \"terminal proposal cannot become ready\")\n"""
          if needle not in text:
              raise SystemExit("ready hardening anchor not found")
          text = text.replace(needle, replacement, 1)
          needle = """    def _mark_proposal_converted(self, proposal_id: str, task_id: str) -> None:\n        current = self.repository.get_proposal(proposal_id)\n        if current.status is ProposalStatus.CONVERTED_TO_TASK:\n"""
          replacement = """    def _mark_proposal_converted(self, proposal_id: str, task_id: str) -> None:\n        current = self.repository.get_proposal(proposal_id)\n        if current.status in {ProposalStatus.DISMISSED, ProposalStatus.SUPERSEDED}:\n            raise ContractError(ErrorCode.CONFLICT, \"terminal proposal cannot be converted\")\n        if current.status is ProposalStatus.CONVERTED_TO_TASK:\n"""
          if needle not in text:
              raise SystemExit("conversion hardening anchor not found")
          text = text.replace(needle, replacement, 1)
          service.write_text(text)
          PY
      - run: ruff format src/ai_multi_agent_platform/governance
      - name: Commit generated corrections
        shell: bash
        run: |
          if git diff --quiet -- src/ai_multi_agent_platform/governance; then
            exit 0
          fi
          git config user.name "Score Symphony CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai_multi_agent_platform/governance
          git commit -m "style: format and harden issue 501 governance"
          git push origin HEAD:feature/501-proposal-specification-governance
