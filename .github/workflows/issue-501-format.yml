name: Issue 501 format helper

on:
  push:
    branches:
      - feature/501-proposal-specification-governance

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/501-proposal-specification-governance
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.16.6'
      - run: ruff format src/ai_multi_agent_platform/governance
      - name: Commit generated formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/governance
          if ! git diff --cached --quiet; then
            git commit -m 'style(governance): apply ruff format'
            git push origin HEAD:feature/501-proposal-specification-governance
          fi
