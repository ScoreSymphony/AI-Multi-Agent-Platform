name: Pipelock network and exfiltration

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-network-exfiltration.yml"
      - "tests/test_issue_730_pipelock_network_exfiltration.py"
      - "tests/fixtures/pipelock_network_boundary_audit.yaml"
      - "tests/fixtures/pipelock_network_boundary_target.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-network-exfiltration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-network-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-network-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi

      - name: Add deterministic TEST-NET target address
        run: sudo ip address add 192.0.2.123/32 dev lo

      - name: Exercise network and multi-stage exfiltration cases
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
          PIPELOCK_730_ALLOW_HOSTS_MUTATION: "1"
          PIPELOCK_730_TEST_NET_IP: "192.0.2.123"
        run: |
          pytest -q tests/test_issue_730_pipelock_network_exfiltration.py \
            --basetemp="$RUNNER_TEMP/pipelock-network" \
            --junitxml="$RUNNER_TEMP/pipelock-network-junit.xml"

      - name: Remove deterministic TEST-NET target address
        if: always()
        run: sudo ip address del 192.0.2.123/32 dev lo || true

      - name: Upload network and exfiltration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-network-exfiltration-evidence
          path: |
            ${{ runner.temp }}/pipelock-network-buildinfo.txt
            ${{ runner.temp }}/pipelock-network-junit.xml
            ${{ runner.temp }}/pipelock-network/**/*.log
            ${{ runner.temp }}/pipelock-network/**/*.jsonl
          if-no-files-found: warn
