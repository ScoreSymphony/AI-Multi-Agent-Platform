name: Triage CodeQL alert 1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/triage-codeql-alert-1.yml

permissions:
  contents: read
  security-events: write

jobs:
  triage:
    name: Validate and dismiss stale alert
    runs-on: ubuntu-latest
    steps:
      - name: Validate and dismiss alert 1
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ALERT_NUMBER: "1"
          EXPECTED_RULE: py/clear-text-logging-sensitive-data
          EXPECTED_PATH: src/ai_multi_agent_platform/cli/render.py
        shell: bash
        run: |
          set -euo pipefail

          alert="$({
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/code-scanning/alerts/${ALERT_NUMBER}"
          })"

          state="$(jq -r '.state' <<<"${alert}")"
          rule="$(jq -r '.rule.id' <<<"${alert}")"
          path="$(jq -r '.most_recent_instance.location.path' <<<"${alert}")"
          ref="$(jq -r '.most_recent_instance.ref' <<<"${alert}")"

          printf 'Alert %s: state=%s rule=%s path=%s ref=%s\n' \
            "${ALERT_NUMBER}" "${state}" "${rule}" "${path}" "${ref}"

          if [[ "${state}" != "open" ]]; then
            echo "Alert is already non-open; no action required."
            exit 0
          fi

          if [[ "${rule}" != "${EXPECTED_RULE}" ]]; then
            echo "Refusing to dismiss unexpected rule: ${rule}" >&2
            exit 1
          fi

          if [[ "${path}" != "${EXPECTED_PATH}" ]]; then
            echo "Refusing to dismiss unexpected path: ${path}" >&2
            exit 1
          fi

          if [[ "${ref}" != "refs/heads/main" ]]; then
            echo "Refusing to dismiss an alert whose most recent instance is not on main: ${ref}" >&2
            exit 1
          fi

          updated="$({
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "/repos/${GH_REPO}/code-scanning/alerts/${ALERT_NUMBER}" \
              -f state='dismissed' \
              -f dismissed_reason='false positive' \
              -f dismissed_comment='Current CLI rendering redacts sensitive fields through the project-specific redaction boundary before stdout, with regression coverage in tests/unit/cli/test_cli_redaction.py. CodeQL does not model this sanitizer; see PR #1080.'
          })"

          updated_state="$(jq -r '.state' <<<"${updated}")"
          updated_reason="$(jq -r '.dismissed_reason' <<<"${updated}")"

          if [[ "${updated_state}" != "dismissed" || "${updated_reason}" != "false positive" ]]; then
            echo "GitHub did not confirm the expected dismissal state." >&2
            exit 1
          fi

          echo "Alert ${ALERT_NUMBER} dismissed as false positive after validating rule, path, and main-branch instance."
