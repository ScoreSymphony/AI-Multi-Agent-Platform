name: Issue 384 final fix

on:
  push:
    branches:
      - feat/384-durable-plan-step-coordinator
    paths:
      - .github/workflows/issue384-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/384-durable-plan-step-coordinator
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply narrow fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          models = Path('src/ai_multi_agent_platform/coordination/models.py')
          text = models.read_text()
          old = '    dependency_ids: tuple[str, ...]\n    satisfied_dependency_ids: tuple[str, ...] = ()\n'
          new = '    dependency_ids: tuple[str, ...] = ()\n    satisfied_dependency_ids: tuple[str, ...] = ()\n'
          if old not in text:
              raise SystemExit('models replacement target not found')
          models.write_text(text.replace(old, new, 1))

          service = Path('src/ai_multi_agent_platform/coordination/service.py')
          text = service.read_text()
          old = '''    async def _aggregate_task(self, plan_id: str) -> None:\n        state = self.repository.get_plan(plan_id)\n        if not state.steps or any(step.status not in _TERMINAL_STEPS for step in state.steps):\n            return\n        task = await self.kernel.get_task(state.plan.task_id)\n'''
          new = '''    async def _aggregate_task(self, plan_id: str) -> None:\n        state = self.repository.get_plan(plan_id)\n        records = self.repository.list_step_records(plan_id)\n        if len(records) != len(state.steps) or any(\n            record.phase is not CoordinationPhase.TERMINAL for record in records\n        ):\n            return\n        if not state.steps or any(step.status not in _TERMINAL_STEPS for step in state.steps):\n            return\n        task = await self.kernel.get_task(state.plan.task_id)\n'''
          if old not in text:
              raise SystemExit('service replacement target not found')
          service.write_text(text.replace(old, new, 1))
          PY
          python -m pip install 'ruff>=0.12,<1'
          ruff format src/ai_multi_agent_platform/coordination/models.py src/ai_multi_agent_platform/coordination/service.py
          rm .github/workflows/issue384-final-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(#384): defer task terminalization through retries'
          git push origin HEAD:feat/384-durable-plan-step-coordinator
