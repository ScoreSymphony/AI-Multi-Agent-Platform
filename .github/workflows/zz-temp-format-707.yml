name: Temporary format issue 707

on:
  push:
    branches:
      - feat/707-single-node-reliability

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install formatter
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply Ruff formatting
        run: ruff format .
      - name: Commit formatting when needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.py'
          git commit -m 'style: apply Ruff formatting for #707'
          git push
