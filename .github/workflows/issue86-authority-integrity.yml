name: Issue 86 authority-integrity hardening

on:
  push:
    branches: [fix/issue-86-authority-integrity]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-86-authority-integrity
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Fix temporary patcher anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/issue86_authority_integrity.py')
          lines = path.read_text(encoding='utf-8').splitlines()

          def replace_labelled_block(label: str, replacement: list[str]) -> None:
              global lines
              label_index = next(
                  i for i, line in enumerate(lines)
                  if f'label="{label}"' in line
              )
              start = label_index - 4
              end = label_index + 2
              if lines[start].strip() != 'text = replace_once(':
                  raise SystemExit(
                      f'unexpected {label} block start: {lines[start]!r}'
                  )
              indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
              lines[start:end] = [indent + line if line else '' for line in replacement]

          replace_labelled_block(
              'evidence context protocol',
              [
                  'if protocol_anchor not in text:',
                  '    raise RuntimeError("evidence context protocol: anchor not found")',
                  'text = text.replace(protocol_anchor, protocol_method + protocol_anchor, 1)',
              ],
          )
          replace_labelled_block(
              'evidence context implementation',
              [
                  'implementation_anchor = "    async def validate_evidence_artifacts(\\n"',
                  'positions = [',
                  '    match.start()',
                  '    for match in re.finditer(re.escape(implementation_anchor), text)',
                  ']',
                  'if len(positions) != 2:',
                  '    raise RuntimeError(',
                  '        f"evidence context implementation: expected 2 anchors, found {len(positions)}"',
                  '    )',
                  'position = positions[1]',
                  'text = (',
                  '    text[:position]',
                  '    + context_method',
                  '    + implementation_anchor',
                  '    + text[position + len(implementation_anchor):]',
                  ')',
              ],
          )
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
      - name: Apply authority-integrity patch
        run: python .github/scripts/issue86_authority_integrity.py
      - name: Normalize generated typing and tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          evidence = Path('src/ai_multi_agent_platform/verification/evidence.py')
          text = evidence.read_text(encoding='utf-8')
          text = text.replace(
              'from .gate import VerificationCompletionAuthority',
              'from .gate import TaskVerificationRequirement, VerificationCompletionAuthority',
              1,
          )
          old = '        policy_version: int,\n    ):\n        return self._completion.require_task('
          new = '        policy_version: int,\n    ) -> TaskVerificationRequirement:\n        return self._completion.require_task('
          if old not in text:
              raise SystemExit('CanonicalVerificationRuntime.require_task annotation anchor missing')
          evidence.write_text(text.replace(old, new, 1), encoding='utf-8')

          test_path = Path('tests/test_issue_86_authority_integrity.py')
          test_text = test_path.read_text(encoding='utf-8')
          test_text = test_text.replace('from dataclasses import replace\n\n', '', 1)
          test_path.write_text(test_text, encoding='utf-8')

          for generated_path in (
              Path('tests/test_issue_86_verification.py'),
              Path('tests/test_issue_86_repair_runtime.py'),
          ):
              generated = generated_path.read_text(encoding='utf-8')
              generated_path.write_text(generated.replace(r'\"', '"'), encoding='utf-8')

          integration = Path('tests/test_issue_86_hardening_integration.py')
          integration_text = integration.read_text(encoding='utf-8')
          integration_text = integration_text.replace(
              '            actor=context.actor,\n',
              '            actor=ActorContext(\n'
              '                principal_ref=admin.user_id,\n'
              '                owner_type="user",\n'
              '                owner_id=admin.user_id,\n'
              '                actor_type="human",\n'
              '            ),\n',
              1,
          )
          integration.write_text(integration_text, encoding='utf-8')
          PY
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Normalize formatting
        run: ruff format src tests
      - name: Ruff lint
        run: |
          ruff check --fix src tests
          ruff check src tests
      - name: Mypy
        run: mypy
      - name: Focused verification and deployment tests
        run: |
          pytest -q \
            tests/test_issue_86_verification.py \
            tests/test_issue_86_kernel_gate.py \
            tests/test_issue_86_persistence.py \
            tests/test_issue_86_control_plane.py \
            tests/test_issue_86_observability.py \
            tests/test_issue_86_reviewer_agent.py \
            tests/test_issue_86_repair_runtime.py \
            tests/test_issue_86_replacement_conformance.py \
            tests/test_issue_86_hardening.py \
            tests/test_issue_86_hardening_integration.py \
            tests/test_issue_86_authority_integrity.py
      - name: Commit validated product changes and cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests docs
          git commit -m "fix(verification): close canonical authority integrity gaps (#86)"
          rm .github/scripts/issue86_authority_integrity.py
          rm .github/workflows/issue86-authority-integrity.yml
          git add -A
          git commit -m "chore: remove temporary issue 86 authority validator"
          git push origin HEAD:fix/issue-86-authority-integrity
