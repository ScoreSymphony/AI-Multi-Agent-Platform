name: Temporary PR 714 kernel Plan context fix

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply exact kernel Plan context fix
        shell: bash
        run: |
          echo '' | base64 -d | gzip -d > /tmp/pr714_patch.py
          python /tmp/pr714_patch.py
      - name: Install test toolchain
        run: python -m pip install -e '.[dev]'
      - name: Validate focused change
        shell: bash
        run: |
          ruff format src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/integration/context/test_plan_step_kernel_fallback.py
          ruff check src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/integration/context/test_plan_step_kernel_fallback.py
          mypy src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py
          pytest -q tests/integration/context/test_plan_step_kernel_fallback.py tests/integration/verification/test_automatic_reviewer_repair.py
      - name: Commit verified fix
        shell: bash
        run: |
          git rm .github/workflows/tmp-pr714-kernel-plan-context-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/integration/context/test_plan_step_kernel_fallback.py
          git commit -m 'fix(context): resolve kernel-owned repair steps (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
