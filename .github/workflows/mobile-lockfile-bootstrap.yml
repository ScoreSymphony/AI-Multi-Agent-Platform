name: Mobile lockfile bootstrap

on:
  pull_request:
    paths:
      - "mobile/package.json"
      - ".github/workflows/mobile-lockfile-bootstrap.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Pin supported npm
        run: npm install --global npm@11.6.0

      - name: Generate exact mobile lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile resolves cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Commit generated lockfile to the PR branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "build(mobile): commit reproducible npm lockfile"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-lock-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: mobile/package-lock.json
