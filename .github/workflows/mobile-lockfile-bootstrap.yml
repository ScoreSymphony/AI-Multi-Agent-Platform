name: Mobile lockfile bootstrap

on:
  pull_request:
    paths:
      - "mobile/package.json"
      - ".github/workflows/mobile-lockfile-bootstrap.yml"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Pin supported npm
        run: npm install --global npm@11.6.0

      - name: Generate exact mobile lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify lockfile resolves cleanly
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: mobile-package-lock-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: mobile/package-lock.json
