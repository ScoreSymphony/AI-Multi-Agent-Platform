name: Final error-boundary finalize

on:
  push:
    branches:
      - codex/983-final-error-boundary-audit

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/983-final-error-boundary-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tighten final guardrail
        run: python scripts/maintenance/final_error_boundary_finalize.py
      - name: Verify strict whole-tree audit and guardrail tests
        shell: bash
        run: |
          python scripts/ci/broad_exception_audit.py --repository-root . --check
          python -m pip install -e ".[dev]"
          pytest -q tests/unit/quality/test_broad_exception_audit.py
      - name: Remove temporary migration helpers and commit
        shell: bash
        run: |
          git rm -f \
            scripts/maintenance/final_error_boundary_cleanup.py \
            scripts/maintenance/final_error_boundary_cleanup.trigger \
            scripts/maintenance/final_error_boundary_redaction.py \
            scripts/maintenance/final_error_boundary_redaction.trigger \
            scripts/maintenance/final_error_boundary_finalize.py \
            scripts/maintenance/final_error_boundary_finalize.trigger \
            .github/workflows/final-error-boundary-cleanup.yml \
            .github/workflows/final-error-boundary-redaction.yml \
            .github/workflows/final-error-boundary-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: enforce fully classified error boundaries"
          git push origin HEAD:codex/983-final-error-boundary-audit
