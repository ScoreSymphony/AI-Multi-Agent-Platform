name: Wire issue 82 run workspace bindings

on:
  push:
    branches:
      - feat/issue-82-operational-completion

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion

      - name: Wire durable Run Workspace bindings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/deployment/single_node.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one occurrence, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from ai_multi_agent_platform.workspaces.compensation import CompensatingSqliteWorkspaceProvider\n',
              'from ai_multi_agent_platform.workspaces import SqliteRunWorkspaceBindingRepository\n'
              'from ai_multi_agent_platform.workspaces.compensation import CompensatingSqliteWorkspaceProvider\n',
          )
          replace_once(
              '    workspaces: CompensatingSqliteWorkspaceProvider\n    repository_registry: RepositoryRegistry\n',
              '    workspaces: CompensatingSqliteWorkspaceProvider\n'
              '    run_workspace_bindings: SqliteRunWorkspaceBindingRepository\n'
              '    repository_registry: RepositoryRegistry\n',
          )
          replace_once(
              '    workspaces = CompensatingSqliteWorkspaceProvider(\n'
              '        config.workspaces_dir,\n'
              '        files,\n'
              '        database_dir / "workspaces.sqlite3",\n'
              '    )\n'
              '    repository_catalog = SqliteRepositoryBindingCatalog(\n',
              '    workspaces = CompensatingSqliteWorkspaceProvider(\n'
              '        config.workspaces_dir,\n'
              '        files,\n'
              '        database_dir / "workspaces.sqlite3",\n'
              '    )\n'
              '    run_workspace_bindings = SqliteRunWorkspaceBindingRepository(\n'
              '        database_dir / "run-workspace-bindings.sqlite3"\n'
              '    )\n'
              '    repository_catalog = SqliteRepositoryBindingCatalog(\n',
          )
          replace_once(
              '        workspace_provider=workspaces,\n        health_providers=(orchestrator, lifecycle, files),\n',
              '        workspace_provider=workspaces,\n'
              '        run_workspace_bindings=run_workspace_bindings,\n'
              '        health_providers=(orchestrator, lifecycle, files),\n',
          )
          replace_once(
              '        workspaces=workspaces,\n        repository_registry=repository_registry,\n',
              '        workspaces=workspaces,\n'
              '        run_workspace_bindings=run_workspace_bindings,\n'
              '        repository_registry=repository_registry,\n',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Format changed composition
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format src/ai_multi_agent_platform/deployment/single_node.py

      - name: Commit wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/deployment/single_node.py
          git commit -m 'fix(repositories): persist Run Workspace bindings in single-node (#82)'
          git push origin HEAD:feat/issue-82-operational-completion
