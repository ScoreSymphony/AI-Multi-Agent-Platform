name: Final audit lint fix

on:
  push:
    branches:
      - codex/983-final-error-boundary-audit

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/983-final-error-boundary-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install project tooling
        run: python -m pip install -e ".[dev]"
      - name: Normalize audit markers and diagnostics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          changed = []
          marker = re.compile(
              r'^(?P<indent>\s*)# error-boundary: allow-broad-catch='
              r'(?P<kind>boundary|cleanup|translation)\b.*$'
          )
          reasons = {
              'boundary': 'reviewed owner boundary',
              'cleanup': 'reviewed cleanup boundary',
              'translation': 'reviewed error translation',
          }
          duplicate_type = re.compile(
              r'\{type\((?P<name>[A-Za-z_][A-Za-z0-9_]*)\)\.__name__\}: '
              r'\{type\((?P=name)\)\.__name__\}'
          )

          for relative in [
              line.strip()
              for line in __import__('subprocess').check_output(
                  [
                      'git', 'diff', '--name-only',
                      '9f3b29d2bd845512d590592881292fe88318983b...HEAD',
                      '--', '*.py'
                  ],
                  text=True,
              ).splitlines()
              if line.strip()
          ]:
              path = root / relative
              if not path.is_file():
                  continue
              before = path.read_text(encoding='utf-8')
              lines = []
              for line in before.splitlines(keepends=True):
                  raw = line.rstrip('\r\n')
                  ending = line[len(raw):]
                  match = marker.match(raw)
                  if match and len(raw) > 100:
                      raw = (
                          f"{match.group('indent')}# error-boundary: allow-broad-catch="
                          f"{match.group('kind')} {reasons[match.group('kind')]}"
                      )
                      line = raw + ending
                  lines.append(line)
              after = ''.join(lines)
              after = duplicate_type.sub(
                  lambda match: f"{{type({match.group('name')}).__name__}}",
                  after,
              )
              if relative == 'src/ai_multi_agent_platform/portability/file_codecs.py':
                  after = after.replace(
                      '"""Portable File/Artifact codecs and provider-neutral file materialization for the owning subsystem."""',
                      '"""Portable File/Artifact codecs and provider-neutral materialization."""',
                      1,
                  )
              if relative == 'src/ai_multi_agent_platform/evaluation/runner.py':
                  after = after.replace(
                      'except (Exception, asyncio.CancelledError) as exc:',
                      'except asyncio.CancelledError as exc:',
                      1,
                  )
              if after != before:
                  compile(after, relative, 'exec')
                  path.write_text(after, encoding='utf-8')
                  changed.append(relative)

          print(f'lint_cleanup_files_changed={len(changed)}')
          PY
      - name: Format and lint repository
        run: |
          ruff format .
          ruff format --check .
          ruff check .
      - name: Verify strict audit and focused tests
        run: |
          python scripts/ci/broad_exception_audit.py --repository-root . --check
          pytest -q tests/unit/quality/test_broad_exception_audit.py tests/integration/security/test_skillspector_security_evidence.py
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No lint fixes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts tests
          git commit -m "fix: normalize final error-boundary audit markers"
          git push origin HEAD:codex/983-final-error-boundary-audit
