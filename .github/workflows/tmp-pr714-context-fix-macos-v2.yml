name: Temporary PR 714 repair context validation macOS v2

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply validated fallback with frozen-event support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          harness = Path('.github/workflows/tmp-pr714-context-fix-macos.yml').read_text()

          script_marker = "          python - <<'PY'\n"
          script_start = harness.index(script_marker) + len(script_marker)
          script_end = harness.index("\n          PY\n", script_start)
          script = dedent(harness[script_start:script_end])
          old_steps = 'if not isinstance(raw_steps, list):'
          new_steps = 'if not isinstance(raw_steps, (list, tuple)):'
          old_deps = 'or not isinstance(depends_on_raw, list)'
          new_deps = 'or not isinstance(depends_on_raw, (list, tuple))'
          if script.count(old_steps) != 1 or script.count(old_deps) != 1:
              raise SystemExit('unexpected frozen-event validation anchors')
          script = script.replace(old_steps, new_steps, 1).replace(old_deps, new_deps, 1)
          exec(compile(script, '<pr714-context-fix>', 'exec'))

          test_marker = "          cat > tests/integration/context/test_plan_step_kernel_fallback.py <<'PY'\n"
          test_start = harness.index(test_marker) + len(test_marker)
          test_end = harness.index("\n          PY\n", test_start)
          test_body = dedent(harness[test_start:test_end])
          test_path = Path('tests/integration/context/test_plan_step_kernel_fallback.py')
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test_body + '\n')
          PY
      - name: Install test toolchain
        run: python -m pip install -e '.[dev]'
      - name: Normalize focused files
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          ruff format \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          ruff check \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
      - name: Typecheck full source tree
        run: mypy
      - name: Run focused regression tests
        run: |
          pytest -q tests/integration/context/test_plan_step_kernel_fallback.py
          pytest -q tests/integration/verification/test_automatic_reviewer_repair.py
      - name: Commit validated product fix and remove harnesses
        shell: bash
        run: |
          git rm \
            .github/workflows/tmp-pr714-context-fix-macos.yml \
            .github/workflows/tmp-pr714-context-fix-macos-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/context/source_adapters.py \
            src/ai_multi_agent_platform/deployment/context_operationalization.py \
            tests/integration/context/test_plan_step_kernel_fallback.py
          git commit -m 'fix(context): resolve kernel-native repair Plan Steps (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
