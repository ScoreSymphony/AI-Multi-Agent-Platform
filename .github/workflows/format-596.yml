name: Format issue 596

on:
  push:
    branches:
      - feat/596-compensation-orchestration

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/596-compensation-orchestration
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install 'ruff>=0.12,<1'
      - name: Ruff fix and format
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/compensation \
            tests/test_issue_596_compensation.py
          ruff format \
            src/ai_multi_agent_platform/compensation \
            tests/test_issue_596_compensation.py
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/compensation tests/test_issue_596_compensation.py
          git commit -m 'style(compensation): apply repository formatting (#596)'
          git push
