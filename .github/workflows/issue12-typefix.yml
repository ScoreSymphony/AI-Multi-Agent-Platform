name: Issue 12 Type Fix

on:
  push:
    branches:
      - feat/issue-12-capability-registry

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-12-capability-registry
      - name: Apply targeted type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('src/ai_multi_agent_platform/capabilities/registry.py')
          text = registry.read_text()
          text = text.replace(
              'from dataclasses import replace\n',
              'from dataclasses import replace\nfrom typing import cast\n',
          )
          text = text.replace(
              'from ai_multi_agent_platform.contracts.types import HealthStatus\n',
              'from ai_multi_agent_platform.contracts.types import HealthStatus, JsonValue\n',
          )
          text = text.replace(
              'details={"available_versions": versions},',
              'details={"available_versions": cast(JsonValue, versions)},',
          )
          registry.write_text(text)

          invocation = Path('src/ai_multi_agent_platform/capabilities/invocation.py')
          text = invocation.read_text()
          text = text.replace(
              'from jsonschema import Draft202012Validator\n',
              'from jsonschema import Draft202012Validator  # type: ignore[import-untyped]\n',
          )
          text = text.replace(
              'from jsonschema.exceptions import SchemaError, ValidationError\n',
              'from jsonschema.exceptions import SchemaError, ValidationError  # type: ignore[import-untyped]\n',
          )
          invocation.write_text(text)
          PY
      - name: Format changed Python
        run: |
          python -m pip install 'ruff>=0.12,<1'
          ruff format src/ai_multi_agent_platform/capabilities/registry.py src/ai_multi_agent_platform/capabilities/invocation.py
          ruff check --fix src/ai_multi_agent_platform/capabilities/registry.py src/ai_multi_agent_platform/capabilities/invocation.py
      - name: Commit type fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/capabilities/registry.py src/ai_multi_agent_platform/capabilities/invocation.py
          git commit -m "fix(#12): satisfy strict capability typing"
          git push
