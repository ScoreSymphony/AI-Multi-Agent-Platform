name: Pipelock profile bypass matrix

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-profile-bypass.yml"
      - "tests/test_issue_730_pipelock_profile_bypass.py"
      - "tests/fixtures/pipelock_profile_bypass_target.py"
      - "tests/fixtures/websocket_adversarial_server.py"
      - "tests/fixtures/pipelock_websocket_audit.yaml"
      - "src/ai_multi_agent_platform/adapters/hermes.py"
      - "docs/upstream/PIPELOCK_CORE_PROFILE_BYPASS_MATRIX.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-profile-bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "websockets==15.0.1"

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-profile-bypass-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-profile-bypass-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi
          sha256sum ./pipelock \
            "$GITHUB_WORKSPACE/tests/fixtures/pipelock_websocket_audit.yaml" \
            > "$RUNNER_TEMP/pipelock-profile-bypass-sha256.txt"

      - name: Exercise direct application and Hermes bypass paths
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
        run: |
          pytest -q tests/test_issue_730_pipelock_profile_bypass.py \
            --basetemp="$RUNNER_TEMP/pipelock-profile-bypass" \
            --junitxml="$RUNNER_TEMP/pipelock-profile-bypass-junit.xml"

      - name: Upload profile-bypass evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-profile-bypass-evidence
          path: |
            ${{ runner.temp }}/pipelock-profile-bypass-buildinfo.txt
            ${{ runner.temp }}/pipelock-profile-bypass-sha256.txt
            ${{ runner.temp }}/pipelock-profile-bypass-junit.xml
            ${{ runner.temp }}/pipelock-profile-bypass/**/*.log
            ${{ runner.temp }}/pipelock-profile-bypass/**/*.jsonl
            ${{ runner.temp }}/pipelock-profile-bypass/**/*.txt
          if-no-files-found: warn
