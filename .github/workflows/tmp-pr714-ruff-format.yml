name: Temporary PR 714 Ruff formatter

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Ruff used by current CI
        run: python -m pip install 'ruff==0.16.6'
      - name: Format only PR 714 Python changes
        run: |
          ruff format \
            src/ai_multi_agent_platform/verification/agent_repair.py \
            src/ai_multi_agent_platform/verification/agent_workflow.py \
            src/ai_multi_agent_platform/verification/reference_reviewer.py \
            tests/integration/verification/test_automatic_reviewer_repair.py \
            tests/test_issue_46_711_automatic_reviewer_vertical.py \
            tests/test_issue_711_agent_review_workflow.py \
            tests/test_issue_711_kernel_output_observer.py \
            tests/test_issue_711_reference_reviewer.py
      - name: Commit formatting when required
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/verification/agent_repair.py \
            src/ai_multi_agent_platform/verification/agent_workflow.py \
            src/ai_multi_agent_platform/verification/reference_reviewer.py \
            tests/integration/verification/test_automatic_reviewer_repair.py \
            tests/test_issue_46_711_automatic_reviewer_vertical.py \
            tests/test_issue_711_agent_review_workflow.py \
            tests/test_issue_711_kernel_output_observer.py \
            tests/test_issue_711_reference_reviewer.py
          git commit -m 'style: apply Ruff formatting to automatic review changes (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
