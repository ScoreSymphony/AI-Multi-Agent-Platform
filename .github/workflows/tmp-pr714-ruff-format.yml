name: Temporary PR 714 Ruff formatter

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pinned Ruff used by current CI
        run: python -m pip install 'ruff==0.16.6'
      - name: Format final PR file
        run: ruff format src/ai_multi_agent_platform/verification/evidence.py
      - name: Commit formatting when required
        shell: bash
        run: |
          if git diff --quiet --exit-code; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/verification/evidence.py
          git commit -m 'style: format reverification recovery (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
