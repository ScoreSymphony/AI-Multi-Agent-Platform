          new_aggregate = '''    def aggregate(self, query: UsageQuery) -> UsageAggregate:\n        records = self.store.query(query)\n        if query.metric_type is None or query.unit is None:\n            raise ValueError("aggregate query requires metric_type and unit")\n        return aggregate_usage_records(\n            records,\n            metric_type=query.metric_type,\n            unit=query.unit,\n            start=query.start,\n            end=query.end,\n        )\n'''
          replace_once(service, old_aggregate, new_aggregate)
          old_budget = '''        records = self.store.query(query)\n        consumed = 0.0\n        for record in records:\n            if record.quantity is None:\n                continue\n            if record.quality is MeasurementQuality.ESTIMATED and not budget.include_estimated:\n                continue\n            consumed += record.quantity\n        fraction = consumed / budget.limit\n'''
          new_budget = '''        records = tuple(\n            record\n            for record in self.store.query(query)\n            if record.quantity is not None\n            and (record.quality is not MeasurementQuality.ESTIMATED or budget.include_estimated)\n        )\n        consumed = _budget_quantity(records)\n        fraction = consumed / budget.limit\n'''
          replace_once(service, old_budget, new_budget)
          marker = '\n\ndef usage_from_metric(metric: MetricRecord) -> UsageRecord | None:\n'
          helper = '''\n\ndef aggregate_usage_records(\n    records: tuple[UsageRecord, ...],\n    *,\n    metric_type: str,\n    unit: str,\n    start=None,\n    end=None,\n) -> UsageAggregate:\n    """Aggregate one canonical metric without summing point-in-time gauges."""\n\n    modes = {record.aggregation_mode for record in records}\n    if len(modes) > 1:\n        raise ValueError("one metric/unit query cannot mix aggregation modes")\n    mode = next(iter(modes), AggregationMode.ADDITIVE)\n    quality_counts = {quality: 0 for quality in MeasurementQuality}\n    for record in records:\n        quality_counts[record.quality] += 1\n\n    if mode is AggregationMode.LATEST and records:\n        latest = max(records, key=lambda record: (record.timestamp, record.id))\n        total = latest.quantity\n    else:\n        values = [record.quantity for record in records if record.quantity is not None]\n        total = sum(values) if values else None\n\n    return UsageAggregate(\n        metric_type=metric_type,\n        unit=unit,\n        total=total,\n        record_count=len(records),\n        unavailable_count=quality_counts[MeasurementQuality.UNAVAILABLE],\n        quality_counts=quality_counts,\n        aggregation_mode=mode,\n        start=start,\n        end=end,\n    )\n\n\ndef _budget_quantity(records: tuple[UsageRecord, ...]) -> float:\n    if not records:\n        return 0.0\n    modes = {record.aggregation_mode for record in records}\n    if len(modes) > 1:\n        raise ValueError("budget cannot mix aggregation modes for one metric/unit")\n    mode = next(iter(modes))\n    if mode is AggregationMode.LATEST:\n        latest = max(records, key=lambda record: (record.timestamp, record.id))\n        assert latest.quantity is not None\n        return latest.quantity\n    total = 0.0\n    for record in records:\n        assert record.quantity is not None\n        total += record.quantity\n    return total\n'''
          replace_once(service, marker, helper + marker)

          control = "src/ai_multi_agent_platform/accounting/control_plane.py"
          replace_once(
              control,
              'from .service import AccountingService\n',
              'from .service import AccountingService, aggregate_usage_records\n',
          )
          old_visible = '''def _aggregate_visible(\n    records: tuple[UsageRecord, ...], metric_type: str, unit: str\n) -> UsageAggregate:\n    selected = tuple(\n        record for record in records if record.metric_type == metric_type and record.unit == unit\n    )\n    values = [record.quantity for record in selected if record.quantity is not None]\n    quality_counts = {quality: 0 for quality in MeasurementQuality}\n    for record in selected:\n        quality_counts[record.quality] += 1\n    return UsageAggregate(\n        metric_type=metric_type,\n        unit=unit,\n        total=sum(values) if values else None,\n        record_count=len(selected),\n        unavailable_count=quality_counts[MeasurementQuality.UNAVAILABLE],\n        quality_counts=quality_counts,\n    )\n'''
          new_visible = '''def _aggregate_visible(\n    records: tuple[UsageRecord, ...], metric_type: str, unit: str\n) -> UsageAggregate:\n    selected = tuple(\n        record for record in records if record.metric_type == metric_type and record.unit == unit\n    )\n    return aggregate_usage_records(selected, metric_type=metric_type, unit=unit)\n'''
          replace_once(control, old_visible, new_visible)
          replace_once(
              control,
              '        "quality_counts": quality_counts,\n'
              '    }\n',
              '        "quality_counts": quality_counts,\n'
              '        "aggregation_mode": aggregate.aggregation_mode.value,\n'
              '    }\n',
          )
          replace_once(
              control,
              '    MeasurementQuality,\n',
              '',
          )

          init = "src/ai_multi_agent_platform/accounting/__init__.py"
          replace_once(
              init,
              'from .models import (\n    BudgetAction,\n',
              'from .models import (\n    AggregationMode,\n    BudgetAction,\n',
          )
          replace_once(
              init,
              'from .service import AccountingService, ThresholdEventSink, usage_from_metric\n',
              'from .service import (\n'
              '    AccountingService,\n'
              '    ThresholdEventSink,\n'
              '    aggregate_usage_records,\n'
              '    usage_from_metric,\n'
              ')\n'
              'from .storage import FileStorageAccounting\n',
          )
          replace_once(
              init,
              '__all__ = [\n    "AccountingService",\n',
              '__all__ = [\n    "AccountingService",\n    "AggregationMode",\n',
          )
          replace_once(
              init,
              '    "BudgetThresholdEvent",\n',
              '    "BudgetThresholdEvent",\n    "FileStorageAccounting",\n',
          )
          replace_once(
              init,
              '    "accounting_resource_services",\n',
              '    "accounting_resource_services",\n    "aggregate_usage_records",\n',
          )
          PY

          cat > src/ai_multi_agent_platform/accounting/storage.py <<'PY'
          """Progressive #13 FileProvider storage measurements for Issue #76."""

          from __future__ import annotations

          import json
          from dataclasses import replace
          from datetime import datetime
          from uuid import NAMESPACE_URL, uuid5

          from ai_multi_agent_platform.contracts import ContractError, ErrorCode
          from ai_multi_agent_platform.data import DataAccessContext, FileProvider, FileState

          from .models import (
              AggregationMode,
              MeasurementQuality,
              UsageRecord,
              UsageScope,
              utc_now,
          )
          from .service import AccountingService

          FILE_STORAGE_METRIC = "storage.file.bytes.current"


          class FileStorageAccounting:
              """Reconcile current durable FileProvider bytes into a point-in-time gauge."""

              def __init__(self, accounting: AccountingService, provider: FileProvider) -> None:
                  self._accounting = accounting
                  self._provider = provider

              async def reconcile(
                  self,
                  context: DataAccessContext,
                  *,
                  scope: UsageScope | None = None,
                  observed_at: datetime | None = None,
                  quality: MeasurementQuality = MeasurementQuality.REPORTED,
              ) -> UsageRecord:
                  if quality not in {MeasurementQuality.MEASURED, MeasurementQuality.REPORTED}:
                      raise ValueError("FileProvider storage must be measured or provider-reported")
                  resolved_scope = _storage_scope(context, scope)
                  provider_id = self._provider.descriptor.provider_id
                  timestamp = observed_at or utc_now()
                  try:
                      files = await self._provider.list_files(context)
                  except ContractError:
                      self._accounting.record_unavailable(
                          metric_type=FILE_STORAGE_METRIC,
                          unit="bytes",
                          source="file-provider",
                          scope=resolved_scope,
                          provider=provider_id,
                          correlation_id=context.operation.correlation_id,
                          causation_id=context.operation.causation_id,
                          aggregation_mode=AggregationMode.LATEST,
                      )
                      raise

                  for record in files:
                      if record.project_id != context.project_id:
                          raise ContractError(
                              ErrorCode.CONTRACT_VIOLATION,
                              "FileProvider returned a record outside the requested project scope",
                          )
                  ready = tuple(record for record in files if record.state is FileState.READY)
                  quantity = float(sum(record.size_bytes for record in ready))
                  identity = json.dumps(
                      {
                          "provider_id": provider_id,
                          "scope": resolved_scope.fields(),
                          "observed_at": timestamp.isoformat(),
                          "files": [
                              [record.file_id, record.size_bytes, record.sha256, record.state.value]
                              for record in sorted(ready, key=lambda item: item.file_id)
                          ],
                      },
                      sort_keys=True,
                      separators=(",", ":"),
                  )
                  usage = UsageRecord(
                      id=f"usage_{uuid5(NAMESPACE_URL, identity)}",
                      metric_type=FILE_STORAGE_METRIC,
                      unit="bytes",
                      quality=quality,
                      source="file-provider",
                      quantity=quantity,
                      scope=resolved_scope,
                      aggregation_mode=AggregationMode.LATEST,
                      timestamp=timestamp,
                      provider=provider_id,
                      correlation_id=context.operation.correlation_id,
                      causation_id=context.operation.causation_id,
                      provenance={
                          "provider_type": self._provider.descriptor.provider_type,
                          "ready_file_count": len(ready),
                          "listed_file_count": len(files),
                      },
                  )
                  self._accounting.record(usage)
                  return usage


          def _storage_scope(context: DataAccessContext, scope: UsageScope | None) -> UsageScope:
              resolved = scope or UsageScope()
              if resolved.project_id is not None and resolved.project_id != context.project_id:
                  raise ValueError("storage accounting scope must match the FileProvider project scope")
              if context.project_id is None:
                  if resolved.project_id is not None:
                      raise ValueError("unscoped FileProvider context cannot claim project usage")
                  return resolved
              if resolved.project_id is None:
                  return replace(resolved, project_id=context.project_id)
              return resolved
          PY

          cat > tests/test_issue76_storage_accounting.py <<'PY'
          from __future__ import annotations

          import asyncio
          from datetime import UTC, datetime, timedelta

          import pytest

          from ai_multi_agent_platform.accounting import (
              AccountingService,
              AggregationMode,
              FileStorageAccounting,
              InMemoryUsageStore,
              MeasurementQuality,
              SQLiteUsageStore,
              ThresholdLevel,
              UsageBudget,
              UsageQuery,
              UsageRecord,
              UsageScope,
          )
          from ai_multi_agent_platform.contracts import OperationContext
          from ai_multi_agent_platform.data import DataAccessContext, LocalFileProvider
          from ai_multi_agent_platform.domain import new_id


          def _context(project_id: str) -> DataAccessContext:
              operation = OperationContext(
                  correlation_id="storage-accounting",
                  owner_type="user",
                  owner_id="alice",
                  project_id=project_id,
              )
              return DataAccessContext(operation=operation, actor_ref="user:alice")


          def test_current_file_storage_uses_latest_snapshot_not_sum(tmp_path) -> None:
              project_id = new_id("project")
              context = _context(project_id)
              provider = LocalFileProvider(tmp_path / "files", tmp_path / "files.sqlite3")
              accounting = AccountingService(InMemoryUsageStore())
              storage = FileStorageAccounting(accounting, provider)
              first_file = asyncio.run(provider.create_file(b"a" * 10, context))
              asyncio.run(provider.create_file(b"b" * 20, context))
              first_time = datetime(2026, 9, 3, 2, 0, tzinfo=UTC)
              first = asyncio.run(storage.reconcile(context, observed_at=first_time))
              assert first.quantity == 30.0
              assert first.aggregation_mode is AggregationMode.LATEST
              assert first.quality is MeasurementQuality.REPORTED

              asyncio.run(provider.delete_file(first_file.file_id, context))
              second = asyncio.run(
                  storage.reconcile(context, observed_at=first_time + timedelta(minutes=1))
              )
              assert second.quantity == 20.0
              aggregate = accounting.aggregate(
                  UsageQuery(
                      metric_type="storage.file.bytes.current",
                      unit="bytes",
                      scope=UsageScope(project_id=project_id),
                  )
              )
              assert aggregate.total == 20.0
              assert aggregate.record_count == 2
              assert aggregate.aggregation_mode is AggregationMode.LATEST


          def test_latest_unavailable_measurement_is_not_fabricated_as_zero() -> None:
              accounting = AccountingService(InMemoryUsageStore())
              start = datetime(2026, 9, 3, 2, 0, tzinfo=UTC)
              accounting.record(
                  UsageRecord(
                      metric_type="node.memory.bytes.current",
                      unit="bytes",
                      quality=MeasurementQuality.REPORTED,
                      source="node",
                      quantity=128.0,
                      aggregation_mode=AggregationMode.LATEST,
                      timestamp=start,
                  )
              )
              accounting.record(
                  UsageRecord(
                      metric_type="node.memory.bytes.current",
                      unit="bytes",
                      quality=MeasurementQuality.UNAVAILABLE,
                      source="node",
                      quantity=None,
                      aggregation_mode=AggregationMode.LATEST,
                      timestamp=start + timedelta(seconds=1),
                  )
              )
              aggregate = accounting.aggregate(
                  UsageQuery(metric_type="node.memory.bytes.current", unit="bytes")
              )
              assert aggregate.total is None
              assert aggregate.unavailable_count == 1


          def test_storage_budget_uses_current_value_and_can_recover_below_threshold(tmp_path) -> None:
              project_id = new_id("project")
              context = _context(project_id)
              provider = LocalFileProvider(tmp_path / "files", tmp_path / "files.sqlite3")
              events = []
              accounting = AccountingService(InMemoryUsageStore(), threshold_event_sink=events.append)
              accounting.put_budget(
                  UsageBudget(
                      metric_type="storage.file.bytes.current",
                      unit="bytes",
                      scope_type="project",
                      scope_id=project_id,
                      limit=30.0,
                  )
              )
              storage = FileStorageAccounting(accounting, provider)
              first = asyncio.run(provider.create_file(b"a" * 10, context))
              asyncio.run(provider.create_file(b"b" * 20, context))
              observed = datetime(2026, 9, 3, 2, 0, tzinfo=UTC)
              asyncio.run(storage.reconcile(context, observed_at=observed))
              assert [event.level for event in events] == [ThresholdLevel.EXCEEDED]

              asyncio.run(provider.delete_file(first.file_id, context))
              asyncio.run(storage.reconcile(context, observed_at=observed + timedelta(minutes=1)))
              budget = accounting.store.list_budgets()[0]
              state = accounting.budget_state(budget.id)
              assert state.consumed == 20.0
              assert state.level is None


          def test_storage_reconciliation_does_not_infer_usage_owner_from_measuring_actor(tmp_path) -> None:
              project_id = new_id("project")
              context = _context(project_id)
              provider = LocalFileProvider(tmp_path / "files", tmp_path / "files.sqlite3")
              accounting = AccountingService(InMemoryUsageStore())
              asyncio.run(provider.create_file(b"abc", context))
              usage = asyncio.run(FileStorageAccounting(accounting, provider).reconcile(context))
              assert usage.scope.project_id == project_id
              assert usage.scope.owner_type is None
              assert usage.scope.owner_id is None
              assert usage.provenance["ready_file_count"] == 1


          def test_storage_scope_can_be_explicitly_owner_attributed(tmp_path) -> None:
              project_id = new_id("project")
              context = _context(project_id)
              provider = LocalFileProvider(tmp_path / "files", tmp_path / "files.sqlite3")
              accounting = AccountingService(InMemoryUsageStore())
              usage = asyncio.run(
                  FileStorageAccounting(accounting, provider).reconcile(
                      context,
                      scope=UsageScope(
                          project_id=project_id,
                          owner_type="user",
                          owner_id="alice",
                      ),
                  )
              )
              assert usage.quantity == 0.0
              assert usage.scope.owner_id == "alice"


          def test_storage_scope_cannot_claim_another_project(tmp_path) -> None:
              project_id = new_id("project")
              provider = LocalFileProvider(tmp_path / "files", tmp_path / "files.sqlite3")
              storage = FileStorageAccounting(AccountingService(InMemoryUsageStore()), provider)
              with pytest.raises(ValueError):
                  asyncio.run(
                      storage.reconcile(
                          _context(project_id),
                          scope=UsageScope(project_id=new_id("project")),
                      )
                  )


          def test_sqlite_round_trip_preserves_latest_aggregation_mode(tmp_path) -> None:
              path = tmp_path / "usage.sqlite3"
              service = AccountingService(SQLiteUsageStore(path))
              record = UsageRecord(
                  metric_type="storage.file.bytes.current",
                  unit="bytes",
                  quality=MeasurementQuality.REPORTED,
                  source="file-provider",
                  quantity=12.0,
                  aggregation_mode=AggregationMode.LATEST,
              )
              service.record(record)
              restarted = AccountingService(SQLiteUsageStore(path))
              stored = restarted.query(
                  UsageQuery(metric_type="storage.file.bytes.current", unit="bytes")
              )[0]
              assert stored.aggregation_mode is AggregationMode.LATEST
              assert restarted.aggregate(
                  UsageQuery(metric_type="storage.file.bytes.current", unit="bytes")
              ).total == 12.0


          def test_one_metric_unit_cannot_mix_additive_and_latest_semantics() -> None:
              service = AccountingService(InMemoryUsageStore())
              for mode in (AggregationMode.ADDITIVE, AggregationMode.LATEST):
                  service.record(
                      UsageRecord(
                          metric_type="test.mixed",
                          unit="count",
                          quality=MeasurementQuality.MEASURED,
                          source="test",
                          quantity=1.0,
                          aggregation_mode=mode,
                      )
                  )
              with pytest.raises(ValueError, match="mix aggregation modes"):
                  service.aggregate(UsageQuery(metric_type="test.mixed", unit="count"))
          PY

          cat >> docs/ACCOUNTING.md <<'MD'

          ## Point-in-time resources and storage

          Repeated accounting records now declare an aggregation mode. `additive` is used for counters and consumptive quantities such as calls, tokens and durations. `latest` is used for point-in-time state such as current storage bytes and, later, RAM/VRAM/utilization gauges. A canonical metric/unit query may not mix both modes.

          `FileStorageAccounting` consumes the completed #13 `FileProvider` boundary and records `storage.file.bytes.current` in bytes. It sums only READY canonical `FileRecord.size_bytes` values visible through the provider's scoped `list_files()` call. Tombstoned or pending files are not counted. The measurement is provider-reported by default because a replaceable FileProvider may obtain size metadata differently; callers may mark it measured only when their provider contract justifies that classification.

          Storage reconciliation does not infer usage ownership from `DataAccessContext.actor_ref`: the actor performing a measurement is not necessarily the owner of the measured resources. Project scope is inherited from the FileProvider request; user/team/organization ownership must be supplied explicitly when the caller actually knows it.

          Provider errors may record an unavailable latest measurement but are re-raised. An unavailable gauge therefore never becomes a fabricated zero. Budget evaluation retains its last available value until a new available gauge is reported, while aggregate/current-state queries expose a latest unavailable sample as unavailable.
          MD

          cat > docs/ISSUE_76_STORAGE_PROGRESS.md <<'MD'
          # Issue #76 storage accounting progress

          This progressive slice connects the completed #13 FileProvider contract to the #76 accounting foundation without making filesystem paths or one storage backend canonical.

          ## Added

          - explicit `additive` versus `latest` aggregation semantics;
          - latest-value budget semantics for point-in-time gauges;
          - SQLite round-trip support for the aggregation mode;
          - `FileStorageAccounting` over canonical `FileRecord.size_bytes`;
          - current file-storage metric `storage.file.bytes.current` with unit `bytes`;
          - project-scope validation and explicit ownership attribution;
          - no actor-to-owner inference;
          - tombstone/removal decreases current storage rather than accumulating historical bytes;
          - unavailable latest values remain unavailable rather than zero.

          ## Boundary

          This does not yet account for WorkspaceSnapshot logical storage, Knowledge/index storage, network transfer, remote Worker/Node storage, or physical backend allocation/replication overhead. Those quantities require their owning domains to expose reliable semantics before #76 records them.

          Issue #76 remains open for the other progressive measurement sources and Resources UI.
          MD

