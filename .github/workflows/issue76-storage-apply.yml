name: Issue 76 storage accounting apply

on:
  push:
    branches: [feat/issue-76-storage-accounting]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-storage-accounting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply and verify storage accounting
        shell: bash
        run: |
          python .github/issue76_storage_apply.py
          ruff format src/ai_multi_agent_platform/accounting tests/test_issue76_storage_accounting.py
          ruff check src/ai_multi_agent_platform/accounting tests/test_issue76_storage_accounting.py
          mypy
          pytest tests/test_issue76_accounting.py tests/test_issue76_storage_accounting.py
          python -m build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/accounting tests/test_issue76_storage_accounting.py docs/ACCOUNTING.md docs/ISSUE_76_STORAGE_PROGRESS.md
          git commit -m "feat: add #76 current file storage accounting"
          git push origin HEAD:feat/issue-76-storage-accounting
