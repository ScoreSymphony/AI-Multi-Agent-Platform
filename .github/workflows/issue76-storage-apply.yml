name: Issue 76 storage accounting apply

on:
  push:
    branches: [feat/issue-76-storage-accounting]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-storage-accounting
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply accounting semantics and storage integration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if text.count(old) != 1:
