name: Issue 76 branch formatter

on:
  push:
    branches: [feat/issue-76-accounting-foundation]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-76-accounting-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository development tools
        run: python -m pip install -e ".[dev]"
      - name: Apply repository formatting and safe lint fixes
        run: |
          ruff format src/ai_multi_agent_platform/accounting tests/test_issue76_accounting.py
          ruff check --fix src/ai_multi_agent_platform/accounting tests/test_issue76_accounting.py
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/accounting tests/test_issue76_accounting.py
          git commit -m "style: apply repository formatting for #76"
          git push origin HEAD:feat/issue-76-accounting-foundation
