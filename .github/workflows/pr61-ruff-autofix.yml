name: PR61 Ruff Autofix

on:
  push:
    branches: [fix/main-ci-format-after-issue-6]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/main-ci-format-after-issue-6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply repository Ruff rules
        run: |
          python -m pip install "ruff==0.16.5"
          ruff check --fix .
          ruff format .
      - name: Commit exact autofixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff autofixes"
            git push origin HEAD:fix/main-ci-format-after-issue-6
          fi
