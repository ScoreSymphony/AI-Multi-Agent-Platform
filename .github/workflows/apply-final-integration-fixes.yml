name: Apply final integration fixes

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/apply-final-integration-fixes.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Apply integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"anchor missing in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # #594: persist the manifest-comparison lens alongside ComparisonReport.
          replace_once(
              'src/ai_multi_agent_platform/evaluation/contracts.py',
              '    def save_comparison(self, comparison: ComparisonReport) -> None: ...\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None: ...\n',
              '''    def save_comparison(\n        self,\n        comparison: ComparisonReport,\n        *,\n        candidate_reference_kinds: frozenset[str] = frozenset(),\n        performance_sensitive: bool = False,\n    ) -> None: ...\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None: ...\n\n    def get_comparison_lens(\n        self, current_run_id: str\n    ) -> tuple[frozenset[str], bool] | None: ...\n''',
          )

          replace_once(
              'src/ai_multi_agent_platform/evaluation/repository.py',
              '        self._comparisons: dict[str, ComparisonReport] = {}\n        self._lock = RLock()\n',
              '        self._comparisons: dict[str, ComparisonReport] = {}\n        self._comparison_lenses: dict[str, tuple[frozenset[str], bool]] = {}\n        self._lock = RLock()\n',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/repository.py',
              '''    def save_comparison(self, comparison: ComparisonReport) -> None:\n        with self._lock:\n            self._comparisons[comparison.current_run_id] = comparison\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None:\n        with self._lock:\n            return self._comparisons.get(current_run_id)\n''',
              '''    def save_comparison(\n        self,\n        comparison: ComparisonReport,\n        *,\n        candidate_reference_kinds: frozenset[str] = frozenset(),\n        performance_sensitive: bool = False,\n    ) -> None:\n        with self._lock:\n            self._comparisons[comparison.current_run_id] = comparison\n            self._comparison_lenses[comparison.current_run_id] = (\n                candidate_reference_kinds,\n                performance_sensitive,\n            )\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None:\n        with self._lock:\n            return self._comparisons.get(current_run_id)\n\n    def get_comparison_lens(\n        self, current_run_id: str\n    ) -> tuple[frozenset[str], bool] | None:\n        with self._lock:\n            return self._comparison_lenses.get(current_run_id)\n''',
          )

          replace_once(
              'src/ai_multi_agent_platform/evaluation/sqlite_repository.py',
              'import sqlite3\n',
              'import json\nimport sqlite3\n',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/sqlite_repository.py',
              '''                connection.execute(\n                    """\n                    CREATE TABLE IF NOT EXISTS evaluation_comparisons (\n                        current_run_id TEXT PRIMARY KEY,\n                        baseline_run_id TEXT NOT NULL,\n                        policy_id TEXT NOT NULL,\n                        policy_version TEXT NOT NULL,\n                        comparison_json TEXT NOT NULL\n                    )\n                    """\n                )\n''',
              '''                connection.execute(\n                    """\n                    CREATE TABLE IF NOT EXISTS evaluation_comparisons (\n                        current_run_id TEXT PRIMARY KEY,\n                        baseline_run_id TEXT NOT NULL,\n                        policy_id TEXT NOT NULL,\n                        policy_version TEXT NOT NULL,\n                        comparison_json TEXT NOT NULL\n                    )\n                    """\n                )\n                connection.execute(\n                    """\n                    CREATE TABLE IF NOT EXISTS evaluation_comparison_lenses (\n                        current_run_id TEXT PRIMARY KEY,\n                        candidate_reference_kinds_json TEXT NOT NULL,\n                        performance_sensitive INTEGER NOT NULL\n                    )\n                    """\n                )\n''',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/sqlite_repository.py',
              '''    def save_comparison(self, comparison: ComparisonReport) -> None:\n        self._require_run(comparison.current_run_id)\n        self._require_run(comparison.baseline_run_id)\n        raw = self._encode_comparison(comparison)\n        try:\n            with self._connect() as connection:\n                connection.execute(\n                    """\n                    INSERT INTO evaluation_comparisons(\n                        current_run_id, baseline_run_id, policy_id, policy_version, comparison_json\n                    ) VALUES (?, ?, ?, ?, ?)\n                    ON CONFLICT(current_run_id) DO UPDATE SET\n                        baseline_run_id = excluded.baseline_run_id,\n                        policy_id = excluded.policy_id,\n                        policy_version = excluded.policy_version,\n                        comparison_json = excluded.comparison_json\n                    """,\n                    (\n                        comparison.current_run_id,\n                        comparison.baseline_run_id,\n                        comparison.policy_id,\n                        comparison.policy_version,\n                        raw,\n                    ),\n                )\n        except sqlite3.Error as exc:\n            raise ContractError(\n                ErrorCode.BACKEND_ERROR,\n                "failed to persist evaluation comparison",\n            ) from exc\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None:\n''',
              '''    def save_comparison(\n        self,\n        comparison: ComparisonReport,\n        *,\n        candidate_reference_kinds: frozenset[str] = frozenset(),\n        performance_sensitive: bool = False,\n    ) -> None:\n        self._require_run(comparison.current_run_id)\n        self._require_run(comparison.baseline_run_id)\n        raw = self._encode_comparison(comparison)\n        lens_raw = json.dumps(sorted(candidate_reference_kinds), separators=(",", ":"))\n        try:\n            with self._connect() as connection:\n                connection.execute(\n                    """\n                    INSERT INTO evaluation_comparisons(\n                        current_run_id, baseline_run_id, policy_id, policy_version, comparison_json\n                    ) VALUES (?, ?, ?, ?, ?)\n                    ON CONFLICT(current_run_id) DO UPDATE SET\n                        baseline_run_id = excluded.baseline_run_id,\n                        policy_id = excluded.policy_id,\n                        policy_version = excluded.policy_version,\n                        comparison_json = excluded.comparison_json\n                    """,\n                    (\n                        comparison.current_run_id,\n                        comparison.baseline_run_id,\n                        comparison.policy_id,\n                        comparison.policy_version,\n                        raw,\n                    ),\n                )\n                connection.execute(\n                    """\n                    INSERT INTO evaluation_comparison_lenses(\n                        current_run_id, candidate_reference_kinds_json, performance_sensitive\n                    ) VALUES (?, ?, ?)\n                    ON CONFLICT(current_run_id) DO UPDATE SET\n                        candidate_reference_kinds_json = excluded.candidate_reference_kinds_json,\n                        performance_sensitive = excluded.performance_sensitive\n                    """,\n                    (comparison.current_run_id, lens_raw, int(performance_sensitive)),\n                )\n        except sqlite3.Error as exc:\n            raise ContractError(\n                ErrorCode.BACKEND_ERROR,\n                "failed to persist evaluation comparison",\n            ) from exc\n\n    def get_comparison(self, current_run_id: str) -> ComparisonReport | None:\n''',
          )
          p = Path('src/ai_multi_agent_platform/evaluation/sqlite_repository.py')
          text = p.read_text()
          text += '''\n\n    def get_comparison_lens(\n        self, current_run_id: str\n    ) -> tuple[frozenset[str], bool] | None:\n        try:\n            with self._connect() as connection:\n                row = connection.execute(\n                    "SELECT candidate_reference_kinds_json, performance_sensitive "\n                    "FROM evaluation_comparison_lenses WHERE current_run_id = ?",\n                    (current_run_id,),\n                ).fetchone()\n        except sqlite3.Error as exc:\n            raise ContractError(\n                ErrorCode.BACKEND_ERROR,\n                "failed to read evaluation comparison lens",\n            ) from exc\n        if row is None:\n            return None\n        try:\n            raw_kinds = json.loads(str(row["candidate_reference_kinds_json"]))\n        except json.JSONDecodeError as exc:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "stored evaluation comparison lens is invalid",\n            ) from exc\n        if not isinstance(raw_kinds, list) or any(\n            not isinstance(item, str) or not item.strip() for item in raw_kinds\n        ):\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "stored evaluation comparison lens is invalid",\n            )\n        return frozenset(raw_kinds), bool(row["performance_sensitive"])\n'''
          p.write_text(text)

          replace_once(
              'src/ai_multi_agent_platform/evaluation/service.py',
              '''class EvaluationRunDetail:\n    """One durable run with raw/derived evidence currently addressable through the repository."""\n\n    run: EvaluationRun\n    results: tuple[EvaluationResult, ...]\n    comparison: ComparisonReport | None\n    aggregates: tuple[AggregatedEvaluationResult, ...] = ()\n    manifest: EvalManifest | None = None\n''',
              '''class EvaluationRunDetail:\n    """One durable run with raw/derived evidence currently addressable through the repository."""\n\n    run: EvaluationRun\n    results: tuple[EvaluationResult, ...]\n    comparison: ComparisonReport | None\n    aggregates: tuple[AggregatedEvaluationResult, ...] = ()\n    manifest: EvalManifest | None = None\n    manifest_comparison: ManifestComparison | None = None\n''',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/service.py',
              '''        return EvaluationRunDetail(\n            run=run,\n            results=self._repository.list_results(run_id),\n            comparison=self._repository.get_comparison(run_id),\n            aggregates=self._repository.list_aggregates(run_id),\n            manifest=self._runner.get_manifest(run_id),\n        )\n''',
              '''        comparison = self._repository.get_comparison(run_id)\n        manifest_comparison = None\n        if comparison is not None:\n            lens = self._repository.get_comparison_lens(run_id)\n            if lens is not None:\n                candidate_reference_kinds, performance_sensitive = lens\n                manifest_comparison = self.compare_manifests(\n                    current_run_id=run_id,\n                    baseline_run_id=comparison.baseline_run_id,\n                    candidate_reference_kinds=candidate_reference_kinds,\n                    performance_sensitive=performance_sensitive,\n                )\n        return EvaluationRunDetail(\n            run=run,\n            results=self._repository.list_results(run_id),\n            comparison=comparison,\n            aggregates=self._repository.list_aggregates(run_id),\n            manifest=self._runner.get_manifest(run_id),\n            manifest_comparison=manifest_comparison,\n        )\n''',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/service.py',
              '        self._repository.save_comparison(comparison)\n        return comparison\n',
              '''        self._repository.save_comparison(\n            comparison,\n            candidate_reference_kinds=candidate_reference_kinds,\n            performance_sensitive=performance_sensitive,\n        )\n        return comparison\n''',
          )
          replace_once(
              'src/ai_multi_agent_platform/evaluation/runner.py',
              '            self._repository.save_comparison(comparison)\n\n        return EvaluationRunSummary(\n',
              '''            self._repository.save_comparison(\n                comparison,\n                candidate_reference_kinds=candidate_reference_kinds,\n                performance_sensitive=performance_sensitive_comparison,\n            )\n\n        return EvaluationRunSummary(\n''',
          )
          replace_once(
              'src/ai_multi_agent_platform/control_plane/evaluation_contract.py',
              '''    resource["comparison"] = (\n        None if detail.comparison is None else _comparison_resource(detail.comparison)\n    )\n''',
              '''    if detail.comparison is None:\n        resource["comparison"] = None\n    else:\n        comparison_resource = _comparison_resource(detail.comparison)\n        if detail.manifest_comparison is not None:\n            comparison_resource["manifest_comparison"] = cast(\n                JsonValue,\n                _manifest_comparison_resource(detail.manifest_comparison),\n            )\n        resource["comparison"] = comparison_resource\n''',
          )

          # #439: assert the canonical Task objective survives rendered Context composition.
          replace_once(
              'tests/test_issue_439_single_node.py',
              '        assert model_provider.calls[-1].messages[-1] == planned_step.objective\n',
              '''        assert any(\n            planned_step.objective in message\n            for message in model_provider.calls[-1].messages\n        )\n        assert any(\n            message.startswith("[context:") for message in model_provider.calls[-1].messages\n        )\n''',
          )

          # #595: use the current routing-profile revision reference contract.
          replace_once(
              'tests/test_issue_595_governed_learning.py',
              '    ModelRoutingProfilePolicy,\n    ModelRoutingProfileService,\n',
              '    ModelRoutingProfilePolicy,\n    ModelRoutingProfileRef,\n    ModelRoutingProfileService,\n',
          )
          replace_once(
              'tests/test_issue_595_governed_learning.py',
              '    latest = routing_repository.get_revision(definition.current_ref)\n',
              '''    latest = routing_repository.get_revision(\n        ModelRoutingProfileRef(definition.profile_id, definition.current_revision)\n    )\n''',
          )

          # #19: use the same canonical principal normalization as provider authorization.
          replace_once(
              'src/ai_multi_agent_platform/context/lifecycle.py',
              '    return ActorIdentity(context.owner_id, actor_type)\n',
              '''    actor_ref = context.owner_id\n    if ":" not in actor_ref and not actor_ref.startswith(f"{context.owner_type}_"):\n        actor_ref = f"{context.owner_type}:{actor_ref}"\n    return ActorIdentity(actor_ref, actor_type)\n''',
          )
          PY
          ruff format src/ai_multi_agent_platform/evaluation/contracts.py src/ai_multi_agent_platform/evaluation/repository.py src/ai_multi_agent_platform/evaluation/sqlite_repository.py src/ai_multi_agent_platform/evaluation/service.py src/ai_multi_agent_platform/evaluation/runner.py src/ai_multi_agent_platform/control_plane/evaluation_contract.py src/ai_multi_agent_platform/context/lifecycle.py tests/test_issue_439_single_node.py tests/test_issue_595_governed_learning.py
          ruff check --fix src/ai_multi_agent_platform/evaluation/contracts.py src/ai_multi_agent_platform/evaluation/repository.py src/ai_multi_agent_platform/evaluation/sqlite_repository.py src/ai_multi_agent_platform/evaluation/service.py src/ai_multi_agent_platform/evaluation/runner.py src/ai_multi_agent_platform/control_plane/evaluation_contract.py src/ai_multi_agent_platform/context/lifecycle.py tests/test_issue_439_single_node.py tests/test_issue_595_governed_learning.py
      - name: Targeted validation
        run: |
          pytest -q tests/test_evaluation_control_plane_api.py tests/test_issue_594_eval_reproducibility.py tests/test_issue_19_product_completion.py::test_agent_model_target_runs_through_product_evaluation_and_server_snapshot tests/test_issue_439_single_node.py tests/test_issue_595_governed_learning.py
          mypy src/ai_multi_agent_platform/evaluation src/ai_multi_agent_platform/control_plane/evaluation_contract.py src/ai_multi_agent_platform/context/lifecycle.py
      - name: Commit fixes
        run: |
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add src tests
          git diff --cached --check
          git commit -m "fix: close final integration validation gaps"
          git push origin HEAD:integration/active-branches-2026-09-08
