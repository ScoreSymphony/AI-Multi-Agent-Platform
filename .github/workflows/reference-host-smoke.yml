name: Reference host smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reference-host-absolute-budget-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate absolute budget implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py tests/performance/test_issue_440_reference_host_absolute_budget.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py tests/performance/test_issue_440_reference_host_absolute_budget.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget.py src/ai_multi_agent_platform/benchmarking/reference_host_absolute_budget_cli.py
          pytest tests/performance/test_issue_440_reference_host_absolute_budget.py
          platform-reference-host-absolute-budget --help >/dev/null
      - name: Verify no built-in absolute budget policy is shipped
        run: |
          python - <<'PY'
          from pathlib import Path

          roots = (Path("docs"), Path("src/ai_multi_agent_platform/benchmarking"))
          candidates = tuple(
              path
              for root in roots
              for path in root.rglob("*absolute-budget-policy*.json")
          )
          schema_files = tuple(path for path in candidates if path.name.endswith(".schema.json"))
          policy_instances = tuple(path for path in candidates if path not in schema_files)
          assert not policy_instances, policy_instances
          PY

  reference-host-campaign-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate campaign implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_campaign.py src/ai_multi_agent_platform/benchmarking/reference_host_campaign_cli.py src/ai_multi_agent_platform/benchmarking/reference_host_storage.py tests/performance/test_issue_440_reference_host_campaign.py tests/performance/test_reference_host_storage.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_campaign.py src/ai_multi_agent_platform/benchmarking/reference_host_campaign_cli.py src/ai_multi_agent_platform/benchmarking/reference_host_storage.py tests/performance/test_issue_440_reference_host_campaign.py tests/performance/test_reference_host_storage.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_campaign.py src/ai_multi_agent_platform/benchmarking/reference_host_campaign_cli.py src/ai_multi_agent_platform/benchmarking/reference_host_storage.py
          pytest tests/performance/test_issue_440_reference_host_campaign.py tests/performance/test_reference_host_storage.py
      - name: Generate tiny reference-host campaign
        run: |
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-campaign-work" \
            --output-dir artifacts/benchmarks/pr-reference-host-campaign
      - name: Validate machine-readable campaign evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path("artifacts/benchmarks/pr-reference-host-campaign")
          campaign = json.loads((root / "campaign.json").read_text(encoding="utf-8"))
          envelope = json.loads((root / "operating-envelope.json").read_text(encoding="utf-8"))
          campaign_schema = json.loads(
              Path("docs/schemas/benchmark-reference-host-campaign.v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          envelope_schema = json.loads(
              Path("docs/schemas/benchmark-operating-envelope.v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator(campaign_schema).validate(campaign)
          Draft202012Validator(envelope_schema).validate(envelope)
          assert campaign["profile"] == "smoke"
          assert campaign["platform_commit"] == os.environ["GITHUB_SHA"]
          for field in ("sweep_summary", "soak_report", "operating_envelope"):
              evidence = campaign[field]
              artifact = root / evidence["path"]
              assert hashlib.sha256(artifact.read_bytes()).hexdigest() == evidence["sha256"]
          assert campaign["environment"] == envelope["environment"]
          assert campaign["environment_fingerprint_sha256"] == envelope[
              "environment_fingerprint_sha256"
          ]
          storage = campaign["environment"]["storage_target"]
          assert storage["identity_version"] == "1"
          assert storage["identity_source"] in {
              "linux-mountinfo",
              "filesystem-stat-fallback",
          }
          assert len(storage["mount_fingerprint_sha256"]) == 64
          assert storage["total_bytes"] > 0
          serialized = json.dumps(storage, sort_keys=True)
          assert os.environ["RUNNER_TEMP"] not in serialized
          PY
      - name: Upload reference-host campaign evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-reference-host-campaign
          path: artifacts/benchmarks/pr-reference-host-campaign
          if-no-files-found: ignore

  reference-host-regression-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate regression implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_regression.py src/ai_multi_agent_platform/benchmarking/reference_host_regression_cli.py tests/performance/test_issue_440_reference_host_regression.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_regression.py src/ai_multi_agent_platform/benchmarking/reference_host_regression_cli.py tests/performance/test_issue_440_reference_host_regression.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_regression.py src/ai_multi_agent_platform/benchmarking/reference_host_regression_cli.py
          pytest tests/performance/test_issue_440_reference_host_regression.py
      - name: Verify no built-in regression policy is shipped
        run: |
          python - <<'PY'
          from pathlib import Path

          candidates = tuple(Path("docs").rglob("*regression-policy*.json"))
          schema_files = tuple(path for path in candidates if path.name.endswith(".schema.json"))
          policy_instances = tuple(path for path in candidates if path not in schema_files)
          assert not policy_instances, policy_instances
          PY

  reference-host-reproducibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate reproducibility implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py tests/performance/test_issue_440_reference_host_reproducibility.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py tests/performance/test_issue_440_reference_host_reproducibility.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py
          pytest tests/performance/test_issue_440_reference_host_reproducibility.py
      - name: Generate two tiny same-host campaign samples
        run: |
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-1-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-1
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-2-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-2
      - name: Analyze observed same-host variability
        run: |
          platform-reference-host-reproducibility \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-1 \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-2 \
            --output artifacts/benchmarks/reference-host-repro/reproducibility.json
      - name: Validate machine-readable reproducibility evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path("artifacts/benchmarks/reference-host-repro")
          report = json.loads((root / "reproducibility.json").read_text(encoding="utf-8"))
          schema = json.loads(
              Path("docs/schemas/benchmark-reference-host-reproducibility.v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator(schema).validate(report)
          assert report["basis"]["profile"] == "smoke"
          assert report["campaign_count"] == 2
          assert report["variability_observed"] is True
          assert report["comparison_status"] == "smoke-contract-only"
          assert report["budget_status"] == "not-established"
          assert report["stability_classification"] == "not-performed"
          assert report["correctness_passed"] is True
          PY
      - name: Upload reproducibility smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-reference-host-reproducibility
          path: artifacts/benchmarks/reference-host-repro
          if-no-files-found: ignore
