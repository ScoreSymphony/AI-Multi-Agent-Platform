name: Apply issue 596 idempotency hardening

on:
  push:
    branches:
      - fix/596-compensation-idempotency-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/596-compensation-idempotency-hardening
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/_apply_issue_596_idempotency.py
      - name: Run focused quality checks
        run: |
          python -m pip install 'pytest>=8.3,<10' 'ruff>=0.12,<1' 'jsonschema==4.26.0'
          ruff check src/ai_multi_agent_platform/compensation tests/test_issue_596_compensation.py
          ruff format --check src/ai_multi_agent_platform/compensation tests/test_issue_596_compensation.py
          PYTHONPATH=src pytest -q tests/test_issue_596_compensation.py
      - name: Commit patch when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/compensation/service.py \
            src/ai_multi_agent_platform/compensation/repository.py \
            docs/runtime/COMPENSATION.md \
            tests/test_issue_596_compensation.py
          git commit -m 'fix(compensation): harden request idempotency (#596)'
          git push