name: Issue 5 Ruff fix

on:
  push:
    branches:
      - fix/issue-5-main-reconciliation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5-main-reconciliation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff==0.16.5"
      - name: Apply safe Ruff fixes
        run: |
          ruff check --fix .
          ruff format .
      - name: Commit fixes and remove helper
        run: |
          git rm -f .github/workflows/issue5-ruff-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply issue 5 reconciliation lint fixes"
          git push origin HEAD:fix/issue-5-main-reconciliation
