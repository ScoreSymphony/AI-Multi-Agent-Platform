name: Temporary writer Ruff format

on:
  push:
    branches:
      - fix/594-595-eval-learning-integration
    paths:
      - .github/workflows/writer-temporary-ruff-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/594-595-eval-learning-integration
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply repository Ruff formatting and remove temporary workflow
        shell: bash
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format .
          ruff format --check .
          git rm .github/workflows/writer-temporary-ruff-format.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'style: apply Ruff formatting'
          git push origin HEAD:fix/594-595-eval-learning-integration
