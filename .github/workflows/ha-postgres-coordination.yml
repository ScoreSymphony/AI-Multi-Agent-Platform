name: PostgreSQL HA coordination

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ha-postgres-coordination.yml"
      - "pyproject.toml"
      - "src/ai_multi_agent_platform/distributed/postgres_control_plane_coordination.py"
      - "tests/integration/distributed/test_postgres_coordination_multiprocess.py"
  pull_request:
    paths:
      - ".github/workflows/ha-postgres-coordination.yml"
      - "pyproject.toml"
      - "src/ai_multi_agent_platform/distributed/postgres_control_plane_coordination.py"
      - "tests/integration/distributed/test_postgres_coordination_multiprocess.py"

jobs:
  postgres-ha-coordination:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_ha_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_ha_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install PostgreSQL HA test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ha-postgres]" pytest
      - name: Run independent-process PostgreSQL coordination acceptance
        env:
          AI_PLATFORM_TEST_HA_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/platform_ha_test
        run: pytest -q tests/integration/distributed/test_postgres_coordination_multiprocess.py
