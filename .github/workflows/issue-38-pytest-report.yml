name: Issue 38 pytest report

on:
  push:
    branches: [feat/issue-38-cli-foundation]

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-38-cli-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install repository dev environment
        run: python -m pip install -e ".[dev]"
      - name: Capture pytest output
        shell: bash
        run: |
          set +e
          pytest > issue-38-pytest-report.txt 2>&1
          cat issue-38-pytest-report.txt
          exit 0
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue-38-pytest-report.txt
          git commit -m "Capture #38 pytest report"
          git push origin HEAD:feat/issue-38-cli-foundation
