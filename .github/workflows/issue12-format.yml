name: Issue 12 Ruff Format

on:
  push:
    branches:
      - feat/issue-12-capability-registry

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style(#12): apply ruff format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-12-capability-registry
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install formatting tool
        run: python -m pip install 'ruff>=0.12,<1'
      - name: Apply Ruff formatter
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style(#12): apply ruff format"
          git push
