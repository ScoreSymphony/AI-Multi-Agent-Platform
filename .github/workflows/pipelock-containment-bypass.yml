name: Pipelock containment and bypass

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-containment-bypass.yml"
      - "tests/test_issue_730_pipelock_containment.py"
      - "tests/fixtures/mcp_stdio_network_probe_server.py"
      - "scripts/ci/issue502_no_network_exec.py"
      - "docs/upstream/PIPELOCK_CORE_CONTAINMENT_EVIDENCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-containment-bypass:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-containment-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-containment-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi

      - name: Generate audit-only evaluation configuration
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pipelock-home"
          HOME="$RUNNER_TEMP/pipelock-home" ./pipelock init \
            --scan-home "$RUNNER_TEMP/pipelock-home" \
            --output "$RUNNER_TEMP/pipelock-audit.yaml" \
            --preset audit \
            --skip-canary
          grep -Eq '^mode:[[:space:]]*audit$' "$RUNNER_TEMP/pipelock-audit.yaml"
          sha256sum ./pipelock "$RUNNER_TEMP/pipelock-audit.yaml" \
            > "$RUNNER_TEMP/pipelock-containment-sha256.txt"

      - name: Exercise direct-bypass and contained MCP stdio profiles
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
          PIPELOCK_730_CONFIG: ${{ runner.temp }}/pipelock-audit.yaml
        run: |
          pytest -q tests/test_issue_730_pipelock_containment.py \
            --junitxml="$RUNNER_TEMP/pipelock-containment-junit.xml"

      - name: Upload containment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-containment-bypass-evidence
          path: |
            ${{ runner.temp }}/pipelock-containment-buildinfo.txt
            ${{ runner.temp }}/pipelock-containment-sha256.txt
            ${{ runner.temp }}/pipelock-containment-junit.xml
          if-no-files-found: error
