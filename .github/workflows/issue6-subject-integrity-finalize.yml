name: Issue 6 subject integrity finalize

on:
  push:
    branches:
      - fix/issue-6-subject-integrity

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-6-subject-integrity
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply subject-integrity fix
        run: |
          python .github/issue6_subject_integrity_fix.py
          python .github/issue6_subject_integrity_fix2.py

      - name: Remove temporary validator files
        run: |
          rm -f .github/issue6_subject_integrity_fix.py
          rm -f .github/issue6_subject_integrity_fix2.py
          rm -f .github/workflows/issue6-subject-integrity-finalize.yml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format changed Python files
        run: |
          ruff format \
            src/ai_multi_agent_platform/kernel/kernel.py \
            src/ai_multi_agent_platform/kernel/models.py \
            src/ai_multi_agent_platform/kernel/state.py \
            tests/test_kernel.py \
            tests/test_kernel_consistency.py \
            tests/test_issue6_subject_integrity.py

      - name: Validate repository
        run: |
          ruff format --check .
          ruff check .
          mypy
          pytest
          python -m build

      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "fix: enforce canonical run subject ownership"
            git push origin HEAD:fix/issue-6-subject-integrity
          fi
