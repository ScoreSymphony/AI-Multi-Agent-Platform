name: issue-79-single-node-wire

on:
  push:
    branches:
      - feat/issue-79-control-plane-portability

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Wire production portability composition
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/deployment/single_node.py")
          text = path.read_text()
          replacements = (
              (
                  "from ai_multi_agent_platform.agents import (\n",
                  "from ai_multi_agent_platform import __version__\nfrom ai_multi_agent_platform.agents import (\n",
              ),
              (
                  "from ai_multi_agent_platform.orchestration import ReferenceOrchestrator\n",
                  "from ai_multi_agent_platform.orchestration import ReferenceOrchestrator\n"
                  "from ai_multi_agent_platform.portability.composition import (\n"
                  "    build_agent_portability_workflow,\n"
                  ")\n",
              ),
              (
                  "    authorization = SqliteLocalAuthorizationProvider(database_dir / \"authorization.sqlite3\")\n\n"
                  "    control_plane = ControlPlane(\n",
                  "    authorization = SqliteLocalAuthorizationProvider(database_dir / \"authorization.sqlite3\")\n\n"
                  "    portability_workflow = build_agent_portability_workflow(\n"
                  "        agents=agents.repository,\n"
                  "        models=models,\n"
                  "        scopes=scopes,\n"
                  "        platform_version=__version__,\n"
                  "    )\n\n"
                  "    control_plane = ControlPlane(\n",
              ),
              (
                  "        conversation_response_provider=conversation_response_provider,\n"
                  "    )\n",
                  "        conversation_response_provider=conversation_response_provider,\n"
                  "        portability_workflow=portability_workflow,\n"
                  "    )\n",
              ),
          )
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected single-node anchor not found: {old!r}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
      - name: Format changed source
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff check --fix \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/portability/composition.py
          ruff format \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/portability/composition.py
      - name: Commit wiring and remove helper
        run: |
          rm .github/workflows/issue-79-single-node-wire.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(portability): wire agent workflow into single-node"
          git push origin HEAD:feat/issue-79-control-plane-portability
