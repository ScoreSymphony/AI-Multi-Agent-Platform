name: Planning and coordination regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/planning-coordination-regressions.yml"
  workflow_dispatch:

jobs:
  planning-coordination-regressions:
    name: Planning and coordination regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Planning pressure regression
        run: |
          mkdir -p artifacts/benchmarks/pr-planning-pressure
          platform-planning-pressure \
            --operations 2 \
            --concurrency 2 \
            --steps-per-plan 2 \
            --warmup-operations 1 \
            --timeout-seconds 5 \
            --safety-max-operations 4 \
            --safety-max-concurrency 4 \
            --safety-max-steps-per-plan 4 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-planning-pressure/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-planning-pressure.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-planning-pressure/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          PY

      - name: Plan Step regression
        run: |
          mkdir -p artifacts/benchmarks/pr-plan-step
          for scenario in linear fan-out fan-in; do
            platform-plan-step \
              --scenario "$scenario" \
              --size 3 \
              --timeout-seconds 5 \
              --safety-max-size 8 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-plan-step/${scenario}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-plan-step.v1.schema.json").read_text())
          for scenario in ("linear", "fan-out", "fan-in"):
              report = json.loads(Path(f"artifacts/benchmarks/pr-plan-step/{scenario}.json").read_text())
              Draft202012Validator(schema).validate(report)
              assert report["correctness"]["passed"] is True
          PY

      - name: Coordination pressure regression
        run: |
          mkdir -p artifacts/benchmarks/pr-coordination-pressure
          platform-coordination-pressure \
            --scenario retry-burst \
            --size 3 \
            --retry-delay-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/retry-burst.json
          platform-coordination-pressure \
            --scenario deadline-wait-burst \
            --size 3 \
            --wait-delay-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/deadline-wait-burst.json
          platform-coordination-pressure \
            --scenario restart-reconcile \
            --size 3 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/restart-reconcile.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-coordination-pressure.v1.schema.json").read_text())
          for scenario in ("retry-burst", "deadline-wait-burst", "restart-reconcile"):
              report = json.loads(Path(f"artifacts/benchmarks/pr-coordination-pressure/{scenario}.json").read_text())
              Draft202012Validator(schema).validate(report)
              assert report["correctness"]["passed"] is True
          PY

      - name: Coordination contention regression
        run: |
          mkdir -p artifacts/benchmarks/pr-coordination-contention
          for scenario in multi-plan claim-contention; do
            platform-coordination-contention \
              --scenario "$scenario" \
              --plan-count 2 \
              --steps-per-plan 2 \
              --claim-hold-seconds 0.01 \
              --timeout-seconds 5 \
              --safety-max-total-steps 8 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-coordination-contention/${scenario}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-coordination-contention.v1.schema.json").read_text())
          for scenario in ("multi-plan", "claim-contention"):
              report = json.loads(Path(f"artifacts/benchmarks/pr-coordination-contention/{scenario}.json").read_text())
              Draft202012Validator(schema).validate(report)
              assert report["correctness"]["passed"] is True
          PY

      - name: Upload grouped regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: planning-coordination-regressions
          path: artifacts/benchmarks
          if-no-files-found: ignore
