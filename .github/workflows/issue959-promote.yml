name: Issue 959 Promote Hermes v0.21.2

on:
  push:
    branches:
      - issue-959-hermes-v0-21-2-validation
    paths:
      - ".github/workflows/issue959-promote.yml"

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-959-hermes-v0-21-2-validation
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Promote validated Hermes revision
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          OLD = "2237be355906fbe6065ce1815711eee52b2d646e"
          NEW = "939e45c91d751fadd94dcd1b873ac3cb44846213"
          ROOT = Path.cwd()

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding="utf-8")

          def write(path: str, content: str) -> None:
              (ROOT / path).write_text(content, encoding="utf-8")

          def replace_required(path: str, old: str, new: str, *, count: int | None = None) -> None:
              text = read(path)
              found = text.count(old)
              if found == 0:
                  raise RuntimeError(f"expected replacement text not found in {path}: {old!r}")
              if count is not None and found != count:
                  raise RuntimeError(
                      f"unexpected replacement count in {path}: expected {count}, found {found} for {old!r}"
                  )
              write(path, text.replace(old, new))

          # Canonical accepted revision and deployment examples.
          replace_required(
              "src/ai_multi_agent_platform/adapters/hermes.py",
              f'HERMES_PINNED_REVISION = "{OLD}"',
              f'HERMES_PINNED_REVISION = "{NEW}"',
              count=1,
          )
          replace_required("config/hermes.example.json", OLD, NEW, count=1)
          replace_required(".github/workflows/ci.yml", OLD, NEW, count=2)

          # Machine-readable upstream provenance.
          upstream_path = "upstream/hermes-agent.yaml"
          upstream = read(upstream_path)
          for old_text, new_text in (
              (f'pinned_revision: "{OLD}"', f'pinned_revision: "{NEW}"'),
              ('last_review_date: "2026-09-11"', 'last_review_date: "2026-09-13"'),
              ("v0.21.1", "v0.21.2"),
              ("v2026.9.7", "v2026.9.11"),
              (OLD, NEW),
              (
                  "Hermes Agent v0.21.1 compatibility is revalidated through issue #733 before the updated pin is accepted on main.",
                  "Hermes Agent v0.21.2 compatibility and session/concurrency reliability are validated through issue #959; v0.21.1 evidence remains the rollback baseline.",
              ),
          ):
              upstream = upstream.replace(old_text, new_text)
          if f'pinned_revision: "{NEW}"' not in upstream or "v2026.9.11" not in upstream:
              raise RuntimeError("Hermes upstream provenance did not promote cleanly")
          write(upstream_path, upstream)

          # Repository and packaged compatibility inventories stay byte-identical.
          compatibility_path = ROOT / "release" / "compatibility.json"
          compatibility = json.loads(compatibility_path.read_text(encoding="utf-8"))
          compatibility["last_reviewed_at"] = "2026-09-13T00:00:00Z"
          hermes = next(
              item for item in compatibility["components"] if item["component"] == "Hermes Agent"
          )
          if hermes["revision"] != OLD:
              raise RuntimeError(f"unexpected pre-adoption Hermes revision: {hermes['revision']}")
          hermes["revision"] = NEW
          hermes["last_checked_at"] = "2026-09-13T00:00:00Z"
          hermes["latest_known_revision"] = NEW
          hermes["notes"] = [
              "Optional external service; canonical lifecycle and authorization remain platform-owned.",
              "Hermes Agent v0.21.2 / tag v2026.9.11 resolves to this exact commit.",
              (
                  "Validated through #959; Hermes Agent v0.21.1 / tag v2026.9.7 / "
                  f"{OLD} remains the rollback baseline."
              ),
          ]
          rendered_compatibility = json.dumps(compatibility, indent=2) + "\n"
          write("release/compatibility.json", rendered_compatibility)
          write("src/ai_multi_agent_platform/release/compatibility.json", rendered_compatibility)

          # Human-facing adapter documentation.
          adapter_doc_path = "docs/integrations/HERMES_ADAPTER.md"
          adapter_doc = read(adapter_doc_path)
          for old_text, new_text in (
              ("Hermes Agent v0.21.1", "Hermes Agent v0.21.2"),
              ("v2026.9.7", "v2026.9.11"),
              (OLD, NEW),
              ("HERMES_AGENT_V0_21_1_VALIDATION.md", "HERMES_AGENT_V0_21_2_VALIDATION.md"),
          ):
              adapter_doc = adapter_doc.replace(old_text, new_text)
          rollback_sentence = (
              "The previous v0.21.1 validation evidence remains retained as the exact rollback baseline "
              f"at `{OLD}`.\n"
          )
          anchor = (
              "The version-specific compatibility review is recorded in "
              "`docs/upstream/HERMES_AGENT_V0_21_2_VALIDATION.md`.\n"
          )
          if anchor not in adapter_doc:
              raise RuntimeError("Hermes adapter documentation anchor not found")
          if rollback_sentence not in adapter_doc:
              adapter_doc = adapter_doc.replace(anchor, anchor + "\n" + rollback_sentence)
          write(adapter_doc_path, adapter_doc)

          # Canonical upstream registry: update only the Hermes section.
          upstreams_path = "docs/UPSTREAMS.md"
          registry = read(upstreams_path)
          prefix, tail = registry.split("### NousResearch Hermes Agent\n", 1)
          hermes_section, suffix = tail.split("\n### NVIDIA SkillSpector", 1)
          hermes_section = hermes_section.replace(
              "- **Status:** integrated through #8; v0.21.1 compatibility revalidated through #733.",
              "- **Status:** integrated through #8; v0.21.2 compatibility and reliability validated through #959.",
          )
          hermes_section = hermes_section.replace(
              f"Hermes Agent v0.21.1 / tag `v2026.9.7` / `{OLD}`",
              f"Hermes Agent v0.21.2 / tag `v2026.9.11` / `{NEW}`",
          )
          hermes_section = hermes_section.replace(
              "- **Last review date:** 2026-09-11.",
              "- **Last review date:** 2026-09-13.",
              1,
          )
          adoption_old = (
              "`docs/upstream/HERMES_AGENT_ADOPTION.md`, "
              "`docs/upstream/HERMES_AGENT_V0_21_1_VALIDATION.md` and "
              "`docs/integrations/HERMES_ADAPTER.md`."
          )
          adoption_new = (
              "`docs/upstream/HERMES_AGENT_ADOPTION.md`, "
              "`docs/upstream/HERMES_AGENT_V0_21_1_VALIDATION.md` (rollback baseline), "
              "`docs/upstream/HERMES_AGENT_V0_21_2_VALIDATION.md` and "
              "`docs/integrations/HERMES_ADAPTER.md`."
          )
          if adoption_old not in hermes_section:
              raise RuntimeError("Hermes upstream registry adoption-review anchor not found")
          hermes_section = hermes_section.replace(adoption_old, adoption_new)
          if NEW not in hermes_section or "#959" not in hermes_section:
              raise RuntimeError("Hermes upstream registry did not promote cleanly")
          write(upstreams_path, prefix + "### NousResearch Hermes Agent\n" + hermes_section + "\n### NVIDIA SkillSpector" + suffix)

          # Final decision document bound to the successful pre-adoption evidence.
          validation_path = "docs/upstream/HERMES_AGENT_V0_21_2_VALIDATION.md"
          validation = read(validation_path)
          old_status = (
              "Validation is in progress. The accepted production/default Hermes revision remains\n"
              "v0.21.1 until every required compatibility, reliability, regression and conformance\n"
              "gate has passed. No adoption decision has been issued yet."
          )
          new_status = (
              "Validation is complete. The final adoption decision is `PASS_UPDATE`. Hermes Agent\n"
              f"v0.21.2 at exact commit `{NEW}` is the accepted production/default revision. The\n"
              "previous v0.21.1 revision remains retained as the rollback baseline."
          )
          if old_status not in validation:
              raise RuntimeError("Hermes v0.21.2 validation status anchor not found")
          validation = validation.replace(old_status, new_status)
          marker = "## Remaining gates before adoption\n"
          if marker not in validation:
              raise RuntimeError("Hermes validation remaining-gates section not found")
          validation = validation.split(marker, 1)[0] + f"""## Decision\n\nFinal result: **`PASS_UPDATE`**.\n\nRevision-bound pre-adoption evidence for `{NEW}`:\n\n- dedicated Hermes v0.21.2 candidate workflow `34759634674`: passed, including the\n  exact-upstream malformed-row, WAL/IOERR, competing-writer, reader/writer,\n  SessionDB/profile ownership and restart/dead-owner reliability matrix;\n- #46 Hermes Scenario B in the same candidate workflow: passed against the exact\n  candidate checkout and the non-Hermes reference executor path;\n- repository CI workflow `34759634728`: passed, including the full Pytest suite,\n  deterministic #19 evaluation/regression gate, static checks and package build;\n- CodeQL workflow `34759634698`: passed; repository-governance and test-layout\n  workflows for the same head also passed;\n- canonical ownership remained unchanged: Hermes-native run/session/profile IDs stay\n  namespaced adapter metadata, while Task/Run/Agent/Team/Plan/Step, authorization and\n  approvals remain platform-owned.\n\nThe adapter's explicit profile URL namespace plus the upstream revision-bound\nSessionDB ownership, canonical-profile listing and launch-home isolation regressions\ncover the profile/session isolation claimed by the adapter. No broader multi-profile\nruntime authority is claimed.\n\nThe accepted pin may therefore move to v0.21.2. The rollback target remains Hermes\nAgent v0.21.1 / tag `v2026.9.7` / `{OLD}` with its original validation and evidence\nartifacts retained unchanged.\n\nPromotion updates the governed pin, compatibility metadata, standard pinned Hermes\nconformance workflow and integration documentation atomically with this decision.\n"""
          write(validation_path, validation)

          # v0.21.2 tests now exercise the accepted verified pin rather than a candidate pin.
          v0212_tests = (
              "tests/regression/upstreams/test_hermes_v0_21_2.py",
              "tests/integration/upstreams/test_hermes_v0_21_2_candidate.py",
              "tests/integration/upstreams/test_hermes_v0_21_2_concurrency.py",
              "tests/integration/upstreams/test_hermes_v0_21_2_restart.py",
          )
          for path in v0212_tests:
              text = read(path)
              if "HermesCompatibilityStatus.UNVERIFIED_PIN" not in text:
                  raise RuntimeError(f"expected pre-adoption status not found in {path}")
              text = text.replace(
                  "HermesCompatibilityStatus.UNVERIFIED_PIN",
                  "HermesCompatibilityStatus.VERIFIED_PIN",
              )
              write(path, text)

          candidate_test_path = "tests/integration/upstreams/test_hermes_v0_21_2_candidate.py"
          candidate_test = read(candidate_test_path)
          candidate_test = candidate_test.replace(
              f'HERMES_V0_21_1_REVISION = "{OLD}"\n',
              "",
          )
          candidate_test = candidate_test.replace(
              "def test_candidate_is_exact_and_does_not_preemptively_replace_accepted_pin() -> None:",
              "def test_accepted_v0_21_2_revision_is_exact_and_verified() -> None:",
          )
          candidate_test = candidate_test.replace(
              "assert HERMES_PINNED_REVISION == HERMES_V0_21_1_REVISION",
              "assert HERMES_PINNED_REVISION == HERMES_V0_21_2_REVISION",
          )
          write(candidate_test_path, candidate_test)

          # Preserve v0.21.1 as historical rollback evidence without claiming it is current.
          rollback_test_path = "tests/regression/upstreams/test_hermes_v0_21_1.py"
          rollback_test = read(rollback_test_path)
          old_block = f'''def test_repository_pin_is_exact_hermes_v0_21_1_commit() -> None:\n    assert HERMES_PINNED_REVISION == HERMES_V0_21_1_REVISION\n    config = HermesAdapterConfig(enabled=True)\n    assert config.pinned_revision == HERMES_V0_21_1_REVISION\n    assert config.compatibility_status.value == "verified_pin"\n'''
          new_block = f'''def test_v0_21_1_revision_remains_distinct_rollback_baseline() -> None:\n    assert HERMES_PINNED_REVISION == "{NEW}"\n    assert HERMES_V0_21_1_REVISION == "{OLD}"\n    assert HERMES_V0_21_1_REVISION != HERMES_PINNED_REVISION\n'''
          if old_block not in rollback_test:
              raise RuntimeError("v0.21.1 rollback regression anchor not found")
          write(rollback_test_path, rollback_test.replace(old_block, new_block))

          # The standard #46 Hermes profile must now execute the accepted v0.21.2 matrix.
          profile_path = "scripts/ci/issue46_external_profile.py"
          profile = read(profile_path)
          last_return = profile.rfind("    return _run_pytest(")
          if last_return < 0:
              raise RuntimeError("accepted Hermes #46 test block not found")
          return_end = profile.find("\n    )", last_return)
          if return_end < 0:
              raise RuntimeError("accepted Hermes #46 test block end not found")
          return_end += len("\n    )")
          accepted_block = '''    return _run_pytest(\n        "tests/test_issue_8_hermes_adapter.py::"\n        "test_hermes_agent_mapper_pins_agent_team_model_and_capability_contracts",\n        "tests/integration/upstreams/test_hermes_pinned.py::"\n        "test_pinned_hermes_declares_required_run_lifecycle_surface",\n        "tests/integration/upstreams/test_hermes_pinned.py::"\n        "test_adapter_against_pinned_hermes_runs_api",\n        "tests/integration/upstreams/test_hermes_pinned.py::"\n        "test_kernel_uses_real_pinned_hermes_and_reference_executor",\n        "tests/regression/upstreams/test_hermes_v0_21_2.py",\n        "tests/integration/upstreams/test_hermes_v0_21_2_candidate.py",\n        "tests/integration/upstreams/test_hermes_v0_21_2_concurrency.py",\n        "tests/integration/upstreams/test_hermes_v0_21_2_restart.py",\n    )'''
          profile = profile[:last_return] + accepted_block + profile[return_end:]
          write(profile_path, profile)

          # Revision-bound #42-style observation/evidence and reproducible adoption check.
          observation = {
              "schema_version": "1",
              "observed_at": "2026-09-13T13:24:00Z",
              "components": [
                  {
                      "component": "Hermes Agent",
                      "source_url": "https://github.com/NousResearch/hermes-agent",
                      "revision": NEW,
                      "license": "MIT",
                      "classifications": ["feature", "reliability"],
                      "release_ref": "v2026.9.11",
                      "patch_conflicts": [],
                      "validation": {
                          "adapter_contract_tests": "passed",
                          "eval_regression": "passed",
                          "security": "passed",
                          "compatibility_review": "passed",
                      },
                  }
              ],
          }
          write(
              "release/hermes-v0.21.2-observation.json",
              json.dumps(observation, indent=2) + "\n",
          )

          evidence = {
              "schema_version": "1",
              "component": "Hermes Agent",
              "candidate_revision": NEW,
              "gates": {
                  "adapter_contract_tests": {
                      "status": "passed",
                      "kind": "workflow_run",
                      "ref": "workflow:34759634674#hermes-v0-21-2-candidate",
                      "digest": None,
                  },
                  "eval_regression": {
                      "status": "passed",
                      "kind": "workflow_run",
                      "ref": "workflow:34759634728#test",
                      "digest": None,
                  },
                  "security": {
                      "status": "passed",
                      "kind": "workflow_run",
                      "ref": "workflow:34759634698#codeql",
                      "digest": None,
                  },
                  "compatibility_review": {
                      "status": "passed",
                      "kind": "review",
                      "ref": "review:docs/upstream/HERMES_AGENT_V0_21_2_VALIDATION.md#decision",
                      "digest": None,
                  },
              },
          }
          write(
              "release/hermes-v0.21.2-validation-evidence.json",
              json.dumps(evidence, indent=2) + "\n",
          )

          adoption_test = f'''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom ai_multi_agent_platform.release.cli import main\n\nROOT = Path(__file__).resolve().parents[2]\nOLD_HERMES_REVISION = "{OLD}"\nCANDIDATE_REVISION = "{NEW}"\n\n\ndef test_hermes_v0_21_2_adoption_evidence_reproduces_pass_update(\n    tmp_path: Path,\n    capsys,\n) -> None:\n    current_inventory = json.loads(\n        (ROOT / "release" / "compatibility.json").read_text(encoding="utf-8")\n    )\n    pre_adoption_inventory = json.loads(json.dumps(current_inventory))\n    hermes = next(\n        component\n        for component in pre_adoption_inventory["components"]\n        if component["component"] == "Hermes Agent"\n    )\n    hermes["revision"] = OLD_HERMES_REVISION\n    hermes["latest_known_revision"] = OLD_HERMES_REVISION\n    hermes["last_checked_at"] = "2026-09-11T00:00:00Z"\n\n    inventory_path = tmp_path / "pre-adoption-compatibility.json"\n    inventory_path.write_text(\n        json.dumps(pre_adoption_inventory, indent=2) + "\\n",\n        encoding="utf-8",\n    )\n    original_inventory = inventory_path.read_text(encoding="utf-8")\n\n    exit_code = main(\n        [\n            "upstream-adoption-check",\n            "--inventory",\n            str(inventory_path),\n            "--observations",\n            str(ROOT / "release" / "hermes-v0.21.2-observation.json"),\n            "--component",\n            "Hermes Agent",\n            "--evidence",\n            str(ROOT / "release" / "hermes-v0.21.2-validation-evidence.json"),\n            "--compatibility-status",\n            "tested",\n            "--reviewed-at",\n            "2026-09-13T00:00:00Z",\n            "--json",\n        ]\n    )\n\n    assert exit_code == 0\n    payload = json.loads(capsys.readouterr().out)\n    assert payload["candidate"]["current_revision"] == OLD_HERMES_REVISION\n    assert payload["candidate"]["candidate_revision"] == CANDIDATE_REVISION\n    assert payload["validation_evidence"]["candidate_revision"] == CANDIDATE_REVISION\n    resulting_hermes = next(\n        component\n        for component in payload["resulting_compatibility_inventory"]["components"]\n        if component["component"] == "Hermes Agent"\n    )\n    assert resulting_hermes["revision"] == CANDIDATE_REVISION\n    assert resulting_hermes["latest_known_revision"] == CANDIDATE_REVISION\n    assert inventory_path.read_text(encoding="utf-8") == original_inventory\n'''
          write("tests/release/test_hermes_v0_21_2_adoption_evidence.py", adoption_test)

          # Promotion invariants before committing.
          assert NEW in read("src/ai_multi_agent_platform/adapters/hermes.py")
          assert NEW in read("upstream/hermes-agent.yaml")
          assert NEW in read(".github/workflows/ci.yml")
          assert read("release/compatibility.json") == read(
              "src/ai_multi_agent_platform/release/compatibility.json"
          )
          assert "PASS_UPDATE" in read(validation_path)
          assert OLD in read("release/hermes-v0.21.1-validation-evidence.json")
          PY

          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add \
            .github/workflows/ci.yml \
            config/hermes.example.json \
            docs/UPSTREAMS.md \
            docs/integrations/HERMES_ADAPTER.md \
            docs/upstream/HERMES_AGENT_V0_21_2_VALIDATION.md \
            release/compatibility.json \
            release/hermes-v0.21.2-observation.json \
            release/hermes-v0.21.2-validation-evidence.json \
            scripts/ci/issue46_external_profile.py \
            src/ai_multi_agent_platform/adapters/hermes.py \
            src/ai_multi_agent_platform/release/compatibility.json \
            tests/integration/upstreams/test_hermes_v0_21_2_candidate.py \
            tests/integration/upstreams/test_hermes_v0_21_2_concurrency.py \
            tests/integration/upstreams/test_hermes_v0_21_2_restart.py \
            tests/regression/upstreams/test_hermes_v0_21_1.py \
            tests/regression/upstreams/test_hermes_v0_21_2.py \
            tests/release/test_hermes_v0_21_2_adoption_evidence.py \
            upstream/hermes-agent.yaml
          git diff --cached --check
          git commit -m "Adopt Hermes Agent v0.21.2 after #959 validation"
          git push origin HEAD:issue-959-hermes-v0-21-2-validation
