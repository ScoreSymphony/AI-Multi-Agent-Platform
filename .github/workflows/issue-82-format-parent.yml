name: Issue 82 parent format repair

on:
  push:
    branches:
      - feat/issue-82-operational-completion

permissions:
  contents: write

jobs:
  format-parent:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue 82 parent
        uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion

      - name: Install repository formatter
        run: python -m pip install 'ruff>=0.12,<1'

      - name: Format known parent baseline files
        run: |
          ruff format \
            src/ai_multi_agent_platform/control_plane/registered_search_contract.py \
            src/ai_multi_agent_platform/repositories/control_plane.py

      - name: Commit formatting repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/control_plane/registered_search_contract.py \
            src/ai_multi_agent_platform/repositories/control_plane.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: repair issue #82 parent formatting baseline'
          git push origin HEAD:feat/issue-82-operational-completion
