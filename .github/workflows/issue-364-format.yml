name: Issue 364 formatter

on:
  push:
    branches: [issue-364-canonical-workflows]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue-364-canonical-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Apply canonical formatting
        shell: bash
        run: |
          ruff format .
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply ruff formatting for #364"
          git push origin HEAD:issue-364-canonical-workflows
