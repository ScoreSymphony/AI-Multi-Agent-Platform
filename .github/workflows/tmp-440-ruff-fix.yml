name: Temporary #440 Ruff cleanup

on:
  push:
    branches:
      - perf/440-sqlite-contention

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/440-sqlite-contention
      - name: Apply isolated lint fix and remove diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/benchmarking/persistence_contention.py")
          text = path.read_text(encoding="utf-8")
          old = "SQLite internal wait time is observed through end-to-end canonical mutation latency"
          new = "SQLite wait time is observed through end-to-end canonical mutation latency"
          if old not in text:
              raise SystemExit("expected lint target not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          rm -rf .tmp-440
          rm .github/workflows/tmp-440-ruff-fix.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            .tmp-440 \
            .github/workflows/tmp-440-ruff-fix.yml
          git commit -m "style(#440): fix Ruff line length and remove diagnostics"
          git push origin HEAD:perf/440-sqlite-contention
