name: Temporary #440 Ruff diagnostic

on:
  push:
    branches:
      - perf/440-sqlite-contention

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: perf/440-sqlite-contention
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Capture Ruff diagnostics
        run: |
          mkdir -p .tmp-440
          ruff check \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py \
            tests/performance/test_issue_440_persistence_contention.py \
            > .tmp-440/ruff.txt 2>&1 || true
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-440/ruff.txt
          git commit -m "chore(#440): capture Ruff diagnostics"
          git push origin HEAD:perf/440-sqlite-contention
