name: Issue 501 lint cleanup

on:
  push:
    branches:
      - feature/501-proposal-specification-governance

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/501-proposal-specification-governance
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install 'ruff==0.16.6'
      - name: Apply deterministic lint fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          repository = Path("src/ai_multi_agent_platform/governance/repository.py")
          text = repository.read_text()
          text = text.replace(
              "from typing import Protocol, cast, runtime_checkable",
              "from typing import Literal, Protocol, cast, runtime_checkable",
          )
          text = text.replace(
              '"INSERT INTO governance_proposal_revisions(proposal_id, revision, payload_json) "\n                    "VALUES (?, ?, ?)"',
              '"INSERT INTO governance_proposal_revisions("\n                    "proposal_id, revision, payload_json) VALUES (?, ?, ?)"',
          )
          text = text.replace(
              '"UPDATE governance_proposals SET revision = ?, payload_json = ? WHERE proposal_id = ?"',
              '"UPDATE governance_proposals SET revision = ?, payload_json = ? "\n                "WHERE proposal_id = ?"',
          )
          text = text.replace(
              '"UPDATE governance_conversions SET status = ?, approval_id = COALESCE(?, approval_id), "\n                "completed_at = ? WHERE specification_id = ?"',
              '"UPDATE governance_conversions SET status = ?, "\n                "approval_id = COALESCE(?, approval_id), completed_at = ? "\n                "WHERE specification_id = ?"',
          )
          text = text.replace(
              '"INSERT OR IGNORE INTO governance_audit_events(event_id, occurred_at, payload_json) "\n                "VALUES (?, ?, ?)"',
              '"INSERT OR IGNORE INTO governance_audit_events("\n                "event_id, occurred_at, payload_json) VALUES (?, ?, ?)"',
          )
          text = text.replace(
              'cast("Literal[\'proposal\', \'specification\', \'conversion\']", resource_type)',
              'cast(Literal["proposal", "specification", "conversion"], resource_type)',
          )
          repository.write_text(text)

          service = Path("src/ai_multi_agent_platform/governance/service.py")
          text = service.read_text().replace("    ConversionStatus,\n", "")
          service.write_text(text)

          test = Path("tests/test_issue_501_governance.py")
          text = test.read_text().replace(
              '        goal="Identify and correct the deterministic cause without changing unrelated runtime behavior.",',
              '        goal=(\n            "Identify and correct the deterministic cause without changing "\n            "unrelated runtime behavior."\n        ),',
          )
          test.write_text(text)
          PY
      - run: ruff format src/ai_multi_agent_platform/governance tests/test_issue_501_governance.py tests/test_issue_501_governance_hardening.py
      - run: ruff check --fix src/ai_multi_agent_platform/governance tests/test_issue_501_governance.py tests/test_issue_501_governance_hardening.py
      - name: Commit corrections
        shell: bash
        run: |
          if git diff --quiet -- src/ai_multi_agent_platform/governance tests/test_issue_501_governance.py tests/test_issue_501_governance_hardening.py; then
            exit 0
          fi
          git config user.name "Score Symphony CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/ai_multi_agent_platform/governance tests/test_issue_501_governance.py tests/test_issue_501_governance_hardening.py
          git commit -m "fix: satisfy issue 501 lint contract"
          git push origin HEAD:feature/501-proposal-specification-governance
