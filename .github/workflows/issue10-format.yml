name: Issue 10 Format Fix

on:
  push:
    branches: [feat/issue-10-model-registry-router]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-model-registry-router
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format affected files
        run: |
          ruff format \
            src/ai_multi_agent_platform/adapters/openai_compatible.py \
            src/ai_multi_agent_platform/control_plane/http.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            src/ai_multi_agent_platform/models/protocol.py \
            src/ai_multi_agent_platform/models/registry.py \
            tests/test_control_plane.py \
            tests/test_issue_10_canonical_model_protocol.py \
            tests/test_issue_10_canonical_tool_calls.py \
            tests/test_issue_10_registry_capability_queries.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/adapters/openai_compatible.py \
            src/ai_multi_agent_platform/control_plane/http.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            src/ai_multi_agent_platform/models/protocol.py \
            src/ai_multi_agent_platform/models/registry.py \
            tests/test_control_plane.py \
            tests/test_issue_10_canonical_model_protocol.py \
            tests/test_issue_10_canonical_tool_calls.py \
            tests/test_issue_10_registry_capability_queries.py
          git commit -m "style: format issue 10 integration tree" || exit 0
          git push origin HEAD:feat/issue-10-model-registry-router
