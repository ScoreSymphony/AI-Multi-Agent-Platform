name: Issue 10 Formatter

on:
  push:
    branches: [feat/issue-10-model-registry-router]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-model-registry-router
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Apply Ruff format
        run: ruff format .
      - name: Commit formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply ruff formatting for issue 10"
          git push origin HEAD:feat/issue-10-model-registry-router
