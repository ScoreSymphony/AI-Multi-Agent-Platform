name: Format issue 82 branch

on:
  push:
    branches:
      - feat/issue-82-operational-completion

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out issue branch
        uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion

      - name: Install Ruff
        run: python -m pip install 'ruff==0.16.6'

      - name: Format issue files
        run: |
          ruff format \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/repositories/control_plane.py \
            src/ai_multi_agent_platform/repositories/local_git.py \
            tests/test_issue_82_connector_repository.py \
            tests/test_issue_82_repository_collaboration.py

      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/repositories/control_plane.py \
            src/ai_multi_agent_platform/repositories/local_git.py \
            tests/test_issue_82_connector_repository.py \
            tests/test_issue_82_repository_collaboration.py
          if git diff --cached --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git commit -m 'style: format issue #82 changes'
          git push origin HEAD:feat/issue-82-operational-completion
