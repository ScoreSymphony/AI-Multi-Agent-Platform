name: Issue 7 exact format

on:
  push:
    branches: [fix/issue-7-ci]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-7-ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Apply format
        run: ruff format .
      - name: Commit exact formatting
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply ruff formatting for issue 7"
          git push origin HEAD:fix/issue-7-ci
