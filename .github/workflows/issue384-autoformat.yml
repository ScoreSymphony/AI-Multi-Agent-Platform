name: Issue 384 autoformat

on:
  push:
    branches:
      - feat/384-durable-plan-step-coordinator

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/384-durable-plan-step-coordinator
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Sync main and apply issue 384 composition
        shell: bash
        run: |
          git fetch origin main
          git show origin/main:src/ai_multi_agent_platform/deployment/single_node.py > src/ai_multi_agent_platform/deployment/single_node.py
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/deployment/single_node.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  raise SystemExit(f'expected single-node anchor not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              'from ai_multi_agent_platform.control_plane.sqlite_scope import SqliteScopeStore\n',
              'from ai_multi_agent_platform.control_plane.sqlite_scope import SqliteScopeStore\n'
              'from ai_multi_agent_platform.coordination import (\n'
              '    DurablePlanStepCoordinator,\n'
              '    SQLiteCoordinatorRepository,\n'
              '    coordination_command_handlers,\n'
              '    coordination_resource_services,\n'
              ')\n',
          )
          replace_once(
              '    AccountingEvaluationEvidenceProvider,\n'
              '    EvaluationEvidenceProvider,\n',
              '    AccountingEvaluationEvidenceProvider,\n'
              '    CoordinationEvaluationEvidenceProvider,\n'
              '    EvaluationEvidenceProvider,\n',
          )
          replace_once(
              '    templates: TemplateApplicationService\n'
              '    workflows: AuthorizedWorkflowService\n'
              '    evaluation_repository: SqliteEvaluationRepository\n',
              '    templates: TemplateApplicationService\n'
              '    workflows: AuthorizedWorkflowService\n'
              '    coordination_repository: SQLiteCoordinatorRepository\n'
              '    coordination: DurablePlanStepCoordinator\n'
              '    evaluation_repository: SqliteEvaluationRepository\n',
          )
          replace_once(
              '    kernel = PlatformKernel(\n'
              '        orchestrator=orchestrator,\n'
              '        lifecycle=lifecycle,\n'
              '        repository=kernel_repository,\n'
              '        event_sink=observability_events,\n'
              '        completion_authority=verification_completion,\n'
              '    )\n'
              '    verification_evidence = KernelFileVerificationEvidenceResolver(\n',
              '    kernel = PlatformKernel(\n'
              '        orchestrator=orchestrator,\n'
              '        lifecycle=lifecycle,\n'
              '        repository=kernel_repository,\n'
              '        event_sink=observability_events,\n'
              '        completion_authority=verification_completion,\n'
              '    )\n'
              '    coordination_repository = SQLiteCoordinatorRepository(\n'
              '        database_dir / "coordination.sqlite3"\n'
              '    )\n'
              '    coordination = DurablePlanStepCoordinator(\n'
              '        repository=coordination_repository,\n'
              '        kernel=kernel,\n'
              '        coordinator_id="single-node",\n'
              '        telemetry=telemetry,\n'
              '    )\n'
              '    verification_evidence = KernelFileVerificationEvidenceResolver(\n',
          )
          replace_once(
              '    evaluation_evidence_providers: list[EvaluationEvidenceProvider] = []\n',
              '    evaluation_evidence_providers: list[EvaluationEvidenceProvider] = [\n'
              '        CoordinationEvaluationEvidenceProvider(coordination_repository)\n'
              '    ]\n',
          )
          replace_once(
              '    for command, handler in evaluation_command_handlers(evaluation_composition.service).items():\n'
              '        control_plane.register_command(command, handler)\n',
              '    for command, handler in evaluation_command_handlers(evaluation_composition.service).items():\n'
              '        control_plane.register_command(command, handler)\n'
              '    for collection, service in coordination_resource_services(coordination).items():\n'
              '        control_plane.register_resource_service(collection, service)\n'
              '    for command, handler in coordination_command_handlers(coordination).items():\n'
              '        control_plane.register_command(command, handler)\n',
          )
          replace_once(
              '        templates=templates,\n'
              '        workflows=workflows,\n'
              '        evaluation_repository=evaluation_composition.repository,\n',
              '        templates=templates,\n'
              '        workflows=workflows,\n'
              '        coordination_repository=coordination_repository,\n'
              '        coordination=coordination,\n'
              '        evaluation_repository=evaluation_composition.repository,\n',
          )
          path.write_text(text, encoding='utf-8')

          sqlite_path = Path('src/ai_multi_agent_platform/coordination/sqlite_repository.py')
          sqlite_text = sqlite_path.read_text(encoding='utf-8')
          sqlite_text = sqlite_text.replace(
              '                    "INSERT INTO coordinator_steps(step_id, plan_id, step_json, record_json, revision) "\n'
              '                    "VALUES(?, ?, ?, ?, ?)",',
              '                    "INSERT INTO coordinator_steps("\n'
              '                    "step_id, plan_id, step_json, record_json, revision"\n'
              '                    ") VALUES(?, ?, ?, ?, ?)",',
          )
          sqlite_text = sqlite_text.replace(
              '                "UPDATE coordinator_plans SET store_revision = store_revision + 1 WHERE plan_id = ?",',
              '                "UPDATE coordinator_plans SET store_revision = store_revision + 1 "\n'
              '                "WHERE plan_id = ?",',
          )
          sqlite_path.write_text(sqlite_text, encoding='utf-8')
          PY
      - name: Install formatter
        run: python -m pip install 'ruff==0.16.6'
      - name: Fix issue 384 lint and formatting
        shell: bash
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/coordination \
            src/ai_multi_agent_platform/evaluation/coordination_evidence.py \
            src/ai_multi_agent_platform/evaluation/__init__.py \
            tests/test_issue_384*.py
          ruff format \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/coordination \
            src/ai_multi_agent_platform/evaluation/coordination_evidence.py \
            src/ai_multi_agent_platform/evaluation/__init__.py \
            tests/test_issue_384*.py
      - name: Commit branch maintenance
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/deployment/single_node.py \
            src/ai_multi_agent_platform/coordination \
            src/ai_multi_agent_platform/evaluation/coordination_evidence.py \
            src/ai_multi_agent_platform/evaluation/__init__.py \
            tests/test_issue_384*.py
          git commit -m 'chore(#384): sync main composition and apply lint fixes'
          git push origin HEAD:feat/384-durable-plan-step-coordinator
