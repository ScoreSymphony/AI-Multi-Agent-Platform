name: Issue 982 context research fix

on:
  push:
    branches:
      - issue/982-explicit-control-plane-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/982-explicit-control-plane-composition
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse canonical Research service and update composition docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context = Path('src/ai_multi_agent_platform/deployment/context_operationalization.py')
          text = context.read_text()
          text = text.replace('from typing import TYPE_CHECKING\n', 'from typing import TYPE_CHECKING, cast\n', 1)
          old_import = '''from ai_multi_agent_platform.research import (
              ResearchService,
              SqliteResearchRepository,
              register_research_control_plane,
          )'''
          new_import = '''from ai_multi_agent_platform.research import (
              ResearchService,
              SqliteResearchRepository,
          )'''
          if old_import not in text:
              raise SystemExit('Research import block not found')
          text = text.replace(old_import, new_import, 1)
          old_creation = '''    research_repository = SqliteResearchRepository(database_dir / "research.sqlite3")
              research = ResearchService(research_repository, authorization=base.approval_gate)'''
          new_creation = '''    research = base.research
              research_repository = cast(SqliteResearchRepository, research.repository)'''
          if old_creation not in text:
              raise SystemExit('Research creation block not found')
          text = text.replace(old_creation, new_creation, 1)
          registration = '    register_research_control_plane(base.control_plane, research)\n'
          if registration not in text:
              raise SystemExit('Research registration call not found')
          text = text.replace(registration, '', 1)
          context.write_text(text)

          docs = Path('docs/runtime/CONTROL_PLANE_COMPOSITION.md')
          text = docs.read_text()
          replacements = {
              '5. installation is sorted by module name after validation, so caller order does not silently alter semantics.':
                  '5. installation follows explicit dependency order; independent modules use lexical order, so caller order does not silently alter semantics.',
              '6. invokes registered post-success observers in deterministic module-name order.':
                  '6. invokes registered post-success observers in deterministic dependency-first order, with lexical order among independent modules.',
              'Contributors run in deterministic module-name order.':
                  'Contributors run in deterministic dependency-first order, with lexical order among independent modules.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'documentation anchor not found: {old}')
              text = text.replace(old, new, 1)
          release_row = '| `release_api.ControlPlaneHTTP` special-case route | the release status endpoint and OpenAPI contribution were owned implicitly by an HTTP subclass override | `release-status` explicitly owns `GET /api/v1/release/status` and its OpenAPI contribution; the HTTP façade only preserves root-manifest compatibility and the operator property |\n'
          research_row = '| Searchable Research registration | canonical Research services were registered first and then silently replaced by Search-aware services | `research` installs the Search-aware projections and command inventory exactly once; Context reuses the same durable `base.research` service instead of registering a second owner |\n'
          if research_row not in text:
              if release_row not in text:
                  raise SystemExit('release migration row not found')
              text = text.replace(release_row, release_row + research_row, 1)
          docs.write_text(text)
          PY
      - name: Install matching Ruff
        run: python -m pip install ruff==0.16.7
      - name: Format patched Python
        run: ruff format src/ai_multi_agent_platform/deployment/context_operationalization.py
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/deployment/context_operationalization.py docs/runtime/CONTROL_PLANE_COMPOSITION.md
          git commit -m 'Reuse canonical Research service in context composition'
          git push origin HEAD:issue/982-explicit-control-plane-composition
