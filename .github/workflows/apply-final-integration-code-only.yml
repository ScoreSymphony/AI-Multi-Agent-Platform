name: Apply final integration fixes code only

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/apply-final-integration-code-only.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Reuse prepared final patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-final-integration-fixes.yml').read_text()
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'final-integration-patch', 'exec'))
          PY
          ruff format \
            src/ai_multi_agent_platform/evaluation/contracts.py \
            src/ai_multi_agent_platform/evaluation/repository.py \
            src/ai_multi_agent_platform/evaluation/sqlite_repository.py \
            src/ai_multi_agent_platform/evaluation/service.py \
            src/ai_multi_agent_platform/evaluation/runner.py \
            src/ai_multi_agent_platform/control_plane/evaluation_contract.py \
            src/ai_multi_agent_platform/context/lifecycle.py \
            tests/test_issue_439_single_node.py \
            tests/test_issue_595_governed_learning.py
          ruff check --fix \
            src/ai_multi_agent_platform/evaluation/contracts.py \
            src/ai_multi_agent_platform/evaluation/repository.py \
            src/ai_multi_agent_platform/evaluation/sqlite_repository.py \
            src/ai_multi_agent_platform/evaluation/service.py \
            src/ai_multi_agent_platform/evaluation/runner.py \
            src/ai_multi_agent_platform/control_plane/evaluation_contract.py \
            src/ai_multi_agent_platform/context/lifecycle.py \
            tests/test_issue_439_single_node.py \
            tests/test_issue_595_governed_learning.py
      - name: Targeted validation
        shell: bash
        run: |
          pytest -q \
            tests/test_evaluation_control_plane_api.py \
            tests/test_issue_594_eval_reproducibility.py \
            tests/test_issue_19_product_completion.py::test_agent_model_target_runs_through_product_evaluation_and_server_snapshot \
            tests/test_issue_439_single_node.py::test_public_single_node_composes_planning_and_hands_activation_to_coordinator \
            tests/test_issue_595_governed_learning.py::test_routing_profile_proposal_evaluation_and_promotion
          mypy src
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/evaluation/contracts.py \
            src/ai_multi_agent_platform/evaluation/repository.py \
            src/ai_multi_agent_platform/evaluation/sqlite_repository.py \
            src/ai_multi_agent_platform/evaluation/service.py \
            src/ai_multi_agent_platform/evaluation/runner.py \
            src/ai_multi_agent_platform/control_plane/evaluation_contract.py \
            src/ai_multi_agent_platform/context/lifecycle.py \
            tests/test_issue_439_single_node.py \
            tests/test_issue_595_governed_learning.py
          git diff --cached --check
          git commit -m "fix: close final integration validation gaps"
          git push origin HEAD:integration/active-branches-2026-09-08
