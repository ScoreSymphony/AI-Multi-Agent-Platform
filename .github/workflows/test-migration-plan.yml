name: Test Migration Plan

on:
  push:
    branches:
      - test/722-final-rest-migration
    paths:
      - scripts/ci/plan_test_migration_722.py
      - .github/workflows/test-migration-plan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze remaining migration candidates
        run: python scripts/ci/plan_test_migration_722.py || true
