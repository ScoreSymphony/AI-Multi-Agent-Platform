name: issue-79-install-debug

on:
  push:
    branches:
      - feat/issue-79-portability-final

permissions:
  contents: write

jobs:
  debug-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install clean server extra
        run: |
          python -m venv .debug-venv
          source .debug-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install ".[server]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
      - name: Build clean installed deployment after deferred composition fix
        run: |
          python - <<'PY'
          import tempfile
          from pathlib import Path
          from ai_multi_agent_platform.deployment import SingleNodeConfig, build_single_node_deployment

          with tempfile.TemporaryDirectory() as directory:
              build_single_node_deployment(
                  SingleNodeConfig(data_dir=Path(directory), secure_cookie=False)
              )
          PY
      - name: Remove helper after success
        run: |
          git rm .github/workflows/issue-79-install-debug.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(ci): remove issue 79 install debugger"
          git push origin HEAD:feat/issue-79-portability-final
