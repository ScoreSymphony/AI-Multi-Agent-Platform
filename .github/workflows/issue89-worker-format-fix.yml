name: Issue 89 worker format fix

on:
  push:
    branches: [issue-89-control-plane-ha]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.12,<1"
      - run: |
          ruff format \
            src/ai_multi_agent_platform/high_availability/worker_transport.py \
            tests/test_issue_89_worker_epoch_transport.py
      - shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/high_availability/worker_transport.py \
            tests/test_issue_89_worker_epoch_transport.py
          git commit -m "chore: format #89 Worker fencing"
          git push origin HEAD:issue-89-control-plane-ha
