name: Temporary integrate issue 638

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: integration/active-branches-2026-09-08

      - name: Merge issue 638 with explicit catalog resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin issue-638-technical-marketplace-complete

          git show HEAD:catalogs/technical-components/catalog.json > /tmp/catalog-ours.json
          git show origin/issue-638-technical-marketplace-complete:catalogs/technical-components/catalog.json > /tmp/catalog-theirs.json

          set +e
          git merge --no-ff --no-commit origin/issue-638-technical-marketplace-complete
          merge_rc=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ -n "$conflicts" ] && [ "$conflicts" != "catalogs/technical-components/catalog.json" ]; then
            echo "Unexpected conflicts:" >&2
            printf '%s\n' "$conflicts" >&2
            exit 1
          fi

          python - <<'PY'
          import copy
          import json
          from pathlib import Path

          ours = json.loads(Path('/tmp/catalog-ours.json').read_text())
          theirs = json.loads(Path('/tmp/catalog-theirs.json').read_text())
          ours_by_id = {item['metadata']['item_id']: item for item in ours['items']}
          merged_items = []

          for item in ours['items']:
              merged = copy.deepcopy(item)
              other = next((candidate for candidate in theirs['items'] if candidate['metadata']['item_id'] == item['metadata']['item_id']), None)
              if other is not None:
                  for field in ('tags', 'categories'):
                      current = list(merged['metadata'].get(field, []))
                      for value in other['metadata'].get(field, []):
                          if value not in current:
                              current.append(value)
                      merged['metadata'][field] = current
              merged_items.append(merged)

          for item in theirs['items']:
              if item['metadata']['item_id'] not in ours_by_id:
                  merged_items.append(item)

          merged_doc = copy.deepcopy(ours)
          merged_doc['items'] = merged_items
          Path('catalogs/technical-components/catalog.json').write_text(
              json.dumps(merged_doc, indent=2, ensure_ascii=False) + '\n'
          )

          # Integrated semantics: the four repository-intelligence records retain
          # the newer #502 audit/version provenance, while #638 owns the broader
          # Marketplace curation records and taxonomy.
          test_path = Path('tests/test_issue_638_technical_marketplace_catalog.py')
          text = test_path.read_text()
          old = '        assert item.review_reference == "https://github.com/ScoreSymphony/AI-Multi-Agent-Platform/issues/638"\n'
          new = '''        if item.item_id in EXPECTED_CODE_INTELLIGENCE:\n            assert item.review_reference == "https://github.com/ScoreSymphony/AI-Multi-Agent-Platform/issues/502"\n        else:\n            assert item.review_reference == "https://github.com/ScoreSymphony/AI-Multi-Agent-Platform/issues/638"\n'''
          if old not in text:
              raise SystemExit('Expected #638 review-reference assertion was not found')
          test_path.write_text(text.replace(old, new, 1))
          PY

          git add catalogs/technical-components/catalog.json tests/test_issue_638_technical_marketplace_catalog.py

          remaining="$(git diff --name-only --diff-filter=U)"
          if [ -n "$remaining" ]; then
            echo "Unresolved conflicts remain:" >&2
            printf '%s\n' "$remaining" >&2
            exit 1
          fi

          if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
            git commit -m "integration: merge issue 638 with current catalog audit"
          elif [ "$merge_rc" -ne 0 ]; then
            echo "Merge failed without a resolvable merge state" >&2
            exit "$merge_rc"
          fi

          git push origin HEAD:integration/active-branches-2026-09-08
