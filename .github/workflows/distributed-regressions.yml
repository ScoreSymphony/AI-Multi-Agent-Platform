name: Distributed regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/distributed-regressions.yml"
  workflow_dispatch:

jobs:
  distributed-scale-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate distributed scale implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py \
            tests/performance/test_issue_440_distributed_scale.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py \
            tests/performance/test_issue_440_distributed_scale.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/distributed_scale.py \
            src/ai_multi_agent_platform/benchmarking/distributed_scale_cli.py
          pytest tests/performance/test_issue_440_distributed_scale.py
      - name: Run tiny distributed scale profile
        run: |
          mkdir -p artifacts/benchmarks/pr-distributed-scale
          platform-distributed-scale \
            --worker-count 2 \
            --rounds 1 \
            --payload-sizes-bytes 1024 \
            --timeout-seconds 20 \
            --safety-max-operations 4 \
            --safety-max-payload-bytes 4096 \
            --safety-max-fixture-bytes 4096 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-distributed-scale/report.json
      - name: Validate distributed scale report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-distributed-scale.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-distributed-scale/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          assert report["benchmark"]["worker_count"] == 2
          assert report["benchmark"]["rounds"] == 1
          assert report["benchmark"]["payload_sizes_bytes"] == [1024]
          assert report["benchmark"]["chunk_bytes"] == 131072
          assert report["benchmark"]["fixture_bytes"] == 1024
          assert report["benchmark"]["operation_count"] == 2
          assert correctness["passed"] is True
          assert correctness["registered_workers"] == 2
          assert correctness["heartbeat_workers"] == 2
          assert correctness["terminal_jobs"] == 2
          assert correctness["unique_worker_job_ids"] == 2
          assert correctness["unique_run_ids"] == 2
          assert correctness["workers_used"] == 2
          assert correctness["balanced_rounds"] == 1
          assert correctness["cleaned_materializations"] == 2
          assert report["registration_latency"]["count"] == 2
          assert report["heartbeat_latency"]["count"] == 2
          assert report["dispatch_latency"]["count"] == 2
          assert report["reconciliation_batch_latency"]["count"] == 1
          assert report["terminal_result_latency"]["count"] == 2
          assert report["payload_operation_counts"] == {"1024": 2}
          PY
      - name: Upload distributed scale evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-distributed-scale-benchmark
          path: artifacts/benchmarks/pr-distributed-scale
          if-no-files-found: ignore

  heterogeneous-placement-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate heterogeneous placement implementation
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py \
            tests/performance/test_issue_440_heterogeneous_placement.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py \
            tests/performance/test_issue_440_heterogeneous_placement.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement.py \
            src/ai_multi_agent_platform/benchmarking/heterogeneous_placement_cli.py
          pytest tests/performance/test_issue_440_heterogeneous_placement.py
      - name: Run tiny heterogeneous placement profile
        run: |
          mkdir -p artifacts/benchmarks/pr-heterogeneous-placement
          platform-heterogeneous-placement \
            --iterations-per-profile 2 \
            --safety-max-operations 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-heterogeneous-placement/report.json
      - name: Validate heterogeneous placement report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-heterogeneous-placement.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-heterogeneous-placement/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          assert report["benchmark"]["iterations_per_profile"] == 2
          assert report["benchmark"]["operation_count"] == 8
          assert correctness["passed"] is True
          assert correctness["attempted_operations"] == 8
          assert correctness["successful_placements"] == 6
          assert correctness["rejected_operations"] == 2
          assert correctness["misplaced_operations"] == 0
          assert correctness["constraint_evidence_failures"] == 0
          assert correctness["reservation_leaks"] == 0
          assert report["role_placement_counts"] == {"browser": 2, "cpu": 2, "gpu": 2}
          assert report["profile_latency"]["cpu-only"]["count"] == 2
          assert report["profile_latency"]["gpu-inference"]["count"] == 2
          assert report["profile_latency"]["browser-network"]["count"] == 2
          assert report["profile_latency"]["unschedulable-vram"]["count"] == 2
          assert report["constraint_evidence_counts"] == {
              "browser-network:cpu:network_unavailable": 2,
              "browser-network:gpu:label_mismatch": 2,
              "cpu-only:browser:label_mismatch": 2,
              "cpu-only:gpu:gpu_required": 2,
              "gpu-inference:browser:gpu_required": 2,
              "gpu-inference:cpu:gpu_required": 2,
              "unschedulable-vram:gpu:vram_insufficient": 2,
          }
          PY
      - name: Upload heterogeneous placement evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-heterogeneous-placement-benchmark
          path: artifacts/benchmarks/pr-heterogeneous-placement
          if-no-files-found: ignore
