name: Issue 597 final hardening

on:
  push:
    branches:
      - fix/597-goal-completion-final

permissions:
  contents: write

jobs:
  harden-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/597-goal-completion-final

      - name: Apply final Goal hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:160]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          goal_contract = "src/ai_multi_agent_platform/control_plane/goal_contract.py"
          replace_once(
              goal_contract,
              "from ai_multi_agent_platform.goals.repository import goal_state_to_json\n",
              "from ai_multi_agent_platform.goals.repository import goal_state_to_json\nfrom ai_multi_agent_platform.security import ActorType, infer_actor_identity\n",
          )
          replace_once(
              goal_contract,
              '''        if not isinstance(raw_evidence, list):\n            raise ContractError(ErrorCode.INVALID_REQUEST, "evidence must be an array")\n        return _goal_resource(\n''',
              '''        if not isinstance(raw_evidence, list):\n            raise ContractError(ErrorCode.INVALID_REQUEST, "evidence must be an array")\n        current = await service.get_goal(resource_ref)\n        evidence = tuple(\n            _parse_evidence(context, item, current.success_criteria) for item in raw_evidence\n        )\n        return _goal_resource(\n''',
          )
          replace_once(
              goal_contract,
              "                evidence=tuple(_parse_evidence(context, item) for item in raw_evidence),",
              "                evidence=evidence,",
          )
          replace_once(
              goal_contract,
              '''def _parse_evidence(context: RequestContext, raw: JsonValue) -> GoalEvidence:\n    value = _object(raw, "evidence[]")\n    observed = _optional_string(value, "observed_at")\n    evidence_id = _optional_string(value, "evidence_id")\n    kind = _required_string(value, "kind")\n''',
              '''def _parse_evidence(\n    context: RequestContext,\n    raw: JsonValue,\n    success_criteria: tuple[SuccessCriterion, ...],\n) -> GoalEvidence:\n    value = _object(raw, "evidence[]")\n    observed = _optional_string(value, "observed_at")\n    evidence_id = _optional_string(value, "evidence_id")\n    criterion_id = _required_string(value, "criterion_id")\n    criterion = next(\n        (item for item in success_criteria if item.criterion_id == criterion_id),\n        None,\n    )\n    if criterion is None:\n        raise ContractError(\n            ErrorCode.INVALID_REQUEST,\n            "Goal evidence criterion_id is not defined by the current Goal revision",\n        )\n    kind = _required_string(value, "kind")\n    if kind != criterion.kind.value:\n        raise ContractError(\n            ErrorCode.INVALID_REQUEST,\n            "Goal evidence kind must match the canonical success criterion kind",\n        )\n''',
          )
          replace_once(
              goal_contract,
              '''    if kind == GoalCriterionKind.HUMAN_ACCEPTANCE.value:\n        if context.actor.owner_type != "user":\n            raise ContractError(\n                ErrorCode.FORBIDDEN,\n                "human Goal acceptance requires an authenticated user actor",\n            )\n        verified = True\n''',
              '''    if kind == GoalCriterionKind.HUMAN_ACCEPTANCE.value:\n        actor_type = context.actor.actor_type\n        if actor_type is None:\n            actor_type = infer_actor_identity(context.actor.principal_ref).actor_type.value\n        if actor_type != ActorType.HUMAN.value:\n            raise ContractError(\n                ErrorCode.FORBIDDEN,\n                "human Goal acceptance requires an authenticated human actor",\n            )\n        verified = True\n''',
          )
          replace_once(
              goal_contract,
              '        "criterion_id": _required_string(value, "criterion_id"),',
              '        "criterion_id": criterion_id,',
          )

          goal_service = "src/ai_multi_agent_platform/goals/service.py"
          replace_once(
              goal_service,
              "    TaskRevisionPolicy,\n    constraints_to_json,",
              "    TaskRevisionPolicy,\n    TERMINAL_GOAL_STATUSES,\n    constraints_to_json,",
          )
          replace_once(
              goal_service,
              '''        progress = (\n            GoalProgress.DEGRADED if task_state is GoalTaskState.FAILED else GoalProgress.MONITORING\n        )\n''',
              '''        if current.status in TERMINAL_GOAL_STATUSES or current.status is GoalStatus.PAUSED:\n            progress = current.progress\n        else:\n            progress = (\n                GoalProgress.DEGRADED\n                if task_state is GoalTaskState.FAILED\n                else GoalProgress.MONITORING\n            )\n''',
          )

          test_path = Path("tests/test_issue_597_completion_gaps.py")
          text = test_path.read_text(encoding="utf-8")
          marker = "def test_evidence_kind_is_bound_to_the_canonical_criterion()"
          if marker not in text:
              addition = dedent(r'''

              def test_evidence_kind_is_bound_to_the_canonical_criterion() -> None:
                  async def scenario() -> None:
                      control_plane, _, _ = _stack()
                      created = await control_plane.goals.create_goal(
                          idempotency_key="create-kind-boundary-goal",
                          title="Metric kind boundary",
                          objective="Prevent evidence kind spoofing",
                          owner_ref=_OWNER,
                          success_criteria=(
                              SuccessCriterion(
                                  criterion_id="quality",
                                  kind=GoalCriterionKind.METRIC,
                                  description="Quality reaches 90",
                                  operator="gte",
                                  target=90,
                              ),
                          ),
                          task_generation_policy=TaskGenerationPolicy(enabled=False),
                      )
                      await control_plane.goals.activate_goal(
                          goal_id=created.goal_id,
                          idempotency_key="activate-kind-boundary-goal",
                      )
                      with pytest.raises(ContractError) as raised:
                          await control_plane.execute_command(
                              _context("spoof-human-kind-for-metric"),
                              "goal.review",
                              created.goal_id,
                              {
                                  "expected_revision": 1,
                                  "trigger_ref": "manual:spoof",
                                  "evidence": [
                                      {
                                          "criterion_id": "quality",
                                          "kind": "human_acceptance",
                                          "value": 100,
                                      }
                                  ],
                              },
                          )
                      assert raised.value.code is ErrorCode.INVALID_REQUEST
                      unchanged = await control_plane.goals.get_goal(created.goal_id)
                      assert unchanged.evidence == ()
                      assert unchanged.reviews == ()

                  _run(scenario())


              def test_service_actor_cannot_promote_human_acceptance_even_in_user_owner_scope() -> None:
                  async def scenario() -> None:
                      control_plane, _, _ = _stack()
                      created = await control_plane.goals.create_goal(
                          idempotency_key="create-service-acceptance-guard",
                          title="Human-only acceptance",
                          objective="Only a human actor may accept this Goal",
                          owner_ref=_OWNER,
                          success_criteria=(
                              SuccessCriterion(
                                  criterion_id="accepted",
                                  kind=GoalCriterionKind.HUMAN_ACCEPTANCE,
                                  description="A human accepts the outcome",
                                  target=True,
                              ),
                          ),
                          task_generation_policy=TaskGenerationPolicy(enabled=False),
                      )
                      await control_plane.goals.activate_goal(
                          goal_id=created.goal_id,
                          idempotency_key="activate-service-acceptance-guard",
                      )
                      service_context = RequestContext(
                          request_id="request:service-acceptance",
                          correlation_id="correlation:service-acceptance",
                          actor=ActorContext(
                              principal_ref="service:goal-reviewer",
                              owner_type="user",
                              owner_id=_OWNER_ID,
                              actor_type="service",
                          ),
                          idempotency_key="service-acceptance-review",
                      )
                      with pytest.raises(ContractError) as raised:
                          await control_plane.execute_command(
                              service_context,
                              "goal.review",
                              created.goal_id,
                              {
                                  "expected_revision": 1,
                                  "trigger_ref": "manual:service",
                                  "evidence": [
                                      {
                                          "criterion_id": "accepted",
                                          "kind": "human_acceptance",
                                          "value": True,
                                      }
                                  ],
                              },
                          )
                      assert raised.value.code is ErrorCode.FORBIDDEN
                      unchanged = await control_plane.goals.get_goal(created.goal_id)
                      assert unchanged.evidence == ()
                      assert unchanged.reviews == ()

                  _run(scenario())


              def test_task_outcome_reconciliation_preserves_paused_and_terminal_progress() -> None:
                  async def scenario() -> None:
                      control_plane, _, _ = _stack()

                      paused_goal = await control_plane.goals.create_goal(
                          idempotency_key="create-paused-progress-guard",
                          title="Paused progress guard",
                          objective="Preserve human pause semantics during Task reconciliation",
                          owner_ref=_OWNER,
                          success_criteria=(
                              SuccessCriterion(
                                  criterion_id="accepted",
                                  kind=GoalCriterionKind.HUMAN_ACCEPTANCE,
                                  description="Human acceptance",
                                  target=True,
                              ),
                          ),
                          task_generation_policy=TaskGenerationPolicy(enabled=False),
                      )
                      await control_plane.goals.activate_goal(
                          goal_id=paused_goal.goal_id,
                          idempotency_key="activate-paused-progress-guard",
                      )
                      paused_task_id = new_id("task")
                      await control_plane.goals.attach_task(
                          goal_id=paused_goal.goal_id,
                          task_id=paused_task_id,
                          expected_revision=1,
                          idempotency_key="attach-paused-progress-task",
                      )
                      paused = await control_plane.goals.pause_goal(
                          goal_id=paused_goal.goal_id,
                          idempotency_key="pause-progress-guard",
                      )
                      paused_progress = paused.progress
                      reconciled_paused = await control_plane.goals.record_task_outcome(
                          goal_id=paused_goal.goal_id,
                          task_id=paused_task_id,
                          task_state=GoalTaskState.SUCCEEDED,
                          idempotency_key="reconcile-paused-progress-task",
                      )
                      assert reconciled_paused.status is GoalStatus.PAUSED
                      assert reconciled_paused.progress is paused_progress
                      assert reconciled_paused.linked_tasks[0].task_state is GoalTaskState.SUCCEEDED

                      terminal_goal = await control_plane.goals.create_goal(
                          idempotency_key="create-terminal-progress-guard",
                          title="Terminal progress guard",
                          objective="Preserve satisfied progress during late Task reconciliation",
                          owner_ref=_OWNER,
                          success_criteria=(
                              SuccessCriterion(
                                  criterion_id="accepted",
                                  kind=GoalCriterionKind.HUMAN_ACCEPTANCE,
                                  description="Human acceptance",
                                  target=True,
                              ),
                          ),
                          task_generation_policy=TaskGenerationPolicy(enabled=False),
                      )
                      await control_plane.goals.activate_goal(
                          goal_id=terminal_goal.goal_id,
                          idempotency_key="activate-terminal-progress-guard",
                      )
                      terminal_task_id = new_id("task")
                      await control_plane.goals.attach_task(
                          goal_id=terminal_goal.goal_id,
                          task_id=terminal_task_id,
                          expected_revision=1,
                          idempotency_key="attach-terminal-progress-task",
                      )
                      satisfied_resource = await control_plane.execute_command(
                          _context("satisfy-terminal-progress-guard"),
                          "goal.review",
                          terminal_goal.goal_id,
                          {
                              "expected_revision": 1,
                              "trigger_ref": "manual:human",
                              "evidence": [
                                  {
                                      "criterion_id": "accepted",
                                      "kind": "human_acceptance",
                                      "value": True,
                                  }
                              ],
                          },
                      )
                      assert satisfied_resource["status"] == GoalStatus.SATISFIED.value
                      satisfied = await control_plane.goals.get_goal(terminal_goal.goal_id)
                      assert satisfied.progress is GoalProgress.SATISFIED
                      reconciled_terminal = await control_plane.goals.record_task_outcome(
                          goal_id=terminal_goal.goal_id,
                          task_id=terminal_task_id,
                          task_state=GoalTaskState.SUCCEEDED,
                          idempotency_key="reconcile-terminal-progress-task",
                      )
                      assert reconciled_terminal.status is GoalStatus.SATISFIED
                      assert reconciled_terminal.progress is GoalProgress.SATISFIED
                      assert reconciled_terminal.linked_tasks[0].task_state is GoalTaskState.SUCCEEDED

                  _run(scenario())
              ''')
              test_path.write_text(text + addition, encoding="utf-8")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format and lint focused changes
        run: |
          ruff format src/ai_multi_agent_platform/control_plane/goal_contract.py src/ai_multi_agent_platform/goals/service.py src/ai_multi_agent_platform/goals/reconciliation.py tests/test_issue_597_completion_gaps.py
          ruff check --fix src/ai_multi_agent_platform/control_plane/goal_contract.py src/ai_multi_agent_platform/goals/service.py src/ai_multi_agent_platform/goals/reconciliation.py tests/test_issue_597_completion_gaps.py
          ruff check src/ai_multi_agent_platform/control_plane/goal_contract.py src/ai_multi_agent_platform/goals/service.py src/ai_multi_agent_platform/goals/reconciliation.py tests/test_issue_597_completion_gaps.py

      - name: Focused Goal regressions
        run: pytest -q tests/test_issue_597_completion_gaps.py

      - name: Commit final hardened patch
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/issue597-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests .github/workflows/issue597-finalize.yml
          git commit -m "fix(#597): harden evidence promotion and Goal reconciliation"
          git push origin HEAD:fix/597-goal-completion-final