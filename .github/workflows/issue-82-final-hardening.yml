name: Issue 82 final hardening

on:
  push:
    branches: [feat/issue-82-operational-completion]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply audited issue 82 lifecycle hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_multi_agent_platform/repositories/control_plane.py",
              '''    control_plane.register_resource_service(\n        REPOSITORY_COLLECTION,\n        RepositoryResourceService(repositories),\n    )\n\n    async def branches(''',
              '''    control_plane.register_resource_service(\n        REPOSITORY_COLLECTION,\n        RepositoryResourceService(repositories),\n    )\n    if management is not None:\n        # #44 discovers this provider-neutral lifecycle hook when both domains are composed.\n        setattr(  # noqa: B010\n            control_plane,\n            "connector_connection_removal_hook",\n            management.detach_connection,\n        )\n\n    async def branches(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/control_plane.py",
              '''        "project_id": connection.project_id,\n        "organization_id": connection.organization_id,''',
              '''        "project_id": connection.project_id,\n        "connection_id": connection.id,\n        "organization_id": connection.organization_id,''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/management.py",
              '''        self._catalog.delete(repository_id)\n        self._registry.unregister(repository_id)\n        return binding.reference\n\n    async def _resolve_discovery(''',
              '''        self._catalog.delete(repository_id)\n        self._registry.unregister(repository_id)\n        return binding.reference\n\n    async def detach_connection(\n        self,\n        connection: Connection,\n    ) -> tuple[RepositoryReference, ...]:\n        """Prune repository routing/catalog state before its canonical Connection is removed.\n\n        The caller owns Connection DELETE authorization. This hook only removes platform-owned\n        repository bindings and never deletes provider-owned repository content. It also removes\n        transient registry-only bindings so a derived Search rebuild cannot retain stale results.\n        """\n\n        detached: list[RepositoryReference] = []\n        persisted_ids: set[str] = set()\n        for record in self._catalog.list(connection_id=connection.id):\n            persisted_ids.add(record.repository_id)\n            self._catalog.delete(record.repository_id)\n            try:\n                binding = self._registry.unregister(record.repository_id)\n            except ContractError as exc:\n                if exc.code is not ErrorCode.NOT_FOUND:\n                    raise\n                detached.append(record.reference)\n            else:\n                detached.append(binding.reference)\n\n        for binding in tuple(self._registry.list(connection_id=connection.id)):\n            if binding.reference.id in persisted_ids:\n                continue\n            self._registry.unregister(binding.reference.id)\n            detached.append(binding.reference)\n        return tuple(detached)\n\n    async def _resolve_discovery(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''from dataclasses import replace\nfrom datetime import UTC, datetime''',
              '''from collections.abc import Awaitable, Callable\nfrom dataclasses import replace\nfrom datetime import UTC, datetime''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''from .repository import ConnectorRepository\n\n\nclass ConnectorService:''',
              '''from .repository import ConnectorRepository\n\nConnectionRemovalHook = Callable[[Connection], Awaitable[object]]\n\n\nclass ConnectorService:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''    async def remove_connection(\n        self,\n        connection_id: str,\n        *,\n        actor: ActorIdentity,\n        context: OperationContext,\n        approval_id: str | None = None,\n    ) -> None:''',
              '''    async def remove_connection(\n        self,\n        connection_id: str,\n        *,\n        actor: ActorIdentity,\n        context: OperationContext,\n        approval_id: str | None = None,\n        before_remove: ConnectionRemovalHook | None = None,\n    ) -> None:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''        await self.repository.delete_connection(connection_id)\n\n    async def check_health(''',
              '''        if before_remove is not None:\n            # Cleanup runs only after DELETE authorization and before the canonical Connection\n            # disappears. A cleanup failure therefore leaves lifecycle state fail-closed/retryable.\n            await before_remove(connection)\n        await self.repository.delete_connection(connection_id)\n\n    async def check_health(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''from .service import ConnectorService\n''',
              '''from .service import ConnectionRemovalHook, ConnectorService\n''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''    actor_resolver: ConnectorControlPlaneActorResolver = default_actor_resolver,\n    health_event_sink: ConnectorHealthEventSink | None = None,\n) -> None:''',
              '''    actor_resolver: ConnectorControlPlaneActorResolver = default_actor_resolver,\n    health_event_sink: ConnectorHealthEventSink | None = None,\n    connection_removal_hook: ConnectionRemovalHook | None = None,\n) -> None:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''    if health_event_sink is None:\n        discovered_sink = getattr(control_plane, "connector_health_event_sink", None)\n        if callable(discovered_sink):\n            health_event_sink = cast(ConnectorHealthEventSink, discovered_sink)\n\n    control_plane.register_resource_service(''',
              '''    if health_event_sink is None:\n        discovered_sink = getattr(control_plane, "connector_health_event_sink", None)\n        if callable(discovered_sink):\n            health_event_sink = cast(ConnectorHealthEventSink, discovered_sink)\n    if connection_removal_hook is None:\n        discovered_removal_hook = getattr(\n            control_plane,\n            "connector_connection_removal_hook",\n            None,\n        )\n        if callable(discovered_removal_hook):\n            connection_removal_hook = cast(ConnectionRemovalHook, discovered_removal_hook)\n\n    control_plane.register_resource_service(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''        await connectors.remove_connection(\n            resource_ref,\n            actor=actor_resolver(context),\n            context=_operation_context(context, existing.project_id),\n            approval_id=_optional_string(payload.get("approval_id"), "approval_id"),\n        )''',
              '''        await connectors.remove_connection(\n            resource_ref,\n            actor=actor_resolver(context),\n            context=_operation_context(context, existing.project_id),\n            approval_id=_optional_string(payload.get("approval_id"), "approval_id"),\n            before_remove=connection_removal_hook,\n        )''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/connector_bootstrap.py",
              '''        connection = await connections.get_connection(record.connection_id)\n        _require_usable_connection(connection)''',
              '''        try:\n            connection = await connections.get_connection(record.connection_id)\n        except ContractError as exc:\n            if exc.code is not ErrorCode.NOT_FOUND:\n                raise\n            # A removed canonical Connection cannot retain repository routing/Search state.\n            catalog.delete(record.repository_id)\n            continue\n        _require_usable_connection(connection)''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''    RepositoryEventRuntimeIngress,\n    RepositoryManagementService,''',
              '''    RepositoryDiscoveryResolver,\n    RepositoryEventRuntimeIngress,\n    RepositoryManagementService,''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''    observability_exporter: InMemoryExporter | None = None,\n    distributed_runtime: DistributedRuntime | None = None,\n) -> SingleNodeDeployment:''',
              '''    observability_exporter: InMemoryExporter | None = None,\n    distributed_runtime: DistributedRuntime | None = None,\n    repository_discovery_resolver: RepositoryDiscoveryResolver | None = None,\n) -> SingleNodeDeployment:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''        approval_gate,\n        managed_local_root=config.repositories_dir,\n    )''',
              '''        approval_gate,\n        managed_local_root=config.repositories_dir,\n        discovery_resolver=repository_discovery_resolver,\n    )''',
          )
          PY
      - name: Install project tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Normalize and lint changed files
        run: |
          ruff check --fix src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories/control_plane.py src/ai_multi_agent_platform/repositories/management.py src/ai_multi_agent_platform/repositories/connector_bootstrap.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_single_node_discovery_composition.py
          ruff format src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories/control_plane.py src/ai_multi_agent_platform/repositories/management.py src/ai_multi_agent_platform/repositories/connector_bootstrap.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_single_node_discovery_composition.py
          ruff check src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories/control_plane.py src/ai_multi_agent_platform/repositories/management.py src/ai_multi_agent_platform/repositories/connector_bootstrap.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_single_node_discovery_composition.py
      - name: Typecheck platform
        run: mypy src/ai_multi_agent_platform
      - name: Run issue 82 lifecycle and composition regressions
        run: |
          pytest -q \
            tests/test_issue_82_repository_search.py \
            tests/test_issue_82_search_lifecycle_hardening.py \
            tests/test_issue_82_repository_management.py \
            tests/test_issue_82_single_node_discovery_composition.py \
            tests/test_issue_82_single_node_capability_composition.py \
            tests/test_issue_82_single_node_run_workspace_bindings.py \
            tests/test_connector_control_plane.py
      - name: Commit validated hardening
        shell: bash
        run: |
          git rm .github/workflows/issue-82-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories/control_plane.py src/ai_multi_agent_platform/repositories/management.py src/ai_multi_agent_platform/repositories/connector_bootstrap.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_single_node_discovery_composition.py
          git commit -m "fix(repositories): close search and Connection lifecycle gaps (#82)"
          git push origin HEAD:feat/issue-82-operational-completion
