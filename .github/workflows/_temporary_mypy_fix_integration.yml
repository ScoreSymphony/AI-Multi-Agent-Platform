              "    return safe",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/handoffs/production.py",
              "            bundle = self.skills.get_bundle(reference.resource_id)\n            if bundle.task_id != task_id:",
              "            skill_bundle = self.skills.get_bundle(reference.resource_id)\n            if skill_bundle.task_id != task_id:",
              count=1,
