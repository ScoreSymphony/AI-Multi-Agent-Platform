              count=1,
          )
          for old, new in (
              ("lambda source=source: repository.get_source(source.source_id)", "partial(repository.get_source, source.source_id)"),
              ("lambda observation=observation: repository.get_observation(observation.observation_id)", "partial(repository.get_observation, observation.observation_id)"),
              ("lambda claim=claim: repository.get_claim(claim.claim_id)", "partial(repository.get_claim, claim.claim_id)"),
              ("lambda value=value: repository.get_evidence(value.evidence_id)", "partial(repository.get_evidence, value.evidence_id)"),
          ):
              replace("src/ai_multi_agent_platform/research/portability.py", old, new, count=2)

          replace(
              "src/ai_multi_agent_platform/repository_intelligence/projectatlas_resources.py",
              "from dataclasses import replace\n",
              "from dataclasses import replace\nfrom typing import TypedDict\n",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/repository_intelligence/projectatlas_resources.py",
              "PROJECTATLAS_PILOT_STATE_BYTES = 820_744\n\n\ndef projectatlas_resource_profile",
              "PROJECTATLAS_PILOT_STATE_BYTES = 820_744\n\n\nclass _ProjectAtlasResourceCommon(TypedDict):\n    runtime: str\n    os_name: str\n    network_required: bool\n    host_pressure_sensitive: bool\n    evidence_ref: str\n    observed_peak_rss_bytes: int\n    observed_state_bytes: int\n\n\ndef projectatlas_resource_profile",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/repository_intelligence/projectatlas_resources.py",
              "    common = {",
              "    common: _ProjectAtlasResourceCommon = {",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/portability/research_codecs.py",
              "        bundle = cast(dict[str, JsonValue], raw_bundle)",
              "        bundle = raw_bundle",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "from ai_multi_agent_platform.skills import ReferenceSkillRenderer, SkillRepository",
              "from ai_multi_agent_platform.skills import ReferenceSkillRenderer, SkillBundle, SkillRepository",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "    ContextCandidate,\n    ContextDataClassification,",
              "    ContextBundle,\n    ContextCandidate,\n    ContextDataClassification,",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "        bindings: Sequence[ContextSourceAdapterBinding],\n    ):\n        source_request",
              "        bindings: Sequence[ContextSourceAdapterBinding],\n    ) -> ContextBundle:\n        source_request",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "    def bundle_for(self, request: ContextSourceRequest):",
              "    def bundle_for(self, request: ContextSourceRequest) -> SkillBundle | None:",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "            revision = cast(str | None, explicit_revision) or (",
              "            revision = explicit_revision or (",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
