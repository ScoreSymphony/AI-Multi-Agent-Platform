name: Temporary integration mypy fixes

on:
  push:
    branches:
      - integration/active-branches-2026-09-08

permissions:
  contents: write

jobs:
  mypy-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply and validate integration typing fixes
        shell: bash
        run: |
          python -m pip install -e '.[dev]'
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int | None = None) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old!r}")
              if count is not None and text.count(old) != count:
                  raise SystemExit(
                      f"unexpected match count in {path}: {text.count(old)} != {count} for {old!r}"
                  )
              p.write_text(text.replace(old, new))

          replace(
              "src/ai_multi_agent_platform/contracts/egress.py",
              "        for value, name in (\n            (self.data_retention_policy, \"data_retention_policy\"),\n            (self.training_policy, \"training_policy\"),\n            (self.logging_policy, \"logging_policy\"),\n            (self.jurisdiction, \"jurisdiction\"),\n        ):\n            if value is not None and not value.strip():",
              "        for optional_value, name in (\n            (self.data_retention_policy, \"data_retention_policy\"),\n            (self.training_policy, \"training_policy\"),\n            (self.logging_policy, \"logging_policy\"),\n            (self.jurisdiction, \"jurisdiction\"),\n        ):\n            if optional_value is not None and not optional_value.strip():",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/cli/learning.py",
              "from urllib.parse import quote\n",
              "from typing import cast\nfrom urllib.parse import quote\n",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/cli/learning.py",
              "        body: dict[str, JsonValue] = {\n            \"resource_ref\": str(args.candidate_id),\n            \"expected_revision\": args.expected_revision,\n        }\n        if args.approval_id is not None:\n            body[\"approval_id\"] = str(args.approval_id)\n        return client.post(\n            \"/commands/learning.promote\",\n            body=body,",
              "        promote_body: dict[str, JsonValue] = {\n            \"resource_ref\": str(args.candidate_id),\n            \"expected_revision\": args.expected_revision,\n        }\n        if args.approval_id is not None:\n            promote_body[\"approval_id\"] = str(args.approval_id)\n        return client.post(\n            \"/commands/learning.promote\",\n            body=promote_body,",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/cli/learning.py",
              "        return json.loads(raw)",
              "        return cast(JsonValue, json.loads(raw))",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/security/egress_composition.py",
              "from ai_multi_agent_platform.contracts import AuthorizationProvider\n",
              "from ai_multi_agent_platform.contracts import AuthorizationProvider\nfrom ai_multi_agent_platform.contracts.egress import EgressAuditSink\n",
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/security/egress_composition.py",
              "    EgressActorResolver,\n    EgressAuditSink,\n    EgressGate,",
              "    EgressActorResolver,\n    EgressGate,",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/security/egress_policy_control_plane.py",
