              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/security/egress_control_plane.py",
              "def _enum[T](value: Mapping[str, object], field: str, enum_type: type[T]) -> T:",
              "def _enum[T](value: Mapping[str, object], field: str, enum_type: Callable[[str], T]) -> T:",
              count=1,
