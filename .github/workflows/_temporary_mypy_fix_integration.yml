              '            body = _canonical_json(\n                {\n                    "artifact_id": artifact_id,\n                    "file_ids": cast(JsonValue, linked_files),\n                }\n            )',
              count=1,
          )
          replace(
              "src/ai_multi_agent_platform/context/source_adapters.py",
              "                body = _canonical_json(cast(JsonValue, entry.value))",
              "                body = _canonical_json(entry.value)",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/context/lifecycle.py",
              "            agent_revision = revision.revision\n            requested_capability_ids: tuple[str, ...] = ()",
              "            agent_revision: int | None = revision.revision\n            requested_capability_ids: tuple[str, ...] = ()",
              count=1,
          )

          replace(
              "src/ai_multi_agent_platform/learning/control_plane.py",
              "    return cast(dict[str, JsonValue], redacted)",
              "    return redacted",
              count=2,
          )
          replace(
              "src/ai_multi_agent_platform/learning/control_plane.py",
              '        "payload_ref": cast(str | None, record.payload_ref),',
              '        "payload_ref": record.payload_ref,',
              count=1,
