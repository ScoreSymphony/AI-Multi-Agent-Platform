          replace(
              "src/ai_multi_agent_platform/handoffs/production.py",
              "        return roles, capabilities, policies\n\n\nclass TelemetryHandoffAuditSink",
              "        return roles, capabilities, team_policies\n\n\nclass TelemetryHandoffAuditSink",
              count=1,
          )
          PY
          ruff check . --fix
          ruff format .
          ruff format --check .
          ruff check .
          mypy
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'fix: resolve integration typing regressions'
            git push origin HEAD:integration/active-branches-2026-09-08
          fi
