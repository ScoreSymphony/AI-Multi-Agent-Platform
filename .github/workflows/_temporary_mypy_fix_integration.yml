          replace(
              "src/ai_multi_agent_platform/handoffs/production.py",
              "                digest=_digest_value(bundle.digest),\n                project_id=bundle.project_id,\n                workspace_id=bundle.workspace_id,",
              "                digest=_digest_value(skill_bundle.digest),\n                project_id=skill_bundle.project_id,\n                workspace_id=skill_bundle.workspace_id,",
              count=1,
