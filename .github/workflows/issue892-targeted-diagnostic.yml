name: Issue 892 targeted diagnostics

on:
  pull_request:

jobs:
  coordination-review-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -vv tests/integration/coordination/test_coordination_async_persistence_review_regressions.py -o faulthandler_timeout=60

  coordination-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -vv tests/integration/coordination -o faulthandler_timeout=60

  context-fallback-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -vv tests/integration/context/test_kernel_plan_step_fallback.py -o faulthandler_timeout=60

  reference-multi-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest -vv tests/integration/deployment/test_reference_multi_agent_golden_path.py -o faulthandler_timeout=60
