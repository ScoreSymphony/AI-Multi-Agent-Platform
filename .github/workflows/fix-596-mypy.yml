name: Apply issue 596 mypy fix

on:
  push:
    branches:
      - fix/596-compensation-idempotency-hardening

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/596-compensation-idempotency-hardening
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Apply typing fix
        run: python scripts/_fix_issue_596_mypy.py
      - name: Validate typing fix
        run: |
          python -m pip install -e '.[dev]'
          ruff format --check src/ai_multi_agent_platform/compensation/repository.py
          ruff check src/ai_multi_agent_platform/compensation/repository.py
          mypy src/ai_multi_agent_platform/compensation/repository.py
      - name: Commit fix when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/compensation/repository.py
          git commit -m 'fix(compensation): satisfy strict repository typing (#596)'
          git push