name: API and persistence regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/api-persistence-regressions.yml"
  workflow_dispatch:

jobs:
  api-persistence-regressions:
    name: API and persistence regressions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: API pressure regression
        run: |
          mkdir -p artifacts/benchmarks/pr-api-pressure
          platform-api-pressure \
            --seed-tasks 4 \
            --operations 8 \
            --concurrency 2 \
            --page-size 2 \
            --warmup-operations 0 \
            --timeout-seconds 10 \
            --safety-max-seed-tasks 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-api-pressure/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-api-pressure.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-api-pressure/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          assert report["correctness"]["failed_operations"] == 0
          PY

      - name: Persistence contention regression
        run: |
          mkdir -p artifacts/benchmarks/pr-persistence-contention
          platform-persistence-contention \
            --writers 3 \
            --tasks-per-writer 2 \
            --safety-max-writers 3 \
            --safety-max-tasks-per-writer 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-persistence-contention/report.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          schema = json.loads(Path("docs/schemas/benchmark-persistence-contention.v1.schema.json").read_text())
          report = json.loads(Path("artifacts/benchmarks/pr-persistence-contention/report.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness"]["passed"] is True
          assert report["correctness"]["failed_logical_operations"] == 0
          PY

      - name: Operating-envelope catalog regression
        run: |
          mkdir -p artifacts/benchmarks/catalog-smoke
          platform-benchmark single-node-sweep \
            --concurrency-levels 1,2 \
            --operations-per-level 2 \
            --warmup-operations 0 \
            --repetitions 1 \
            --platform-commit "$GITHUB_SHA" \
            --output-dir artifacts/benchmarks/catalog-smoke/sweep
          platform-operating-envelope \
            --sweep artifacts/benchmarks/catalog-smoke/sweep/summary.json \
            --output artifacts/benchmarks/catalog-smoke/envelope.json
          platform-operating-envelope-catalog \
            --host ci-reference=artifacts/benchmarks/catalog-smoke/envelope.json \
            --output artifacts/benchmarks/catalog-smoke/catalog.json

      - name: Upload grouped regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-persistence-regressions
          path: artifacts/benchmarks
          if-no-files-found: ignore
