name: Broad Exception Inventory

on:
  pull_request:
    paths:
      - "src/**/*.py"
      - "scripts/ci/broad_exception_audit.py"
      - ".github/workflows/broad-exception-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate broad-exception inventory
        shell: bash
        run: |
          python scripts/ci/broad_exception_audit.py --repository-root . --format text | tee broad-exception-inventory.txt
          python scripts/ci/broad_exception_audit.py --repository-root . --format json > broad-exception-inventory.json
          python scripts/ci/broad_exception_audit.py --repository-root . --format markdown > broad-exception-inventory.md
          {
            echo '## Broad exception inventory'
            echo '```text'
            cat broad-exception-inventory.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload inventory evidence
        uses: actions/upload-artifact@v4
        with:
          name: broad-exception-inventory
          path: |
            broad-exception-inventory.txt
            broad-exception-inventory.json
            broad-exception-inventory.md
          if-no-files-found: error
