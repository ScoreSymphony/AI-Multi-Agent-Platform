name: Reference host reproducibility smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  reference-host-reproducibility-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate reproducibility implementation
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py tests/performance/test_issue_440_reference_host_reproducibility.py
          ruff check src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py tests/performance/test_issue_440_reference_host_reproducibility.py
          mypy src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility.py src/ai_multi_agent_platform/benchmarking/reference_host_reproducibility_cli.py
          pytest tests/performance/test_issue_440_reference_host_reproducibility.py
      - name: Generate two tiny same-host campaign samples
        run: |
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-1-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-1
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-2-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-2
      - name: Analyze observed same-host variability
        run: |
          platform-reference-host-reproducibility \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-1 \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-2 \
            --output artifacts/benchmarks/reference-host-repro/reproducibility.json
      - name: Validate machine-readable reproducibility evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          root = Path("artifacts/benchmarks/reference-host-repro")
          report = json.loads((root / "reproducibility.json").read_text(encoding="utf-8"))
          schema = json.loads(
              Path("docs/schemas/benchmark-reference-host-reproducibility.v1.schema.json").read_text(
                  encoding="utf-8"
              )
          )
          Draft202012Validator(schema).validate(report)
          assert report["basis"]["profile"] == "smoke"
          assert report["campaign_count"] == 2
          assert report["variability_observed"] is True
          assert report["comparison_status"] == "smoke-contract-only"
          assert report["budget_status"] == "not-established"
          assert report["stability_classification"] == "not-performed"
          assert report["correctness_passed"] is True
          PY
      - name: Upload reproducibility smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-reference-host-reproducibility
          path: artifacts/benchmarks/reference-host-repro
          if-no-files-found: ignore
