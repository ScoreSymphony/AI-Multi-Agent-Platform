name: issue-79-format

on:
  push:
    branches:
      - feat/issue-79-control-plane-portability

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install formatter
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format issue 79 files
        run: |
          ruff format \
            src/ai_multi_agent_platform/portability/workflow.py \
            src/ai_multi_agent_platform/portability/__init__.py \
            src/ai_multi_agent_platform/control_plane/portability_api.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_79_control_plane_portability.py
      - name: Commit formatter changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/portability/workflow.py \
            src/ai_multi_agent_platform/portability/__init__.py \
            src/ai_multi_agent_platform/control_plane/portability_api.py \
            src/ai_multi_agent_platform/control_plane/__init__.py \
            tests/test_issue_79_control_plane_portability.py
          git commit -m "style: format issue 79 portability slice"
          git push origin HEAD:feat/issue-79-control-plane-portability
