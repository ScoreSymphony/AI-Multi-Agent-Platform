name: Pipelock performance reference

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock-performance-reference.yml"
      - "scripts/benchmarks/issue730_pipelock_benchmark.py"
      - "tests/fixtures/mcp_stdio_server.py"
      - "tests/fixtures/websocket_echo_server.py"
      - "tests/fixtures/pipelock_adversarial_cases.json"
      - "tests/fixtures/pipelock_websocket_audit.yaml"
      - "docs/upstream/PIPELOCK_CORE_PERFORMANCE_EVIDENCE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-performance-reference:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7

      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false

      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install platform benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "websockets==15.0.1"

      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build

      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-performance-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-performance-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi
          sha256sum ./pipelock \
            "$GITHUB_WORKSPACE/tests/fixtures/pipelock_websocket_audit.yaml" \
            > "$RUNNER_TEMP/pipelock-performance-sha256.txt"

      - name: Run hosted-runner reference benchmark
        run: |
          python scripts/benchmarks/issue730_pipelock_benchmark.py \
            --pipelock-bin "$GITHUB_WORKSPACE/.candidate/pipelock/pipelock" \
            --config "$GITHUB_WORKSPACE/tests/fixtures/pipelock_websocket_audit.yaml" \
            --output "$RUNNER_TEMP/pipelock-performance-reference.json" \
            --environment-label "github-hosted-ubuntu-reference" \
            --iterations 20 \
            --warmups 3 \
            --mcp-iterations 5

      - name: Validate benchmark evidence contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result = json.loads(
              (Path(os.environ["RUNNER_TEMP"]) / "pipelock-performance-reference.json")
              .read_text(encoding="utf-8")
          )
          assert result["schema_version"] == 1
          assert result["issue"] == 730
          assert result["environment"]["label"] == "github-hosted-ubuntu-reference"
          assert result["measurement_scope"]["hosted_runner_is_vps_evidence"] is False
          for surface in ("http", "websocket_roundtrip", "mcp_stdio_call_total"):
              assert result["latency"][surface]["direct"]["count"] > 0
              assert result["latency"][surface]["mediated"]["count"] > 0
          for key in (
              "pipelock_run_startup_ms",
              "pipelock_rss_peak_observed_bytes",
              "pipelock_home_and_stdout_growth_bytes",
          ):
              assert result["operability"][key] >= 0
          classification = result["classification"]
          assert classification["true_positive"] + classification["false_negative"] > 0
          assert classification["true_negative"] + classification["false_positive"] > 0
          PY

      - name: Upload reference performance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-performance-reference-evidence
          path: |
            ${{ runner.temp }}/pipelock-performance-buildinfo.txt
            ${{ runner.temp }}/pipelock-performance-sha256.txt
            ${{ runner.temp }}/pipelock-performance-reference.json
            ${{ runner.temp }}/issue730-pipelock-benchmark-work/pipelock.log
          if-no-files-found: warn
