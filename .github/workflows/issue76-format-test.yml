name: Issue 76 format completion test

on:
  push:
    branches: [feat/issue-76-completion]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff==0.16.5
      - run: ruff format tests/test_issue76_completion.py
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_issue76_completion.py
          git diff --cached --quiet && exit 1
          git commit -m "style: format #76 completion test"
          git push
