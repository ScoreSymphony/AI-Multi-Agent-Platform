name: Issue 32 mypy fix

on:
  push:
    branches:
      - fix/issue-32-ci-cleanup

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-32-ci-cleanup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/ai_multi_agent_platform/control_plane/models.py": [
                  (
                      '''        if self.diagnostics:\n            payload["diagnostics"] = self.diagnostics\n''',
                      '''        if self.diagnostics:\n            diagnostics: dict[str, JsonValue] = {\n                namespace: dict(values) for namespace, values in self.diagnostics.items()\n            }\n            payload["diagnostics"] = diagnostics\n''',
                  ),
                  (
                      '''    selected = [_select_fields(item, query.fields) for item in window]\n    return {\n        "items": selected,\n''',
                      '''    selected = [_select_fields(item, query.fields) for item in window]\n    selected_json: list[JsonValue] = [dict(item) for item in selected]\n    return {\n        "items": selected_json,\n''',
                  ),
              ],
              "src/ai_multi_agent_platform/control_plane/openapi.py": [
                  ('''    owner = {\n''', '''    owner: dict[str, Any] = {\n'''),
              ],
              "src/ai_multi_agent_platform/control_plane/service.py": [
                  (
                      '''            resources.extend(\n                _run_resource(await self._kernel.get_run(current_task_id, run_id))\n                for run_id in task.run_ids\n            )\n''',
                      '''            for run_id in task.run_ids:\n                resources.append(\n                    _run_resource(await self._kernel.get_run(current_task_id, run_id))\n                )\n''',
                  ),
              ],
              "src/ai_multi_agent_platform/control_plane/extensions.py": [
                  (
                      '''            if request.method == "GET" and relative in {"", "/"}:\n                return self._response(\n''',
                      '''            if request.method == "GET" and relative in {"", "/"}:\n                manifest_resources: list[JsonValue] = [\n                    *PLATFORM_COLLECTIONS,\n                    "timeline",\n                ]\n                manifest_commands: list[JsonValue] = [command for command in REQUIRED_COMMANDS]\n                return self._response(\n''',
                  ),
                  (
                      '''                        "resources": list(PLATFORM_COLLECTIONS) + ["timeline"],\n                        "commands": list(REQUIRED_COMMANDS),\n''',
                      '''                        "resources": manifest_resources,\n                        "commands": manifest_commands,\n''',
                  ),
                  (
                      '''                resource_ref = request.body.get("resource_ref")\n                if not isinstance(resource_ref, str) or not resource_ref.strip():\n''',
                      '''                generic_resource_ref = request.body.get("resource_ref")\n                if not isinstance(generic_resource_ref, str) or not generic_resource_ref.strip():\n''',
                  ),
                  (
                      '''                    resource_ref,\n                    payload,\n''',
                      '''                    generic_resource_ref,\n                    payload,\n''',
                  ),
              ],
          }

          for filename, file_replacements in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in file_replacements:
                  if old not in text:
                      raise SystemExit(f"expected target not found in {filename}: {old!r}")
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
      - name: Normalize with repository tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          ruff format \
            src/ai_multi_agent_platform/control_plane/models.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            src/ai_multi_agent_platform/control_plane/extensions.py
          ruff check --fix \
            src/ai_multi_agent_platform/control_plane/models.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            src/ai_multi_agent_platform/control_plane/extensions.py
      - name: Commit fixes and remove helper
        run: |
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git rm .github/workflows/issue32-mypy-fix.yml
          git add \
            src/ai_multi_agent_platform/control_plane/models.py \
            src/ai_multi_agent_platform/control_plane/openapi.py \
            src/ai_multi_agent_platform/control_plane/service.py \
            src/ai_multi_agent_platform/control_plane/extensions.py
          git commit -m "fix: satisfy strict typing in issue 32 control plane"
          git push origin HEAD:fix/issue-32-ci-cleanup
