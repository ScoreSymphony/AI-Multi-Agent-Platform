name: Temporary writer Pytest contract fix

on:
  push:
    branches:
      - fix/594-595-eval-learning-integration
    paths:
      - .github/workflows/writer-temporary-pytest-contract-fix.yml

permissions:
  contents: write

jobs:
  contract-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/594-595-eval-learning-integration
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Update canonical test evidence fixtures and schema parity
        run: python .github/writer-temporary-contract-fix.py
      - name: Validate full Python gate
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          ruff format .
          ruff format --check .
          ruff check .
          mypy
          pytest
          python scripts/ci/issue19_evaluation_gate.py --platform-commit "$GITHUB_SHA"
          python -m build
      - name: Commit validated fix and remove temporary helpers
        shell: bash
        run: |
          git rm .github/workflows/writer-temporary-pytest-contract-fix.yml
          git rm .github/writer-temporary-contract-fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test: align learning evidence fixtures with canonical contracts'
          git push origin HEAD:fix/594-595-eval-learning-integration
