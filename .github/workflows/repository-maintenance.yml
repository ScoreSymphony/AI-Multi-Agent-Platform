name: Repository maintenance

on:
  workflow_dispatch:
    inputs:
      cleanup_orphaned_history:
        description: Delete completed Actions runs for explicitly retired workflow paths
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup-orphaned-actions-history:
    if: inputs.cleanup_orphaned_history
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs for explicitly retired workflow paths
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const retiredPaths = new Set([
              '.github/workflows/forge-removal-guard.yml',
              '.github/workflows/ha-postgres-coordination.yml',
              '.github/workflows/ha-postgres-persistence.yml',
              '.github/workflows/issue-862-garage-multinode-evidence.yml',
              '.github/workflows/issue-862-rustfs-multinode-evidence.yml',
              '.github/workflows/issue-862-storage-disaster-recovery-evidence.yml',
              '.github/workflows/issue-862-storage-evidence.yml',
              '.github/workflows/issue-862-storage-tls-evidence.yml',
              '.github/workflows/issue-862-storage-upgrade-evidence.yml',
              '.github/workflows/issue859-bifrost-dns-rebinding.yml',
              '.github/workflows/issue859-bifrost-performance.yml',
              '.github/workflows/issue859-bifrost-security.yml',
              '.github/workflows/pipelock-candidate-compat.yml',
              '.github/workflows/test-layout.yml',
            ]);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner,
              repo,
              per_page: 100,
            });
            const retired = runs.filter(
              (run) =>
                run.status === 'completed' &&
                run.path &&
                retiredPaths.has(run.path),
            );
            const byPath = new Map();
            for (const run of retired) {
              const bucket = byPath.get(run.path) || [];
              bucket.push(run);
              byPath.set(run.path, bucket);
            }

            core.info(`explicit_retired_workflow_paths=${retiredPaths.size}`);
            core.info(`completed_retired_runs=${retired.length}`);
            for (const [path, pathRuns] of [...byPath.entries()].sort()) {
              core.info(`${path}: ${pathRuns.length} completed run(s)`);
            }

            const maxDelete = 4000;
            let deleted = 0;
            for (const [path, pathRuns] of [...byPath.entries()].sort()) {
              if (deleted + pathRuns.length > maxDelete) {
                core.warning(
                  `Skipping ${path}: deleting its ${pathRuns.length} runs would exceed maxDelete=${maxDelete}`,
                );
                continue;
              }
              for (const run of pathRuns) {
                try {
                  await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id });
                  deleted += 1;
                } catch (error) {
                  if (error.status === 404) {
                    continue;
                  }
                  throw error;
                }
              }
            }
            core.info(`deleted_retired_runs=${deleted}`);
