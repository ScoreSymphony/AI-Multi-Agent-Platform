name: Repository maintenance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repository-maintenance.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      cleanup_orphaned_history:
        description: Delete completed Actions runs for workflow files that no longer exist
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  cleanup-orphaned-actions-history:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      inputs.cleanup_orphaned_history
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Delete completed runs for orphaned workflow files
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;

            const workflows = await github.paginate(
              github.rest.actions.listRepoWorkflows,
              {
                owner,
                repo,
                per_page: 100,
              },
            );
            const currentPaths = new Set(
              workflows
                .filter((workflow) => workflow.state !== 'deleted')
                .map((workflow) => workflow.path)
                .filter(
                  (path) =>
                    typeof path === 'string' &&
                    path.startsWith('.github/workflows/'),
                ),
            );

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                per_page: 100,
              },
            );
            const orphaned = runs.filter(
              (run) =>
                run.status === 'completed' &&
                typeof run.path === 'string' &&
                run.path.startsWith('.github/workflows/') &&
                !currentPaths.has(run.path),
            );

            const byPath = new Map();
            for (const run of orphaned) {
              const bucket = byPath.get(run.path) || [];
              bucket.push(run);
              byPath.set(run.path, bucket);
            }

            core.info(`current_workflow_paths=${currentPaths.size}`);
            core.info(`orphaned_completed_runs=${orphaned.length}`);
            for (const [path, pathRuns] of [...byPath.entries()].sort()) {
              core.info(`${path}: ${pathRuns.length} completed run(s)`);
            }

            const maxDelete = 4000;
            let deleted = 0;
            for (const [path, pathRuns] of [...byPath.entries()].sort()) {
              if (deleted + pathRuns.length > maxDelete) {
                core.warning(
                  `Skipping ${path}: deleting its ${pathRuns.length} runs would exceed maxDelete=${maxDelete}`,
                );
                continue;
              }
              for (const run of pathRuns) {
                try {
                  await github.rest.actions.deleteWorkflowRun({
                    owner,
                    repo,
                    run_id: run.id,
                  });
                  deleted += 1;
                } catch (error) {
                  if (error.status === 404) {
                    continue;
                  }
                  throw error;
                }
              }
            }
            core.info(`deleted_orphaned_runs=${deleted}`);
