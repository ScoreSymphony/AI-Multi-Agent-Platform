name: Issue 595 formatter

on:
  push:
    branches:
      - feat/595-governed-learning-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/595-governed-learning-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Wire issue 595 single-node runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/deployment/single_node.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              if old not in text:
                  return
              text = text.replace(old, new, 1)

          replace_once(
              "from ai_multi_agent_platform.kernel import (\n    EventSourcedTaskRepository,\n    PlatformKernel,\n    SqliteKernelRepository,\n)\n",
              "from ai_multi_agent_platform.kernel import (\n    EventSourcedTaskRepository,\n    PlatformKernel,\n    SqliteKernelRepository,\n)\nfrom ai_multi_agent_platform.learning import (\n    AgentPromotionAdapter,\n    LearningQualityGate,\n    LearningService,\n    PromotionRegistry,\n    RoutingProfilePromotionAdapter,\n    SQLiteLearningRepository,\n    SkillPromotionAdapter,\n    register_learning_control_plane,\n)\n",
          )
          replace_once(
              "from ai_multi_agent_platform.security.sqlite_authorization import SqliteLocalAuthorizationProvider\n",
              "from ai_multi_agent_platform.security.sqlite_authorization import SqliteLocalAuthorizationProvider\nfrom ai_multi_agent_platform.skills import JsonSkillRepository, SkillService, register_skill_control_plane\n",
          )
          replace_once(
              "    agents: AgentService\n    conversations: ConversationService\n",
              "    agents: AgentService\n    skills: SkillService\n    learning: LearningService\n    conversations: ConversationService\n",
          )
          replace_once(
              "    agents = AgentService(JsonAgentRepository(database_dir / \"agents.json\"))\n    conversations = ConversationService(\n",
              "    agents = AgentService(JsonAgentRepository(database_dir / \"agents.json\"))\n    skills = SkillService(JsonSkillRepository(database_dir / \"skills.json\"))\n    conversations = ConversationService(\n",
          )
          replace_once(
              "    portability_workflow = build_agent_portability_workflow(\n",
              "    learning = LearningService(\n        SQLiteLearningRepository(database_dir / \"learning.sqlite3\"),\n        quality_gate=LearningQualityGate(\n            evaluation=evaluation_composition.service,\n            verification=verification,\n        ),\n        promotion_registry=PromotionRegistry(\n            (\n                AgentPromotionAdapter(agents),\n                SkillPromotionAdapter(skills),\n                RoutingProfilePromotionAdapter(routing_profiles),\n            )\n        ),\n        authorization_gate=approval_gate,\n    )\n\n    portability_workflow = build_agent_portability_workflow(\n",
          )
          replace_once(
              "    register_repository_control_plane(\n        control_plane,\n        repositories,\n        management=repository_management,\n    )\n",
              "    register_repository_control_plane(\n        control_plane,\n        repositories,\n        management=repository_management,\n    )\n    register_skill_control_plane(control_plane, skills)\n    register_learning_control_plane(control_plane, learning)\n",
          )
          replace_once(
              "        agents=agents,\n        conversations=conversations,\n",
              "        agents=agents,\n        skills=skills,\n        learning=learning,\n        conversations=conversations,\n",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install Ruff
        run: python -m pip install "ruff<1,>=0.12"
      - name: Format issue 595 files
        run: |
          ruff format tests/test_issue_595_governed_learning.py
          ruff format src/ai_multi_agent_platform/learning/__init__.py
          ruff format src/ai_multi_agent_platform/learning/control_plane.py
          ruff format src/ai_multi_agent_platform/learning/sources.py
          ruff format src/ai_multi_agent_platform/deployment/single_node.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- tests/test_issue_595_governed_learning.py src/ai_multi_agent_platform/learning src/ai_multi_agent_platform/deployment/single_node.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_issue_595_governed_learning.py src/ai_multi_agent_platform/learning src/ai_multi_agent_platform/deployment/single_node.py
          git commit -m "feat(learning): wire governed learning into single-node runtime"
          git push origin HEAD:feat/595-governed-learning-completion
