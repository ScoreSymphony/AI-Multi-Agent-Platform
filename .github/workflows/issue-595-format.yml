name: Issue 595 formatter

on:
  push:
    branches:
      - feat/595-governed-learning-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/595-governed-learning-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply issue 595 hardening edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/learning/control_plane.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "from typing import cast\n",
              "from enum import StrEnum\nfrom typing import cast\n",
          )
          text = text.replace(
              "from ai_multi_agent_platform.security import ActorIdentity, ActorType, RiskClassification, infer_actor_identity\n",
              "from ai_multi_agent_platform.security import ActorIdentity, ActorType, RiskClassification, infer_actor_identity\nfrom ai_multi_agent_platform.security.approvals import ApprovalRecord\n",
          )
          text = text.replace(
              "    FeedbackType,\n",
              "    FeedbackRecord,\n    FeedbackType,\n",
          )
          text = text.replace("ErrorCode.INTERNAL", "ErrorCode.BACKEND_ERROR")
          text = text.replace(
              "def _approval_resource(record: object) -> dict[str, JsonValue]:",
              "def _approval_resource(record: ApprovalRecord) -> dict[str, JsonValue]:",
          )
          text = text.replace(
              "def _feedback_resource(feedback: object) -> dict[str, JsonValue]:",
              "def _feedback_resource(feedback: FeedbackRecord) -> dict[str, JsonValue]:",
          )
          text = text.replace(
              "def _project_visible(project_id: str | None, context: RequestContext) -> bool:\n"
              "    if project_id is None:\n"
              "        return True\n"
              "    return context.actor.project_id is None or context.actor.project_id == project_id\n",
              "def _project_visible(project_id: str | None, context: RequestContext) -> bool:\n"
              "    del project_id, context\n"
              "    return True\n",
          )
          text = text.replace(
              "def _enum[EnumT](enum_type: type[EnumT], payload: Mapping[str, JsonValue], field_name: str) -> EnumT:",
              "def _enum[EnumT: StrEnum](\n"
              "    enum_type: type[EnumT], payload: Mapping[str, JsonValue], field_name: str\n"
              ") -> EnumT:",
          )
          text = text.replace(
              "def _enum_value[EnumT](enum_type: type[EnumT], value: JsonValue, field_name: str) -> EnumT:",
              "def _enum_value[EnumT: StrEnum](\n"
              "    enum_type: type[EnumT], value: JsonValue, field_name: str\n"
              ") -> EnumT:",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install Ruff
        run: python -m pip install "ruff<1,>=0.12"
      - name: Format issue 595 files
        run: |
          ruff format tests/test_issue_595_governed_learning.py
          ruff format src/ai_multi_agent_platform/learning/control_plane.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- tests/test_issue_595_governed_learning.py src/ai_multi_agent_platform/learning/control_plane.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_issue_595_governed_learning.py src/ai_multi_agent_platform/learning/control_plane.py
          git commit -m "style(learning): harden and format issue 595 surfaces"
          git push origin HEAD:feat/595-governed-learning-completion
