name: Issue 595 formatter

on:
  push:
    branches:
      - feat/595-governed-learning-completion
  workflow_dispatch:

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/595-governed-learning-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff<1,>=0.12"
      - name: Format issue 595 tests
        run: ruff format tests/test_issue_595_governed_learning.py
      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet -- tests/test_issue_595_governed_learning.py; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_issue_595_governed_learning.py
          git commit -m "style(learning): format issue 595 acceptance tests"
          git push origin HEAD:feat/595-governed-learning-completion
