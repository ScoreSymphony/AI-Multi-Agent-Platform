name: Issue 10 Completion

on:
  push:
    branches:
      - feat/issue-10-control-plane-completion

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-control-plane-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply issue 10 completion
        run: |
          python scripts/issue10_complete.py
          python scripts/issue10_type_fixes.py
      - name: Remove temporary implementation helpers
        run: rm scripts/issue10_complete.py scripts/issue10_type_fixes.py
      - name: Normalize inherited OpenAPI line lengths
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/ai_multi_agent_platform/control_plane/openapi.py")
          text = path.read_text()
          text = text.replace(
              '            "later_domains": "register new Control Plane paths only when their canonical domain exists",\n',
              '            "later_domains": (\n'
              '                "register new Control Plane paths only when their canonical "\n'
              '                "domain exists"\n'
              '            ),\n',
          )
          text = text.replace(
              '            "description": "Exact canonical-field filter; replace field with a resource field name.",\n',
              '            "description": (\n'
              '                "Exact canonical-field filter; replace field with a resource "\n'
              '                "field name."\n'
              '            ),\n',
          )
          path.write_text(text)
          PY
      - name: Install project
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Normalize repository style
        run: |
          source .venv/bin/activate
          ruff format .
          ruff check . --fix
          ruff format .
      - name: Validate full repository
        run: |
          source .venv/bin/activate
          ruff format --check .
          ruff check .
          mypy
          pytest
          python -m build
      - name: Commit completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/control_plane docs/MODELS.md tests
          git add -u scripts/issue10_complete.py scripts/issue10_type_fixes.py
          git commit -m "feat(models): complete issue 10 control plane inventory" || exit 0
          git push origin HEAD:feat/issue-10-control-plane-completion
