name: Issue 10 Completion

on:
  push:
    branches:
      - feat/issue-10-control-plane-completion

permissions:
  contents: write

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-control-plane-completion
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply issue 10 completion
        run: python scripts/issue10_complete.py
      - name: Install project
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Normalize repository style
        run: |
          source .venv/bin/activate
          ruff format .
          ruff check . --fix
          ruff format .
      - name: Validate full repository
        run: |
          source .venv/bin/activate
          ruff format --check .
          ruff check .
          mypy
          pytest
          python -m build
      - name: Commit completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/control_plane docs/MODELS.md tests
          git commit -m "feat(models): complete issue 10 control plane inventory" || exit 0
          git push origin HEAD:feat/issue-10-control-plane-completion
