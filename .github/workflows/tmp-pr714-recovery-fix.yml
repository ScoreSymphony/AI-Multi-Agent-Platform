name: Temporary PR 714 recovery hardening

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Apply recovery hardening and regression test
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow_path = Path("src/ai_multi_agent_platform/verification/agent_workflow.py")
          text = workflow_path.read_text(encoding="utf-8")
          if "def _existing_reverification_child(" not in text:
              needle = '''            completion = self._completion.assess_task_completion(request.task_id)\n'''
              replacement = '''            recovered_child = self._existing_reverification_child(cycles[-1])\n            if recovered_child is not None:\n                current_id = recovered_child.verification_id\n                continue\n\n            completion = self._completion.assess_task_completion(request.task_id)\n'''
              if text.count(needle) != 1:
                  raise SystemExit(f"expected one completion needle, found {text.count(needle)}")
              text = text.replace(needle, replacement, 1)

              marker = '''    def status_for(self, verification_id: str) -> ReviewWorkflowResult:\n'''
              helper = '''    def _existing_reverification_child(\n        self,\n        cycle: ReviewWorkflowCycle,\n    ) -> VerificationRequest | None:\n        """Recover a child request already persisted after a staged repair output.\n\n        Re-verification creation and the caller observing its returned ID are not one\n        atomic operation. The staged repair output therefore acts as the durable\n        lineage key when a process stops after the child request is committed.\n        """\n\n        result = cycle.verification_result\n        reviewer_run = cycle.reviewer_run\n        if (\n            result is None\n            or result.outcome is not VerificationOutcome.NEEDS_CHANGES\n            or reviewer_run is None\n        ):\n            return None\n\n        raw = reviewer_run.telemetry.get(_STAGED_REPAIR_OUTPUT_KEY)\n        if raw is None:\n            return None\n        if not isinstance(raw, dict) or raw.get("schema") != _STAGED_REPAIR_OUTPUT_SCHEMA:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "reviewer AgentRun contains malformed staged repair output metadata",\n            )\n        if raw.get("source_verification_id") != cycle.request.verification_id:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "staged repair output belongs to a different source Verification",\n            )\n\n        repair_run_id = raw.get("repair_run_id")\n        repair_attempt = raw.get("repair_attempt")\n        subject_type = raw.get("subject_type")\n        subject_id = raw.get("subject_id")\n        correlation_id = raw.get("correlation_id")\n        causation_id = raw.get("causation_id")\n        expected_attempt = cycle.request.repair_attempt + 1\n        if (\n            not isinstance(repair_run_id, str)\n            or repair_attempt != expected_attempt\n            or not isinstance(subject_type, str)\n            or not isinstance(subject_id, str)\n            or not isinstance(correlation_id, str)\n            or (causation_id is not None and not isinstance(causation_id, str))\n        ):\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "staged repair output cannot identify the next canonical Verification",\n            )\n\n        candidates = tuple(\n            request\n            for request, _result in self._completion.verification.history(\n                task_id=cycle.request.task_id\n            )\n            if request.verification_id != cycle.request.verification_id\n            and request.policy_id == cycle.request.policy_id\n            and request.policy_version == cycle.request.policy_version\n            and request.stage_id == cycle.request.stage_id\n            and request.requested_verifier_kind is cycle.request.requested_verifier_kind\n            and request.repair_attempt == expected_attempt\n            and request.run_id == repair_run_id\n            and request.subject.subject_type == subject_type\n            and request.subject.subject_id == subject_id\n            and request.correlation_id == correlation_id\n            and request.causation_id == causation_id\n        )\n        if len(candidates) > 1:\n            raise ContractError(\n                ErrorCode.CONTRACT_VIOLATION,\n                "staged repair output maps to multiple child Verification requests",\n                details={\n                    "verification_id": cycle.request.verification_id,\n                    "repair_attempt": expected_attempt,\n                    "repair_run_id": repair_run_id,\n                    "match_count": len(candidates),\n                },\n            )\n        return None if not candidates else candidates[0]\n\n'''
              if text.count(marker) != 1:
                  raise SystemExit(f"expected one status marker, found {text.count(marker)}")
              text = text.replace(marker, helper + marker, 1)
              workflow_path.write_text(text, encoding="utf-8")

          test_path = Path("tests/test_issue_711_agent_review_workflow.py")
          tests = test_path.read_text(encoding="utf-8")
          if "test_persisted_reverification_child_is_reconciled_after_post_commit_crash" not in tests:
              tests += '''\n\ndef test_persisted_reverification_child_is_reconciled_after_post_commit_crash() -> None:\n    class CrashAfterChildCommitRuntime(CanonicalVerificationRuntime):\n        def __init__(self, completion, evidence) -> None:\n            super().__init__(completion, evidence)\n            self.child_commits = 0\n\n        async def request_reverification_after_repair(self, verification_id: str, **kwargs):\n            request = await super().request_reverification_after_repair(\n                verification_id, **kwargs\n            )\n            self.child_commits += 1\n            if self.child_commits == 1:\n                raise ContractError(\n                    ErrorCode.UNAVAILABLE,\n                    "simulated crash after child Verification commit",\n                )\n            return request\n\n    async def scenario() -> None:\n        (\n            agents,\n            _producer,\n            reviewer,\n            verification,\n            policy,\n            evidence,\n            completion,\n            _runtime,\n            request,\n        ) = _setup(max_repairs=1)\n        runtime = CrashAfterChildCommitRuntime(completion, evidence)\n        executor = QueueReviewerExecutor(\n            VerificationOutcome.NEEDS_CHANGES,\n            VerificationOutcome.PASS,\n        )\n        repair_runtime = FakeRepairRuntime(request.task_id)\n        repair_executor = ReplacingRepairExecutor(evidence)\n        workflow = AutomaticReviewerWorkflow(\n            runtime=runtime,\n            completion=completion,\n            agents=agents,\n            resolver=_resolver(policy, reviewer),\n            executor=executor,\n            repair_runtime=repair_runtime,  # type: ignore[arg-type]\n            repair_executor=repair_executor,\n        )\n\n        with pytest.raises(ContractError) as crash:\n            await workflow.run_request(request.verification_id)\n        assert crash.value.code is ErrorCode.UNAVAILABLE\n        assert runtime.child_commits == 1\n        assert repair_runtime.calls == 1\n        assert repair_executor.calls == 1\n        assert executor.calls == 1\n\n        history_after_crash = verification.history(task_id=request.task_id)\n        assert len(history_after_crash) == 2\n        child_request, child_result = history_after_crash[-1]\n        assert child_request.repair_attempt == 1\n        assert child_request.status.value == "pending"\n        assert child_result is None\n\n        recovered = await workflow.run_request(request.verification_id)\n\n        assert recovered.completion.state is CompletionState.ACCEPTED\n        assert len(recovered.cycles) == 2\n        assert recovered.cycles[-1].request.verification_id == child_request.verification_id\n        assert recovered.cycles[-1].verification_result is not None\n        assert recovered.cycles[-1].verification_result.outcome is VerificationOutcome.PASS\n        assert runtime.child_commits == 1\n        assert repair_runtime.calls == 1\n        assert repair_executor.calls == 1\n        assert executor.calls == 2\n        assert len(verification.history(task_id=request.task_id)) == 2\n        assert len(agents.service.repository.list_agent_runs()) == 2\n\n    asyncio.run(scenario())\n'''
              test_path.write_text(tests, encoding="utf-8")
          PY
      - name: Install development environment
        run: python -m pip install -e '.[dev]'
      - name: Format and statically check touched files
        run: |
          ruff format \
            src/ai_multi_agent_platform/verification/agent_workflow.py \
            tests/test_issue_711_agent_review_workflow.py
          ruff check \
            src/ai_multi_agent_platform/verification/agent_workflow.py \
            tests/test_issue_711_agent_review_workflow.py
          mypy src/ai_multi_agent_platform/verification/agent_workflow.py
      - name: Run focused automatic-review tests
        run: |
          pytest \
            tests/test_issue_711_agent_review_workflow.py \
            tests/integration/verification/test_automatic_reviewer_repair.py
      - name: Commit tested recovery fix and remove this helper workflow
        shell: bash
        run: |
          git rm .github/workflows/tmp-pr714-recovery-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            src/ai_multi_agent_platform/verification/agent_workflow.py \
            tests/test_issue_711_agent_review_workflow.py
          git commit -m 'fix: reconcile persisted repair reverification lineage (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
