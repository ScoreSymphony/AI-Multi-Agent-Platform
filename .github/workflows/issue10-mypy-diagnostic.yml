name: Issue 10 Mypy Diagnostic

on:
  push:
    branches: [feat/issue-10-model-registry-router]

permissions:
  contents: write

jobs:
  mypy-diagnostic:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-10-model-registry-router
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Capture mypy report
        shell: bash
        run: mypy > issue10-mypy-report.txt 2>&1 || true
      - name: Commit report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add issue10-mypy-report.txt
          git commit -m "chore: capture issue 10 mypy diagnostics" || exit 0
          git push origin HEAD:feat/issue-10-model-registry-router
