name: Issue 82 finalizer

on:
  push:
    branches: [feat/issue-82-operational-completion]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-82-operational-completion
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Merge current main with audited conflict policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -v -E '^(frontend/src/app/Shell.tsx|src/ai_multi_agent_platform/deployment/single_node.py)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              printf '%s\n' "$unexpected"
              exit 1
            fi
            git checkout --ours -- frontend/src/app/Shell.tsx src/ai_multi_agent_platform/deployment/single_node.py
            git add frontend/src/app/Shell.tsx src/ai_multi_agent_platform/deployment/single_node.py
          fi
      - name: Apply final issue 82 lifecycle and typing fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one match in {path}, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          replace_once(
              "src/ai_multi_agent_platform/repositories/capability_bridge.py",
              '    required = ["repository_id"]\n',
              '    required: list[JsonValue] = ["repository_id"]\n',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/control_plane.py",
              '''    control_plane.register_resource_service(\n        REPOSITORY_COLLECTION,\n        RepositoryResourceService(repositories),\n    )\n\n    async def branches(''',
              '''    control_plane.register_resource_service(\n        REPOSITORY_COLLECTION,\n        RepositoryResourceService(repositories),\n    )\n    if management is not None:\n        # #44 discovers this hook dynamically at Connection-removal time, so registration order\n        # does not matter and repository bindings cannot outlive their canonical Connection.\n        setattr(  # noqa: B010\n            control_plane,\n            "connector_connection_removal_hook",\n            management.detach_connection,\n        )\n\n    async def branches(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/control_plane.py",
              '''        "project_id": connection.project_id,\n        "organization_id": connection.organization_id,''',
              '''        "project_id": connection.project_id,\n        "connection_id": connection.id,\n        "organization_id": connection.organization_id,''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/management.py",
              '''        self._catalog.delete(repository_id)\n        self._registry.unregister(repository_id)\n        return binding.reference\n\n    async def _resolve_discovery(''',
              '''        self._catalog.delete(repository_id)\n        self._registry.unregister(repository_id)\n        return binding.reference\n\n    async def detach_connection(\n        self,\n        connection: Connection,\n    ) -> tuple[RepositoryReference, ...]:\n        """Prune all canonical repository bindings before their Connection is removed.\n\n        Connection deletion is already authorized by #44. This lifecycle hook only removes\n        platform-owned routing/catalog state and never deletes provider-owned repository content.\n        It is idempotent with respect to missing in-memory bindings and also cleans transient\n        registry-only bindings so a Search rebuild cannot retain stale repository discovery.\n        """\n\n        detached: list[RepositoryReference] = []\n        persisted_ids: set[str] = set()\n        for record in self._catalog.list(connection_id=connection.id):\n            persisted_ids.add(record.repository_id)\n            self._catalog.delete(record.repository_id)\n            try:\n                binding = self._registry.unregister(record.repository_id)\n            except ContractError as exc:\n                if exc.code is not ErrorCode.NOT_FOUND:\n                    raise\n                detached.append(record.reference)\n            else:\n                detached.append(binding.reference)\n\n        for binding in tuple(self._registry.list(connection_id=connection.id)):\n            if binding.reference.id in persisted_ids:\n                continue\n            self._registry.unregister(binding.reference.id)\n            detached.append(binding.reference)\n        return tuple(detached)\n\n    async def _resolve_discovery(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''from dataclasses import replace\nfrom datetime import UTC, datetime''',
              '''from collections.abc import Awaitable, Callable\nfrom dataclasses import replace\nfrom datetime import UTC, datetime''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''class ConnectorService:\n''',
              '''ConnectionRemovalHook = Callable[[Connection], Awaitable[None]]\n\n\nclass ConnectorService:\n''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''    async def remove_connection(\n        self,\n        connection_id: str,\n        *,\n        actor: ActorIdentity,\n        context: OperationContext,\n        approval_id: str | None = None,\n    ) -> None:''',
              '''    async def remove_connection(\n        self,\n        connection_id: str,\n        *,\n        actor: ActorIdentity,\n        context: OperationContext,\n        approval_id: str | None = None,\n        before_remove: ConnectionRemovalHook | None = None,\n    ) -> None:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/service.py",
              '''        await self.repository.delete_connection(connection_id)\n\n    async def check_health(''',
              '''        if before_remove is not None:\n            # Run cross-domain cleanup only after DELETE authorization has succeeded and before\n            # the canonical Connection disappears, so a cleanup failure leaves lifecycle state\n            # fail-closed and retryable.\n            await before_remove(connection)\n        await self.repository.delete_connection(connection_id)\n\n    async def check_health(''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''from .service import ConnectorService\n''',
              '''from .service import ConnectionRemovalHook, ConnectorService\n''',
          )
          replace_once(
              "src/ai_multi_agent_platform/connectors/control_plane.py",
              '''        await connectors.remove_connection(\n            resource_ref,\n            actor=actor_resolver(context),\n            context=_operation_context(context, existing.project_id),\n            approval_id=_optional_string(payload.get("approval_id"), "approval_id"),\n        )''',
              '''        removal_hook = getattr(control_plane, "connector_connection_removal_hook", None)\n        await connectors.remove_connection(\n            resource_ref,\n            actor=actor_resolver(context),\n            context=_operation_context(context, existing.project_id),\n            approval_id=_optional_string(payload.get("approval_id"), "approval_id"),\n            before_remove=(\n                cast(ConnectionRemovalHook, removal_hook) if callable(removal_hook) else None\n            ),\n        )''',
          )
          replace_once(
              "src/ai_multi_agent_platform/repositories/connector_bootstrap.py",
              '''        connection = await connections.get_connection(record.connection_id)\n        _require_usable_connection(connection)''',
              '''        try:\n            connection = await connections.get_connection(record.connection_id)\n        except ContractError as exc:\n            if exc.code is not ErrorCode.NOT_FOUND:\n                raise\n            # A removed canonical Connection cannot retain repository routing/search state.\n            catalog.delete(record.repository_id)\n            continue\n        _require_usable_connection(connection)''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''    RepositoryManagementService,\n    RepositoryRegistry,''',
              '''    RepositoryDiscoveryResolver,\n    RepositoryManagementService,\n    RepositoryRegistry,''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''    distributed_runtime: DistributedRuntime | None = None,\n) -> SingleNodeDeployment:''',
              '''    distributed_runtime: DistributedRuntime | None = None,\n    repository_discovery_resolver: RepositoryDiscoveryResolver | None = None,\n) -> SingleNodeDeployment:''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''        approval_gate,\n        managed_local_root=config.repositories_dir,\n    )''',
              '''        approval_gate,\n        managed_local_root=config.repositories_dir,\n        discovery_resolver=repository_discovery_resolver,\n    )''',
          )
          replace_once(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              '''        scopes=scopes,\n        platform_version=__version__,\n        templates=templates.repository,\n        evaluation=evaluation_composition.service,\n    )''',
              '''        scopes=scopes,\n        platform_version=__version__,\n        capabilities=capabilities,\n        templates=templates.repository,\n        evaluation=evaluation_composition.service,\n        evaluation_fixture_exists=evaluation_composition.fixture_exists,\n    )''',
          )
          replace_once(
              "tests/test_issue_82_search_lifecycle_hardening.py",
              '''        # Run input/output provenance remains canonical Repository provenance, not derived Search state.\n''',
              '''        # Run input/output provenance remains canonical Repository provenance,\n        # not derived Search state.\n''',
          )
          PY
      - name: Install project tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Normalize and validate issue 82
        run: |
          ruff check --fix src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_repository_runtime_event_ingress.py
          ruff format src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_repository_runtime_event_ingress.py
          ruff check src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_repository_runtime_event_ingress.py
          mypy src/ai_multi_agent_platform/connectors/service.py src/ai_multi_agent_platform/connectors/control_plane.py src/ai_multi_agent_platform/repositories src/ai_multi_agent_platform/deployment/single_node.py
          pytest -q tests/test_issue_82_repository_search.py tests/test_issue_82_search_lifecycle_hardening.py tests/test_issue_82_repository_management.py tests/test_issue_82_repository_runtime_event_ingress.py tests/test_issue_82_repository_execution_lifecycle.py tests/test_issue_82_single_node_capability_composition.py tests/test_connector_control_plane.py
      - name: Commit validated finalization
        shell: bash
        run: |
          git rm .github/workflows/issue-82-finalize.yml
          git add -A
          git commit -m "fix(repositories): close operational lifecycle gaps (#82)"
          git push origin HEAD:feat/issue-82-operational-completion
