name: Temporary PR 714 context repair fix v2

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse patch and correct JsonValue typing
        shell: bash
        run: |
          payload=$(grep -o "echo '[A-Za-z0-9+/=]*'" .github/workflows/tmp-pr714-context-repair-fix.yml | head -1 | cut -d"'" -f2)
          test -n "$payload"
          echo "$payload" | base64 -d | gzip -d > /tmp/pr714_patch.py
          python -c "from pathlib import Path; p=Path('/tmp/pr714_patch.py'); s=p.read_text(); old='        dependencies = [cast(str, item) for item in depends_on_raw]\\n'; new='        dependencies: list[JsonValue] = [cast(JsonValue, item) for item in depends_on_raw]\\n'; assert s.count(old)==1; p.write_text(s.replace(old,new))"
          python /tmp/pr714_patch.py
      - name: Install test toolchain
        run: python -m pip install -e '.[dev]'
      - name: Format and lint focused changes
        run: |
          ruff format src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/test_issue_711_kernel_plan_step_context.py
          ruff check src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/test_issue_711_kernel_plan_step_context.py
      - name: Typecheck focused production changes
        run: mypy src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py
      - name: Run focused regression and productive repair tests
        run: pytest -q tests/test_issue_711_kernel_plan_step_context.py tests/integration/verification/test_automatic_reviewer_repair.py
      - name: Commit verified fix and remove temporary workflows
        shell: bash
        run: |
          git rm .github/workflows/tmp-pr714-context-repair-fix.yml .github/workflows/tmp-pr714-context-repair-fix-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ai_multi_agent_platform/context/source_adapters.py src/ai_multi_agent_platform/deployment/context_operationalization.py tests/test_issue_711_kernel_plan_step_context.py
          git commit -m 'fix: resolve kernel-owned repair steps in canonical context (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
