name: Temporary PR 714 reverification recovery patch

on:
  push:
    branches:
      - codex/issue-711-auto-reviewer-workflows

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' || !contains(github.event.head_commit.message, 'fix(review): reconcile persisted repair reverification')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/issue-711-auto-reviewer-workflows
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install test environment
        run: python -m pip install -e '.[dev]'
      - name: Patch canonical reverification recovery and add regression
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/verification/evidence.py')
          text = path.read_text(encoding='utf-8')
          old = '''    async def request_reverification_after_repair(
              self,
              verification_id: str,
              *,
              subject_type: str,
              subject_id: str,
              correlation_id: str,
              causation_id: str | None = None,
          ) -> VerificationRequest:
              previous = self._completion.verification.get_request(verification_id)
              context = await self._evidence.resolve_context(
                  task_id=previous.task_id,
                  subject_type=subject_type,
                  subject_id=subject_id,
              )
              result_id = subject_id if subject_type == "result" else None
              artifact_ids = (subject_id,) if subject_type == "artifact" else ()
              return self._completion.request_canonical_reverification_after_repair(
                  verification_id,
                  new_subject=context.subject,
                  correlation_id=correlation_id,
                  run_id=context.run_id,
                  result_id=result_id,
                  artifact_ids=artifact_ids,
                  project_id=context.project_id,
                  capability_ids=context.capability_ids,
                  producer=context.producer,
                  causation_id=causation_id,
              )
          '''.replace('          ', '')
          new = '''    async def request_reverification_after_repair(
              self,
              verification_id: str,
              *,
              subject_type: str,
              subject_id: str,
              correlation_id: str,
              causation_id: str | None = None,
          ) -> VerificationRequest:
              previous = self._completion.verification.get_request(verification_id)
              context = await self._evidence.resolve_context(
                  task_id=previous.task_id,
                  subject_type=subject_type,
                  subject_id=subject_id,
              )
              result_id = subject_id if subject_type == "result" else None
              artifact_ids = (subject_id,) if subject_type == "artifact" else ()
              existing = self._existing_reverification_after_repair(
                  previous=previous,
                  context=context,
                  result_id=result_id,
                  artifact_ids=artifact_ids,
                  correlation_id=correlation_id,
                  causation_id=causation_id,
              )
              if existing is not None:
                  return existing
              return self._completion.request_canonical_reverification_after_repair(
                  verification_id,
                  new_subject=context.subject,
                  correlation_id=correlation_id,
                  run_id=context.run_id,
                  result_id=result_id,
                  artifact_ids=artifact_ids,
                  project_id=context.project_id,
                  capability_ids=context.capability_ids,
                  producer=context.producer,
                  causation_id=causation_id,
              )

          def _existing_reverification_after_repair(
              self,
              *,
              previous: VerificationRequest,
              context: VerificationEvidenceContext,
              result_id: str | None,
              artifact_ids: tuple[str, ...],
              correlation_id: str,
              causation_id: str | None,
          ) -> VerificationRequest | None:
              next_attempt = previous.repair_attempt + 1
              candidates = tuple(
                  request
                  for request, _result in self._completion.verification.history(
                      task_id=previous.task_id
                  )
                  if request.verification_id != previous.verification_id
                  and request.policy_id == previous.policy_id
                  and request.policy_version == previous.policy_version
                  and request.stage_id == previous.stage_id
                  and request.repair_attempt == next_attempt
              )
              exact = tuple(
                  request
                  for request in candidates
                  if request.requested_verifier_kind is previous.requested_verifier_kind
                  and request.subject == context.subject
                  and request.run_id == context.run_id
                  and request.result_id == result_id
                  and request.artifact_ids == artifact_ids
                  and request.project_id == context.project_id
                  and request.capability_ids == context.capability_ids
                  and request.producer == context.producer
                  and request.correlation_id == correlation_id
                  and request.causation_id == causation_id
              )
              if len(exact) == 1:
                  return exact[0]
              if len(exact) > 1:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "repair output maps to multiple canonical reverification requests",
                      details={
                          "source_verification_id": previous.verification_id,
                          "verification_ids": [request.verification_id for request in exact],
                      },
                  )

              lineage_conflicts = tuple(
                  request
                  for request in candidates
                  if request.run_id == context.run_id
                  or (causation_id is not None and request.causation_id == causation_id)
              )
              if lineage_conflicts:
                  raise ContractError(
                      ErrorCode.CONTRACT_VIOLATION,
                      "persisted repair reverification conflicts with current canonical evidence",
                      details={
                          "source_verification_id": previous.verification_id,
                          "verification_ids": [
                              request.verification_id for request in lineage_conflicts
                          ],
                          "repair_attempt": next_attempt,
                          "subject_id": context.subject.subject_id,
                          "run_id": context.run_id,
                      },
                  )
              return None
          '''.replace('          ', '')
          marker = 'def _existing_reverification_after_repair('
          if marker not in text:
              if old not in text:
                  raise SystemExit('expected reverification method block was not found')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/regression/verification/test_reverification_recovery.py')
          test.parent.mkdir(parents=True, exist_ok=True)
          test.write_text('''from __future__ import annotations

import asyncio

from ai_multi_agent_platform.domain import new_id
from ai_multi_agent_platform.verification import (
    CanonicalVerificationRuntime,
    ProducerIdentity,
    VerificationCompletionAuthority,
    VerificationEvidenceContext,
    VerificationOutcome,
    VerificationPolicy,
    VerificationService,
    VerificationStage,
    VerificationSubject,
    VerifierKind,
)


class _Evidence:
    def __init__(self, contexts: dict[str, VerificationEvidenceContext]) -> None:
        self._contexts = contexts

    async def resolve_subject(self, *, task_id: str, subject_type: str, subject_id: str):
        context = self._contexts[subject_id]
        assert context.task_id == task_id
        assert context.subject.subject_type == subject_type
        return context.subject

    async def resolve_context(self, *, task_id: str, subject_type: str, subject_id: str):
        context = self._contexts[subject_id]
        assert context.task_id == task_id
        assert context.subject.subject_type == subject_type
        return context

    async def validate_evidence_artifacts(self, *, task_id: str, artifact_ids: tuple[str, ...]):
        del task_id
        return artifact_ids


def test_repair_reverification_reuses_persisted_exact_child_after_retry() -> None:
    async def scenario() -> None:
        task_id = new_id("task")
        project_id = new_id("project")
        first_result_id = new_id("result")
        repaired_result_id = new_id("result")
        first_run_id = new_id("run")
        repair_run_id = new_id("run")
        first_subject = VerificationSubject(
            "result", first_result_id, f"{first_run_id}:attempt:1", "sha256:first"
        )
        repaired_subject = VerificationSubject(
            "result", repaired_result_id, f"{repair_run_id}:attempt:1", "sha256:repaired"
        )
        first_producer = ProducerIdentity(
            actor_ref="agent:producer-a",
            agent_id=new_id("agent"),
            agent_revision=1,
            model_config_id="model-a",
            provider_id="provider-a",
        )
        repaired_producer = ProducerIdentity(
            actor_ref="agent:producer-b",
            agent_id=new_id("agent"),
            agent_revision=1,
            model_config_id="model-b",
            provider_id="provider-b",
        )
        contexts = {
            first_result_id: VerificationEvidenceContext(
                task_id=task_id,
                subject=first_subject,
                run_id=first_run_id,
                project_id=project_id,
                capability_ids=("cap.read",),
                producer=first_producer,
            ),
            repaired_result_id: VerificationEvidenceContext(
                task_id=task_id,
                subject=repaired_subject,
                run_id=repair_run_id,
                project_id=project_id,
                capability_ids=("cap.read",),
                producer=repaired_producer,
            ),
        }
        service = VerificationService(require_canonical_subjects=True)
        completion = VerificationCompletionAuthority(service)
        policy = service.register_policy(
            VerificationPolicy(
                name="repair replay recovery",
                stages=(VerificationStage("review", VerifierKind.HUMAN),),
                max_repair_attempts=1,
            )
        )
        runtime = CanonicalVerificationRuntime(completion, _Evidence(contexts))
        initial = await runtime.request_verification(
            task_id=task_id,
            policy_id=policy.policy_id,
            policy_version=policy.version,
            stage_id="review",
            subject_type="result",
            subject_id=first_result_id,
            correlation_id=task_id,
        )
        service.record_human_review(
            initial.verification_id,
            reviewer_ref="user:reviewer",
            outcome=VerificationOutcome.NEEDS_CHANGES,
        )

        first_child = await runtime.request_reverification_after_repair(
            initial.verification_id,
            subject_type="result",
            subject_id=repaired_result_id,
            correlation_id=task_id,
            causation_id=repair_run_id,
        )
        replayed_child = await runtime.request_reverification_after_repair(
            initial.verification_id,
            subject_type="result",
            subject_id=repaired_result_id,
            correlation_id=task_id,
            causation_id=repair_run_id,
        )

        assert replayed_child.verification_id == first_child.verification_id
        assert replayed_child.subject == repaired_subject
        assert replayed_child.run_id == repair_run_id
        assert replayed_child.producer == repaired_producer
        assert replayed_child.repair_attempt == 1
        assert len(service.history(task_id=task_id)) == 2

    asyncio.run(scenario())
''', encoding='utf-8')
          PY
      - name: Format and validate patch
        run: |
          ruff format src/ai_multi_agent_platform/verification/evidence.py tests/regression/verification/test_reverification_recovery.py
          ruff check src/ai_multi_agent_platform/verification/evidence.py tests/regression/verification/test_reverification_recovery.py
          pytest tests/regression/verification/test_reverification_recovery.py tests/test_issue_711_agent_review_workflow.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'Score Symphony'
          git config user.email 'scoresymphony@gmail.com'
          git add src/ai_multi_agent_platform/verification/evidence.py tests/regression/verification/test_reverification_recovery.py
          if git diff --cached --quiet; then
            echo 'No patch changes to commit.'
            exit 0
          fi
          git commit -m 'fix(review): reconcile persisted repair reverification (#711)'
          git push origin HEAD:codex/issue-711-auto-reviewer-workflows
