name: issue-79-doc-sync

on:
  push:
    branches:
      - feat/issue-79-control-plane-portability

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update portability overview
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/PORTABILITY.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "Further canonical configuration codecs, import/export reports and Control Plane/CLI "
              "surfaces remain follow-up work within #79.\n"
          )
          new = (
              "Control Plane/CLI package, validation, preview, import and report surfaces are now "
              "implemented and documented in `PORTABILITY_CONTROL_PLANE.md`. The single-node "
              "composition currently wires Agent and Agent Team portability against canonical "
              "stores. Remaining canonical configuration codecs and production registry wiring "
              "continue within #79 as their owning persistence work lands.\n"
          )
          if old not in text:
              raise SystemExit("expected portability follow-up paragraph not found")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
      - name: Commit documentation and remove helper
        run: |
          rm .github/workflows/issue-79-doc-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(issue-79): sync portability overview"
          git push origin HEAD:feat/issue-79-control-plane-portability
