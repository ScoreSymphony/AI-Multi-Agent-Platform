name: issue-79-sync-final

on:
  push:
    branches:
      - feat/issue-79-portability-final

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bring forward completed portability workflow
        run: |
          git fetch origin feat/issue-79-control-plane-portability
          files=(
            docs/PORTABILITY_CONTROL_PLANE.md
            src/ai_multi_agent_platform/cli/portability.py
            src/ai_multi_agent_platform/control_plane/portability_api.py
            src/ai_multi_agent_platform/portability/workflow.py
            src/ai_multi_agent_platform/portability/composition.py
            tests/test_issue_79_cli_portability.py
            tests/test_issue_79_control_plane_portability.py
            tests/test_issue_79_single_node_portability.py
          )
          for file in "${files[@]}"; do
            mkdir -p "$(dirname "$file")"
            git show "origin/feat/issue-79-control-plane-portability:$file" > "$file"
          done
      - name: Wire current main surfaces
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"missing anchor in {path}: {old!r}")
              file.write_text(text.replace(old, new, 1))

          replace(
              "src/ai_multi_agent_platform/control_plane/__init__.py",
              "from .conversation_current_composition import (\n    AuthenticatedControlPlaneHTTP,\n    ControlPlane,\n    ControlPlaneASGI,\n    ControlPlaneHTTP,\n    build_openapi,\n)",
              "from .conversation_current_composition import (\n    AuthenticatedControlPlaneHTTP,\n    ControlPlaneASGI,\n    ControlPlaneHTTP,\n    build_openapi,\n)",
          )
          replace(
              "src/ai_multi_agent_platform/control_plane/__init__.py",
              "from .plugin_api import (\n    PLUGIN_CANDIDATE_COLLECTION,\n    PLUGIN_COLLECTION,\n    PLUGIN_COLLECTIONS,\n    PLUGIN_COMMANDS,\n    PluginPermissionResolver,\n)\nfrom .service import ScopeStore",
              "from .plugin_api import (\n    PLUGIN_CANDIDATE_COLLECTION,\n    PLUGIN_COLLECTION,\n    PLUGIN_COLLECTIONS,\n    PLUGIN_COMMANDS,\n    PluginPermissionResolver,\n)\nfrom .portability_api import (\n    PORTABILITY_COLLECTIONS,\n    PORTABILITY_COMMANDS,\n    PORTABILITY_PACKAGE_COLLECTION,\n    PORTABILITY_PREVIEW_COLLECTION,\n    PORTABILITY_REPORT_COLLECTION,\n    ControlPlane,\n)\nfrom .service import ScopeStore",
          )
          replace(
              "src/ai_multi_agent_platform/control_plane/__init__.py",
              '    "PLUGIN_COMMANDS",\n    "PageQuery",',
              '    "PLUGIN_COMMANDS",\n    "PORTABILITY_COLLECTIONS",\n    "PORTABILITY_COMMANDS",\n    "PORTABILITY_PACKAGE_COLLECTION",\n    "PORTABILITY_PREVIEW_COLLECTION",\n    "PORTABILITY_REPORT_COLLECTION",\n    "PageQuery",',
          )

          replace(
              "src/ai_multi_agent_platform/cli/main.py",
              "from .onboarding import add_onboarding_parser, execute_onboarding\nfrom .plugins import add_plugin_parser, execute_plugin\n",
              "from .onboarding import add_onboarding_parser, execute_onboarding\nfrom .plugins import add_plugin_parser, execute_plugin\nfrom .portability import add_portability_parser, execute_portability\n",
          )
          replace(
              "src/ai_multi_agent_platform/cli/main.py",
              "    add_memory_knowledge_parsers(areas)\n    add_onboarding_parser(areas)\n\n    profile = areas.add_parser",
              "    add_memory_knowledge_parsers(areas)\n    add_onboarding_parser(areas)\n    add_portability_parser(areas)\n\n    profile = areas.add_parser",
          )
          replace(
              "src/ai_multi_agent_platform/cli/main.py",
              "    if args.area == \"knowledge\":\n        return CommandResult(execute_knowledge(args, client, _require_confirmation))\n    if args.area == \"project\":",
              "    if args.area == \"knowledge\":\n        return CommandResult(execute_knowledge(args, client, _require_confirmation))\n    if args.area == \"portability\":\n        return CommandResult(execute_portability(args, client))\n    if args.area == \"project\":",
          )

          replace(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              "from ai_multi_agent_platform.agents import (",
              "from ai_multi_agent_platform import __version__\nfrom ai_multi_agent_platform.agents import (",
          )
          replace(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              "from ai_multi_agent_platform.orchestration import ReferenceOrchestrator\nfrom ai_multi_agent_platform.security import (",
              "from ai_multi_agent_platform.orchestration import ReferenceOrchestrator\nfrom ai_multi_agent_platform.portability.composition import build_agent_portability_workflow\nfrom ai_multi_agent_platform.security import (",
          )
          replace(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              "    authentication = LocalAuthenticationService(store=authentication_store)\n    authorization = SqliteLocalAuthorizationProvider(database_dir / \"authorization.sqlite3\")\n\n    control_plane = ControlPlane(",
              "    authentication = LocalAuthenticationService(store=authentication_store)\n    authorization = SqliteLocalAuthorizationProvider(database_dir / \"authorization.sqlite3\")\n\n    portability_workflow = build_agent_portability_workflow(\n        agents=agents.repository,\n        models=models,\n        scopes=scopes,\n        platform_version=__version__,\n        templates=templates.repository,\n    )\n\n    control_plane = ControlPlane(",
          )
          replace(
              "src/ai_multi_agent_platform/deployment/single_node.py",
              "        conversation_response_provider=conversation_response_provider,\n    )",
              "        conversation_response_provider=conversation_response_provider,\n        portability_workflow=portability_workflow,\n    )",
          )

          path = Path("src/ai_multi_agent_platform/portability/composition.py")
          text = path.read_text()
          text = text.replace(
              "register_agent_portability_codecs(serializers, id_policy=id_policy)",
              "register_agent_portability_codecs(\n        serializers, agent_id_policy=id_policy, team_id_policy=id_policy\n    )",
          )
          path.write_text(text)
          PY
      - name: Carry workflow exports forward
        run: |
          git show origin/feat/issue-79-control-plane-portability:src/ai_multi_agent_platform/portability/__init__.py > src/ai_multi_agent_platform/portability/__init__.py
      - name: Format and validate synchronized slice
        run: |
          python -m pip install "ruff>=0.12,<1"
          ruff check --fix src/ai_multi_agent_platform/cli/main.py src/ai_multi_agent_platform/cli/portability.py src/ai_multi_agent_platform/control_plane/__init__.py src/ai_multi_agent_platform/control_plane/portability_api.py src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/portability/composition.py src/ai_multi_agent_platform/portability/workflow.py tests/test_issue_79_cli_portability.py tests/test_issue_79_control_plane_portability.py tests/test_issue_79_single_node_portability.py
          ruff format src/ai_multi_agent_platform/cli/main.py src/ai_multi_agent_platform/cli/portability.py src/ai_multi_agent_platform/control_plane/__init__.py src/ai_multi_agent_platform/control_plane/portability_api.py src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/portability/composition.py src/ai_multi_agent_platform/portability/workflow.py tests/test_issue_79_cli_portability.py tests/test_issue_79_control_plane_portability.py tests/test_issue_79_single_node_portability.py
      - name: Commit synchronized implementation and remove helper
        run: |
          git rm .github/workflows/issue-79-sync-final.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PORTABILITY_CONTROL_PLANE.md src tests
          git commit -m "feat(portability): rebase control-plane workflow on current main"
          git push origin HEAD:feat/issue-79-portability-final
