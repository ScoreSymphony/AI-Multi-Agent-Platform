name: Issue 19 docs helper

on:
  push:
    branches:
      - fix/issue-19-final-product-completion

permissions:
  contents: write

jobs:
  update-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-19-final-product-completion
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Update issue 19 portability and completion docs
        run: python scripts/issue19_docs_temp.py
      - name: Commit documentation
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PORTABILITY.md docs/PORTABILITY_CONTROL_PLANE.md docs/ISSUE_19_COMPLETION.md
          git commit -m "docs: update issue 19 final product and portability audit"
          git push origin HEAD:fix/issue-19-final-product-completion
