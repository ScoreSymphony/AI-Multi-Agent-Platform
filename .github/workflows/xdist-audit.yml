name: Pytest xdist audit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: xdist-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap audit environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pytest-xdist>=3.6,<4"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          pytest --version
          python - <<'PY'
          import importlib.metadata
          print("pytest-xdist", importlib.metadata.version("pytest-xdist"))
          PY
      - name: Run measured trials
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          run_case() {
            local case_name="$1"
            local test_path="$2"
            local args="$3"
            local repeats="$4"
            local extra_args=()
            if [ -n "$args" ]; then
              read -r -a extra_args <<< "$args"
            fi

            for trial in $(seq 1 "$repeats"); do
              echo "::group::${case_name} trial ${trial}/${repeats}"
              start_ns=$(date +%s%N)
              set +e
              pytest "${extra_args[@]}" "$test_path"
              status=$?
              set -e
              end_ns=$(date +%s%N)
              python - "$case_name" "$trial" "$status" "$start_ns" "$end_ns" <<'PY'
          import json
          import sys

          case_name, trial, status, start_ns, end_ns = sys.argv[1:]
          duration = (int(end_ns) - int(start_ns)) / 1_000_000_000
          print("XDIST_AUDIT=" + json.dumps({
              "case": case_name,
              "trial": int(trial),
              "status": int(status),
              "duration_seconds": round(duration, 3),
          }, sort_keys=True))
          PY
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            done
          }

          run_case unit-serial tests/unit "" 2
          run_case unit-n4-loadfile tests/unit "-n 4 --dist=loadfile" 3
          run_case unit-n4-loadscope tests/unit "-n 4 --dist=loadscope" 2

          run_case contract-serial tests/contract "" 2
          run_case contract-n4-loadfile tests/contract "-n 4 --dist=loadfile" 3
          run_case contract-n4-loadscope tests/contract "-n 4 --dist=loadscope" 2

          run_case architecture-serial tests/architecture "" 1
          run_case architecture-n2-loadfile tests/architecture "-n 2 --dist=loadfile" 2

          run_case integration-serial tests/integration "" 1
          run_case integration-n2-loadfile tests/integration "-n 2 --dist=loadfile" 2

          run_case regression-serial tests/regression "" 1
          run_case regression-n2-loadfile tests/regression "-n 2 --dist=loadfile" 2

          run_case e2e-serial tests/e2e "" 1
          run_case e2e-n2-loadfile tests/e2e "-n 2 --dist=loadfile" 2

          run_case release-serial tests/release "" 1
          run_case release-n2-loadfile tests/release "-n 2 --dist=loadfile" 2

          # Performance tests are intentionally measured serially only: running
          # benchmarks under worker contention would invalidate timing semantics.
          run_case performance-serial tests/performance "" 1

          echo "XDIST_AUDIT_FAILURES=$failures"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
