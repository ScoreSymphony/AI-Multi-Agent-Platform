name: Pytest xdist audit

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: xdist-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stress:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap audit environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pytest-xdist>=3.6,<4"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
          pytest --version
          python - <<'PY'
          import importlib.metadata
          print("pytest-xdist", importlib.metadata.version("pytest-xdist"))
          PY
      - name: Run higher-concurrency stress trials
        shell: bash
        run: |
          set -euo pipefail
          failures=0

          run_case() {
            local case_name="$1"
            local repeats="$2"
            shift 2
            for trial in $(seq 1 "$repeats"); do
              echo "::group::${case_name} trial ${trial}/${repeats}"
              start_ns=$(date +%s%N)
              set +e
              pytest -n 4 --dist=loadfile "$@"
              status=$?
              set -e
              end_ns=$(date +%s%N)
              python - "$case_name" "$trial" "$status" "$start_ns" "$end_ns" <<'PY'
          import json
          import sys

          case_name, trial, status, start_ns, end_ns = sys.argv[1:]
          duration = (int(end_ns) - int(start_ns)) / 1_000_000_000
          print("XDIST_AUDIT=" + json.dumps({
              "case": case_name,
              "trial": int(trial),
              "status": int(status),
              "duration_seconds": round(duration, 3),
          }, sort_keys=True))
          PY
              echo "::endgroup::"
              if [ "$status" -ne 0 ]; then
                failures=$((failures + 1))
              fi
            done
          }

          # Whole integration suite at higher concurrency. Optional live PostgreSQL/Pipelock
          # resources are absent in normal PR CI, so this probes the default suite only.
          run_case integration-n4-loadfile 3 tests/integration

          # Concentrate the highest process/server/socket density into one xdist pool so
          # port hand-off, subprocess lifecycle and worker cleanup races are more likely
          # to surface than in the broad integration run.
          run_case process-heavy-n4-loadfile 5 \
            tests/integration/distributed \
            tests/integration/workspaces \
            tests/integration/mcp \
            tests/integration/control_plane \
            tests/e2e/files

          # Cross-suite scheduling probe: prove that otherwise isolated files do not
          # depend on suite execution order or process-global state leaking from prior runs.
          run_case cross-suite-n4-loadfile 3 \
            tests/unit \
            tests/contract \
            tests/architecture \
            tests/regression \
            tests/release

          echo "XDIST_AUDIT_FAILURES=$failures"
          if [ "$failures" -ne 0 ]; then
            exit 1
          fi
