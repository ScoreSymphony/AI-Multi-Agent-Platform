name: Issue 597 northbound authority hardening

on:
  push:
    branches:
      - fix/597-goal-completion-final

permissions:
  contents: write

jobs:
  remove-client-task-authority:
    if: github.actor == 'ScoreSymphony'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: fix/597-goal-completion-final

      - name: Remove northbound Goal Task-outcome mutation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"patch anchor not found in {path}: {old[:180]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          contract = "src/ai_multi_agent_platform/control_plane/goal_contract.py"
          replace_once(contract, '    "goal.attach-task",\n    "goal.record-task-outcome",\n', '    "goal.attach-task",\n')
          replace_once(
              contract,
              '''    async def record_task_outcome(\n        context: RequestContext, resource_ref: str, payload: dict[str, JsonValue]\n    ) -> dict[str, JsonValue]:\n        try:\n            task_state = GoalTaskState(_required_string(payload, "task_state"))\n        except ValueError as exc:\n            raise ContractError(ErrorCode.INVALID_REQUEST, "invalid Goal Task outcome") from exc\n        return _goal_resource(\n            await service.record_task_outcome(\n                goal_id=resource_ref,\n                task_id=_required_string(payload, "task_id"),\n                task_state=task_state,\n                idempotency_key=_idempotency(context),\n                actor_ref=context.actor.principal_ref,\n            )\n        )\n\n''',
              "",
          )
          replace_once(
              contract,
              '        "goal.attach-task": attach_task,\n        "goal.record-task-outcome": record_task_outcome,\n',
              '        "goal.attach-task": attach_task,\n',
          )
          replace_once(contract, "    GoalTaskState,\n", "")

          frontend = "frontend/src/api/goals.ts"
          replace_once(
              frontend,
              '''  recordTaskOutcome(\n    goalId: string,\n    taskId: string,\n    taskState: GoalTaskState,\n  ): Promise<CanonicalGoal> {\n    return this.command("goal.record-task-outcome", goalId, {\n      task_id: taskId,\n      task_state: taskState,\n    });\n  }\n\n''',
              "",
          )

          frontend_test = "frontend/src/api/goals.test.ts"
          replace_once(
              frontend_test,
              '    await client.attachTask("goal_1", "task_1", 4);\n    await client.recordTaskOutcome("goal_1", "task_1", "succeeded");\n',
              '    await client.attachTask("goal_1", "task_1", 4);\n',
          )
          replace_once(
              frontend_test,
              '      "/api/v1/commands/goal.attach-task",\n      "/api/v1/commands/goal.record-task-outcome",\n',
              '      "/api/v1/commands/goal.attach-task",\n',
          )

          cli_test = "tests/test_issue_597_cli.py"
          replace_once(cli_test, '    "goal.attach-task",\n    "goal.record-task-outcome",\n', '    "goal.attach-task",\n')

          cli_doc = "docs/cli/CLI_GOALS.md"
          replace_once(
              cli_doc,
              '''## Task outcome reconciliation\n\n```bash\nplatform extension execute goal.record-task-outcome GOAL_ID \\\n  --idempotency-key reconcile-task-42 \\\n  --payload '{"task_id":"task_...","task_state":"succeeded"}'\n```\n\nValid `task_state` values are `active`, `succeeded`, `failed`, `cancelled` and `superseded` according to the canonical Goal Task-link projection.\n\n''',
              '''## Task outcome reconciliation\n\nTask terminal state is not writable through a northbound Goal command. The canonical Task/Run kernel emits terminal Task events, and the Goal runtime projects `task.succeeded`, `task.failed` and `task.cancelled` into matching Goal Task links before #18 advances the event cursor. This prevents CLI/Web clients from claiming Task completion independently of the canonical Task lifecycle.\n\n''',
          )

          runtime_doc = "docs/runtime/GOALS.md"
          replace_once(runtime_doc, "goal.attach-task\ngoal.record-task-outcome\n", "goal.attach-task\n")
          replace_once(
              runtime_doc,
              "`task.succeeded`, `task.failed` and `task.cancelled` update matching `GoalTaskLink` projections through idempotent `goal.record_task_outcome` semantics.",
              "`task.succeeded`, `task.failed` and `task.cancelled` update matching `GoalTaskLink` projections through the internal idempotent Goal service reconciliation operation. There is deliberately no northbound Task-outcome mutation command.",
          )
          replace_once(
              runtime_doc,
              "`human_acceptance` is the one northbound promotion case: it is accepted only from an authenticated `user` owner context and the server records that principal as the canonical actor/source.",
              "`human_acceptance` is the one northbound promotion case: the evidence criterion ID and kind must match the current canonical Goal revision, the caller must be a canonical human actor, and the server records that principal as the canonical actor/source.",
          )

          integration_review = Path("docs/INTEGRATION_REVIEW_2026-09-09.md")
          if integration_review.exists():
              text = integration_review.read_text(encoding="utf-8")
              text = text.replace(", `goal.record-task-outcome`", "")
              integration_review.write_text(text, encoding="utf-8")

          regression = Path("tests/test_issue_597_completion_gaps.py")
          text = regression.read_text(encoding="utf-8")
          marker = "def test_task_outcome_mutation_is_not_northbound_goal_authority()"
          if marker not in text:
              text += '''\n\ndef test_task_outcome_mutation_is_not_northbound_goal_authority() -> None:\n    from ai_multi_agent_platform.control_plane.goal_contract import GOAL_COMMANDS\n\n    assert "goal.record-task-outcome" not in GOAL_COMMANDS\n\n'''
              regression.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dev environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Format, lint and test Goal backend/CLI
        run: |
          ruff format src/ai_multi_agent_platform/control_plane/goal_contract.py tests/test_issue_597_completion_gaps.py tests/test_issue_597_cli.py
          ruff check src/ai_multi_agent_platform/control_plane/goal_contract.py tests/test_issue_597_completion_gaps.py tests/test_issue_597_cli.py
          pytest -q tests/test_issue_597_completion_gaps.py tests/test_issue_597_cli.py

      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"

      - name: Validate Goal frontend client
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- src/api/goals.test.ts

      - name: Commit authority hardening
        if: success()
        shell: bash
        run: |
          rm -f .github/workflows/issue597-northbound-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src frontend tests docs .github/workflows/issue597-northbound-hardening.yml
          git commit -m "fix(#597): keep Task terminal state kernel-authoritative"
          git push origin HEAD:fix/597-goal-completion-final
