name: Issue 87 finalizer

on:
  push:
    branches: [feat/issue-87-organization-membership]
    paths:
      - .github/workflows/issue87-finalize.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/issue-87-organization-membership
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Apply finalization patch
        shell: bash
        run: |
          set +e
          python tools/issue87_finalize.py > issue87-patch-diagnostic.txt 2>&1
          status=$?
          cat issue87-patch-diagnostic.txt
          if [ "$status" -ne 0 ]; then
            git config user.name "Score Symphony"
            git config user.email "scoresymphony@gmail.com"
            git add issue87-patch-diagnostic.txt
            git commit -m "chore: capture issue 87 patch diagnostic"
            git push origin HEAD:feat/issue-87-organization-membership
            exit "$status"
          fi
          rm issue87-patch-diagnostic.txt
      - name: Bootstrap Python environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format
        run: ruff format src tests
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy
      - name: Targeted backend tests
        run: pytest -q tests/test_issue_87_organization_domain.py tests/test_issue_87_control_plane.py tests/test_issue_87_authorization_bridge.py tests/test_issue_87_search_and_invitation_security.py tests/test_issue_45_connector_search.py
      - name: Frontend validation
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --run src/api/organizations.test.ts
          npm run build
      - name: Commit validated finalization
        shell: bash
        run: |
          git config user.name "Score Symphony"
          git config user.email "scoresymphony@gmail.com"
          git add src tests frontend docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: complete organization search and invitation security (#87)"
            git push origin HEAD:feat/issue-87-organization-membership
          fi
