name: Issue 384 mypy fix

on:
  push:
    branches:
      - feat/384-durable-plan-step-coordinator

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/384-durable-plan-step-coordinator
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Patch strict typing findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ai_multi_agent_platform/coordination/service.py')
          text = path.read_text(encoding='utf-8')

          replacements = {
              'from typing import Literal, Protocol\n':
                  'from typing import Literal, Protocol, cast\n',
              '                details={"step_ids": sorted(unknown)},\n':
                  '                details={"step_ids": cast(JsonValue, sorted(unknown))},\n',
              '                    wait_type=(records[step.id].wait.wait_type if records[step.id].wait else None),\n':
                  '                    wait_type=(\n'
                  '                        cast(StepWait, records[step.id].wait).wait_type\n'
                  '                        if records[step.id].wait is not None\n'
                  '                        else None\n'
                  '                    ),\n',
              '                        records[step.id].wait.deadline_at if records[step.id].wait else None\n':
                  '                        cast(StepWait, records[step.id].wait).deadline_at\n'
                  '                        if records[step.id].wait is not None\n'
                  '                        else None\n',
              '        if any(step.status is StepStatus.CANCELLED for step in state.steps):\n'
              '            if task.status is not TaskStatus.CANCELLED:\n'
              '                await self.kernel.cancel_task(\n'
              '                    idempotency_key=f"coord:{plan_id}:aggregate:cancelled",\n'
              '                    task_id=state.plan.task_id,\n'
              '                    source="platform-coordinator",\n'
              '                )\n'
              '            return\n':
                  '        if any(step.status is StepStatus.CANCELLED for step in state.steps):\n'
                  '            if task.status in {\n'
                  '                TaskStatus.DRAFT,\n'
                  '                TaskStatus.READY,\n'
                  '                TaskStatus.RUNNING,\n'
                  '                TaskStatus.WAITING,\n'
                  '            }:\n'
                  '                await self.kernel.cancel_task(\n'
                  '                    idempotency_key=f"coord:{plan_id}:aggregate:cancelled",\n'
                  '                    task_id=state.plan.task_id,\n'
                  '                    source="platform-coordinator",\n'
                  '                )\n'
                  '            return\n',
              '                    details={"step_id": step.id, "dependencies": sorted(missing)},\n':
                  '                    details={\n'
                  '                        "step_id": step.id,\n'
                  '                        "dependencies": cast(JsonValue, sorted(missing)),\n'
                  '                    },\n',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected service anchor not found: {old[:90]!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Format patched service
        run: |
          python -m pip install 'ruff==0.16.6'
          ruff format src/ai_multi_agent_platform/coordination/service.py
          ruff check src/ai_multi_agent_platform/coordination/service.py
      - name: Commit patch and remove helper workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/issue384-mypy-fix.yml
          git add src/ai_multi_agent_platform/coordination/service.py
          git commit -m 'fix(#384): satisfy strict coordinator typing'
          git push origin HEAD:feat/384-durable-plan-step-coordinator
