name: Repair Learning integration helper

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/fix-merge-ready-learning-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - name: Repair helper and remove bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          target = Path('.github/workflows/merge-ready-learning.yml')
          text = target.read_text()
          old = '          ruff check src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py\n'
          new = '          ruff check --fix src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py\n'
          if old not in text:
              raise SystemExit('expected Ruff command not found')
          target.write_text(text.replace(old, new, 1))
          Path('.github/workflows/fix-merge-ready-learning-workflow.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/workflows
          git diff --cached --check
          git commit -m "ci: allow learning helper to apply Ruff fixes"
          git push origin HEAD:integration/active-branches-2026-09-08
