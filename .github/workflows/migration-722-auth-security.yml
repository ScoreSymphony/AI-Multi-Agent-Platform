name: Temporary #722 auth security migration

on:
  push:
    branches:
      - test/722-auth-security

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Baseline collection
        run: pytest --collect-only -q | tee /tmp/collect-before.txt
      - name: Migrate auth and security cohort
        run: python scripts/ci/migrate_722_auth_security.py migrate
      - name: Format and lint changed Python files
        shell: bash
        run: |
          git diff --name-only --diff-filter=ACM | grep -E '\.py$' > /tmp/changed-python.txt
          xargs -r ruff format < /tmp/changed-python.txt
          xargs -r ruff check < /tmp/changed-python.txt
          git diff --check
      - name: Validate collection delta
        shell: bash
        run: |
          pytest --collect-only -q | tee /tmp/collect-after.txt
          python scripts/ci/migrate_722_auth_security.py validate-collection \
            /tmp/collect-before.txt /tmp/collect-after.txt
      - name: Targeted auth and security tests
        run: pytest tests/unit/security tests/unit/authorization tests/contract/security tests/integration/security tests/e2e/security
      - name: Full pytest
        run: pytest
      - name: Remove temporary migration machinery and commit
        shell: bash
        run: |
          rm .github/workflows/migration-722-auth-security.yml
          rm scripts/ci/migrate_722_auth_security.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --check
          git commit -m "test: migrate authentication authorization and security tests"
          git push origin HEAD:test/722-auth-security
