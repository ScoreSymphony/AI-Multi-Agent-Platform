name: Temporary #722 auth security migration

on:
  push:
    branches:
      - test/722-auth-security

permissions:
  contents: write

jobs:
  migrate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Bootstrap test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Preflight duplicate destinations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          moves = {
              "tests/test_issue_15_team_scope.py": "tests/unit/authorization/test_team_scope.py",
              "tests/test_issue_15_exact_binding.py": "tests/integration/security/test_authorization_exact_binding.py",
              "tests/test_issue_364_authorization.py": "tests/integration/security/test_workflow_authorization.py",
              "tests/test_issue_310_policy_scope_bounds.py": "tests/unit/authorization/test_policy_scope_bounds.py",
              "tests/test_issue_251_non_disclosure.py": "tests/integration/security/test_non_disclosure.py",
              "tests/test_issue_14_worker_protocol_security.py": "tests/integration/security/test_worker_protocol_security.py",
              "tests/test_issue_14_worker_secrets.py": "tests/integration/security/test_worker_secret_handling.py",
              "tests/test_issue_872_authorization.py": "tests/integration/security/test_coding_batch_merge_authorization.py",
              "tests/test_policy_profile_state_probing_authorization.py": "tests/integration/security/test_policy_profile_state_authorization.py",
              "tests/test_issue73_run_cancel_authorization.py": "tests/e2e/security/test_terminal_run_cancel_authorization.py",
              "tests/test_issue171_team_authorization_evidence.py": "tests/integration/security/test_team_accounting_authorization.py",
              "tests/test_issue_591_egress_approvals.py": "tests/unit/authorization/test_egress_approval_binding.py",
              "tests/test_issue_310_policy_lifecycle_authorization.py": "tests/integration/security/test_policy_profile_lifecycle_authorization.py",
              "tests/test_issue_310_policy_management_scope_authority.py": "tests/integration/security/test_policy_management_scope_authority.py",
              "tests/test_issue_310_policy_mutation_approval_binding.py": "tests/integration/security/test_policy_mutation_approval_binding.py",
              "tests/test_issue_310_policy_import_approval_binding.py": "tests/integration/security/test_policy_import_approval_binding.py",
              "tests/test_issue_310_policy_lifecycle_revision_binding.py": "tests/integration/security/test_policy_lifecycle_revision_binding.py",
          }
          duplicates = []
          for source, target in moves.items():
              src = Path(source)
              dst = Path(target)
              if src.exists() and dst.exists():
                  if src.read_bytes() != dst.read_bytes():
                      raise SystemExit(f"conflicting existing migration target: {source} -> {target}")
                  duplicates.append(source)
          Path("/tmp/duplicate_sources.txt").write_text("\n".join(duplicates), encoding="utf-8")
          print("duplicate sources:", duplicates)
          PY
      - name: Baseline collection
        shell: bash
        run: |
          pytest --collect-only -q | tee /tmp/collect-before.txt
          if [ -s /tmp/duplicate_sources.txt ]; then
            mapfile -t DUPLICATES < /tmp/duplicate_sources.txt
            pytest --collect-only -q "${DUPLICATES[@]}" | tee /tmp/collect-duplicates.txt
          else
            printf '0 tests collected\n' | tee /tmp/collect-duplicates.txt
          fi
      - name: Migrate auth and security cohort
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          import re
          import shutil
          from pathlib import Path

          workflow = Path(".github/workflows/migration-722-auth-security.yml")

          moves = {
              "tests/test_issue_15_team_scope.py": "tests/unit/authorization/test_team_scope.py",
              "tests/test_issue_15_exact_binding.py": "tests/integration/security/test_authorization_exact_binding.py",
              "tests/test_issue_364_authorization.py": "tests/integration/security/test_workflow_authorization.py",
              "tests/test_issue_310_policy_scope_bounds.py": "tests/unit/authorization/test_policy_scope_bounds.py",
              "tests/test_issue_251_non_disclosure.py": "tests/integration/security/test_non_disclosure.py",
              "tests/test_issue_14_worker_protocol_security.py": "tests/integration/security/test_worker_protocol_security.py",
              "tests/test_issue_14_worker_secrets.py": "tests/integration/security/test_worker_secret_handling.py",
              "tests/test_issue_872_authorization.py": "tests/integration/security/test_coding_batch_merge_authorization.py",
              "tests/test_policy_profile_state_probing_authorization.py": "tests/integration/security/test_policy_profile_state_authorization.py",
              "tests/test_issue73_run_cancel_authorization.py": "tests/e2e/security/test_terminal_run_cancel_authorization.py",
              "tests/test_issue171_team_authorization_evidence.py": "tests/integration/security/test_team_accounting_authorization.py",
              "tests/test_issue_591_egress_approvals.py": "tests/unit/authorization/test_egress_approval_binding.py",
              "tests/test_issue_310_policy_lifecycle_authorization.py": "tests/integration/security/test_policy_profile_lifecycle_authorization.py",
              "tests/test_issue_310_policy_management_scope_authority.py": "tests/integration/security/test_policy_management_scope_authority.py",
              "tests/test_issue_310_policy_mutation_approval_binding.py": "tests/integration/security/test_policy_mutation_approval_binding.py",
              "tests/test_issue_310_policy_import_approval_binding.py": "tests/integration/security/test_policy_import_approval_binding.py",
              "tests/test_issue_310_policy_lifecycle_revision_binding.py": "tests/integration/security/test_policy_lifecycle_revision_binding.py",
          }

          split_groups = {
              "tests/test_issue_36_authentication.py": {
                  "tests/unit/security/test_authentication_service.py": {
                      "test_local_login_success_failure_and_disabled_account",
                      "test_password_change_invalidates_browser_sessions_and_logout_revokes",
                      "test_expired_session_and_csrf_validation",
                      "test_personal_service_and_worker_credentials_are_hashed_and_revocable",
                      "test_worker_replay_nonce_survives_full_future_clock_skew_window",
                      "test_rate_control_hook_blocks_repeated_failed_login",
                      "test_external_identity_requires_explicit_mapping_and_claims_do_not_become_permissions",
                      "test_authentication_audit_redacts_secret_metadata",
                  },
                  "tests/integration/security/test_control_plane_authentication.py": {
                      "test_control_plane_requires_authentication_and_does_not_trust_principal_headers",
                      "test_authenticated_request_ids_are_unique_and_propagated_end_to_end",
                      "test_control_plane_keeps_unauthenticated_401_distinct_from_authorization_403",
                      "test_personal_credential_http_management_requires_canonical_manage_credentials",
                      "test_authenticated_sse_rejects_spoofed_anonymous_stream_and_projects_canonical_actor",
                      "test_authenticated_openapi_documents_auth_routes_and_security_schemes",
                      "test_browser_control_plane_login_csrf_session_listing_and_logout",
                  },
              },
              "tests/test_issue_36_authentication_hardening.py": {
                  "tests/unit/security/test_authentication_hardening.py": {
                      "test_scoped_credential_survives_authentication_service_recreation",
                      "test_corrupt_persisted_scope_fails_closed_during_bearer_authentication",
                      "test_authentication_attempts_emit_redacted_audit_records",
                      "test_locked_account_and_automation_integration_credentials",
                      "test_worker_rotation_revokes_old_secret_and_preserves_scope",
                  },
                  "tests/integration/security/test_control_plane_authentication_hardening.py": {
                      "test_credential_scope_denies_even_when_15_policy_allows",
                      "test_15_policy_denies_even_when_credential_scope_allows",
                      "test_scoped_personal_credential_http_contract_exposes_safe_scope_metadata",
                      "test_authenticated_request_rate_limit_hook_returns_429",
                      "test_session_renewal_revokes_old_session_and_targeted_revoke_is_deterministic",
                      "test_scoped_credential_openapi_matches_current_composed_http_contract",
                  },
              },
              "tests/test_issue_15_final_boundaries.py": {
                  "tests/integration/security/test_authorization_final_boundaries.py": {
                      "test_generic_extension_command_approval_binds_exact_payload",
                      "test_task_management_update_approval_binds_exact_payload",
                      "test_workspace_create_approval_binds_composed_workspace_payload",
                      "test_workspace_bound_start_approval_binds_resolved_snapshot",
                      "test_composed_control_plane_is_fail_closed_without_explicit_dev_opt_out",
                  },
                  "tests/unit/authorization/test_approval_project_scope.py": {
                      "test_approval_decision_cannot_substitute_another_project_scope",
                  },
                  "tests/contract/security/test_control_plane_authorization_vocabulary.py": {
                      "test_task_management_vocabulary_is_canonical_task_modify",
                  },
              },
              "tests/test_issue34_completion.py": {
                  "tests/contract/security/test_secret_provider_contract.py": {
                      "test_secret_provider_contract_requires_audit_hook_boundary",
                  },
                  "tests/unit/security/test_secret_provider.py": {
                      "test_local_secret_provider_supports_replaceable_audit_sink",
                      "test_local_reference_backend_declares_ephemeral_restart_contract",
                      "test_local_reference_backend_restart_requires_reprovision",
                      "test_redaction_helpers_cover_representative_operational_api_and_export_surfaces",
                      "test_secret_reference_direct_serialization_never_exposes_sensitive_metadata",
                      "test_secret_reference_metadata_is_deeply_immutable_and_detached_from_input",
                  },
              },
              "tests/test_issue_310_policy_profiles.py": {
                  "tests/unit/authorization/test_policy_profile_compilation.py": {
                      "test_local_reference_provider_compiles_canonical_revision_without_owning_identity",
                      "test_unsupported_provider_neutral_conditions_fail_closed_in_local_compiler",
                  },
                  "tests/integration/security/test_policy_profile_service.py": {
                      "test_create_and_version_preserves_exact_historical_revision",
                      "test_json_repository_survives_restart_with_history_assignment_and_disable",
                      "test_untrusted_imported_profile_cannot_self_grant_assignment_authority",
                      "test_project_organization_and_team_scopes_are_isolated_by_authorization_gate",
                      "test_assignment_requires_preexisting_authority_not_profile_contents",
                  },
                  "tests/contract/security/test_policy_profile_serialization.py": {
                      "test_canonical_serialization_contains_no_credentials_or_provider_private_policy_objects",
                  },
              },
          }

          old_paths = [*moves, *split_groups]

          def provenance(source: str) -> str:
              match = re.search(r"test_issue_?(\d+)|test_issue(\d+)", Path(source).name)
              issue = next((group for group in match.groups() if group), None) if match else None
              if issue:
                  return f'"""Migrated under #722; original coverage tracked issue #{issue}."""'
              return '"""Migrated under #722 from root-level authorization coverage."""'

          def add_provenance(path: Path, source: str) -> None:
              text = path.read_text(encoding="utf-8")
              marker = provenance(source)
              if text.startswith(marker):
                  return
              path.write_text(f"{marker}\n\n{text}", encoding="utf-8")

          for source, target in moves.items():
              src = Path(source)
              dst = Path(target)
              if not src.exists():
                  if dst.exists():
                      continue
                  raise SystemExit(f"missing migration source and target: {source}")
              dst.parent.mkdir(parents=True, exist_ok=True)
              if dst.exists():
                  if src.read_bytes() != dst.read_bytes():
                      raise SystemExit(f"conflicting migration target: {source} -> {target}")
                  src.unlink()
              else:
                  shutil.move(str(src), str(dst))
              add_provenance(dst, source)

          def split_module(source: str, groups: dict[str, set[str]]) -> None:
              src = Path(source)
              if not src.exists():
                  if all(Path(target).exists() for target in groups):
                      return
                  raise SystemExit(f"missing split source: {source}")
              text = src.read_text(encoding="utf-8")
              lines = text.splitlines(keepends=True)
              tree = ast.parse(text)
              tests: dict[str, ast.AST] = {}
              common: list[ast.AST] = []
              for node in tree.body:
                  is_test = isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")
                  if is_test:
                      tests[node.name] = node
                  else:
                      common.append(node)
              expected = set().union(*groups.values())
              if set(tests) != expected:
                  missing = sorted(set(tests) - expected)
                  unknown = sorted(expected - set(tests))
                  raise SystemExit(
                      f"split classification mismatch for {source}: unclassified={missing}, unknown={unknown}"
                  )

              def node_text(node: ast.AST) -> str:
                  start = node.lineno
                  decorators = getattr(node, "decorator_list", ())
                  if decorators:
                      start = min(start, *(decorator.lineno for decorator in decorators))
                  return "".join(lines[start - 1 : node.end_lineno]).rstrip()

              common_text = [node_text(node) for node in common]
              for target, selected in groups.items():
                  dst = Path(target)
                  if dst.exists():
                      raise SystemExit(f"split target already exists: {target}")
                  dst.parent.mkdir(parents=True, exist_ok=True)
                  selected_nodes = [
                      node for node in tree.body
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                      and node.name in selected
                  ]
                  chunks = [provenance(source), "# ruff: noqa: F401", *common_text]
                  chunks.extend(node_text(node) for node in selected_nodes)
                  dst.write_text("\n\n\n".join(chunks).rstrip() + "\n", encoding="utf-8")
              src.unlink()

          for source, groups in split_groups.items():
              split_module(source, groups)

          stale = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or path == workflow or ".git" in path.parts:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for old in old_paths:
                  if old in text:
                      stale.append(f"{path}: {old}")
          if stale:
              raise SystemExit("stale old-path references remain:\n" + "\n".join(stale))
          PY
          ruff format tests/unit/security tests/unit/authorization tests/contract/security tests/integration/security tests/e2e/security
          ruff check tests/unit/security tests/unit/authorization tests/contract/security tests/integration/security tests/e2e/security
      - name: Validate collection delta
        shell: bash
        run: |
          pytest --collect-only -q | tee /tmp/collect-after.txt
          python - <<'PY'
          import re
          from pathlib import Path

          def count(path: str) -> int:
              text = Path(path).read_text(encoding="utf-8")
              matches = re.findall(r"(\d+) tests? collected", text)
              if not matches:
                  raise SystemExit(f"could not parse collection count from {path}")
              return int(matches[-1])

          before = count("/tmp/collect-before.txt")
          after = count("/tmp/collect-after.txt")
          duplicates = count("/tmp/collect-duplicates.txt")
          print(f"collection before={before} after={after} duplicate_items_removed={duplicates}")
          if before - after != duplicates:
              raise SystemExit(
                  f"unexpected collection delta: before={before}, after={after}, expected removal={duplicates}"
              )
          Path("/tmp/collection-summary.txt").write_text(
              f"before={before}\nafter={after}\nduplicate_items_removed={duplicates}\n",
              encoding="utf-8",
          )
          PY
      - name: Targeted auth and security tests
        run: pytest tests/unit/security tests/unit/authorization tests/contract/security tests/integration/security tests/e2e/security
      - name: Full pytest
        run: pytest
      - name: Remove temporary workflow and commit migration
        shell: bash
        run: |
          rm .github/workflows/migration-722-auth-security.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "test: migrate authentication authorization and security tests"
          git push origin HEAD:test/722-auth-security
