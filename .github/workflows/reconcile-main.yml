name: Reconcile issue 5 with latest main

on:
  push:
    branches:
      - fix/issue-5-main-reconciliation

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/issue-5-main-reconciliation
          fetch-depth: 0
      - name: Reconcile latest main and canonical contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          cp src/ai_multi_agent_platform/contracts/types.py /tmp/types.py
          cp src/ai_multi_agent_platform/testing/fakes.py /tmp/fakes.py
          cp docs/CONTRACTS.md /tmp/contracts.md

          git merge -X theirs --no-edit origin/main

          python - <<'PY'
          from pathlib import Path

          # Rebuild the provider contract types from the hardened issue-5 version,
          # while preserving provider-contract v2 immutable ToolInvocation semantics.
          types = Path('/tmp/types.py').read_text()
          types = types.replace(
              'from dataclasses import dataclass, field\nfrom enum import StrEnum\nfrom typing import Literal\n',
              'from collections.abc import Mapping\nfrom dataclasses import dataclass, field\nfrom enum import StrEnum\nfrom types import MappingProxyType\nfrom typing import Literal\n',
          )
          types = types.replace(
              'type JsonValue = JsonScalar | list[JsonValue] | dict[str, JsonValue]\n\nCONTRACT_VERSION = "1.0"\n',
              '''type JsonValue = JsonScalar | list[JsonValue] | dict[str, JsonValue]\ntype FrozenJsonValue = JsonScalar | tuple[FrozenJsonValue, ...] | Mapping[str, FrozenJsonValue]\n\nCONTRACT_VERSION = "2.0"\n\n\ndef _freeze_json(value: JsonValue) -> FrozenJsonValue:\n    """Copy a JSON-compatible value into an immutable representation."""\n\n    if isinstance(value, dict):\n        return MappingProxyType({key: _freeze_json(item) for key, item in value.items()})\n    if isinstance(value, list):\n        return tuple(_freeze_json(item) for item in value)\n    return value\n\n\ndef _thaw_json(value: JsonValue | FrozenJsonValue) -> JsonValue:\n    """Copy an immutable JSON value back to a standard JSON-serializable value."""\n\n    if isinstance(value, Mapping):\n        return {key: _thaw_json(item) for key, item in value.items()}\n    if isinstance(value, list | tuple):\n        return [_thaw_json(item) for item in value]\n    return value\n''',
          )
          old_tool = '''@dataclass(frozen=True, slots=True)\nclass ToolInvocation:\n    invocation_id: str\n    tool_ref: str\n    arguments: dict[str, JsonValue]\n    context: OperationContext\n\n    def __post_init__(self) -> None:\n        if not self.invocation_id.strip():\n            raise ValueError("tool invocation_id must not be blank")\n        validate_id(self.tool_ref, "tool")\n'''
          new_tool = '''@dataclass(frozen=True, slots=True)\nclass ToolInvocation:\n    invocation_id: str\n    tool_ref: str\n    arguments: Mapping[str, JsonValue]\n    context: OperationContext\n\n    def __post_init__(self) -> None:\n        if not self.invocation_id.strip():\n            raise ValueError("tool invocation_id must not be blank")\n        validate_id(self.tool_ref, "tool")\n        frozen = MappingProxyType(\n            {key: _freeze_json(value) for key, value in dict(self.arguments).items()}\n        )\n        object.__setattr__(self, "arguments", frozen)\n\n    def arguments_json(self) -> dict[str, JsonValue]:\n        """Return a detached standard JSON representation for provider transport."""\n\n        return {key: _thaw_json(value) for key, value in self.arguments.items()}\n'''
          if old_tool not in types:
              raise SystemExit('ToolInvocation block not found')
          types = types.replace(old_tool, new_tool)
          Path('src/ai_multi_agent_platform/contracts/types.py').write_text(types)

          # Keep issue-5 fake semantics plus contract-v2 detached argument export.
          fakes = Path('/tmp/fakes.py').read_text().replace(
              'output = invocation.arguments\n', 'output = invocation.arguments_json()\n'
          )
          Path('src/ai_multi_agent_platform/testing/fakes.py').write_text(fakes)

          # Keep the stronger issue-5 contract documentation and fold in v2 semantics.
          docs = Path('/tmp/contracts.md').read_text()
          docs = docs.replace(
              'The initial provider contract version is `1.0`.\n',
              '''The initial provider contract version was `1.0`. The current provider contract version is `2.0`.\n\nProvider Contract `2.0` introduces immutable `ToolInvocation.arguments` semantics. A governed tool call cannot be changed through an alias to the caller's original argument object after approval/audit identity has been established. Adapters that need ordinary JSON transport data must use `ToolInvocation.arguments_json()`, which returns a detached mutable copy without changing the governed snapshot.\n\nThis is a major-version change because a `1.0` adapter could legitimately mutate or normalize the supplied argument dictionary in place. A provider relying on immutable invocation semantics must therefore advertise contract `2.0`.\n''',
          )
          docs = docs.replace(
              '- `ToolInvocation.tool_ref` is a canonical Tool ID. Native/MCP/HTTP/provider tool identifiers are adapter-private mappings, not canonical IDs.\n',
              '- `ToolInvocation.tool_ref` is a canonical Tool ID. Native/MCP/HTTP/provider tool identifiers are adapter-private mappings, not canonical IDs.\n- Provider Contract `2.0` deep-freezes `ToolInvocation.arguments`; adapters use `arguments_json()` for a detached transport copy, preserving exact approval/audit binding.\n',
          )
          Path('docs/CONTRACTS.md').write_text(docs)

          # Finish the canonical Event migration in the durable test provider.
          p = Path('src/ai_multi_agent_platform/testing/sqlite_events.py')
          text = p.read_text()
          text = text.replace('from pathlib import Path\nfrom typing import cast\n', 'from datetime import datetime\nfrom pathlib import Path\nfrom typing import Any, cast\n')
          text = text.replace('from ai_multi_agent_platform.contracts.types import (', 'from ai_multi_agent_platform.domain import OwnerRef\n\nfrom ai_multi_agent_platform.contracts.types import (')
          text = text.replace('                    event.event_id,', '                    event.id,')
          text = text.replace('                    event.occurred_at,', '                    event.occurred_at.isoformat(),')
          text = text.replace('                    event.context.correlation_id,', '                    event.correlation_id,')
          text = text.replace('                    event.context.causation_id,', '                    event.causation_id,')
          text = text.replace('                    event.context.owner_type,\n                    event.context.owner_id,\n                    event.context.project_id,', '                    event.owner_ref.type if event.owner_ref else None,\n                    event.owner_ref.id if event.owner_ref else None,\n                    event.project_id,')
          old_return = '''        return PlatformEvent(\n            event_id=str(row["event_id"]),\n            event_type=str(row["event_type"]),\n            subject_type=str(row["subject_type"]),\n            subject_id=str(row["subject_id"]),\n            occurred_at=str(row["occurred_at"]),\n            context=OperationContext(\n                correlation_id=str(row["correlation_id"]),\n                causation_id=cls._nullable_text(row["causation_id"]),\n                owner_type=cls._nullable_text(row["owner_type"]),\n                owner_id=cls._nullable_text(row["owner_id"]),\n                project_id=cls._nullable_text(row["project_id"]),\n            ),\n            payload=payload,\n            schema_version=str(row["schema_version"]),\n        )\n'''
          new_return = '''        owner_type = cls._nullable_text(row["owner_type"])\n        owner_id = cls._nullable_text(row["owner_id"])\n        owner_ref = None\n        if owner_type is not None and owner_id is not None:\n            owner_ref = OwnerRef(type=cast(Any, owner_type), id=owner_id)\n        return PlatformEvent(\n            id=str(row["event_id"]),\n            event_type=str(row["event_type"]),\n            subject_type=cast(Any, str(row["subject_type"])),\n            subject_id=str(row["subject_id"]),\n            occurred_at=datetime.fromisoformat(str(row["occurred_at"])),\n            correlation_id=str(row["correlation_id"]),\n            causation_id=cls._nullable_text(row["causation_id"]),\n            owner_ref=owner_ref,\n            project_id=cls._nullable_text(row["project_id"]),\n            payload=payload,\n            schema_version=str(row["schema_version"]),\n        )\n'''
          if old_return not in text:
              raise SystemExit('legacy sqlite event constructor not found')
          text = text.replace(old_return, new_return)
          p.write_text(text)

          # Make Run replacement statically typed rather than dict-expanded.
          p = Path('src/ai_multi_agent_platform/kernel/state.py')
          text = p.read_text()
          old = '''    occurred = _timestamp(event)\n    changes: dict[str, object] = {\n        "status": target,\n        "updated_at": occurred,\n        "causation_id": event.causation_id,\n        "provenance": _event_provenance(event),\n    }\n    if target is RunStatus.RUNNING and run.started_at is None:\n        changes["started_at"] = occurred\n    if target in {\n        RunStatus.SUCCEEDED,\n        RunStatus.FAILED,\n        RunStatus.CANCELLED,\n        RunStatus.TIMED_OUT,\n    }:\n        changes["finished_at"] = occurred\n    return replace(run, **changes)\n'''
          new = '''    occurred = _timestamp(event)\n    started_at = run.started_at\n    finished_at = run.finished_at\n    if target is RunStatus.RUNNING and started_at is None:\n        started_at = occurred\n    if target in {\n        RunStatus.SUCCEEDED,\n        RunStatus.FAILED,\n        RunStatus.CANCELLED,\n        RunStatus.TIMED_OUT,\n    }:\n        finished_at = occurred\n    return replace(\n        run,\n        status=target,\n        updated_at=occurred,\n        causation_id=event.causation_id,\n        provenance=_event_provenance(event),\n        started_at=started_at,\n        finished_at=finished_at,\n    )\n'''
          if old not in text:
              raise SystemExit('dynamic run replace block not found')
          p.write_text(text.replace(old, new))
          PY

          python -m pip install "ruff==0.16.5"
          ruff check --fix .
          ruff format .

          git rm -f .github/workflows/reconcile-main.yml
          git add -A
          git commit -m "fix: reconcile issue 5 contracts with latest main"
          git push origin HEAD:fix/issue-5-main-reconciliation
