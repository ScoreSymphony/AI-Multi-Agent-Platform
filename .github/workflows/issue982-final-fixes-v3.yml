name: issue982-final-fixes-v3

on:
  push:
    branches:
      - issue/982-explicit-control-plane-composition
    paths:
      - .github/workflows/issue982-final-fixes-v3.yml

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: issue/982-explicit-control-plane-composition
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/issue982-final-fixes.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          script = textwrap.dedent(source[start:end])
          exec(compile(script, '<issue982-fixes>', 'exec'))

          target = Path('src/ai_multi_agent_platform/templates/control_plane.py')
          text = target.read_text(encoding='utf-8')
          text = text.replace(
              '    setattr(application, "_control_plane_template_control_plane", control_plane)\n',
              '    application.__dict__["_control_plane_template_control_plane"] = control_plane\n',
          )
          text = text.replace(
              '    setattr(application, "_control_plane_template_handlers", handlers)\n',
              '    application.__dict__["_control_plane_template_handlers"] = handlers\n',
          )
          target.write_text(text, encoding='utf-8')
          PY
      - name: Install development environment
        run: python -m pip install -e ".[dev,server]"
      - name: Format focused files
        run: |
          ruff format \
            src/ai_multi_agent_platform/control_plane/workspace_task_management_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/workspace_task_management_registered_composition.py \
            src/ai_multi_agent_platform/control_plane/automation_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/terminal_explicit_composition.py \
            src/ai_multi_agent_platform/control_plane/automation_api.py \
            src/ai_multi_agent_platform/control_plane/organization_api.py \
            src/ai_multi_agent_platform/control_plane/conversation_composition.py \
            src/ai_multi_agent_platform/control_plane/notifications_plugin_composition.py \
            src/ai_multi_agent_platform/control_plane/notifications_explicit_composition.py \
            src/ai_multi_agent_platform/templates/control_plane.py
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - name: Install-smoke probe
        id: smoke
        continue-on-error: true
        run: python scripts/ci/issue39_install_lifecycle_smoke.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform
          git commit -m "Resolve issue 982 final CI blockers"
          git push origin HEAD:issue/982-explicit-control-plane-composition
      - name: Require install smoke
        if: steps.smoke.outcome != 'success'
        run: exit 1
