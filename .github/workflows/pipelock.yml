          if-no-files-found: warn

  validate-capture-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate shell syntax and help path
        run: |
          bash -n scripts/benchmarks/run_issue730_pipelock_vps_capture.sh
          bash scripts/benchmarks/run_issue730_pipelock_vps_capture.sh --help
      - name: Verify evidence pin and hosted-runner refusal
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'f7d1816f1a5ad63d501b0c48f36066f836f59022' \
            scripts/benchmarks/run_issue730_pipelock_vps_capture.sh
          set +e
          GITHUB_ACTIONS=true bash scripts/benchmarks/run_issue730_pipelock_vps_capture.sh \
            "$RUNNER_TEMP/should-not-run" >"$RUNNER_TEMP/refusal.log" 2>&1
          status=$?
          set -e
          test "$status" -eq 2
          grep -F 'refusing to label a GitHub Actions runner as ordinary-VPS evidence' \
            "$RUNNER_TEMP/refusal.log"
