            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi
      - name: Add deterministic TEST-NET target address
        run: sudo ip address add 192.0.2.123/32 dev lo
      - name: Exercise network and multi-stage exfiltration cases
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
