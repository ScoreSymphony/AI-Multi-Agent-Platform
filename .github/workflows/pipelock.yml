name: Pipelock validation suite

on:
  pull_request:
    paths:
      - ".github/workflows/pipelock.yml"
      - "tests/test_issue_730_pipelock_security_corpus.py"
      - "tests/fixtures/pipelock_adversarial_cases.json"
      - "tests/fixtures/pipelock_websocket_audit.yaml"
      - "docs/upstream/PIPELOCK_CORE_*.md"
      - "tests/test_issue_730_pipelock_containment.py"
      - "tests/fixtures/mcp_stdio_network_probe_server.py"
      - "scripts/ci/issue730_inet_socket_deny_exec.py"
      - "tests/test_issue_730_pipelock_mcp_adversarial.py"
      - "tests/fixtures/mcp_adversarial_http_server.py"
      - "tests/fixtures/pipelock_mcp_adversarial.yaml"
      - "tests/test_issue_730_pipelock_network_exfiltration.py"
      - "tests/fixtures/pipelock_network_boundary_audit.yaml"
      - "tests/fixtures/pipelock_network_boundary_target.py"
      - "tests/test_issue_730_pipelock_outage_recovery.py"
      - "tests/fixtures/pipelock_outage_enforced.yaml"
      - "tests/fixtures/pipelock_outage_target_server.py"
      - "scripts/benchmarks/issue730_pipelock_benchmark.py"
      - "tests/fixtures/mcp_stdio_server.py"
      - "tests/fixtures/websocket_echo_server.py"
      - "tests/test_issue_730_pipelock_profile_bypass.py"
      - "tests/fixtures/pipelock_profile_bypass_target.py"
      - "tests/fixtures/websocket_adversarial_server.py"
      - "src/ai_multi_agent_platform/adapters/hermes.py"
      - "scripts/benchmarks/run_issue730_pipelock_vps_capture.sh"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pinned-core-adversarial-corpus:
    runs-on: ubuntu-latest
    steps:
      - name: Check out platform
        uses: actions/checkout@v7
      - name: Check out exact Pipelock Core candidate
        uses: actions/checkout@v7
        with:
          repository: luckyPipewrench/pipelock
          ref: f7d1816f1a5ad63d501b0c48f36066f836f59022
          path: .candidate/pipelock
          persist-credentials: false
      - name: Set up Go from pinned upstream module
        uses: actions/setup-go@v6
        with:
          go-version-file: .candidate/pipelock/go.mod
          cache-dependency-path: .candidate/pipelock/go.sum
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install platform test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "websockets==15.0.1"
      - name: Build tag-free Core candidate
        working-directory: .candidate/pipelock
        run: make build
      - name: Reject Enterprise-tagged candidate binaries
        working-directory: .candidate/pipelock
        shell: bash
        run: |
          set -euo pipefail
          go version -m ./pipelock | tee "$RUNNER_TEMP/pipelock-adversarial-buildinfo.txt"
          if grep -Eq 'tags=.*enterprise' "$RUNNER_TEMP/pipelock-adversarial-buildinfo.txt"; then
            echo "candidate binary contains Enterprise build tag" >&2
            exit 1
          fi
      - name: Exercise adversarial security corpus
        env:
          PIPELOCK_730_BIN: ${{ github.workspace }}/.candidate/pipelock/pipelock
        run: |
          pytest -q tests/test_issue_730_pipelock_security_corpus.py \
            --basetemp="$RUNNER_TEMP/pipelock-security" \
            --junitxml="$RUNNER_TEMP/pipelock-security-junit.xml"
      - name: Upload synthetic adversarial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pipelock-adversarial-corpus-evidence
          path: |
            ${{ runner.temp }}/pipelock-adversarial-buildinfo.txt
            ${{ runner.temp }}/pipelock-security-junit.xml
            ${{ runner.temp }}/pipelock-security/**/*.log
          if-no-files-found: warn

  pinned-core-containment-bypass:
    runs-on: ubuntu-latest
