            --junitxml="$RUNNER_TEMP/pipelock-network-junit.xml"
      - name: Remove deterministic TEST-NET target address
        if: always()
        run: sudo ip address del 192.0.2.123/32 dev lo || true
      - name: Upload network and exfiltration evidence
