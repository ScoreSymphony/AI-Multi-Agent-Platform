name: Apply Learning integration patch

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/apply-learning-integration.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Apply prepared Learning patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/merge-ready-learning.yml').read_text()
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n      - name: Install backend test environment"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          patch = textwrap.dedent(source[start:end])
          Path('/tmp/apply_learning_patch.py').write_text(patch)
          subprocess.run(['python', '/tmp/apply_learning_patch.py'], check=True)
          PY
      - name: Install backend test environment
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Format and lint patched backend
        run: |
          ruff format src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py
          ruff check --fix src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py
          ruff check src/ai_multi_agent_platform/learning/control_plane.py src/ai_multi_agent_platform/learning/runtime_control_plane.py src/ai_multi_agent_platform/learning/single_node.py src/ai_multi_agent_platform/deployment/durable_connectors.py src/ai_multi_agent_platform/cli/main.py
      - name: Backend targeted regression
        run: |
          pytest -q tests/test_issue_595_governed_learning.py tests/test_issue_650_single_node_context_e2e.py tests/test_issue_651_deployment_composition.py
          python - <<'PY'
          from ai_multi_agent_platform.cli.main import _build_parser
          args = _build_parser().parse_args(["learning", "candidate", "list"])
          assert args.area == "learning"
          assert args.command == "candidate"
          assert args.candidate_command == "list"
          PY
      - name: Backend typecheck
        run: mypy
      - name: Install and validate frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm test -- --run
          npm run build
      - name: Commit validated fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/learning/control_plane.py \
            src/ai_multi_agent_platform/learning/runtime_control_plane.py \
            src/ai_multi_agent_platform/learning/single_node.py \
            src/ai_multi_agent_platform/deployment/durable_connectors.py \
            src/ai_multi_agent_platform/cli/main.py \
            frontend/src/app/navigation.ts \
            frontend/src/app/Shell.tsx
          git diff --cached --check
          git commit -m "fix: complete governed learning integration"
          git push origin HEAD:integration/active-branches-2026-09-08
