name: Temporary integration root-cause fixes

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/_temporary_integration_fix_round3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/active-branches-2026-09-08
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Apply integration fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def edit(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} match(es), found {actual}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          # Avoid package-level circular imports in spawn/multiprocess paths.
          edit(
              "src/ai_multi_agent_platform/repository_intelligence/resources.py",
              "from ai_multi_agent_platform.distributed import JobRequirements",
              "from ai_multi_agent_platform.distributed.models import JobRequirements",
          )
          edit(
              "src/ai_multi_agent_platform/planning/evidence.py",
              "from ai_multi_agent_platform.coordination import CoordinationPhase, StepCoordinationRecord",
              "from ai_multi_agent_platform.coordination.models import CoordinationPhase, StepCoordinationRecord",
          )

          # Handoff history must participate in permission-filtered global search.
          repo_path = "src/ai_multi_agent_platform/handoffs/repository.py"
          edit(
              repo_path,
              "    def get_handoff(self, handoff_id: str, revision: int | None = None) -> AgentHandoff: ...\n\n    def list_handoffs_for_task",
              "    def get_handoff(self, handoff_id: str, revision: int | None = None) -> AgentHandoff: ...\n\n    def list_handoffs(self) -> tuple[AgentHandoff, ...]: ...\n\n    def list_handoffs_for_task",
          )
          edit(
              repo_path,
              "    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        return tuple(\n            sorted(\n                (item for item in self._handoffs.values() if item.content.task_id == task_id),",
              "    def list_handoffs(self) -> tuple[AgentHandoff, ...]:\n        return tuple(\n            sorted(\n                self._handoffs.values(),\n                key=lambda item: (item.created_at, item.handoff_id, item.revision),\n            )\n        )\n\n    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        return tuple(\n            sorted(\n                (item for item in self._handoffs.values() if item.content.task_id == task_id),",
          )
          edit(
              repo_path,
              "    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        return self._list_handoffs(\n            \"SELECT payload_json FROM agent_handoffs WHERE task_id = ? \"",
              "    def list_handoffs(self) -> tuple[AgentHandoff, ...]:\n        return self._list_handoffs(\n            \"SELECT payload_json FROM agent_handoffs ORDER BY handoff_id, revision\",\n            (),\n        )\n\n    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        return self._list_handoffs(\n            \"SELECT payload_json FROM agent_handoffs WHERE task_id = ? \"",
          )
          edit(
              "src/ai_multi_agent_platform/handoffs/service.py",
              "    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        validate_id(task_id, \"task\")",
              "    def list_handoffs(self) -> tuple[AgentHandoff, ...]:\n        return self._repository.list_handoffs()\n\n    def list_handoffs_for_task(self, task_id: str) -> tuple[AgentHandoff, ...]:\n        validate_id(task_id, \"task\")",
          )
          edit(
              "src/ai_multi_agent_platform/handoffs/control_plane.py",
              "    domains before returning each Handoff. Unscoped enumeration is deliberately rejected.\n",
              "    domains before returning each Handoff. Unscoped enumeration remains safe because every\n    candidate is individually filtered through the owning Task authorization boundary.\n",
          )
          edit(
              "src/ai_multi_agent_platform/handoffs/control_plane.py",
              "        raise ContractError(\n            ErrorCode.INVALID_REQUEST,\n            \"handoff history listing requires task_id or step_id filter\",\n        )",
              "        return self.service.list_handoffs()",
          )

          # Reuse the canonical Context/Research/Skill repositories in the Handoff composition.
          handoff_path = "src/ai_multi_agent_platform/deployment/handoff_composition.py"
          edit(
              handoff_path,
              "    verification: VerificationEvidenceResolver,\n    telemetry: Telemetry,\n) -> HandoffDeploymentComposition:",
              "    verification: VerificationEvidenceResolver,\n    telemetry: Telemetry,\n    research_repository: SqliteResearchRepository | None = None,\n    skill_repository: JsonSkillRepository | None = None,\n    context_bundle_repository: JsonContextBundleRepository | None = None,\n    context_binding_repository: JsonContextRunBindingRepository | None = None,\n) -> HandoffDeploymentComposition:",
          )
          edit(
              handoff_path,
              "    repository = SQLiteHandoffRepository(database_dir / \"handoffs.sqlite3\")\n    research_repository = SqliteResearchRepository(database_dir / \"research.sqlite3\")\n    skill_repository = JsonSkillRepository(database_dir / \"skills.json\")\n    context_bundle_repository = JsonContextBundleRepository(database_dir / \"context-bundles.json\")\n    context_binding_repository = JsonContextRunBindingRepository(\n        database_dir / \"context-run-bindings.json\"\n    )",
              "    repository = SQLiteHandoffRepository(database_dir / \"handoffs.sqlite3\")\n    research_repository = research_repository or SqliteResearchRepository(\n        database_dir / \"research.sqlite3\"\n    )\n    skill_repository = skill_repository or JsonSkillRepository(database_dir / \"skills.json\")\n    supplied_context = (context_bundle_repository is not None, context_binding_repository is not None)\n    if supplied_context[0] != supplied_context[1]:\n        raise ValueError(\n            \"Handoff composition requires both canonical Context repositories or neither\"\n        )\n    reuse_context_registration = all(supplied_context)\n    context_bundle_repository = context_bundle_repository or JsonContextBundleRepository(\n        database_dir / \"context-bundles.json\"\n    )\n    context_binding_repository = context_binding_repository or JsonContextRunBindingRepository(\n        database_dir / \"context-run-bindings.json\"\n    )",
          )
          edit(
              handoff_path,
              "    # Handoff and Context surfaces remain evidence-only Control Plane resources.\n    register_context_control_plane(\n        control_plane,\n        context_bundle_repository,\n        context_binding_repository,\n    )\n    register_handoff_control_plane(control_plane, runtime.service)",
              "    # Standalone Handoff composition owns Context registration only when no canonical\n    # deployment Context composition was supplied. Re-registering supplied repositories would\n    # overwrite the authorization-aware Context services installed by #650.\n    if not reuse_context_registration:\n        register_context_control_plane(\n            control_plane,\n            context_bundle_repository,\n            context_binding_repository,\n        )\n    register_handoff_control_plane(control_plane, runtime.service)",
          )
          edit(
              "src/ai_multi_agent_platform/deployment/durable_connectors.py",
              "        verification=base.verification_runtime.evidence,\n        telemetry=base.telemetry,\n    )",
              "        verification=base.verification_runtime.evidence,\n        telemetry=base.telemetry,\n        research_repository=context.research_repository,\n        skill_repository=context.skills_repository,\n        context_bundle_repository=context.bundles,\n        context_binding_repository=context.run_bindings,\n    )",
          )

          # Security policy denial must be established before model availability is consulted.
          runtime_path = "src/ai_multi_agent_platform/agents/runtime.py"
          edit(
              runtime_path,
              "        requirements = self._effective_model_requirements(\n            agent,\n            task_model_override,\n            runtime_model_requirements,\n        )",
              "        self._validate_capability_policy(\n            agent,\n            requested_capability_ids=requested_capability_ids,\n            shared_capability_ids=shared_capability_ids,\n        )\n        requirements = self._effective_model_requirements(\n            agent,\n            task_model_override,\n            runtime_model_requirements,\n        )",
          )
          edit(
              runtime_path,
              "    def _resolve_capabilities(\n        self,",
              "    @staticmethod\n    def _validate_capability_policy(\n        agent: AgentRevision,\n        *,\n        requested_capability_ids: tuple[str, ...],\n        shared_capability_ids: tuple[str, ...],\n    ) -> set[str]:\n        policy = agent.profile.capabilities\n        effective = set(policy.required_ids)\n        effective.update(requested_capability_ids)\n        effective.update(shared_capability_ids)\n        denied = effective.intersection(policy.denied)\n        if denied:\n            raise ContractError(\n                ErrorCode.FORBIDDEN,\n                \"Agent capability policy denies one or more requested capabilities\",\n                details={\"capability_ids\": cast(JsonValue, sorted(denied))},\n            )\n        if policy.allowed:\n            outside_allowlist = effective - set(policy.allowed)\n            if outside_allowlist:\n                raise ContractError(\n                    ErrorCode.FORBIDDEN,\n                    \"Agent capability request exceeds its allowlist\",\n                    details={\"capability_ids\": cast(JsonValue, sorted(outside_allowlist))},\n                )\n        return effective\n\n    def _resolve_capabilities(\n        self,",
          )
          edit(
              runtime_path,
              "        policy = agent.profile.capabilities\n        effective = set(policy.required_ids)\n        effective.update(requested_capability_ids)\n        effective.update(shared_capability_ids)\n\n        denied = effective.intersection(policy.denied)\n        if denied:\n            raise ContractError(\n                ErrorCode.FORBIDDEN,\n                \"Agent capability policy denies one or more requested capabilities\",\n                details={\"capability_ids\": cast(JsonValue, sorted(denied))},\n            )\n        if policy.allowed:\n            outside_allowlist = effective - set(policy.allowed)\n            if outside_allowlist:\n                raise ContractError(\n                    ErrorCode.FORBIDDEN,\n                    \"Agent capability request exceeds its allowlist\",\n                    details={\"capability_ids\": cast(JsonValue, sorted(outside_allowlist))},\n                )\n\n        constraints = {item.capability_id: item for item in policy.constraints}",
              "        policy = agent.profile.capabilities\n        effective = self._validate_capability_policy(\n            agent,\n            requested_capability_ids=requested_capability_ids,\n            shared_capability_ids=shared_capability_ids,\n        )\n\n        constraints = {item.capability_id: item for item in policy.constraints}",
          )

          # Preserve aggregation contract validation precedence over manifest comparability.
          runner_path = "src/ai_multi_agent_platform/evaluation/runner.py"
          edit(
              runner_path,
              "        baseline = self._validate_baseline(\n            suite=suite,\n            baseline_run_id=baseline_run_id,\n            regression_policy=regression_policy,\n            aggregation_policy=aggregation_policy,\n        )\n\n        run = EvaluationRun(",
              "        baseline = self._validate_baseline(\n            suite=suite,\n            baseline_run_id=baseline_run_id,\n            regression_policy=regression_policy,\n            aggregation_policy=aggregation_policy,\n        )\n        if (\n            baseline is not None\n            and aggregation_policy is not None\n            and aggregation_policy.require_equal_sample_count\n            and baseline.repetitions != repetitions\n        ):\n            raise ValueError(\n                \"aggregation policy requires baseline and current runs to use the same repetition count\"\n            )\n\n        run = EvaluationRun(",
          )
          edit(
              runner_path,
              "                    \"aggregation policy requires baseline and current runs to use the same \"\n                    \"actual repetition count\"",
              "                    \"aggregation policy requires baseline and current runs to use the same \"\n                    \"repetition count after execution\"",
          )
          PY

      - name: Format changed Python files
        run: |
          python -m ruff format \
            src/ai_multi_agent_platform/repository_intelligence/resources.py \
            src/ai_multi_agent_platform/planning/evidence.py \
            src/ai_multi_agent_platform/handoffs/repository.py \
            src/ai_multi_agent_platform/handoffs/service.py \
            src/ai_multi_agent_platform/handoffs/control_plane.py \
            src/ai_multi_agent_platform/deployment/handoff_composition.py \
            src/ai_multi_agent_platform/deployment/durable_connectors.py \
            src/ai_multi_agent_platform/agents/runtime.py \
            src/ai_multi_agent_platform/evaluation/runner.py

      - name: Lint changed Python files
        run: |
          python -m ruff check \
            src/ai_multi_agent_platform/repository_intelligence/resources.py \
            src/ai_multi_agent_platform/planning/evidence.py \
            src/ai_multi_agent_platform/handoffs/repository.py \
            src/ai_multi_agent_platform/handoffs/service.py \
            src/ai_multi_agent_platform/handoffs/control_plane.py \
            src/ai_multi_agent_platform/deployment/handoff_composition.py \
            src/ai_multi_agent_platform/deployment/durable_connectors.py \
            src/ai_multi_agent_platform/agents/runtime.py \
            src/ai_multi_agent_platform/evaluation/runner.py

      - name: Run targeted regression tests
        run: |
          python -m pytest -q \
            tests/test_issue_650_single_node_context_e2e.py \
            tests/test_issue_651_deployment_composition.py \
            tests/contract/research/test_research_single_node_composition.py \
            tests/contract/research/test_research_team_integration.py \
            tests/test_issue_289_global_search_acceptance.py \
            tests/test_issue_598_single_node_integration.py \
            tests/test_evaluation_aggregation.py \
            tests/test_issue_240_multi_process_workers.py \
            tests/test_issue_240_operator_entrypoints.py \
            tests/test_issue_388_network_message_transport.py \
            tests/test_issue_433_remote_workspace_transport.py \
            tests/test_issue_89_control_plane_ha.py \
            tests/test_issue_384_coordination_durability.py

      - name: Commit validated fixes and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/_temporary_integration_fix_round3.yml
          git add \
            src/ai_multi_agent_platform/repository_intelligence/resources.py \
            src/ai_multi_agent_platform/planning/evidence.py \
            src/ai_multi_agent_platform/handoffs/repository.py \
            src/ai_multi_agent_platform/handoffs/service.py \
            src/ai_multi_agent_platform/handoffs/control_plane.py \
            src/ai_multi_agent_platform/deployment/handoff_composition.py \
            src/ai_multi_agent_platform/deployment/durable_connectors.py \
            src/ai_multi_agent_platform/agents/runtime.py \
            src/ai_multi_agent_platform/evaluation/runner.py
          git commit -m 'fix: resolve integration root-cause regressions'
          git push origin HEAD:integration/active-branches-2026-09-08
