name: Semantic provenance cleanup

on:
  push:
    branches:
      - codex/983-final-error-boundary-audit

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/983-final-error-boundary-audit
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply semantic provenance cleanup
        run: python scripts/maintenance/semantic_provenance_cleanup.py
      - name: Validate permanent naming
        run: >-
          python scripts/ci/validate_permanent_naming.py
          --base 9f3b29d2bd845512d590592881292fe88318983b
          --head HEAD
      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No semantic provenance changes produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "chore: make source provenance naming semantic"
          git push origin HEAD:codex/983-final-error-boundary-audit
