name: Reference host regressions

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/reference-host-regressions.yml"
  workflow_dispatch:

jobs:
  reference-host-regressions:
    name: Reference host regressions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Absolute-budget contract regression
        run: |
          platform-reference-host-absolute-budget --help >/dev/null
          python - <<'PY'
          from pathlib import Path

          roots = (Path("docs"), Path("src/ai_multi_agent_platform/benchmarking"))
          candidates = tuple(
              path
              for root in roots
              for path in root.rglob("*absolute-budget-policy*.json")
          )
          schema_files = tuple(path for path in candidates if path.name.endswith(".schema.json"))
          policy_instances = tuple(path for path in candidates if path not in schema_files)
          assert not policy_instances, policy_instances
          PY

      - name: Reference-host campaign regression
        run: |
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-campaign-work" \
            --output-dir artifacts/benchmarks/pr-reference-host-campaign
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          root = Path("artifacts/benchmarks/pr-reference-host-campaign")
          campaign = json.loads((root / "campaign.json").read_text(encoding="utf-8"))
          envelope = json.loads((root / "operating-envelope.json").read_text(encoding="utf-8"))
          campaign_schema = json.loads(Path("docs/schemas/benchmark-reference-host-campaign.v1.schema.json").read_text())
          envelope_schema = json.loads(Path("docs/schemas/benchmark-operating-envelope.v1.schema.json").read_text())
          Draft202012Validator(campaign_schema).validate(campaign)
          Draft202012Validator(envelope_schema).validate(envelope)
          assert campaign["environment_fingerprint_sha256"] == envelope["environment_fingerprint_sha256"]
          PY

      - name: Regression-policy contract regression
        run: |
          platform-reference-host-regression --help >/dev/null
          python - <<'PY'
          from pathlib import Path

          candidates = tuple(Path("docs").rglob("*regression-policy*.json"))
          schema_files = tuple(path for path in candidates if path.name.endswith(".schema.json"))
          policy_instances = tuple(path for path in candidates if path not in schema_files)
          assert not policy_instances, policy_instances
          PY

      - name: Reference-host reproducibility regression
        run: |
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-1-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-1
          platform-reference-host-campaign \
            --profile smoke \
            --host-label ci-reference \
            --platform-commit "$GITHUB_SHA" \
            --work-dir "$RUNNER_TEMP/reference-host-repro-run-2-work" \
            --output-dir artifacts/benchmarks/reference-host-repro/run-2
          platform-reference-host-reproducibility \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-1 \
            --campaign-dir artifacts/benchmarks/reference-host-repro/run-2 \
            --output artifacts/benchmarks/reference-host-repro/reproducibility.json
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator

          report = json.loads(Path("artifacts/benchmarks/reference-host-repro/reproducibility.json").read_text())
          schema = json.loads(Path("docs/schemas/benchmark-reference-host-reproducibility.v1.schema.json").read_text())
          Draft202012Validator(schema).validate(report)
          assert report["correctness_passed"] is True
          assert report["campaign_count"] == 2
          PY

      - name: Upload grouped regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reference-host-regressions
          path: artifacts/benchmarks
          if-no-files-found: ignore
