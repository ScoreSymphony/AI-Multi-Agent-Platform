name: Issue 440 format diagnostic

on:
  push:
    branches: [issue-440-performance-benchmark-foundation]

permissions:
  contents: read

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install formatter
        run: python -m pip install -e ".[dev]"
      - name: Generate exact Ruff formatting diff
        shell: bash
        run: |
          ruff format \
            src/ai_multi_agent_platform/benchmarking/__init__.py \
            src/ai_multi_agent_platform/benchmarking/models.py \
            src/ai_multi_agent_platform/benchmarking/single_node.py \
            src/ai_multi_agent_platform/benchmarking/cli.py \
            tests/test_issue_440_benchmarking.py
          git diff -- \
            src/ai_multi_agent_platform/benchmarking/__init__.py \
            src/ai_multi_agent_platform/benchmarking/models.py \
            src/ai_multi_agent_platform/benchmarking/single_node.py \
            src/ai_multi_agent_platform/benchmarking/cli.py \
            tests/test_issue_440_benchmarking.py > issue440-ruff-format.patch
          cat issue440-ruff-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: issue440-ruff-format-diff
          path: issue440-ruff-format.patch
