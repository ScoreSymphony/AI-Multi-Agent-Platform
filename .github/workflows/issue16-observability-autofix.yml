name: Issue 16 Observability Autofix

on:
  push:
    branches: [issue-16-observability-foundation]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-16-observability-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Apply focused Ruff fixes
        shell: bash
        run: |
          ruff check --fix \
            src/ai_multi_agent_platform/observability \
            tests/test_observability.py
          ruff format \
            src/ai_multi_agent_platform/observability \
            tests/test_observability.py
          ruff check \
            src/ai_multi_agent_platform/observability \
            tests/test_observability.py
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/ai_multi_agent_platform/observability \
            tests/test_observability.py
          git commit -m "fix(observability): satisfy repository Ruff lint" || exit 0
          git push origin HEAD:issue-16-observability-foundation
