name: Issue 16 Observability Autofix

on:
  push:
    branches: [issue-16-observability-foundation]

permissions:
  contents: write

jobs:
  autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-16-observability-foundation
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct focused typing patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/observability/instrumentation.py")
          text = path.read_text(encoding="utf-8")
          class_start = text.index("class ObservedExecutor")
          start = text.index("        except Exception as exc:\n", class_start)
          marker = "            raise\n\n        outcome = _EXECUTION_OUTCOMES[result.status]"
          end = text.index(marker, start) + len("            raise\n")
          block = text[start:end]
          block = block.replace("_exception_failure_from_exception", "_failure_from_exception")
          block = block.replace("exception_failure=exception_failure", "failure=exception_failure")
          block = block.replace(
              '"platform.executor.exception_failures"',
              '"platform.executor.failures"',
          )
          text = text[:start] + block + text[end:]
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install Ruff
        run: python -m pip install "ruff>=0.12,<1"
      - name: Format and lint focused file
        shell: bash
        run: |
          ruff format src/ai_multi_agent_platform/observability/instrumentation.py
          ruff check src/ai_multi_agent_platform/observability/instrumentation.py
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/observability/instrumentation.py
          git commit -m "fix(observability): narrow exception typing variable" || exit 0
          git push origin HEAD:issue-16-observability-foundation
