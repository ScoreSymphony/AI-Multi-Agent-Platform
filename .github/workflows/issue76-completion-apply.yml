name: Issue 76 completion apply

on:
  push:
    branches: [feat/issue-76-completion]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
      - name: Install Python dependencies
        shell: bash
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          echo "$VIRTUAL_ENV/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$VIRTUAL_ENV" >> "$GITHUB_ENV"
      - name: Apply source patch
        run: python scripts/issue76_completion_patch.py
      - name: Verify Python completion gates
        run: |
          ruff format src tests
          ruff check --fix src tests
          ruff check src tests
          mypy
          pytest -q tests/test_issue76_accounting.py tests/test_issue76_storage_accounting.py tests/test_issue76_control_plane_http.py tests/test_issue76_trends.py tests/test_issue76_model_attribution.py tests/test_issue76_completion.py
          python -m build
      - name: Verify frontend completion gates
        working-directory: frontend
        run: |
          npm install --global npm@11.6.0
          npm install --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai_multi_agent_platform/accounting frontend/src/api/types.ts frontend/src/pages/UsagePage.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "feat: complete #76 usage and resource accounting"
          git push
