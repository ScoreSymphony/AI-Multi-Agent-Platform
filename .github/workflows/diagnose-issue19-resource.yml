name: Diagnose issue 19 resource type

on:
  push:
    branches:
      - integration/active-branches-2026-09-08
    paths:
      - .github/workflows/diagnose-issue19-resource.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: integration/active-branches-2026-09-08
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Verify evaluation context authorization without cross-scope target
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lifecycle = Path('src/ai_multi_agent_platform/context/lifecycle.py')
          text = lifecycle.read_text()
          old = '    return ActorIdentity(context.owner_id, actor_type)\n'
          new = '''    actor_ref = context.owner_id\n    if ":" not in actor_ref and not actor_ref.startswith(f"{context.owner_type}_"):\n        actor_ref = f"{context.owner_type}:{actor_ref}"\n    return ActorIdentity(actor_ref, actor_type)\n'''
          if old not in text:
              raise SystemExit('actor normalization anchor missing')
          lifecycle.write_text(text.replace(old, new, 1))

          deployment = Path('src/ai_multi_agent_platform/deployment/single_node.py')
          text = deployment.read_text()
          old_actions = '''                        AuthorizationAction.EXECUTE,\n                        AuthorizationAction.READ,\n                        AuthorizationAction.MODIFY,\n'''
          new_actions = '''                        AuthorizationAction.EXECUTE,\n                        AuthorizationAction.READ,\n                        AuthorizationAction.VIEW,\n                        AuthorizationAction.MODIFY,\n'''
          if old_actions not in text:
              raise SystemExit('evaluation action policy anchor missing')
          text = text.replace(old_actions, new_actions, 1)
          old_resources = '                resource_types=frozenset({ResourceType.RUN}),\n'
          new_resources = '''                resource_types=frozenset(\n                    {\n                        ResourceType.RUN,\n                        ResourceType.TASK,\n                        ResourceType.AGENT,\n                        ResourceType.FILE,\n                        ResourceType.MEMORY,\n                    }\n                ),\n'''
          if old_resources not in text:
              raise SystemExit('evaluation resource policy anchor missing')
          deployment.write_text(text.replace(old_resources, new_resources, 1))

          test = Path('tests/test_issue_19_product_completion.py')
          text = test.read_text()
          old_scope = '''            project_id=project.id,\n            workspace_id=workspace.id,\n            name="Evaluation Target Assistant",\n'''
          new_scope = '''            project_id=None,\n            workspace_id=None,\n            name="Evaluation Target Assistant",\n'''
          if old_scope not in text:
              raise SystemExit('issue 19 Agent scope anchor missing')
          text = text.replace(old_scope, new_scope, 1)
          old_workspace = '        workspace = first.scopes.create_workspace(\n'
          if old_workspace not in text:
              raise SystemExit('issue 19 Workspace assignment anchor missing')
          text = text.replace(old_workspace, '        _workspace = first.scopes.create_workspace(\n', 1)
          anchor = '        assert all(result["outcome"] == "passed" for result in results), results\n'
          if anchor not in text:
              raise SystemExit('issue 19 assertion anchor missing')
          test.write_text(text.replace(anchor, '        print("ISSUE19_RESULTS", repr(results))\n' + anchor, 1))
          PY
          ruff format src/ai_multi_agent_platform/context/lifecycle.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_19_product_completion.py
          ruff check src/ai_multi_agent_platform/context/lifecycle.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_19_product_completion.py
          pytest -vv -s tests/test_issue_19_product_completion.py::test_agent_model_target_runs_through_product_evaluation_and_server_snapshot
