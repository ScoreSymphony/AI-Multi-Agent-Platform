name: issue-79-cycle-patch

on:
  push:
    branches:
      - feat/issue-79-portability-final

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Keep portability composition optional at package import
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/ai_multi_agent_platform/deployment/single_node.py")
          text = path.read_text()
          old = "from ai_multi_agent_platform.control_plane import (\n    AuthenticatedControlPlaneHTTP,\n    ControlPlane,\n    ControlPlaneASGI,\n)\nfrom ai_multi_agent_platform.control_plane.sqlite_scope import SqliteScopeStore\n"
          new = "from ai_multi_agent_platform.control_plane import (\n    AuthenticatedControlPlaneHTTP,\n    ControlPlaneASGI,\n)\nfrom ai_multi_agent_platform.control_plane.portability_api import ControlPlane\nfrom ai_multi_agent_platform.control_plane.sqlite_scope import SqliteScopeStore\n"
          if old not in text:
              raise SystemExit("single-node ControlPlane import anchor not found")
          path.write_text(text.replace(old, new, 1))

          path = Path("tests/test_issue_79_control_plane_portability.py")
          text = path.read_text()
          old = "from ai_multi_agent_platform.control_plane import ControlPlane, ControlPlaneHTTP, HTTPRequest\n"
          new = "from ai_multi_agent_platform.control_plane import ControlPlaneHTTP, HTTPRequest\nfrom ai_multi_agent_platform.control_plane.portability_api import ControlPlane\n"
          if old not in text:
              raise SystemExit("portability test ControlPlane import anchor not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate changed imports
        run: |
          python -m pip install -e ".[dev]"
          ruff format src/ai_multi_agent_platform/control_plane/__init__.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_79_control_plane_portability.py
          ruff check src/ai_multi_agent_platform/control_plane/__init__.py src/ai_multi_agent_platform/deployment/single_node.py tests/test_issue_79_control_plane_portability.py
          mypy src/ai_multi_agent_platform/control_plane/__init__.py src/ai_multi_agent_platform/deployment/single_node.py src/ai_multi_agent_platform/control_plane/portability_api.py
          pytest -q tests/test_issue_79_control_plane_portability.py tests/test_issue_79_single_node_portability.py
      - name: Commit fix and remove helper
        run: |
          git rm .github/workflows/issue-79-cycle-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix(portability): defer optional Control Plane composition"
          git push origin HEAD:feat/issue-79-portability-final
