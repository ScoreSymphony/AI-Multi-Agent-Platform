name: Performance extended smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  performance-coordination-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate API pressure smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/api_pressure.py \
            src/ai_multi_agent_platform/benchmarking/api_pressure_cli.py \
            tests/performance/files/test_api_pressure.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/api_pressure.py \
            src/ai_multi_agent_platform/benchmarking/api_pressure_cli.py \
            tests/performance/files/test_api_pressure.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/api_pressure.py \
            src/ai_multi_agent_platform/benchmarking/api_pressure_cli.py
          pytest tests/performance/files/test_api_pressure.py
          mkdir -p artifacts/benchmarks/pr-api-pressure
          platform-api-pressure \
            --seed-tasks 4 \
            --operations 8 \
            --concurrency 2 \
            --page-size 2 \
            --warmup-operations 0 \
            --timeout-seconds 10 \
            --safety-max-seed-tasks 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-api-pressure/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-api-pressure.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-api-pressure/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          assert report["benchmark"]["seed_tasks"] == 4
          assert report["benchmark"]["page_size"] == 2
          assert report["benchmark"]["expected_pages_per_scan"] == 2
          assert correctness["passed"] is True
          assert correctness["completed_operations"] == 8
          assert correctness["failed_operations"] == 0
          assert correctness["observed_tasks"] == 4
          assert correctness["bearer_list_operations"] == 2
          assert correctness["session_list_operations"] == 2
          assert correctness["authorized_detail_operations"] == 2
          assert correctness["pagination_scan_operations"] == 2
          assert correctness["pagination_page_requests"] == 4
          assert correctness["pagination_duplicate_ids"] == 0
          assert correctness["pagination_incomplete_scans"] == 0
          assert correctness["measured_http_requests"] == 10
          assert correctness["unique_request_ids"] == 10
          assert report["operation_latency"]["count"] == 8
          assert report["bearer_list_latency"]["count"] == 2
          assert report["session_list_latency"]["count"] == 2
          assert report["authorized_detail_latency"]["count"] == 2
          assert report["pagination_scan_latency"]["count"] == 2
          assert report["pagination_page_latency"]["count"] == 4
          PY
      - name: Upload API pressure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-api-pressure-benchmark
          path: artifacts/benchmarks/pr-api-pressure
          if-no-files-found: ignore

      - name: Validate coordination contention smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/coordination_contention.py \
            src/ai_multi_agent_platform/benchmarking/coordination_contention_cli.py \
            tests/performance/cli/test_coordination_contention.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/coordination_contention.py \
            src/ai_multi_agent_platform/benchmarking/coordination_contention_cli.py \
            tests/performance/cli/test_coordination_contention.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/coordination_contention.py \
            src/ai_multi_agent_platform/benchmarking/coordination_contention_cli.py
          pytest tests/performance/cli/test_coordination_contention.py
          mkdir -p artifacts/benchmarks/pr-coordination-contention
          platform-coordination-contention \
            --scenario multi-plan \
            --plan-count 2 \
            --steps-per-plan 2 \
            --claim-hold-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-total-steps 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-contention/multi-plan.json
          platform-coordination-contention \
            --scenario claim-contention \
            --plan-count 2 \
            --steps-per-plan 2 \
            --claim-hold-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-total-steps 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-contention/claim-contention.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-coordination-contention.v1.schema.json").read_text()
          )
          for scenario in ("multi-plan", "claim-contention"):
              report = json.loads(
                  Path(f"artifacts/benchmarks/pr-coordination-contention/{scenario}.json").read_text()
              )
              Draft202012Validator(schema).validate(report)
              correctness = report["correctness"]
              assert report["benchmark"]["scenario"] == scenario
              assert report["benchmark"]["total_steps"] == 4
              assert correctness["passed"] is True
              assert correctness["expected_plans"] == 2
              assert correctness["succeeded_tasks"] == 2
              assert correctness["expected_steps"] == 4
              assert correctness["succeeded_steps"] == 4
              assert correctness["run_created_events"] == 4
              assert correctness["unique_run_ids"] == 4
              assert report["registration_latency"]["count"] == 2
              assert report["outcome_persistence_latency"]["count"] == 4
              assert report["completion_observation_latency"]["count"] == 4
          multi = json.loads(
              Path("artifacts/benchmarks/pr-coordination-contention/multi-plan.json").read_text()
          )
          assert multi["blocked_observation_latency"]["count"] == 0
          assert multi["correctness"]["blocked_observations"] == 0
          claim = json.loads(
              Path("artifacts/benchmarks/pr-coordination-contention/claim-contention.json").read_text()
          )
          assert claim["blocked_observation_latency"]["count"] == 4
          assert claim["correctness"]["blocked_observations"] == 4
          assert claim["correctness"]["recovered_observations"] == 4
          assert claim["correctness"]["stale_claim_rejections"] == 4
          assert claim["correctness"]["fence_advanced_steps"] == 4
          PY
      - name: Upload coordination contention evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-coordination-contention-benchmarks
          path: artifacts/benchmarks/pr-coordination-contention
          if-no-files-found: ignore

      - name: Validate coordination pressure smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure.py \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure_cli.py \
            tests/performance/cli/test_coordination_pressure.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure.py \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure_cli.py \
            tests/performance/cli/test_coordination_pressure.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure.py \
            src/ai_multi_agent_platform/benchmarking/coordination_pressure_cli.py
          pytest tests/performance/cli/test_coordination_pressure.py
          mkdir -p artifacts/benchmarks/pr-coordination-pressure
          platform-coordination-pressure \
            --scenario retry-burst \
            --size 3 \
            --retry-delay-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/retry-burst.json
          platform-coordination-pressure \
            --scenario deadline-wait-burst \
            --size 3 \
            --wait-delay-seconds 0.01 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/deadline-wait-burst.json
          platform-coordination-pressure \
            --scenario restart-reconcile \
            --size 3 \
            --timeout-seconds 5 \
            --safety-max-size 8 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-coordination-pressure/restart-reconcile.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-coordination-pressure.v1.schema.json").read_text()
          )
          expected_runs = {
              "retry-burst": 6,
              "deadline-wait-burst": 3,
              "restart-reconcile": 3,
          }
          expected_attempt = {
              "retry-burst": 2,
              "deadline-wait-burst": 1,
              "restart-reconcile": 1,
          }
          for scenario in ("retry-burst", "deadline-wait-burst", "restart-reconcile"):
              report = json.loads(
                  Path(f"artifacts/benchmarks/pr-coordination-pressure/{scenario}.json").read_text()
              )
              Draft202012Validator(schema).validate(report)
              correctness = report["correctness"]
              assert report["benchmark"]["scenario"] == scenario
              assert correctness["passed"] is True
              assert correctness["expected_steps"] == 3
              assert correctness["succeeded_steps"] == 3
              assert correctness["run_created_events"] == expected_runs[scenario]
              assert correctness["unique_run_ids"] == expected_runs[scenario]
              assert correctness["maximum_attempt"] == expected_attempt[scenario]
              assert correctness["task_succeeded"] is True
              assert report["resume_or_reconcile_latency"]["count"] == 1
          retry = json.loads(
              Path("artifacts/benchmarks/pr-coordination-pressure/retry-burst.json").read_text()
          )
          assert retry["correctness"]["retry_scheduled_steps"] == 3
          wait = json.loads(
              Path(
                  "artifacts/benchmarks/pr-coordination-pressure/deadline-wait-burst.json"
              ).read_text()
          )
          assert wait["correctness"]["wait_entered_steps"] == 3
          assert wait["correctness"]["wait_resolved_steps"] == 3
          restart = json.loads(
              Path(
                  "artifacts/benchmarks/pr-coordination-pressure/restart-reconcile.json"
              ).read_text()
          )
          assert restart["correctness"]["reconciled_running_steps"] == 3
          assert restart["correctness"]["run_identity_preserved"] is True
          PY
      - name: Upload coordination pressure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-coordination-pressure-benchmarks
          path: artifacts/benchmarks/pr-coordination-pressure
          if-no-files-found: ignore

      - name: Validate Plan Step scale smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/plan_step.py \
            src/ai_multi_agent_platform/benchmarking/plan_step_cli.py \
            tests/performance/planning/test_plan_step.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/plan_step.py \
            src/ai_multi_agent_platform/benchmarking/plan_step_cli.py \
            tests/performance/planning/test_plan_step.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/plan_step.py \
            src/ai_multi_agent_platform/benchmarking/plan_step_cli.py
          pytest tests/performance/planning/test_plan_step.py
          mkdir -p artifacts/benchmarks/pr-plan-step
          for scenario in linear fan-out fan-in; do
            platform-plan-step \
              --scenario "$scenario" \
              --size 3 \
              --timeout-seconds 5 \
              --safety-max-size 8 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-plan-step/${scenario}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-plan-step.v1.schema.json").read_text()
          )
          expected_steps = {"linear": 3, "fan-out": 4, "fan-in": 5}
          expected_width = {"linear": 1, "fan-out": 3, "fan-in": 3}
          for scenario in ("linear", "fan-out", "fan-in"):
              report = json.loads(
                  Path(f"artifacts/benchmarks/pr-plan-step/{scenario}.json").read_text()
              )
              Draft202012Validator(schema).validate(report)
              assert report["benchmark"]["scenario"] == scenario
              assert report["correctness"]["passed"] is True
              assert report["correctness"]["expected_steps"] == expected_steps[scenario]
              assert report["correctness"]["run_created_events"] == expected_steps[scenario]
              assert report["correctness"]["unique_run_ids"] == expected_steps[scenario]
              assert report["correctness"]["dependency_order_valid"] is True
              assert report["correctness"]["task_succeeded"] is True
              assert report["correctness"]["active_width_peak"] == expected_width[scenario]
              assert report["registration_latency"]["count"] == 1
              assert report["outcome_persistence_latency"]["count"] == expected_steps[scenario]
              assert (
                  report["coordination_observation_latency"]["count"]
                  == expected_steps[scenario]
              )
          PY
      - name: Upload Plan Step evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-plan-step-benchmarks
          path: artifacts/benchmarks/pr-plan-step
          if-no-files-found: ignore

      - name: Validate planning pressure smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/planning_pressure.py \
            src/ai_multi_agent_platform/benchmarking/planning_pressure_cli.py \
            tests/performance/planning/test_planning_pressure.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/planning_pressure.py \
            src/ai_multi_agent_platform/benchmarking/planning_pressure_cli.py \
            tests/performance/planning/test_planning_pressure.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/planning_pressure.py \
            src/ai_multi_agent_platform/benchmarking/planning_pressure_cli.py
          pytest tests/performance/planning/test_planning_pressure.py
          mkdir -p artifacts/benchmarks/pr-planning-pressure
          platform-planning-pressure \
            --operations 2 \
            --concurrency 2 \
            --steps-per-plan 2 \
            --warmup-operations 1 \
            --timeout-seconds 5 \
            --safety-max-operations 4 \
            --safety-max-concurrency 4 \
            --safety-max-steps-per-plan 4 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-planning-pressure/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          report = json.loads(
              Path("artifacts/benchmarks/pr-planning-pressure/report.json").read_text()
          )
          schema = json.loads(
              Path("docs/schemas/benchmark-planning-pressure.v1.schema.json").read_text()
          )
          Draft202012Validator(schema).validate(report)
          assert report["benchmark"]["benchmark_id"] == "single-node.planning-pressure"
          assert report["benchmark"]["planner_profile"] == (
              "deterministic-reference-no-model-provider"
          )
          assert report["correctness"]["passed"] is True
          assert report["correctness"]["completed_cycles"] == 2
          assert report["correctness"]["canonical_failure_evidence_resolved"] == 2
          assert report["correctness"]["distinct_replacement_plans"] == 2
          assert report["correctness"]["provider_invocations"] == 0
          assert report["initial_proposal_latency"]["count"] == 2
          assert report["initial_activation_latency"]["count"] == 2
          assert report["replan_proposal_latency"]["count"] == 2
          assert report["replan_activation_latency"]["count"] == 2
          PY
      - name: Upload planning pressure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-planning-pressure-benchmark
          path: artifacts/benchmarks/pr-planning-pressure
          if-no-files-found: ignore

  performance-persistence-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate persistence contention smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py \
            tests/performance/recovery/test_persistence_contention.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py \
            tests/performance/recovery/test_persistence_contention.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/persistence_contention.py \
            src/ai_multi_agent_platform/benchmarking/persistence_contention_cli.py
          pytest tests/performance/recovery/test_persistence_contention.py
          mkdir -p artifacts/benchmarks/pr-persistence-contention
          platform-persistence-contention \
            --writers 3 \
            --tasks-per-writer 2 \
            --safety-max-writers 3 \
            --safety-max-tasks-per-writer 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-persistence-contention/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-persistence-contention.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-persistence-contention/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)
          assert report["benchmark"]["benchmark_id"] == "persistence.sqlite.writer-contention"
          assert report["benchmark"]["writer_count"] == 3
          assert report["benchmark"]["task_count"] == 6
          assert report["benchmark"]["logical_operation_count"] == 12
          assert report["contention"]["writer_instances"] == 3
          assert report["contention"]["synchronized_rounds"] == 4
          assert report["operation_latency"]["count"] == 12
          assert report["correctness"]["passed"] is True
          assert report["correctness"]["failed_logical_operations"] == 0
          PY
      - name: Upload persistence contention evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-persistence-contention-benchmark
          path: artifacts/benchmarks/pr-persistence-contention
          if-no-files-found: ignore

      - name: Validate persistence fault smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py \
            tests/performance/recovery/test_persistence_fault_benchmark.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py \
            tests/performance/recovery/test_persistence_fault_benchmark.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/persistence_faults.py \
            src/ai_multi_agent_platform/benchmarking/persistence_fault_cli.py
          pytest tests/performance/recovery/test_persistence_fault_benchmark.py
          mkdir -p artifacts/benchmarks/pr-persistence-fault
          platform-persistence-fault \
            --task-count 2 \
            --concurrency 1 \
            --failure-mode mixed \
            --failure-every 1 \
            --max-attempts 2 \
            --safety-max-tasks 2 \
            --platform-commit "$GITHUB_SHA" \
            --output artifacts/benchmarks/pr-persistence-fault/report.json
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-persistence-fault.v1.schema.json").read_text()
          )
          report = json.loads(
              Path("artifacts/benchmarks/pr-persistence-fault/report.json").read_text()
          )
          Draft202012Validator(schema).validate(report)

          correctness = report["correctness"]
          faults = report["faults"]
          assert report["benchmark"]["task_count"] == 2
          assert report["benchmark"]["failure_mode"] == "mixed"
          assert report["benchmark"]["logical_operation_count"] == 4
          assert correctness["passed"] is True
          assert correctness["completed_tasks"] == 2
          assert correctness["successful_logical_operations"] == 4
          assert correctness["retryable_failures_observed"] == 4
          assert correctness["recovered_faulted_operations"] == 4
          assert correctness["history_failures"] == 0
          assert correctness["command_record_failures"] == 0
          assert faults["planned_faults"] == 4
          assert faults["injected_failures"] == 4
          assert faults["injected_before_commit"] == 2
          assert faults["injected_after_commit"] == 2
          assert report["recovery_latency"]["count"] == 4
          PY
      - name: Upload persistence fault evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-persistence-fault-benchmark
          path: artifacts/benchmarks/pr-persistence-fault
          if-no-files-found: ignore

  performance-provider-envelope-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install benchmark environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate operating-envelope catalog smoke
        if: always()
        run: |
          ruff format --check src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py tests/performance/evaluation/test_operating_envelope_catalog.py
          ruff check src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py tests/performance/evaluation/test_operating_envelope_catalog.py
          mypy src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog.py src/ai_multi_agent_platform/benchmarking/operating_envelope_catalog_cli.py
          pytest tests/performance/evaluation/test_operating_envelope_catalog.py
          mkdir -p artifacts/benchmarks/catalog-smoke
          platform-benchmark single-node-sweep --concurrency-levels 1,2 --operations-per-level 2 --warmup-operations 0 --repetitions 1 --platform-commit "$GITHUB_SHA" --output-dir artifacts/benchmarks/catalog-smoke/sweep
          platform-operating-envelope --sweep artifacts/benchmarks/catalog-smoke/sweep/summary.json --output artifacts/benchmarks/catalog-smoke/envelope.json
          platform-operating-envelope-catalog --host ci-reference=artifacts/benchmarks/catalog-smoke/envelope.json --output artifacts/benchmarks/catalog-smoke/catalog.json
      - name: Upload operating-envelope catalog evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-operating-envelope-catalog
          path: artifacts/benchmarks/catalog-smoke
          if-no-files-found: ignore

      - name: Validate provider fault smoke
        if: always()
        run: |
          ruff format --check \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py \
            tests/performance/models/test_provider_faults.py
          ruff check \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py \
            tests/performance/models/test_provider_faults.py
          mypy \
            src/ai_multi_agent_platform/benchmarking/provider_faults.py \
            src/ai_multi_agent_platform/benchmarking/provider_fault_cli.py
          pytest tests/performance/models/test_provider_faults.py
          mkdir -p artifacts/benchmarks/pr-provider-faults
          for scenario in \
            model-latency \
            model-unavailable \
            model-cancelled \
            tool-unavailable \
            tool-timeout \
            tool-cancelled; do
            platform-provider-fault \
              --scenario "$scenario" \
              --operations-per-phase 2 \
              --concurrency 2 \
              --fault-delay-seconds 0.02 \
              --tool-timeout-seconds 0.005 \
              --cancel-after-seconds 0.005 \
              --operation-timeout-seconds 1 \
              --safety-max-operations-per-phase 4 \
              --safety-max-concurrency 4 \
              --platform-commit "$GITHUB_SHA" \
              --output "artifacts/benchmarks/pr-provider-faults/${scenario}.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path

          from jsonschema import Draft202012Validator

          schema = json.loads(
              Path("docs/schemas/benchmark-provider-fault.v1.schema.json").read_text()
          )
          expected_errors = {
              "model-latency": {},
              "model-unavailable": {"unavailable": 2},
              "model-cancelled": {"cancelled": 2},
              "tool-unavailable": {"unavailable": 2},
              "tool-timeout": {"timeout": 2},
              "tool-cancelled": {"cancelled": 2},
          }
          expected_retryable_errors = {
              "model-latency": {},
              "model-unavailable": {"unavailable": 2},
              "model-cancelled": {},
              "tool-unavailable": {"unavailable": 2},
              "tool-timeout": {"timeout": 2},
              "tool-cancelled": {"cancelled": 2},
          }
          for scenario, errors in expected_errors.items():
              report = json.loads(
                  Path(f"artifacts/benchmarks/pr-provider-faults/{scenario}.json").read_text()
              )
              Draft202012Validator(schema).validate(report)
              assert report["benchmark"]["scenario"] == scenario
              assert report["correctness"]["passed"] is True
              assert report["correctness"]["recovered"] is True
              assert report["correctness"]["automatic_retry_attempts"] == 0
              assert report["error_counts"] == errors
              assert report["retryable_error_counts"] == expected_retryable_errors[scenario]
              for phase in ("baseline", "fault", "recovery"):
                  assert report["phase_latency"][phase]["count"] == 2
                  assert report["provider_service_latency"][phase]["count"] == 2
                  assert report["platform_overhead_latency"][phase]["count"] == 2
          assert (
              json.loads(
                  Path(
                      "artifacts/benchmarks/pr-provider-faults/model-latency.json"
                  ).read_text()
              )["provider_service_latency"]["fault"]["p50_ms"]
              >= 10
          )
          PY
      - name: Upload provider fault evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-provider-fault-benchmarks
          path: artifacts/benchmarks/pr-provider-faults
          if-no-files-found: ignore
