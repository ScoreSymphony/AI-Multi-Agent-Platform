name: Stop legacy Actions cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-legacy-action-runs.yml"

permissions: {}

concurrency:
  group: cleanup-legacy-actions-history
  cancel-in-progress: true

jobs:
  stop:
    name: stop legacy Actions cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Stop cleanup worker
        run: echo "Legacy Actions cleanup is disabled; use scripts/maintenance/delete_legacy_action_runs.py locally instead."
