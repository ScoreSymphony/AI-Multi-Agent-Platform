name: Cleanup legacy Actions history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-legacy-action-runs.yml"
      - "scripts/maintenance/cleanup_legacy_action_runs.sh"
  workflow_dispatch:
    inputs:
      continue:
        description: "Continuation pass after a previous cleanup batch"
        required: false
        default: "false"

permissions:
  contents: read
  actions: write

concurrency:
  group: cleanup-legacy-actions-history
  cancel-in-progress: false

jobs:
  cleanup:
    name: cleanup legacy Actions history
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_CLEANUP_SECONDS: "10800"
    steps:
      - uses: actions/checkout@v7

      - name: Build protected-path and stale-run plan
        run: |
          bash scripts/maintenance/cleanup_legacy_action_runs.sh \
            plan artifacts/legacy-action-cleanup

      - name: Upload cleanup plan
        uses: actions/upload-artifact@v7
        with:
          name: legacy-action-cleanup-plan-${{ github.run_id }}
          path: artifacts/legacy-action-cleanup
          if-no-files-found: error

      - name: Delete completed runs for stale workflow paths
        id: apply
        run: |
          bash scripts/maintenance/cleanup_legacy_action_runs.sh \
            apply artifacts/legacy-action-cleanup

          source artifacts/legacy-action-cleanup/continuation.env
          echo "continue=${CONTINUATION_NEEDED}" >> "$GITHUB_OUTPUT"

      - name: Upload cleanup result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: legacy-action-cleanup-result-${{ github.run_id }}
          path: artifacts/legacy-action-cleanup
          if-no-files-found: warn

      - name: Dispatch continuation pass when required
        if: steps.apply.outputs.continue == 'true'
        run: |
          gh workflow run cleanup-legacy-action-runs.yml \
            --ref main \
            -f continue=true
